<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 A.M. Rain</title>
<meta name="color-scheme" content="dark">
<style>
  :root{
    color-scheme:dark;
    /* Filmic and restrained: blue-black shadow, hot amber/orange as the main light,
       one red neon accent, cold blue-grey from the lamps and sky. */
    --ink:#0a0d14; --amber:#e2a24a; --orange:#f0802e; --neon:#d4262e; --cold:#7c8ea8;

    --font-sign:"Bebas Neue","League Gothic","Oswald","Haettenschweiler","Impact","Arial Narrow","Roboto Condensed",sans-serif;
    --font-script:"SignPainter","SignPainter-HouseScript","Brush Script MT","Snell Roundhand","Bebas Neue","Impact",cursive;
    --font-serif:"Playfair Display","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
    --font-deco:"Broadway","Futura","Gill Sans","Century Gothic","Avenir Next","Helvetica Neue",sans-serif;
    --font-panel:"Futura","Futura PT","Avenir Next","Gill Sans","Century Gothic","Helvetica Neue",Arial,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
  canvas#glass{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  body.idle, body.idle *{cursor:none !important}

  /* ---- period instrument panel ---- */
  #panel{
    position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:2;box-sizing:border-box;
    width:min(284px,calc(100vw - 32px));padding:16px 18px 14px;
    background:rgba(10,13,20,.94);color:var(--amber);
    border:1px solid rgba(226,162,74,.4);
    box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4px rgba(226,162,74,.14);
    font:300 11px/1.45 var(--font-panel);
    font-variant:small-caps;text-transform:lowercase;letter-spacing:.24em;
    user-select:none;-webkit-user-select:none;
  }
  #panel .hd{display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:9px;margin-bottom:12px;border-bottom:1px solid rgba(226,162,74,.22)}
  #panel .hd b{font-weight:400;letter-spacing:.32em}
  #panel .hd span{opacity:.55}
  #panel label{display:block;margin:0 0 11px}
  #panel .row{display:flex;justify-content:space-between;align-items:baseline}
  #panel output{font-variant-numeric:tabular-nums;letter-spacing:.12em;opacity:.8}
  #panel .ft{margin-top:12px;padding-top:9px;border-top:1px solid rgba(226,162,74,.22);
    display:flex;justify-content:space-between;gap:8px}
  #panel .ft button, #dock{font:inherit;font-variant:small-caps;text-transform:lowercase;color:var(--amber);
    background:transparent;border:0;padding:4px 0;letter-spacing:.18em;opacity:.65;cursor:pointer}
  #panel .ft button:hover, #dock:hover{opacity:1}
  #panel .ft button:focus-visible, #dock:focus-visible{outline:1px dotted rgba(226,162,74,.6);outline-offset:3px}
  #panel .ft button[aria-pressed="true"]{opacity:1}
  #dock{position:fixed;left:calc(20px + 2.2vmin);bottom:calc(18px + 2.2vmin + env(safe-area-inset-bottom, 0px));z-index:2;
    font:300 11px/1 var(--font-panel);letter-spacing:.3em;padding:8px 10px;
    background:rgba(10,13,20,.7);border:1px solid rgba(226,162,74,.3);transition:opacity .8s ease}
  body.idle #dock{opacity:0;pointer-events:none}

  #panel input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;
    height:16px;margin:3px 0 0;background:transparent;cursor:pointer}
  #panel input[type=range]:focus{outline:none}
  #panel input[type=range]:focus-visible{outline:1px dotted rgba(226,162,74,.55);outline-offset:3px}
  #panel input[type=range]::-webkit-slider-runnable-track{height:9px;border:0;background:
    linear-gradient(rgba(226,162,74,.6),rgba(226,162,74,.6)) 0 100%/100% 1px no-repeat,
    repeating-linear-gradient(90deg,rgba(226,162,74,.42) 0 1px,transparent 1px 10%) 0 100%/100% 5px no-repeat}
  #panel input[type=range]::-moz-range-track{height:9px;border:0;background:
    linear-gradient(rgba(226,162,74,.6),rgba(226,162,74,.6)) 0 100%/100% 1px no-repeat,
    repeating-linear-gradient(90deg,rgba(226,162,74,.42) 0 1px,transparent 1px 10%) 0 100%/100% 5px no-repeat}
  #panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:3px;height:14px;margin-top:-3px;border:0;border-radius:0;background:var(--amber);
    box-shadow:0 0 6px rgba(226,162,74,.55)}
  #panel input[type=range]::-moz-range-thumb{width:3px;height:14px;border:0;border-radius:0;
    background:var(--amber);box-shadow:0 0 6px rgba(226,162,74,.55)}

  #hint{position:fixed;left:50%;bottom:calc(30px + 3vmin);transform:translateX(-50%);z-index:1;
    max-width:calc(100vw - 32px);text-align:center;white-space:nowrap;overflow:hidden;
    color:rgba(226,162,74,.7);font:300 11px/1 var(--font-panel);font-variant:small-caps;
    text-transform:lowercase;letter-spacing:.3em;pointer-events:none;opacity:0;transition:opacity 1.6s ease;
    text-shadow:0 0 6px rgba(10,13,20,.9)}
  #hint.show{opacity:1;transition-duration:.6s}

  @media (max-width:520px){
    #panel{right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
    #hint{letter-spacing:.18em;white-space:normal;line-height:1.6}
  }
  @media (prefers-reduced-motion:reduce){ #hint, #dock{transition:none} }
</style>
</head>
<body>

<canvas id="glass" aria-label="A rainy 1940s Manhattan street of jazz clubs at night, seen through a window"></canvas>

<div id="panel" hidden role="group" aria-label="Window controls">
  <div class="hd"><b>window controls</b><span>no. 7</span></div>
  <div id="sliders"></div>
  <div class="ft">
    <button type="button" id="btn-sound" aria-pressed="false">m music</button>
    <button type="button" id="btn-full">f full</button>
    <button type="button" id="btn-hide">h hide</button>
  </div>
</div>
<button type="button" id="dock" aria-controls="panel">controls</button>
<div id="hint"></div>

<script>
(() => {
'use strict';

/* =============================================================================
   PALETTE
   Low key: almost everything sits in blue-black, and colour lives only in the
   lights, the way it does in night photographs of 52nd Street and Times Square.
   ============================================================================= */
const INK    = [8, 10, 16];
const NIGHT  = [14, 17, 26];
const COLD   = [120, 138, 165];
const FROST  = [222, 228, 236];
const AMBER  = [238, 172, 82];
const ORANGE = [248, 130, 46];
const RED    = [232, 38, 46];
const HAZE   = [22, 24, 34];      // distance fades to dark navy, not grey
const NEON = {
  red: [238, 40, 48], pink: [252, 78, 116], orange: [252, 136, 48], yellow: [255, 206, 90],
  green: [70, 226, 132], blue: [98, 170, 255], white: [248, 240, 216],
};

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const R     = Math.random;
const rand  = (a, b) => a + R() * (b - a);
const pick  = arr => arr[(R() * arr.length) | 0];
const rgba  = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(4)})`;
const mixa  = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mixc  = (a, b, t) => rgba(mixa(a, b, t), 1);
const scl   = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const avg   = arr => arr.reduce((s, v) => s + v, 0) / arr.length;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function cx2d(c, opaque) {
  const g = c.getContext('2d', opaque ? { alpha: false } : undefined);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  return g;
}
const css = getComputedStyle(document.documentElement);
const FONT_SIGN   = css.getPropertyValue('--font-sign').trim()   || 'Impact, sans-serif';
const FONT_SCRIPT = css.getPropertyValue('--font-script').trim() || 'cursive';
const FONT_DECO   = css.getPropertyValue('--font-deco').trim()   || 'sans-serif';
const FONT_SERIF  = css.getPropertyValue('--font-serif').trim()  || 'Georgia, serif';

const HAS_FILTER = (() => {
  try {
    const c = mk(12, 12), g = c.getContext('2d');
    g.filter = 'blur(2px)'; g.fillStyle = '#fff'; g.fillRect(5, 5, 2, 2);
    return g.getImageData(1, 6, 1, 1).data[3] > 0;
  } catch (e) { return false; }
})();

/* =============================================================================
   SETTINGS
   ============================================================================= */
const DEF   = { rain: .5, fog: .2, neon: 1, grain: .55, colour: .9, music: .7 };
const RANGE = { rain: [0, 1], fog: [0, 1], neon: [.2, 1.5], grain: [0, 1], colour: [0, 1], music: [0, 1] };
const settings = { ...DEF };
const STORE = 'noir-swing-street';
try {
  const s = JSON.parse(localStorage.getItem(STORE) || '{}');
  for (const k in DEF) if (typeof s[k] === 'number' && isFinite(s[k])) settings[k] = clamp(s[k], RANGE[k][0], RANGE[k][1]);
} catch (e) {}

/* =============================================================================
   PERSPECTIVE SETUP

   World units are metres.  X runs across the street (left negative, right
   positive), Y is height above the road, Z is distance down the street.

   We look out of a ground-floor window at about eye level: the camera sits at
   CAM = (0.6, 2.1, 0), just right of the street's centre line, looking
   straight down the street (+Z).  A pinhole camera turns a world point into
   a screen point with

       sx = VPx + F * (X - CAM.x) / Z
       sy = VPy + F * (CAM.y - Y) / Z

   Dividing by Z is all of perspective.  Every line parallel to the street
   (constant X and Y, growing Z) runs toward (VPx, VPy), the single vanishing
   point of a one-point view, placed slightly right of centre.  F is the focal
   length in pixels; anything h metres tall at depth Z is F*h/Z pixels tall.

   Building fronts and car flanks are vertical planes (X = constant).  On such
   a plane each screen column sees exactly ONE depth Z.  So each one is painted
   flat first, like an architect's elevation, then copied to the screen one
   pixel column at a time with each column scaled by F/Z (mapPlane).  That is
   an exact perspective warp done with nothing but drawImage.  The road uses
   the same trick sideways: each screen row below the horizon has one Z.

   Reflections fall out of the same algebra: a point (X, Y, Z) mirrored in the
   wet road sits at (X, -Y, Z), so on screen it lands at 2*py(0, Z) - sy.  In
   other words each column is flipped about its own ground line.
   ============================================================================= */
const CAM = { x: .6, y: 2.1 };
const XL = -7.4, XR = 7.4;     // building fronts
const CURB = 4.3;              // kerbs at X = +/-4.3
const ZNEAR = 6, ZFAR = 300;
const CROSS = { z0: 58, z1: 70 }; // a cross street cuts the block here
let W = 0, H = 0, S = 1, F = 1, VPx = 0, VPy = 0;
const px = (X, Z) => VPx + F * (X - CAM.x) / Z;
const py = (Y, Z) => VPy + F * (CAM.y - Y) / Z;
const kAt = Z => F / Z;
const hazeAt = Z => clamp(1 - Math.exp(-(Z - 10) / 85), 0, .93);
const hz = (col, Z, extra = 1) => mixc(col, HAZE, hazeAt(Z) * extra);
const hza = (col, Z, extra = 1) => mixa(col, HAZE, hazeAt(Z) * extra);

function poly(g, pts) {
  g.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], x = px(p[0], p[2]), y = py(p[1], p[2]);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function face(g, pts, fill) { if (!fill) return; poly(g, pts); g.fillStyle = fill; g.fill(); }
function box(g, x0, x1, y0, y1, z0, z1, front, side, top) {
  if (CAM.x > x1) face(g, [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], side);
  else if (CAM.x < x0) face(g, [[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], side);
  if (CAM.y > y1) face(g, [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], top);
  else if (CAM.y < y0) face(g, [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], top);
  face(g, [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], front);
}
function line3(g, a, b) { g.moveTo(px(a[0], a[2]), py(a[1], a[2])); g.lineTo(px(b[0], b[2]), py(b[1], b[2])); }
function frontRect(x0, x1, y0, y1, z) { return { x0: px(x0, z), x1: px(x1, z), y0: py(y1, z), y1: py(y0, z) }; }
function groundGlow(g, X, Z, rx, rz, col, a) {
  if (Z < 1) return;
  const k = kAt(Z), x = px(X, Z), y = py(0, Z);
  const r = rx * k, ry = Math.max(1, rz * k * CAM.y / Z);
  g.save(); g.translate(x, y); g.scale(1, ry / r);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
  gr.addColorStop(0, rgba(col, a)); gr.addColorStop(.4, rgba(col, a * .4)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
}
function glow(g, x, y, r, col, a) {
  if (r < .5 || a <= 0) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a)); gr.addColorStop(.3, rgba(col, a * .38)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
}
// Copy a flat elevation texture onto a vertical plane X = const, one screen column at a time.
function mapPlane(g, tex, X, z0, z1, top, ppm, flip) {
  const dx = X - CAM.x;
  if (Math.abs(dx) < 1e-3) return;
  const sa = px(X, z0), sb = px(X, z1);
  const s0 = Math.max(0, Math.floor(Math.min(sa, sb))), s1 = Math.min(W, Math.ceil(Math.max(sa, sb)));
  for (let sx = s0; sx < s1; sx++) {
    const da = sx - VPx, db = sx + 1 - VPx;           // invert sx -> Z for this column
    if (da === 0 || db === 0 || Math.sign(da) !== Math.sign(dx) || Math.sign(db) !== Math.sign(dx)) continue;
    let za = F * dx / da, zb = F * dx / db;
    if (za > zb) [za, zb] = [zb, za];
    za = clamp(za, z0, z1); zb = clamp(zb, z0, z1);
    if (zb <= za) continue;
    const zm = (za + zb) / 2;
    const ua = (flip ? z1 - zb : za - z0) * ppm, uw = Math.max(.35, (zb - za) * ppm);
    const yt = py(top, zm), yb = py(0, zm);
    g.drawImage(tex, clamp(ua, 0, tex.width - uw), 0, uw, tex.height, sx, yt, 1, yb - yt);
  }
}

/* =============================================================================
   CANVASES
   ============================================================================= */
const cv = document.getElementById('glass');
const ctx = cv.getContext('2d', { alpha: false });
let backC, backX, farC, farX;     // sky, road, pavements, pools of light on the ground
let frontC, frontX;   // buildings, storefronts, parked cars, ironwork (all static)
let emissC, emissX;   // only the light from the static scene (lit windows, shop fronts)
let signsC, signsX;   // neon and lit signs, lamps, signals (redrawn when one flickers)
let allC, allX;       // emiss + signs: source for reflections, bloom and mist
let reflC, reflX, reflS, reflSX, ripC;
let sceneC, sceneX, softC, softX, blurC, blurX, t2C, t2X;
let bloomC, bloomX, mistC, mistX, rainC, rainX;
let fogM, fogX, fogT, fogComp, fcX, wetComp, wcX;
let sdC, sdX, frameC, vigC;
let roadTile, walkTile, puff;

/* =============================================================================
   STREET LAYOUT (seeded, so it's the same block every time)
   ============================================================================= */
let AWNINGS = [], BLD = [], WINS = [], SIGNS = [], CARS = [], LAMPS = [], SIGNALS = [], ANIMWIN = [], GROUPS = [];
const signal = { state: 0, t: 0 };   // 0 green, 1 amber, 2 red

function sideSpan(side, a, b) { return side < 0 ? [XL + a, XL + b] : [XR - b, XR - a]; }
function addSign(o) {
  const [x0, x1] = sideSpan(o.side, o.a, o.b);
  o.x0 = x0; o.x1 = x1;
  o.levels = (o.text || '').split('').map(() => 1);
  SIGNS.push(o); return o;
}
function planStreet() {
  const rnd = mulberry32(1949), rr = (a, b) => a + rnd() * (b - a);
  const mkB = (side, z0, z1, st, mat, ground) => {
    const gH = 4.2, fh = rr(3.0, 3.3);
    const top = gH + (st - 1) * fh + rr(.4, 1.0);
    const base = mat === 'brick' ? [30, 20, 20] : mat === 'brown' ? [26, 20, 19] : [27, 27, 31];
    return { side, z0, z1, st, mat, ground, gH, fh, top, col: base.map(v => v * rr(.85, 1.15)), fe: rnd() < .5 && mat !== 'stone',
      windows: [], roof: [], seed: (rnd() * 1e9) | 0 };
  };
  const L = [mkB(-1, 5, 11.8, 5, 'brick', 'bar'), mkB(-1, 11.8, 18.2, 4, 'brown', 'club'), mkB(-1, 18.2, 24.4, 6, 'brick', 'club'),
             mkB(-1, 24.4, 29.5, 5, 'brick', 'restaurant'), mkB(-1, 29.5, 34.6, 5, 'brown', 'club'), mkB(-1, 34.6, 42, 15, 'stone', 'hotel'),
             mkB(-1, 42, 49.5, 5, 'brick', 'liquor'), mkB(-1, 49.5, CROSS.z0, 6, 'brick', 'bar')];
  const Rt = [mkB(1, 5, 10.8, 5, 'brick', 'liquor'), mkB(1, 10.8, 16.4, 4, 'brown', 'club'), mkB(1, 16.4, 21.6, 5, 'brick', 'bar'),
              mkB(1, 21.6, 27, 9, 'brick', 'club'), mkB(1, 27, 32.4, 5, 'brown', 'club'), mkB(1, 32.4, 38.6, 5, 'brick', 'restaurant'),
              mkB(1, 38.6, 46, 13, 'stone', 'shop'), mkB(1, 46, CROSS.z0, 5, 'brick', 'diner')];
  for (const arr of [L, Rt]) {
    let z = CROSS.z1; const side = arr[0].side;
    while (z < ZFAR) {
      const w = rr(6, 12) * (1 + z / 220), mat = ['brick', 'brick', 'brown', 'stone'][(rnd() * 4) | 0];
      arr.push(mkB(side, z, Math.min(ZFAR, z + w), 5 + Math.floor(rnd() * rnd() * 20), mat, pick2(rnd, ['bar', 'shop', 'closed', 'restaurant', 'club', 'closed'])));
      z += w;
    }
  }
  BLD = [...L, ...Rt];

  // ---- signs. a/b are distances out from the wall (metres); y0/y1 heights.
  SIGNS = [];
  addSign({ side: -1, z: 9.0,  a: .2, b: .95, y0: 3.4, y1: 5.6, kind: 'blade', text: 'BAR', col: NEON.red, font: FONT_SIGN });
  addSign({ side: -1, z: 13.6, a: 0, b: 3.0, y0: 3.7, y1: 5.3, kind: 'marquee', text: 'Corsair', col: NEON.orange, font: FONT_SCRIPT,
            board: ['TONIGHT \u00b7 BE-BOP TIL 4 A.M.', 'LOU HARLAN QUARTET'], depth: 1.4 });
  addSign({ side: -1, z: 19.6, a: .2, b: 1.15, y0: 4.3, y1: 10.6, kind: 'blade', text: 'SAMARA', top: 'CLUB', col: NEON.red, font: FONT_SIGN });
  addSign({ side: -1, z: 25.6, a: .15, b: 2.5, y0: 3.5, y1: 4.35, kind: 'box', text: 'CHOP SUEY', col: NEON.red, panel: NEON.white, font: FONT_SIGN });
  addSign({ side: -1, z: 30.6, a: .15, b: 2.7, y0: 4.4, y1: 5.25, kind: 'neonbox', text: 'Jade Room', col: NEON.green, font: FONT_SCRIPT });
  addSign({ side: -1, z: 36.0, a: .2, b: 1.0, y0: 5.0, y1: 10.2, kind: 'blade', text: 'HOTEL', col: NEON.white, font: FONT_DECO, bulbs: true });
  addSign({ side: -1, z: 44.5, a: .15, b: 2.2, y0: 3.4, y1: 4.0, kind: 'neonbox', text: 'LIQUORS', col: NEON.yellow, font: FONT_SIGN });
  addSign({ side: -1, z: 51.5, a: .2, b: 1.0, y0: 3.8, y1: 7.6, kind: 'blade', text: 'GRILL', col: NEON.orange, font: FONT_SIGN });
  addSign({ side: 1, z: 7.5,  a: .15, b: 2.3, y0: 3.4, y1: 4.05, kind: 'neonbox', text: 'LIQUORS', col: NEON.yellow, font: FONT_SIGN });
  addSign({ side: 1, z: 12.4, a: 0, b: 3.0, y0: 3.7, y1: 5.3, kind: 'marquee', text: '3 ACES', col: NEON.red, font: FONT_SIGN,
            board: ['EDDIE MARCH TRIO', 'RUBY LANE \u00b7 VOCALS'], depth: 1.4 });
  addSign({ side: 1, z: 17.6, a: .2, b: 1.1, y0: 4.4, y1: 10.0, kind: 'blade', text: "DOLAN'S", col: NEON.yellow, font: FONT_SIGN, under: 'BAR' });
  addSign({ side: 1, z: 23.0, a: .15, b: 2.7, y0: 4.2, y1: 5.05, kind: 'neonbox', text: 'Pelican', col: NEON.pink, font: FONT_SCRIPT });
  addSign({ side: 1, z: 28.4, a: .2, b: 1.0, y0: 4.6, y1: 10.4, kind: 'blade', text: 'DANCING', col: NEON.blue, font: FONT_SIGN });
