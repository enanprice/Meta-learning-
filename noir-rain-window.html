<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 A.M. Rain</title>
<meta name="color-scheme" content="dark">
<style>
  :root{
    color-scheme:dark;
    /* Filmic and restrained: blue-black shadow, hot amber/orange as the main light,
       one red neon accent, cold blue-grey from the lamps and sky. */
    --ink:#0a0d14; --amber:#e2a24a; --orange:#f0802e; --neon:#d4262e; --cold:#7c8ea8;

    --font-sign:"Bebas Neue","League Gothic","Oswald","Haettenschweiler","Impact","Arial Narrow","Roboto Condensed",sans-serif;
    --font-script:"SignPainter","SignPainter-HouseScript","Brush Script MT","Snell Roundhand","Bebas Neue","Impact",cursive;
    --font-deco:"Broadway","Futura","Gill Sans","Century Gothic","Avenir Next","Helvetica Neue",sans-serif;
    --font-panel:"Futura","Futura PT","Avenir Next","Gill Sans","Century Gothic","Helvetica Neue",Arial,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
  canvas#glass{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  body.idle, body.idle *{cursor:none !important}

  /* ---- period instrument panel ---- */
  #panel{
    position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:2;box-sizing:border-box;
    width:min(284px,calc(100vw - 32px));padding:16px 18px 14px;
    background:rgba(10,13,20,.94);color:var(--amber);
    border:1px solid rgba(226,162,74,.4);
    box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4px rgba(226,162,74,.14);
    font:300 11px/1.45 var(--font-panel);
    font-variant:small-caps;text-transform:lowercase;letter-spacing:.24em;
    user-select:none;-webkit-user-select:none;
  }
  #panel .hd{display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:9px;margin-bottom:12px;border-bottom:1px solid rgba(226,162,74,.22)}
  #panel .hd b{font-weight:400;letter-spacing:.32em}
  #panel .hd span{opacity:.55}
  #panel label{display:block;margin:0 0 11px}
  #panel .row{display:flex;justify-content:space-between;align-items:baseline}
  #panel output{font-variant-numeric:tabular-nums;letter-spacing:.12em;opacity:.8}
  #panel .ft{margin-top:12px;padding-top:9px;border-top:1px solid rgba(226,162,74,.22);
    display:flex;justify-content:space-between;gap:8px}
  #panel .ft button, #dock{font:inherit;font-variant:small-caps;text-transform:lowercase;color:var(--amber);
    background:transparent;border:0;padding:4px 0;letter-spacing:.18em;opacity:.65;cursor:pointer}
  #panel .ft button:hover, #dock:hover{opacity:1}
  #panel .ft button:focus-visible, #dock:focus-visible{outline:1px dotted rgba(226,162,74,.6);outline-offset:3px}
  #panel .ft button[aria-pressed="true"]{opacity:1}
  #dock{position:fixed;left:calc(20px + 2.2vmin);bottom:calc(18px + 2.2vmin + env(safe-area-inset-bottom, 0px));z-index:2;
    font:300 11px/1 var(--font-panel);letter-spacing:.3em;padding:8px 10px;
    background:rgba(10,13,20,.7);border:1px solid rgba(226,162,74,.3);transition:opacity .8s ease}
  body.idle #dock{opacity:0;pointer-events:none}

  #panel input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;
    height:16px;margin:3px 0 0;background:transparent;cursor:pointer}
  #panel input[type=range]:focus{outline:none}
  #panel input[type=range]:focus-visible{outline:1px dotted rgba(226,162,74,.55);outline-offset:3px}
  #panel input[type=range]::-webkit-slider-runnable-track{height:9px;border:0;background:
    linear-gradient(rgba(226,162,74,.6),rgba(226,162,74,.6)) 0 100%/100% 1px no-repeat,
    repeating-linear-gradient(90deg,rgba(226,162,74,.42) 0 1px,transparent 1px 10%) 0 100%/100% 5px no-repeat}
  #panel input[type=range]::-moz-range-track{height:9px;border:0;background:
    linear-gradient(rgba(226,162,74,.6),rgba(226,162,74,.6)) 0 100%/100% 1px no-repeat,
    repeating-linear-gradient(90deg,rgba(226,162,74,.42) 0 1px,transparent 1px 10%) 0 100%/100% 5px no-repeat}
  #panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:3px;height:14px;margin-top:-3px;border:0;border-radius:0;background:var(--amber);
    box-shadow:0 0 6px rgba(226,162,74,.55)}
  #panel input[type=range]::-moz-range-thumb{width:3px;height:14px;border:0;border-radius:0;
    background:var(--amber);box-shadow:0 0 6px rgba(226,162,74,.55)}

  #hint{position:fixed;left:50%;bottom:calc(30px + 3vmin);transform:translateX(-50%);z-index:1;
    max-width:calc(100vw - 32px);text-align:center;white-space:nowrap;overflow:hidden;
    color:rgba(226,162,74,.7);font:300 11px/1 var(--font-panel);font-variant:small-caps;
    text-transform:lowercase;letter-spacing:.3em;pointer-events:none;opacity:0;transition:opacity 1.6s ease;
    text-shadow:0 0 6px rgba(10,13,20,.9)}
  #hint.show{opacity:1;transition-duration:.6s}

  @media (max-width:520px){
    #panel{right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
    #hint{letter-spacing:.18em;white-space:normal;line-height:1.6}
  }
  @media (prefers-reduced-motion:reduce){ #hint, #dock{transition:none} }
</style>
</head>
<body>

<canvas id="glass" aria-label="A rainy 1940s Manhattan street at night, seen from a second-floor window"></canvas>

<div id="panel" hidden role="group" aria-label="Window controls">
  <div class="hd"><b>window controls</b><span>no. 7</span></div>
  <div id="sliders"></div>
  <div class="ft">
    <button type="button" id="btn-sound" aria-pressed="false">m music</button>
    <button type="button" id="btn-full">f full</button>
    <button type="button" id="btn-hide">h hide</button>
  </div>
</div>
<button type="button" id="dock" aria-controls="panel">controls</button>
<div id="hint"></div>

<script>
(() => {
'use strict';

/* =============================================================================
   PALETTE
   ============================================================================= */
const INK    = [10, 13, 20];    // blue-black shadow
const NIGHT  = [17, 21, 31];
const COLD   = [124, 142, 168]; // streetlamp / sky blue-grey
const FROST  = [214, 222, 232]; // cold highlight
const AMBER  = [228, 162, 74];  // warm light
const ORANGE = [240, 128, 46];  // hot doorway light
const RED    = [212, 38, 46];   // the one neon red
const HAZE   = [66, 58, 58];    // distance haze, a little warm
const BRICK  = [40, 27, 27], BROWN = [35, 27, 25], STONE = [36, 36, 41];
const CABY   = [150, 116, 36];  // a cab, dimmed by night

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const R     = Math.random;
const rand  = (a, b) => a + R() * (b - a);
const pick  = arr => arr[(R() * arr.length) | 0];
const rgba  = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(4)})`;
const mixa  = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mixc  = (a, b, t) => rgba(mixa(a, b, t), 1);
const avg   = arr => arr.reduce((s, v) => s + v, 0) / arr.length;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function cx2d(c, opaque) {
  const g = c.getContext('2d', opaque ? { alpha: false } : undefined);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  return g;
}
const css = getComputedStyle(document.documentElement);
const FONT_SIGN   = css.getPropertyValue('--font-sign').trim()   || 'Impact, sans-serif';
const FONT_SCRIPT = css.getPropertyValue('--font-script').trim() || 'cursive';
const FONT_DECO   = css.getPropertyValue('--font-deco').trim()   || 'sans-serif';

const HAS_FILTER = (() => {
  try {
    const c = mk(12, 12), g = c.getContext('2d');
    g.filter = 'blur(2px)'; g.fillStyle = '#fff'; g.fillRect(5, 5, 2, 2);
    return g.getImageData(1, 6, 1, 1).data[3] > 0;
  } catch (e) { return false; }
})();

/* =============================================================================
   SETTINGS
   ============================================================================= */
const DEF   = { rain: .5, fog: .25, neon: 1, grain: .5, music: .7 };
const RANGE = { rain: [0, 1], fog: [0, 1], neon: [.2, 1.5], grain: [0, 1], music: [0, 1] };
const settings = { ...DEF };
const STORE = 'noir-street-window';
try {
  const s = JSON.parse(localStorage.getItem(STORE) || '{}');
  for (const k in DEF) if (typeof s[k] === 'number' && isFinite(s[k])) settings[k] = clamp(s[k], RANGE[k][0], RANGE[k][1]);
} catch (e) {}

/* =============================================================================
   PERSPECTIVE SETUP

   World units are metres.  X runs across the street (left negative, right
   positive), Y is height above the road, Z is distance down the street.

   We are in a second-floor window: the camera sits at CAM = (1.5, 6.5, 0),
   a little right of the street's centre line, looking straight down the street
   (+Z).  A pinhole camera turns a world point into a screen point with

       sx = VPx + F * (X - CAM.x) / Z
       sy = VPy + F * (CAM.y - Y) / Z

   Divide-by-Z is the whole of perspective: every line parallel to the street
   (constant X and Y, Z growing) heads toward (VPx, VPy) as Z grows, so that is
   the single vanishing point of a one-point view.  We put it slightly right of
   centre.  F is the focal length in pixels: larger F means a narrower lens.
   Anything h metres tall at depth Z is F*h/Z pixels tall on screen.

   Facades are vertical planes (X = constant).  Along such a plane every screen
   column sees exactly ONE depth Z.  So each building is painted flat first, as
   an architect's elevation (bricks, windows, signs), and then copied onto the
   screen one pixel column at a time, each column scaled by F/Z.  That is an
   exact perspective warp using nothing but drawImage.  The road is the same
   idea turned sideways: each screen row below the horizon has one Z.
   ============================================================================= */
const CAM = { x: 1.5, y: 6.5 };
const XL = -8.5, XR = 8.5;   // building fronts
const ROAD = 5;              // kerbs at X = +/-5, pavements outside that
const ZNEAR = 8, ZFAR = 420;
const CLUB = { door0: 26.3, door1: 27.9 };  // the jazz club doorway, left side
let W = 0, H = 0, S = 1, F = 1, VPx = 0, VPy = 0;
const px = (X, Z) => VPx + F * (X - CAM.x) / Z;
const py = (Y, Z) => VPy + F * (CAM.y - Y) / Z;
const kAt = Z => F / Z;                                    // pixels per metre at depth Z
const hazeAt = Z => clamp(1 - Math.exp(-(Z - 14) / 125), 0, .86);
const darkAt = Z => clamp(.42 * (1 - (Z - 8) / 30), 0, .42);
const hz = (col, Z, extra = 1) => mixc(col, HAZE, hazeAt(Z) * extra);

function poly(g, pts) {
  g.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], x = px(p[0], p[2]), y = py(p[1], p[2]);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function face(g, pts, fill) { if (!fill) return; poly(g, pts); g.fillStyle = fill; g.fill(); }
// A box in world space: draws only the faces the camera can see, back to front.
function box(g, x0, x1, y0, y1, z0, z1, front, side, top) {
  if (CAM.x > x1) face(g, [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], side);
  else if (CAM.x < x0) face(g, [[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], side);
  if (CAM.y > y1) face(g, [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], top);
  else if (CAM.y < y0) face(g, [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], top);
  face(g, [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], front);
}
function line3(g, a, b) { g.moveTo(px(a[0], a[2]), py(a[1], a[2])); g.lineTo(px(b[0], b[2]), py(b[1], b[2])); }
function sbox(x0, x1, y0, y1, z0, z1) { // screen bbox of a world box
  const xs = [], ys = [];
  for (const X of [x0, x1]) for (const Y of [y0, y1]) for (const Z of [z0, z1]) { xs.push(px(X, Z)); ys.push(py(Y, Z)); }
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}
// A soft pool of light lying on the ground, foreshortened correctly.
function groundGlow(g, X, Z, rx, rz, col, a) {
  if (Z < 1) return;
  const k = kAt(Z), x = px(X, Z), y = py(0, Z);
  const r = rx * k, ry = Math.max(1, rz * k * CAM.y / Z);
  g.save(); g.translate(x, y); g.scale(1, ry / r);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
  gr.addColorStop(0, rgba(col, a)); gr.addColorStop(.4, rgba(col, a * .45)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore();
}
function glow(g, x, y, r, col, a) {
  if (r < .5) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a)); gr.addColorStop(.35, rgba(col, a * .4)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
}

/* =============================================================================
   CANVASES
   ============================================================================= */
const cv = document.getElementById('glass');
const ctx = cv.getContext('2d', { alpha: false });
let staticC, staticX;   // everything that never moves (rendered once per resize)
let lightC, lightX;     // neon, lamps, light pools (rendered when a sign flickers)
let reflC, reflX, reflS, reflSX, ripC; // wet-road reflections (half res)
let sceneC, sceneX;     // the live street: static + light + people, cars, rain
let softC, softX;       // scene, lightly blurred (half res): water film on the glass
let blurC, blurX;       // scene, heavily blurred + veil (quarter res): condensation
let t2C, t2X;           // scratch for no-filter fallback
let bloomC, bloomX;
let fogM, fogX;         // "unwiped" mask, see recoverFog
let fogT;               // where condensation lives (edges, bottom corners)
let fogComp, fcX, wetComp, wcX;
let sdC, sdX;           // static droplets
let frameC, vigC;
let roadTile, walkTile, puff;

/* =============================================================================
   STREET LAYOUT (seeded so it's the same street every time)
   ============================================================================= */
let BLD = [], WINS = [], PROTS = [], LAMPS = [], ANIMWIN = [];
const neon = { jazz: [1, 1, 1, 1], velvet: [1, 1, 1, 1, 1, 1], bar: [1, 1, 1], eats: [1, 1, 1, 1] };

function planStreet() {
  const rnd = mulberry32(1947), rr = (a, b) => a + rnd() * (b - a);
  const mkB = (side, z0, z1, st, mat, ground, fe) => {
    const gH = mat === 'brown' ? 3.3 : 4.2, fh = rr(3.0, 3.25);
    const top = gH + (st - 1) * fh + rr(.5, 1.1);
    const base = mat === 'brick' ? BRICK : mat === 'brown' ? BROWN : STONE;
    const col = base.map(v => v * rr(.82, 1.12));
    return { side, z0, z1, st, mat, ground, gH, fh, top, col, fe: !!fe, windows: [], roof: [], seed: (rnd() * 1e9) | 0 };
  };
  const L = [mkB(-1, 8, 14.5, 6, 'brown', 'stoop'), mkB(-1, 14.5, 21.5, 5, 'brick', 'shutter', 1),
             mkB(-1, 21.5, 30.5, 5, 'brick', 'club', 1), mkB(-1, 30.5, 37.5, 4, 'brown', 'stoop'),
             mkB(-1, 37.5, 47, 6, 'brick', 'shop', 1)];
  const Rt = [mkB(1, 8, 17, 5, 'brick', 'diner', 1), mkB(1, 17, 27, 7, 'stone', 'hotel'),
              mkB(1, 27, 34, 5, 'brick', 'closed', 1), mkB(1, 34, 43, 4, 'brown', 'bar'),
              mkB(1, 43, 51, 6, 'brick', 'shop', 1)];
  for (const arr of [L, Rt]) {
    let z = arr[arr.length - 1].z1;
    const side = arr[0].side;
    while (z < ZFAR) {
      const w = rr(6, 13) * (1 + z / 240), mat = ['brick', 'brick', 'brown', 'stone'][(rnd() * 4) | 0];
      arr.push(mkB(side, z, Math.min(ZFAR, z + w), 4 + ((rnd() * 4) | 0), mat, rnd() < .5 ? 'shop' : 'closed', rnd() < .45));
      z += w;
    }
  }
  BLD = [...L, ...Rt];
  WINS = [];
  for (const b of BLD) {
    const depth = b.z1 - b.z0, nb = Math.max(2, Math.round(depth / rr(2.3, 2.9))), bw = depth / nb;
    b.nb = nb; b.bw = bw;
    const sizeVar = rr(.85, 1.1), litP = rr(.1, .36);
    for (let s = 1; s < b.st; s++) {
      const y0 = b.gH + (s - 1) * b.fh + rr(.75, .95);
      const hh = b.fh * rr(.48, .58) * sizeVar * (s === b.st - 1 ? .9 : 1);
      for (let i = 0; i < nb; i++) {
        const cz = b.z0 + bw * (i + .5) + rr(-.08, .08) * bw, ww = bw * rr(.36, .48) * sizeVar, jy = rr(-.07, .07);
        const t = rnd();
        const w = { b, side: b.side, X: b.side < 0 ? XL : XR, za: cz - ww / 2, zb: cz + ww / 2, ya: y0 + jy, yb: y0 + jy + hh,
          on: rnd() < litP, kind: t < .45 ? 0 : t < .8 ? 1 : 2, a: rr(.4, 1), shade: rnd() < .25 ? rr(.2, .55) : 0, locked: false };
        b.windows.push(w); WINS.push(w);
      }
    }
    if (b.fe) {
      const i0 = clamp(Math.floor(nb / 2) - 1, 0, nb - 2);
      b.fez0 = b.z0 + bw * i0 + .15; b.fez1 = b.z0 + bw * (i0 + 2) - .15;
      for (const w of b.windows) if (w.za < b.fez1 && w.zb > b.fez0) w.locked = true;
    }
    // roof clutter: water towers, chimneys, stair bulkheads (set back from the front)
    const back = b.side < 0 ? -1 : 1;
    if (b.mat !== 'stone' && rnd() < .45) b.roof.push({ t: 'tower', X: b.side < 0 ? XL - rr(2.5, 6) : XR + rr(2.5, 6), Z: rr(b.z0 + 1, b.z1 - 1), s: rr(.85, 1.15) });
    const nc = (rnd() * 3) | 0;
    for (let i = 0; i < nc; i++) b.roof.push({ t: 'chimney', X: (b.side < 0 ? XL : XR) + back * rr(.6, 4), Z: rr(b.z0 + .4, b.z1 - .6), h: rr(.8, 2.2), w: rr(.5, 1.1) });
    if (rnd() < .4) b.roof.push({ t: 'bulk', X: (b.side < 0 ? XL : XR) + back * rr(2, 5), Z: rr(b.z0 + .5, b.z1 - 2.5), h: rr(2, 2.8), w: rr(1.8, 3) });
  }
  // the club's lit windows above the door should mostly be on
  LAMPS = [];
  for (const z of [18, 44, 70, 96, 122, 150]) LAMPS.push({ X: -ROAD - .45, Z: z, arm: 1.05 });
  for (const z of [31, 57, 83, 109, 136]) LAMPS.push({ X: ROAD + .45, Z: z, arm: -1.05 });
}

/* =============================================================================
   TEXTURES
   ============================================================================= */
const TP = 64; // road texture pixels per metre
function makeTiles() {
  const rnd = mulberry32(42), rr = (a, b) => a + rnd() * (b - a);
  // Cobbles, half paved over with worn asphalt
  roadTile = mk(256, 256);
  let g = roadTile.getContext('2d');
  g.fillStyle = rgba(mixa(INK, NIGHT, .5), 1); g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 10) {
    let x = (y / 10 % 2) * 8;
    while (x < 256 + 20) {
      const w = rr(13, 19), c = mixa(INK, [40, 42, 52], rr(.15, .6));
      g.fillStyle = rgba(c, 1);
      g.beginPath(); g.roundRect ? g.roundRect(x + 1, y + 1, w - 2, 8, 2.5) : g.rect(x + 1, y + 1, w - 2, 8); g.fill();
      g.fillStyle = rgba(FROST, rr(.03, .08)); g.fillRect(x + 2, y + 1.5, w - 5, 1.2); // wet top glint
      x += w;
    }
  }
  for (let i = 0; i < 26; i++) { // asphalt patches
    g.fillStyle = rgba(mixa(INK, NIGHT, .7), rr(.6, .95));
    g.beginPath(); g.ellipse(rr(0, 256), rr(0, 256), rr(20, 70), rr(14, 50), rr(0, 3), 0, TAU); g.fill();
  }
  for (let i = 0; i < 900; i++) { g.fillStyle = rgba(rnd() < .5 ? INK : FROST, rr(.02, .07)); g.fillRect(rr(0, 256), rr(0, 256), rr(1, 3), rr(1, 2)); }

  // Pavement flagstones
  walkTile = mk(256, 256);
  g = walkTile.getContext('2d');
  g.fillStyle = 'rgb(28,29,35)'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 85.33) for (let x = 0; x < 256; x += 85.33) {
    g.fillStyle = rgba(mixa([24, 25, 31], [40, 40, 46], rnd()), 1); g.fillRect(x + 1.5, y + 1.5, 82, 82);
    g.strokeStyle = rgba(INK, .5); g.lineWidth = 1;
    if (rnd() < .4) { g.beginPath(); g.moveTo(x + rr(5, 80), y + 2); g.lineTo(x + rr(5, 80), y + rr(30, 82)); g.stroke(); }
  }

/* =============================================================================
   WET-ROAD REFLECTIONS (half res, rebuilt with the light layer)
   A light at (X, Y, Z) reflects in a wet road as if mirrored to (X, -Y, Z).

function buildRipple() {
  const g = ripC.getContext('2d'), w = ripC.width, h = ripC.height, q = .5, rnd = mulberry32(77);

    const Z = F * CAM.y / (y / q - VPy), ph = Z * 5.5 + Math.sin(Z * .9) * 2.2;
    const a = Z > 140 ? .7 : .52 + .48 * Math.pow(.5 + .5 * Math.sin(ph), 1.6);

    const len = Math.min(H - y0, (ym - y0) * 2 + 40 * S), w = Math.max(2 * S, wm * k * .85);

  streak(XL + .2, 1.3, dz, 1.8, ORANGE, .7);
  streak(XL + .9, 1.3, dz, 3.4, ORANGE, .25);
  streak(XL + .8, 6.8, 24.9, .9, RED, .55 * avg(neon.jazz) * nb);
  streak(XL + 1.75, 4.35, 29.1, 2.8, ORANGE, .45 * avg(neon.velvet) * nb);
  streak(XR - .75, 5.0, 35.1, .9, AMBER, .4 * avg(neon.bar) * nb);
  streak(XR - .95, 4.65, 13.6, 1.4, AMBER, .35 * avg(neon.eats) * nb);
  for (const z of [11.6, 13.0, 14.4, 15.7]) streak(XR - .1, 1.8, z, 1.2, AMBER, .28);
  streak(XR - .1, 1.4, 21.5, 2, AMBER, .32);
  streak(XR - .1, 1.2, 36.7, 1.3, ORANGE, .3);

  for (const L of LAMPS) streak(L.X + L.arm, 4.5, L.Z, .45, COLD, .4 * (1 - hazeAt(L.Z) * .5));
  for (const w of WINS) {

/* =============================================================================
   STREET LIFE
   ============================================================================= */
const peds = [], cars = [], steam = [], rain = [], splashes = [];
let nextPed = 0, nextCar = 3, nextExit = 18, nextSteam = 0;
const doorman = { x: XL + .45, z: CLUB.door0 - .45, ph: 0, smoke: 0, nextPuff: 4 };

function spawnPed(initial) {
  const side = R() < .55 ? -1 : 1, dir = R() < .5 ? 1 : -1;
  const x = side < 0 ? rand(-8.0, -5.7) : rand(5.7, 8.0);
  const z = initial ? rand(11, 95) : dir > 0 ? 7.2 : rand(95, 140);
  peds.push({ x, z, side, dir, spd: rand(.95, 1.3), ph: R() * TAU, h: rand(1.66, 1.86), umb: R() < .42, hat: R() < .85,
    skirt: R() < .25, alpha: initial || dir > 0 ? 1 : 0, state: 'walk', decided: false });
}
function spawnCar(initial) {
  const dir = R() < .5 ? -1 : 1;
  const z = initial ? rand(60, 160) : dir < 0 ? 280 : 2.5;
  cars.push({ dir, x: dir < 0 ? -2.45 : 2.45, z, spd: rand(5, 7.5), cab: R() < .22,
    col: pick([[22, 26, 34], [30, 20, 22], [18, 26, 24], [26, 26, 30], [34, 28, 22]]), swished: false });
  if (!initial && dir > 0) carSound(1, 6, .5);
}
function updateLife(dt) {
  nextPed -= dt;
  if (nextPed <= 0) { nextPed = rand(2.5, 6); if (peds.length < 14) spawnPed(false); }
  nextExit -= dt;
  if (nextExit <= 0) {
    nextExit = rand(25, 50);
    peds.push({ x: XL + .5, z: (CLUB.door0 + CLUB.door1) / 2, side: -1, dir: R() < .5 ? 1 : -1, spd: rand(.95, 1.2), ph: 0, h: rand(1.7, 1.85),
      umb: false, hat: true, skirt: R() < .3, alpha: 0, state: 'exit', decided: true });
  }
  const dzc = (CLUB.door0 + CLUB.door1) / 2;
  for (let i = peds.length - 1; i >= 0; i--) {
    const p = peds[i];
    if (p.state === 'walk') {
      p.z += p.dir * p.spd * dt; p.ph += p.spd * dt * 4.2;
      if (p.alpha < 1) p.alpha = Math.min(1, p.alpha + dt / 2.5);
      if (p.side < 0 && !p.decided && Math.abs(p.z - dzc) < .3) { p.decided = true; if (R() < .35) p.state = 'enter'; }
      if (p.z < 6.3 || p.z > 150) peds.splice(i, 1);
    } else if (p.state === 'enter') {          // ducks into the club
      p.x -= .9 * dt; p.z += (dzc - p.z) * Math.min(1, dt * 2); p.ph += dt * 3.5;
      if (p.x < XL + 1) p.alpha -= dt / 1.1;
      if (p.alpha <= 0) peds.splice(i, 1);
    } else {                                  // steps out of the club
      p.x += .8 * dt; p.ph += dt * 3.5; p.alpha = Math.min(1, p.alpha + dt / 1.2);
      if (p.x > -7.2) p.state = 'walk';
    }
  }
  nextCar -= dt;
  if (nextCar <= 0) { nextCar = rand(8, 20); if (cars.length < 3) spawnCar(false); }
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i]; c.z += c.dir * c.spd * dt;
    if (c.dir < 0 && !c.swished && c.z < 34) { c.swished = true; carSound(-1, 5.5, -.45); }
    if (c.z > 320 || c.z < 1.5) cars.splice(i, 1);
  }
  nextSteam -= dt;
  while (nextSteam <= 0) {
    nextSteam += .32;
    steam.push({ x: .4 + rand(-.35, .35), y: .05, z: 17.6 + rand(-.25, .25), r: rand(.25, .4), vy: rand(.3, .5), vx: rand(-.05, .15), life: rand(5, 8), age: 0 });
  }
  for (let i = steam.length - 1; i >= 0; i--) {
    const s = steam[i]; s.age += dt; s.y += s.vy * dt; s.x += s.vx * dt; s.r += .32 * dt; s.vy *= 1 - .08 * dt;
    if (s.age > s.life) steam.splice(i, 1);
  }
  doorman.ph += dt;
  doorman.nextPuff -= dt;
  if (doorman.nextPuff <= 0) { doorman.smoke = 1; doorman.nextPuff = rand(6, 12); }
  doorman.smoke = Math.max(0, doorman.smoke - dt / 1.6);
  for (const w of ANIMWIN) {
    const a = w.anim;
    if (a.type === 'person') {
      if (a.wait > 0) a.wait -= dt;
      else { const d = a.target - a.u; a.u += Math.sign(d) * Math.min(Math.abs(d), dt * .09); if (Math.abs(d) < .005) { a.wait = rand(3, 10); a.target = rand(.1, .9); } }
    }
  }
}

// A person in hat and overcoat, drawn in metres around their feet (y up is negative).
function personPath(g, p, sw) {
  const st = .16 * sw;
  g.beginPath();
  g.moveTo(st - .07, 0); g.lineTo(st + .05, 0); g.lineTo(.03, -.86); g.lineTo(-.1, -.86); g.closePath();
  g.moveTo(-st - .07, 0); g.lineTo(-st + .05, 0); g.lineTo(.1, -.86); g.lineTo(-.03, -.86); g.closePath();

  g.moveTo(-flare, -hem); g.lineTo(flare, -hem); g.lineTo(.23, -1.42); g.quadraticCurveTo(.2, -1.52, .1, -1.53);
  g.lineTo(-.1, -1.53); g.quadraticCurveTo(-.2, -1.52, -.23, -1.42); g.closePath();
  g.moveTo(.1, -1.62); g.arc(0, -1.62, .1, 0, TAU);

    g.moveTo(.1, -1.7); g.lineTo(.09, -1.83); g.quadraticCurveTo(0, -1.79, -.09, -1.83); g.lineTo(-.1, -1.7); g.closePath();

function drawPerson(g, p) {
  if (p.z < 4) return;
  const k = kAt(p.z), x = px(p.x, p.z), y = py(0, p.z), hz0 = hazeAt(p.z);

function drawDoorman(g) {
  const p = { x: doorman.x, z: doorman.z, side: -1, h: 1.84, umb: false, hat: true, skirt: false };
  const k = kAt(p.z), x = px(p.x, p.z), y = py(0, p.z), sway = Math.sin(doorman.ph * .4) * .015;

/* -----------------------------------------------------------------------------
   DROP REFRACTION
   A droplet on glass is a tiny plano-convex lens. Light from the street passes
   through the pane, then the curved bead, which bends it toward the drop's
   centre. Past its focal length a converging lens makes a real, INVERTED image
   of what's behind it. That upside-down street inside every bead is what the
   eye reads as water.

   One drawImage per drop fakes it:
     1. Take a patch of the SHARP scene centred on the drop, smaller than the
        drop (2r / MAG), so stretching it to fill the drop magnifies it.
     2. Flip it vertically about the drop's own centre line.
        setTransform(1, 0, 0, -1, 0, 2y) maps every point (px, py) to
        (px, 2y - py): a mirror across the horizontal line through the drop.
        The destination rectangle is symmetric about y, so it lands exactly
        where it started, just upside down.
     3. The caller limits it to the drop outline: a clip() for moving drops,
        or one batched 'destination-in' pass for the tiny static droplets.

const SLIDERS = [['rain', 'rain intensity'], ['fog', 'fog'], ['neon', 'neon'], ['grain', 'grain'], ['music', 'music volume']];
