<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a bound ledger — sigil masthead, sticky folio tabs, one working pane per section; tables scroll inside their own frame */
:root{
  --bg:#0d0908; --panel:#161010; --panel2:#1e1614; --line:#3a2a22; --line2:#2a1e19;
  --fg:#ebdfca; --muted:#a28e78; --faint:#6f5f50;
  --gold:#c9a44c; --gold-dim:#7d6531; --blood:#8c2124; --ember:#d0612f;
  --good:#8aa564; --bad:#cf4d42; --warn:#d6a53b;
  --display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --italic:"IM Fell English",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(1200px 500px at 50% -180px,rgba(208,97,47,.13),transparent 70%),radial-gradient(800px 600px at 100% 110%,rgba(140,33,36,.10),transparent 70%);
  background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;letter-spacing:.01em;margin:0}
h2{font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.1}
h3{font-size:1.25rem;color:var(--gold)}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.it{font-family:var(--italic);font-style:italic}

/* masthead */
.mast{padding-block:28px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sigil{width:58px;height:58px;flex:none}
.mast h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1}
.mast .sub{font-family:var(--italic);font-style:italic;color:var(--muted);font-size:1.05rem;margin-top:4px}
.mast .grow{flex:1;min-width:220px}
.savestate{font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:2px;white-space:nowrap}
.savestate b{color:var(--gold);font-weight:500}

/* tabs */
.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 82%,rgba(13,9,8,0));padding-block:6px 10px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);box-shadow:0 3px 0 -2px var(--line),0 -3px 0 -2px var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-family:var(--display);font-size:1.05rem;color:var(--muted);text-decoration:none;padding:10px 14px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--gold);border-bottom-color:var(--ember)}
.tabs a:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

.pane{padding-block:18px 80px;display:grid;gap:26px}
.panehead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.panehead .desc{color:var(--muted);max-width:62ch;margin-top:6px}

/* surfaces */
.box{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:2px;min-width:0}
.box.tight{padding:14px}
.rule{height:0;border-top:1px solid var(--line);margin:4px 0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.stack{display:grid;gap:12px;align-content:start}
.pane[hidden]{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{font-family:var(--body);font-size:.95rem;color:var(--fg);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:2px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--gold-dim)}
.btn.gold{background:var(--gold);color:#1a120c;border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:#d8b45a}
.btn.blood{background:var(--blood);border-color:var(--blood);color:#f3e6d2}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:5px;min-width:0}
label.f>span{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label.f>span i{font-family:var(--body);text-transform:none;letter-spacing:0;font-style:italic;color:var(--faint)}
input,select,textarea{font-family:var(--body);font-size:16px;color:var(--fg);background:#0f0b0a;border:1px solid var(--line);border-radius:2px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.75rem;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(201,164,76,.08)}

/* states */
.pill{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.ok{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* stat tiles */
.tile{display:grid;gap:6px}
.tile .v{font-family:var(--mono);font-size:1.7rem;line-height:1.1}
.tile .of{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.bar{height:5px;background:var(--line2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.bar i.behind{background:var(--bad)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--fg);opacity:.55}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:820px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl thead th{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;background:var(--panel2)}
.tbl tbody th{text-align:left;font-weight:400}
.tbl td{font-family:var(--mono);font-size:.88rem}
.tbl tr.today th a{color:var(--ember)}
.tbl tr.empty td{color:var(--bad);opacity:.7}
.tbl tr.future td,.tbl tr.future th{color:var(--faint)}
.tbl tr.total td,.tbl tr.total th{border-top:1px solid var(--gold-dim);color:var(--gold)}
.tbl tr.pct td{font-size:.78rem}
.tbl th a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--faint)}

/* judgement list */
.judg{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.judg li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.judg li .mk{font-family:var(--mono);font-size:.8rem}

/* calendar */
.calwrap{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.calwrap{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.calhead h3{color:var(--fg);font-size:1.4rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cell{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line2);background:var(--panel);padding:5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;color:var(--fg);font-family:var(--mono);font-size:.72rem;position:relative;min-width:0;overflow:hidden}
.cell:hover{border-color:var(--gold-dim)}
.cell .d{font-size:.8rem}
.cell .m{color:var(--muted);font-size:.66rem;line-height:1.25;overflow:hidden}
.cell.out{opacity:.32}
.cell.today{border-color:var(--ember)}
.cell.sel{outline:2px solid var(--gold);outline-offset:-2px}
.cell.missed::after{content:"";position:absolute;right:5px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.cell.logged::after{content:"";position:absolute;right:5px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.won .d{color:var(--gold)}
.heat{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ember)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--c)}
@media (max-width:520px){.cell .m{display:none}.cell{padding:4px}}
.metgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}

/* pipeline */
.stagecol{display:grid;gap:8px;align-content:start}
.deal{border:1px solid var(--line);background:var(--panel2);padding:12px;display:grid;gap:8px;min-width:0}
.deal .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.deal .nm{font-weight:600;overflow-wrap:anywhere}
.deal.over{border-color:var(--bad)}
.deal details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}

/* inquisitor */
.verdict{background:#120d0c;border:1px solid var(--line);border-top:3px double var(--gold-dim);padding:18px 20px;min-height:120px;max-width:none;overflow-wrap:anywhere}
.verdict h4{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.15rem;margin:16px 0 6px}
.verdict h4:first-child{margin-top:0}
.verdict p{margin:0 0 8px;max-width:72ch}
.verdict ul{margin:0 0 8px;padding-left:20px;max-width:72ch}
.verdict li{margin-bottom:4px}
.verdict strong{color:var(--fg)}
.verdict.empty{color:var(--faint);font-family:var(--italic);font-style:italic;display:flex;align-items:center}
.hist{display:grid;gap:8px}
.hist details{border:1px solid var(--line2);background:var(--panel);padding:10px 14px}
.hist summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.hist summary .when{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

/* grimoire */
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.res:last-child{border-bottom:0}
.res .t{font-weight:600}
.res .t a{color:var(--fg);text-decoration-color:var(--gold-dim)}
.res .by{color:var(--muted);font-style:italic}
.res .why{color:var(--muted);font-size:.93rem;grid-column:1/-1;max-width:70ch}
.res textarea{grid-column:1/-1;min-height:56px;font-size:.92rem}
.typ{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ember);margin-right:8px}
.stbtn{font-family:var(--mono);font-size:.7rem;padding:4px 9px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;cursor:pointer;white-space:nowrap;align-self:start}
.stbtn[data-s="studying"]{color:var(--warn);border-color:var(--warn)}
.stbtn[data-s="done"]{color:var(--good);border-color:var(--good)}

.notice{border:1px dashed var(--line);padding:12px 14px;color:var(--muted);font-size:.92rem}
.confirm{display:inline-flex;gap:6px;align-items:center}
.small{font-size:.85rem}
.foot{color:var(--faint);font-family:var(--italic);font-style:italic;text-align:center;padding-block:10px 40px}
@media (prefers-reduced-motion:no-preference){.flick{animation:flick 5s ease-in-out infinite}@keyframes flick{0%,100%{opacity:1}46%{opacity:.82}50%{opacity:.95}54%{opacity:.78}}}
</style>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); };
const weekIdOf = d => keyOf(mondayOf(d));
const fmtDay = d => d.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
const fmtLong = d => d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
const fmtWeek = wid => { const m = parseKey(wid), s = addDays(m, 6); return `${m.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${s.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const n = v => Number(v) || 0;
const pct = (a, b) => b > 0 ? a / b : null;
const fmtPct = v => v == null ? "—" : `${Math.round(v*100)}%`;
const TODAY = new Date();
const TODAYK = keyOf(TODAY);

/* ---------- domain ---------- */
const METRICS = [
  {k:"outreach",  label:"Outreach sent",       short:"Outreach", hint:"DMs, emails, dials"},
  {k:"convos",    label:"Conversations",       short:"Convos",   hint:"real replies or pickups"},
  {k:"booked",    label:"Calls booked",        short:"Booked"},
  {k:"shown",     label:"Calls taken",         short:"Taken",    hint:"they actually showed"},
  {k:"pitched",   label:"Offers made",         short:"Offers"},
  {k:"closed",    label:"Deals closed",        short:"Closed"},
  {k:"cash",      label:"Cash collected",      short:"Cash",     money:true},
  {k:"contracted",label:"Revenue contracted",  short:"Contract", money:true},
  {k:"hProspect", label:"Hours prospecting",   short:"h Prosp",  step:.25},
  {k:"hCalls",    label:"Hours on calls",      short:"h Calls",  step:.25},
  {k:"hLearn",    label:"Hours learning",      short:"h Learn",  step:.25, hint:"books, videos, roleplay"},
];
const DEF_TARGETS = {outreach:250, convos:50, booked:10, shown:7, pitched:6, closed:2, cash:0, contracted:0, hProspect:15, hCalls:6, hLearn:4};
const STAGES = [["lead","Lead"],["booked","Call booked"],["held","Call held"],["follow","Proposal / follow-up"],["won","Won"],["lost","Lost"]];
const SKILLS = [["prospect","Prospecting"],["discovery","Discovery & qualification"],["offer","Offer & pitch"],["objections","Objection handling"],["closing","Closing"],["follow","Follow-up & retention"],["mind","Discipline & mindset"]];

const gr = q => "https://www.goodreads.com/search?q=" + encodeURIComponent(q);
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const GRIMOIRE = [
  {id:"fanatical", s:"prospecting", t:"Book", title:"Fanatical Prospecting", by:"Jeb Blount", why:"The argument for protected daily prospecting blocks and why an empty pipeline is always a prospecting problem.", url:gr("Fanatical Prospecting Jeb Blount")},
  {id:"100mleads", s:"prospecting", t:"Book", title:"$100M Leads", by:"Alex Hormozi", why:"The four ways to get anyone's attention (warm, cold, content, paid) and how much volume each one needs.", url:gr("$100M Leads Hormozi")},
  {id:"v-prosp", s:"prospecting", t:"YouTube search", title:"Cold outreach teardowns for high-ticket offers", by:"Search results", why:"Watch real DMs and cold emails get taken apart. Compare against what you sent today.", url:yt("cold outreach teardown high ticket DM")},
  {id:"spin", s:"discovery", t:"Book", title:"SPIN Selling", by:"Neil Rackham", why:"Built on research into large sales: Situation, Problem, Implication, Need-payoff. Implication questions are where most reps are weakest.", url:gr("SPIN Selling Rackham")},
  {id:"gap", s:"discovery", t:"Book", title:"Gap Selling", by:"Keenan", why:"Sell the distance between the prospect's current state and future state, not your features.", url:gr("Gap Selling Keenan")},
  {id:"momtest", s:"discovery", t:"Book", title:"The Mom Test", by:"Rob Fitzpatrick", why:"How to ask questions people can't politely lie to you about. Short and useful for qualification.", url:gr("The Mom Test Rob Fitzpatrick")},
  {id:"v-nepq", s:"discovery", t:"YouTube search", title:"NEPQ discovery questions", by:"Jeremy Miner (search)", why:"Question-led selling: getting the prospect to say the problem out loud instead of you telling them.", url:yt("Jeremy Miner NEPQ discovery questions")},
  {id:"100moffers", s:"offer", t:"Book", title:"$100M Offers", by:"Alex Hormozi", why:"The value equation. If your offer needs heavy closing, the offer is often the real problem.", url:gr("$100M Offers Hormozi")},
  {id:"pitchanything", s:"offer", t:"Book", title:"Pitch Anything", by:"Oren Klaff", why:"Frame control and status. Read it critically: some of it is theatre, the frame material holds up.", url:gr("Pitch Anything Oren Klaff")},
  {id:"v-value", s:"offer", t:"YouTube search", title:"The value equation explained", by:"Alex Hormozi (search)", why:"Dream outcome, likelihood, time delay, effort. Run your own offer through it.", url:yt("Alex Hormozi value equation")},
  {id:"nsplit", s:"objections", t:"Book", title:"Never Split the Difference", by:"Chris Voss", why:"Labels, mirrors, calibrated questions, accusation audits. The most transferable book on this list.", url:gr("Never Split the Difference Chris Voss")},
  {id:"objections", s:"objections", t:"Book", title:"Objections", by:"Jeb Blount", why:"Why objections happen, and a repeatable pattern for turning them around without sounding scripted.", url:gr("Objections Jeb Blount")},
  {id:"v-voss", s:"objections", t:"YouTube search", title:"Tactical empathy and labelling", by:"Chris Voss (search)", why:"See the tone of voice. Voss's techniques fail when you read them and deliver them flat.", url:yt("Chris Voss tactical empathy labeling")},
  {id:"v-obj", s:"objections", t:"YouTube search", title:"Price and 'I need to think about it' objections", by:"Search results", why:"The two objections you'll hear most. Watch several approaches and pick one to drill.", url:yt("high ticket sales I need to think about it objection")},
  {id:"wolf", s:"closing", t:"Book", title:"Way of the Wolf", by:"Jordan Belfort", why:"The Straight Line system: certainty in the product, in you, and in the company. Take the structure, leave the persona.", url:gr("Way of the Wolf Jordan Belfort")},
  {id:"challenger", s:"closing", t:"Book", title:"The Challenger Sale", by:"Matthew Dixon & Brent Adamson", why:"Teach, tailor, take control. Research-backed case for pushing back on the buyer.", url:gr("The Challenger Sale Dixon Adamson")},

function md(t){

    if (/^#{1,4}\s/.test(s)) { if (list) { out += "</ul>"; list = false; } out += `<h4>${s.replace(/^#{1,4}\s/,"")}</h4>`; }

      <div class="box tight tile"><span class="lbl">Learning vs selling this week</span><span class="v ${t.hLearn > t.hProspect + t.hCalls && t.hLearn > 0 ? "bad" : ""}">${+t.hLearn.toFixed(2)}h : ${+(t.hProspect + t.hCalls).toFixed(2)}h</span><span class="of">study time : prospecting + calls</span></div>
    </div>
    <div class="grid g2" style="align-items:start">${GSTAGES.map(([s,l]) => { const list = all.filter(r => r.s === s); return `<div class="box"><h3>${l}</h3>${list.map(row).join("") || `<p class="small muted">Nothing here yet.</p>`}</div>`; }).join("")}
      <form class="box stack" id="resform"><h3>Add your own</h3>
        <label class="f"><span>Title</span><input id="nr-title" required></label>
        <label class="f"><span>Author / creator</span><input id="nr-by"></label>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
          <label class="f"><span>Part of the sale</span><select id="nr-s">${GSTAGES.map(([v,l]) => `<option value="${v}">${l}</option>`).join("")}</select></label>
          <label class="f"><span>Type</span><select id="nr-t"><option>Book</option><option>Video</option><option>Course</option><option>Podcast</option><option>Article</option></select></label>
        </div>
        <label class="f"><span>Link <i>optional</i></span><input id="nr-url" type="url" placeholder="https://"></label>
        <label class="f"><span>Why it's here</span><input id="nr-why"></label>
        <div class="row"><button class="btn gold" type="submit">Add to the grimoire</button></div>
      </form>
    </div>`;
};
$("#p-grimoire").addEventListener("input", e => { const id = e.target.dataset.gn; if (!id) return; S.grim.notes[id] = e.target.value; saveGrim(); });
$("#p-grimoire").addEventListener("submit", e => {
  if (e.target.id !== "resform") return; e.preventDefault();
  const url = $("#nr-url").value.trim();
  S.grim.custom.push({id:"c-"+uid(), custom:true, s:$("#nr-s").value, t:$("#nr-t").value, title:$("#nr-title").value.trim(), by:$("#nr-by").value.trim(), why:$("#nr-why").value.trim(), url:/^https?:\/\//i.test(url) ? url : ""});
  write("meta", "grimoire", () => S.grim); render.grimoire();
});

/* ---------- PACT ---------- */
render.pact = () => {
  const el = $("#p-pact"), p = S.pact;
  el.innerHTML = `
    <div class="panehead"><div><h2>The Pact</h2><p class="desc">The terms you're holding yourself to. Your weekly targets drive every pace bar and judgement in the ledger, and your offer is sent to the Inquisitor with each critique. Set them where they make you uncomfortable.</p></div></div>
    <div class="grid g2" style="align-items:start">
      <div class="box stack"><h3>The offer</h3>
        <label class="f"><span>What I sell, and to whom</span><textarea data-pf="offer" id="p-offer" placeholder="e.g. 12-week coaching programme for agency owners stuck under $30k/month">${esc(p.offer)}</textarea></label>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px">
          <label class="f"><span>Price</span><input data-pf="price" id="p-price" value="${esc(p.price)}" placeholder="e.g. $6,000 or 3 × $2,200"></label>
          <label class="f"><span>Currency symbol</span><input data-pf="currency" id="p-currency" value="${esc(p.currency)}" maxlength="3"></label>
          <label class="f"><span>Monthly cash goal</span><input data-pf="monthly" id="p-monthly" value="${esc(p.monthly)}" placeholder="e.g. 20,000"></label>
        </div>
        <label class="f"><span>Why I signed this</span><textarea data-pf="why" id="p-why" placeholder="The real reason, not the LinkedIn version.">${esc(p.why)}</textarea></label>
        <label class="f"><span>Penalty clause</span><textarea data-pf="clause" id="p-clause" style="min-height:60px" placeholder="If I miss my outreach target two weeks running, I will…">${esc(p.clause)}</textarea></label>
      </div>
      <div class="box stack"><h3>Weekly targets</h3><p class="small muted">Leave a target at 0 to stop tracking it against pace. Cash and contracted revenue start at 0 because only you know your numbers. Set them.</p>
        <div class="metgrid">${METRICS.map(m => `<label class="f"><span>${m.label}</span><input type="number" min="0" step="${m.step || 1}" data-tf="${m.k}" id="t-${m.k}" value="${esc(p.targets[m.k] ?? 0)}"></label>`).join("")}</div>
        <div class="notice small">The outreach target ÷ 5 is your daily bar on the calendar. That assumes five working days. Weekends count as bonus.</div>
      </div>
    </div>`;
};
$("#p-pact").addEventListener("input", e => {
  const pf = e.target.dataset.pf, tf = e.target.dataset.tf;
  if (pf) S.pact[pf] = e.target.value; else if (tf) S.pact.targets[tf] = e.target.value; else return;
  savePact();
});

/* ---------- global click handling ---------- */
function inlineConfirm(holder, label, onYes){
  const orig = holder.innerHTML;
  holder.innerHTML = `<span class="confirm"><span class="small bad">${label}</span><button class="btn sm blood" type="button">Yes</button><button class="btn sm ghost" type="button">Cancel</button></span>`;
  const [yes, no] = holder.querySelectorAll("button");
  yes.onclick = onYes; no.onclick = () => holder.innerHTML = orig;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case "wk": S.view.week = shiftWeek(S.view.week, +b.dataset.d); render.ledger(); break;
    case "rk": S.view.reck = shiftWeek(S.view.reck, +b.dataset.d); render.reckoning(); break;
    case "rkgo": S.view.reck = b.dataset.w; render.reckoning(); break;
    case "openday": openDay(b.dataset.k); if (location.hash === "#calendar") { e.preventDefault(); render.calendar(); } break;
    case "mon": S.view.month = new Date(S.view.month.getFullYear(), S.view.month.getMonth() + +b.dataset.d, 1); render.calendar(); break;
    case "pick": S.view.day = b.dataset.k; document.querySelectorAll("#p-calendar .cell.sel").forEach(c => c.classList.remove("sel")); b.classList.add("sel"); renderDayEditor(); if (innerWidth < 980) $("#dayeditor").scrollIntoView({behavior:"smooth", block:"start"}); break;
    case "newday": { const k = S.view.day; S.days[k] = {createdAt:new Date().toISOString()}; write("days", k, () => S.days[k]); render.calendar(); setTimeout(() => $("#f-outreach")?.focus(), 0); break; }
    case "delday": inlineConfirm($("#dayconfirm"), "Delete this day?", () => { const k = S.view.day; delete S.days[k]; clearTimeout(timers["days"+k]); write("days", k, null, true); render.calendar(); }); break;
    case "judgeday": S.view.mode = "day"; S.view.period = "day"; break;
    case "judgeweek": S.view.mode = "day"; S.view.period = "week"; break;
    case "deldeal": { const card = b.closest(".deal"); inlineConfirm(b.closest(".dconf"), "Delete?", () => { const id = card.dataset.id; delete S.deals[id]; clearTimeout(timers["deals"+id]); write("deals", id, null, true); render.pipeline(); }); break; }
    case "mode": { const keep = $("#inq-input")?.value; S.view.mode = b.dataset.m; inqPrefill = keep; render.inquisitor(); break; }
    case "ask": S.view.period = $("#inq-period")?.value || S.view.period; S.view.brutal = $("#inq-brutal").checked; runInquisitor(b); break;
    case "keep": if (lastVerdict) { const id = uid(); S.verdicts[id] = lastVerdict; lastVerdict = null; write("verdicts", id, () => S.verdicts[id]).then(() => {}); b.hidden = true; const out = $("#inq-out").innerHTML; inqPrefill = $("#inq-input").value; render.inquisitor(); $("#inq-out").className = "verdict"; $("#inq-out").innerHTML = out; $("#inq-kept").textContent = "Kept in the record."; } break;
    case "delv": { const h = b.closest(".vconf"); inlineConfirm(h, "Delete this verdict?", () => { const id = h.dataset.id; delete S.verdicts[id]; write("verdicts", id, null, true); render.inquisitor(); }); break; }
    case "judgewk": judgeWeek(b); break;
    case "cyc": { const id = b.closest(".res").dataset.id, cur = S.grim.status[id] || ""; const next = cur === "" ? "studying" : cur === "studying" ? "done" : ""; if (next) S.grim.status[id] = next; else delete S.grim.status[id]; write("meta","grimoire",() => S.grim); render.grimoire(); break; }
    case "delres": { const id = b.closest(".res").dataset.id; inlineConfirm(b.closest(".gconf"), "Remove?", () => { S.grim.custom = S.grim.custom.filter(r => r.id !== id); delete S.grim.status[id]; delete S.grim.notes[id]; write("meta","grimoire",() => S.grim); render.grimoire(); }); break; }
  }
});

/* ---------- routing ---------- */
const TABS = ["ledger","calendar","pipeline","inquisitor","reckoning","grimoire","pact"];
function route(){
  let t = location.hash.slice(1); if (!TABS.includes(t)) t = "ledger";
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.t === t ? "page" : "false"));
  document.querySelectorAll("section.pane").forEach(p => p.hidden = p.id !== "p-" + t);
  render[t]();
}
window.addEventListener("hashchange", route);
route();

/* ---------- boot ---------- */
(async () => {
  await Store.init();
  setSave(Store.mode === "cloud" ? "Reading your ledger…" : "Saving to this browser only");
  try {
    const [meta, days, weeks, deals, verdicts] = await Promise.all(["meta","days","weeks","deals","verdicts"].map(c => Store.list(c)));
    if (meta.pact) S.pact = {...S.pact, ...meta.pact, targets:{...DEF_TARGETS, ...(meta.pact.targets || {})}};
    if (meta.grimoire) S.grim = {status:{}, notes:{}, custom:[], ...meta.grimoire};
    Object.assign(S.days, days); Object.assign(S.weeks, weeks); Object.assign(S.deals, deals); Object.assign(S.verdicts, verdicts);
    setSave(Store.mode === "cloud" ? savedLabel() : "Saving to <b>this browser only</b>");
  } catch (e) {
    setSave("Couldn't reach your saved data");
  }
  S.loaded = true;
  route();
})();
})();
</script>
