{
  id: 'nietzsche', name: `Friedrich Nietzsche`, born: 1844, died: 1900, era: 'c19',
  place: `Röcken (Saxony); Basel; Sils Maria; Turin; Weimar`, role: `Philosopher and philologist`,
  themes: ['meaning', 'ethics', 'god', 'suffering', 'mind'], keywords: ['god is dead', 'will to power', 'ubermensch', 'overman', 'superman', 'eternal recurrence', 'amor fati', 'master slave morality', 'ressentiment', 'zarathustra', 'last man', 'nihilism', 'perspectivism', 'beyond good and evil', 'genealogy of morals', 'apollonian', 'dionysian'],
  tagline: `God is dead, and we have killed him. Now what?`,
  summary: `Nietzsche argued that the collapse of belief in God would bring down the whole moral structure of Western civilisation with it, threatening nihilism. He traced Christian morality back to the resentment of the weak, and called for a “revaluation of all values”. His answers were the will to power, the *Übermensch* who creates his own values, and the test of eternal recurrence: could you will to live your exact life again, forever? His ideal was *amor fati*, the love of fate, saying yes to everything, including suffering.`,
  life: `Friedrich Wilhelm Nietzsche was born in 1844 in Röcken, a village in Prussian Saxony, the son of a Lutheran pastor. He was named after the King of Prussia, whose birthday he shared. His father died when he was four, of a brain illness, and his younger brother soon after. He was raised in a household of women: his mother, sister, grandmother and two aunts.

He was a brilliant student at the elite boarding school of Schulpforta and studied classical philology (Greek and Latin texts) at Bonn and Leipzig. In a Leipzig bookshop in 1865 he found Schopenhauer’s *The World as Will and Representation*, took it home, and was overwhelmed. He also met Richard Wagner, who became a father figure and idol.

At just 24, before he had even finished his doctorate, he was appointed professor of classical philology at the University of Basel in Switzerland, one of the youngest ever. He served briefly as a medical orderly in the Franco-Prussian War of 1870, where he caught dysentery and diphtheria.

His first book, *The Birth of Tragedy* (1872), dedicated to Wagner, was attacked by other philologists as unscholarly, and his academic reputation never recovered. Over the next years he broke with Wagner, disgusted by his antisemitism, German nationalism and turn to Christianity in *Parsifal*. It was the most painful break of his life.

His health was terrible: migraines, near-blindness, vomiting, insomnia. In 1879, at 34, he resigned his professorship on a small pension. For the next ten years he lived as a wanderer, moving between boarding houses in Switzerland, Italy and southern France, following the weather that hurt him least. He spent summers in Sils Maria in the Swiss Alps. He walked for hours every day, writing in notebooks as he walked. “Only thoughts which come from walking have any value.” In this period, mostly alone and almost unread, he wrote nearly all his major works.

In 1882 he fell in love with Lou Salomé, a brilliant 21-year-old Russian, and proposed (through his friend Paul Rée, who was also in love with her). She turned them both down. His sister Elisabeth, jealous, intrigued against her. The episode left him devastated.

In January 1889, in Turin, he collapsed in the street. According to a story that may be legend, he saw a coachman whipping a horse, threw his arms around the horse’s neck, and broke down. He then sent strange notes to friends signed “Dionysus” and “The Crucified”. He spent the last eleven years of his life incapacitated, cared for first by his mother, then by his sister in Weimar. The cause is still debated: syphilis was long assumed, but some researchers now suggest a brain tumour or other neurological illness.

His sister took control of his literary estate. She was married to a prominent antisemite and nationalist, Bernhard Förster, with whom she had founded a failed “Aryan” colony in Paraguay. She edited and forged letters, assembled his notebooks into a book called *The Will to Power* which he never wrote, and presented him as a prophet of German nationalism. She later welcomed Hitler to the Nietzsche Archive. Nietzsche died in 1900, aged 55, just as he was becoming famous.`,
  ideas: [
    { t: `God is dead`, b: `The famous line appears in *The Gay Science* (§125), in a parable. A madman runs into a marketplace in broad daylight with a lantern, crying “I seek God! I seek God!” The people there, who don’t believe in God, laugh at him. He turns on them: “Where is God? I will tell you. We have killed him, you and I. All of us are his murderers.” Then he asks what it means: “How could we drink up the sea? Who gave us the sponge to wipe away the entire horizon? What were we doing when we unchained this earth from its sun? Whither is it moving now? Are we not plunging continually? Is there still any up or down? Are we not straying as through an infinite nothing?”

Nietzsche isn’t celebrating. He is warning. The belief in the Christian God had become unbelievable (because of science, historical criticism, and Christianity’s own demand for truthfulness). But the people who have stopped believing haven’t grasped the consequences. The whole of European morality, its ideas of good and evil, guilt, equality, the value of truth and compassion, rested on that belief. Take it away and the foundation is gone. “This tremendous event is still on its way... it has not yet reached the ears of men.” He predicted that the next two centuries would be the age of nihilism.` },
    { t: `Nihilism`, b: `Nihilism is the situation in which “the highest values devalue themselves”. We realise there is no God-given purpose, no objective meaning, no true world beyond this one. The danger is that we conclude nothing matters. Nietzsche distinguished passive nihilism (resignation, exhaustion, the wish for nothingness, which he saw in Schopenhauer and Buddhism) from active nihilism, which clears away old values to make room for new ones. His whole project was to find a way through nihilism rather than into it.` },
    { t: `Master morality and slave morality`, b: `In *On the Genealogy of Morality* (1887) Nietzsche asks where our moral values came from. He tells a historical story (partly speculative, partly polemical).

**Master morality** was the morality of ancient aristocrats. They called themselves “good”, meaning noble, strong, healthy, proud, powerful, and they called those unlike them “bad”, meaning common, weak, pitiable. “Good” came first, from self-affirmation.

**Slave morality** arose among the oppressed, who couldn’t fight back against their masters. It started from a No. They called their oppressors “evil” (a new, moralised word) and then defined themselves as “good” by contrast: humble, meek, patient, forgiving. What had been weakness (the inability to retaliate) was reinterpreted as virtue (choosing not to).

This was a revolt driven by *ressentiment*: the festering, impotent resentment of those who can’t act and so take revenge in imagination. Nietzsche thought Christianity was its greatest triumph, where the meek inherit the earth and the powerful are damned. The slave revolt in morality won. We are its heirs, and most of us don’t notice.

Nietzsche’s point isn’t simply that we should go back to master morality. It is that we should see that our morality has a history, that it was created by human beings for human purposes, and so it can be questioned.` },
    { t: `Ressentiment`, b: `This is one of Nietzsche’s most useful psychological ideas, whatever you make of his history. *Ressentiment* is resentment turned into a whole way of seeing: the person who can’t get what they want decides that what they want is evil, and that their failure to get it is a moral achievement. It poisons from inside. It looks for someone to blame. It dresses envy as justice. Nietzsche thought the person driven by it could never be free. You can spot it in politics, online, and, if you are honest, in yourself.` },
    { t: `The will to power`, b: `Nietzsche’s most misunderstood idea. Against Schopenhauer’s “will to live” and the Darwinian “struggle for survival”, Nietzsche suggested that the basic drive of all living things is not merely to survive but to grow, expand, overcome and express their strength. “A living thing seeks above all to discharge its strength.”

For humans this can mean domination of others, but it more often means self-overcoming: mastery of your own impulses, creation of art, philosophy, new values. The ascetic priest, the artist and the philosopher are all expressions of will to power. It isn’t primarily about political power, and it certainly isn’t a racial doctrine.` },
    { t: `The Übermensch`, b: `In *Thus Spoke Zarathustra*, the prophet Zarathustra comes down from the mountain and tells the crowd: “I teach you the Übermensch (overman, superman). Man is something that shall be overcome. What have you done to overcome him?” Man is “a rope, tied between beast and overman, a rope over an abyss”.

The Übermensch is the one who, after the death of God, creates new values out of his own strength, affirms life fully, and becomes who he is. It isn’t a biological superman or a master race. Nietzsche never fully describes it; it is a goal, an aspiration, more than a picture. The crowd laughs at Zarathustra.` },
    { t: `The last man`, b: `Zarathustra then tells them about the opposite of the Übermensch, “the most contemptible man”: the last man. The last man has no great longings, no ambitions, no danger. He wants comfort, safety, entertainment and a little poison now and then for pleasant dreams. “‘What is love? What is creation? What is longing? What is a star?’ thus asks the last man, and he blinks.” Everyone is the same and wants the same. “‘We have invented happiness,’ say the last men, and they blink.”

The crowd shouts: “Give us this last man, O Zarathustra! Make us into these last men!” Nietzsche feared this was where modern democratic, consumer civilisation was heading: not towards catastrophe but towards a comfortable, trivial numbness. It is hard to read it now and not think of endless feeds.` },
    { t: `Eternal recurrence`, b: `In *The Gay Science* (§341), Nietzsche imagines a demon who creeps into your loneliest loneliness and says: “This life as you now live it and have lived it, you will have to live once more and innumerable times more; and there will be nothing new in it, but every pain and every joy and every thought and sigh and everything unspeakably small or great in your life will have to return to you, all in the same succession and sequence.”

Would you throw yourself down and gnash your teeth and curse the demon? Or have you experienced a moment when you would answer: “You are a god, and never have I heard anything more divine”?

Whether or not Nietzsche believed recurrence was literally true (scholars disagree), it works as a test. Are you living a life you could will to repeat, forever? If not, what would have to change?` },
    { t: `Amor fati`, b: `“My formula for greatness in a human being is *amor fati*: that one wants nothing to be different, not forward, not backward, not in all eternity. Not merely bear what is necessary, still less conceal it, but love it.” This is the positive side of eternal recurrence: not just accepting your fate, as the Stoics taught, but embracing all of it, including suffering, which Nietzsche thought was necessary for any greatness. “What does not kill me makes me stronger.”` },
    { t: `Perspectivism`, b: `There is no view from nowhere. All knowledge is from a perspective, shaped by drives, needs and interests. “There is only a perspective seeing, only a perspective knowing; and the more affects we allow to speak about one thing, the more eyes, different eyes, we can use to observe one thing, the more complete will our concept of this thing, our objectivity, be.” This isn’t “anything goes”. It is a demand to look from many angles.` },
    { t: `Apollo and Dionysus`, b: `In *The Birth of Tragedy*, Nietzsche argued that Greek tragedy came from the fusion of two forces. The **Apollonian**: order, form, clarity, individuality, dream, sculpture. The **Dionysian**: intoxication, ecstasy, chaos, the dissolution of the self into the collective, music. Tragedy let the Greeks face the horror of existence and affirm life anyway. Then Socrates, with his cold rationality, killed tragedy.` }
  ],
  works: [
    { t: `The Birth of Tragedy`, y: `1872`, b: `Apollonian and Dionysian, the death of tragedy, and a hymn to Wagner. Nietzsche later disowned much of it but kept the core insight.` },
    { t: `Human, All Too Human`, y: `1878`, b: `A break with Wagner and Romanticism. Short aphorisms in a cooler, sceptical voice, influenced by the French moralists.` },
    { t: `The Gay Science`, y: `1882; Book V 1887`, b: `“Gay” means joyful (from the Provençal *gai saber*, the art of poetry). The death of God (§125), eternal recurrence (§341), amor fati (§276). Probably the best single place to start.` },
    { t: `Thus Spoke Zarathustra`, y: `1883–85`, b: `His most famous book, written as a prophetic prose poem in the style of the Bible. The Übermensch, the last man, the three metamorphoses (camel, lion, child). Powerful, strange, sometimes overwrought. Read the Prologue and Part I first.` },
    { t: `Beyond Good and Evil`, y: `1886`, b: `A “prelude to a philosophy of the future”: nine chapters of aphorisms attacking philosophers’ prejudices, morality, religion and nationalism. Dense and brilliant.` },
    { t: `On the Genealogy of Morality`, y: `1887`, b: `Three essays: on good and evil (slave morality), guilt and bad conscience, and ascetic ideals. His most sustained argument, and the one most philosophers teach.` },
    { t: `Twilight of the Idols`, y: `1888`, b: `“How to philosophise with a hammer.” Short, punchy, full of famous maxims. A good summary of his late views.` },
    { t: `The Antichrist and Ecce Homo`, y: `1888`, b: `A furious attack on Christianity, and an autobiography with chapter titles like “Why I Am So Wise” and “Why I Write Such Good Books”, written months before his collapse. Brilliant and unsettling.` }
  ],
  quotes: [
    { q: `God is dead. God remains dead. And we have killed him.`, s: `*The Gay Science* §125` },
    { q: `If we have our own why in life, we shall get along with almost any how.`, s: `*Twilight of the Idols*, “Maxims and Arrows” 12` },
    { q: `Out of life’s school of war: What does not destroy me makes me stronger.`, s: `*Twilight of the Idols*, “Maxims and Arrows” 8` },
    { q: `And if you gaze long into an abyss, the abyss also gazes into you.`, s: `*Beyond Good and Evil* §146` },
    { q: `Whoever fights monsters should see to it that in the process he does not become a monster.`, s: `*Beyond Good and Evil* §146` },
    { q: `One must still have chaos in oneself to be able to give birth to a dancing star.`, s: `*Thus Spoke Zarathustra*, Prologue 5` },
    { q: `My formula for greatness in a human being is amor fati: that one wants nothing to be different, not forward, not backward, not in all eternity.`, s: `*Ecce Homo*, “Why I Am So Clever” 10` },
    { q: `Without music, life would be a mistake.`, s: `*Twilight of the Idols*, “Maxims and Arrows” 33` },
    { q: `“What is love? What is creation? What is longing? What is a star?” thus asks the last man, and he blinks.`, s: `*Thus Spoke Zarathustra*, Prologue 5` },
    { q: `Become who you are!`, s: `*The Gay Science* §270; subtitle of *Ecce Homo* (“How One Becomes What One Is”), after Pindar` },
    { q: `Only thoughts which come from walking have any value.`, s: `*Twilight of the Idols*, “Maxims and Arrows” 34` }
  ],
  fakes: [
    { q: `And those who were seen dancing were thought to be insane by those who could not hear the music.`, n: `Not Nietzsche. No source in his works. It seems to be an old saying, attributed to him only since the 2000s.` },
    { q: `There are no facts, only interpretations.`, n: `Close, but from his private notebooks (Nachlass, 1886–87), not a published work. The original says: “No, facts is precisely what there is not, only interpretations.” He didn’t publish it, and it’s often used to make him a crude relativist, which he wasn’t.` },
    { q: `The individual has always had to struggle to keep from being overwhelmed by the tribe.`, n: `No known source in Nietzsche. The rest of the popular quote (“if you try it, you will be lonely often...”) is also unsourced.` },
    { q: `He who has a why to live can bear almost any how.`, n: `A paraphrase popularised by Viktor Frankl in *Man’s Search for Meaning*. Nietzsche’s original is in *Twilight of the Idols* (see above).` }
  ],
  critique: `The Nazis claimed Nietzsche, mainly through his sister’s forgeries and selective editing. He himself despised antisemitism (in a draft letter to his sister in 1887 he wrote that it was a matter of honour to him to be “absolutely clean and unequivocal” in opposing antisemitism, and in the notes he wrote as he collapsed he announced he was “having all anti-Semites shot”) and German nationalism. But he made it easy to misuse him. He wrote with contempt about democracy, equality, socialism and feminism; he praised cruelty, war and “the blond beast”; he fantasised about breeding a higher type of human. A philosophy that despises pity and exalts the strong is dangerous material in the wrong hands, and the wrong hands found it.

Philosophically, his genealogy of morals is a just-so story. There is little historical evidence for a “slave revolt” as he describes it, and showing that a value had a disreputable origin (the “genetic fallacy”) doesn’t show the value is wrong. Compassion might have started as resentment and still be good.

Perspectivism faces the obvious problem: is perspectivism itself just a perspective? If so, why believe it? Nietzsche knew this and seemed to enjoy it.

And his ideal is vague. The Übermensch creates his own values, but which values? Critics point out that a ruthless tyrant can say he is “creating values” too. Nietzsche gives us the destruction of old tablets without enough on what to write on the new ones.

Finally, many readers (especially young men, especially online) take Nietzsche as a license: to despise the “weak”, to see themselves as higher types, to reject moral constraint. That is almost exactly the reading Nietzsche would have scorned. His self-overcoming was brutal self-discipline, not self-indulgence, and he was a sick, lonely, courteous man who was kind to his landladies. If reading Nietzsche makes you feel superior to other people, you have probably misread him.`,
  start: `Don’t start with *Zarathustra*. Start with *The Gay Science*, Books I and IV, or *Twilight of the Idols*, which is short and punchy. Then *On the Genealogy of Morality*, the most rewarding sustained read. Translations by Walter Kaufmann (Vintage) are classic; the Cambridge translations are more accurate. For a guide, Michael Tanner’s *Nietzsche: A Very Short Introduction* is excellent. Sue Prideaux’s *I Am Dynamite! A Life of Nietzsche* (2018) is a wonderful biography.`,
  related: ['schopenhauer', 'dostoevsky', 'kierkegaard', 'heraclitus', 'camus', 'jung', 'freud']
}
);

THINKERS.push(
{
  id: 'wittgenstein', name: `Ludwig Wittgenstein`, born: 1889, died: 1951, era: 'c20',
  place: `Vienna; Cambridge; rural Austria; Norway`, role: `Philosopher`,
  themes: ['knowledge', 'mind', 'meaning'], keywords: ['tractatus', 'philosophical investigations', 'language games', 'meaning is use', 'private language', 'family resemblance', 'whereof one cannot speak', 'limits of my language', 'fly bottle', 'picture theory'],
  tagline: `Most philosophical problems are knots in language. Untie them and they disappear.`,
  summary: `Wittgenstein revolutionised philosophy twice. His first book, the *Tractatus*, argued that language pictures facts, and that everything important (ethics, meaning, God) lies beyond what can be said: “Whereof one cannot speak, thereof one must be silent.” Then he rejected it. His later work argued that meaning is use: words get their sense from the “language games” they play in human life, and philosophical confusion comes from taking words out of their home. Philosophy should be therapy, showing the fly the way out of the fly-bottle.`,
  life: `Ludwig Josef Johann Wittgenstein was born in Vienna in 1889, the youngest of eight children of Karl Wittgenstein, a steel magnate and one of the richest men in Europe. The family palace was a centre of Viennese culture; Brahms and Mahler gave concerts there, and Klimt painted his sister. It was also a family of immense pressure and unhappiness. Three of Ludwig’s four brothers killed themselves.

He studied engineering in Berlin and Manchester, where he designed a propeller, and became fascinated by the foundations of mathematics. In 1911 he turned up, unannounced, at Bertrand Russell’s rooms in Cambridge. Russell soon thought him the most perfect example of genius he had known: “passionate, profound, intense and dominating”. Within a year, the student was criticising the teacher.

When the First World War broke out, he volunteered for the Austrian army, asking for the most dangerous posts, and was decorated for bravery. He carried Tolstoy’s *Gospel in Brief* everywhere and wrote the *Tractatus* in his notebooks at the front. He finished it as a prisoner of war in Italy.

Believing he had solved all the problems of philosophy, he gave up philosophy. He gave away his entire inheritance, a vast fortune, to his siblings (they were rich already, so, he reasoned, it couldn’t corrupt them). He trained as a primary schoolteacher and taught in poor villages in rural Austria. He was a brilliant, demanding and sometimes violent teacher; after he hit a boy who collapsed, he left under a cloud, and later went back to apologise to the families. He worked as a monastery gardener and designed a strikingly austere modernist house for his sister in Vienna.

Gradually he realised the *Tractatus* was wrong. In 1929 he returned to Cambridge, submitting the *Tractatus* as his doctoral thesis (Russell and G. E. Moore examined him; he clapped them on the shoulders at the end and said “Don’t worry, I know you’ll never understand it”). He became professor of philosophy in 1939. He taught without notes, thinking aloud, in his rooms in Trinity College, with students sitting on deckchairs. He urged his best students to give up philosophy and do something useful.

During the Second World War he worked as a porter at Guy’s Hospital in London. He spent long periods in a hut he built in Norway and in a cottage in the west of Ireland. He resigned his chair in 1947. He died of prostate cancer in 1951, in the house of his doctor in Cambridge, aged 62. His last words were: “Tell them I’ve had a wonderful life.”`,
  ideas: [
    { t: `The picture theory of meaning`, b: `The *Tractatus* is written as numbered propositions, beginning: “1. The world is everything that is the case.” The world is made of facts, not things. Language works by picturing facts. A proposition is like a picture or model: its elements correspond to objects, and their arrangement shows a possible arrangement of objects. If the arrangement exists, the proposition is true. Wittgenstein said the idea came to him on reading about a Paris court case in which a traffic accident was reconstructed with model cars.` },
    { t: `The limits of language`, b: `If meaningful language only pictures facts, then much of what people say is literally nonsense: not false, but without sense. That includes ethics, aesthetics, religion, the meaning of life, and even the propositions of the *Tractatus* itself. “My propositions serve as elucidations in the following way: anyone who understands me eventually recognises them as nonsensical, when he has used them to climb up beyond them. (He must, so to speak, throw away the ladder after he has climbed up it.)”

But this doesn’t mean these things don’t matter. It means they can’t be *said*; they can only be *shown*. “There are, indeed, things that cannot be put into words. They make themselves manifest. They are what is mystical.” Wittgenstein told a publisher that the book had two parts, the one written and the one not written, and that the unwritten part was the important one.` },
    { t: `The meaning of life`, b: `“The solution of the problem of life is seen in the vanishing of the problem.” (Is not this the reason why those who have found after a long period of doubt that the sense of life became clear to them have then been unable to say what constituted that sense?) And: “Not how the world is, is the mystical, but that it is.”

Wittgenstein believed that the meaning of life couldn’t be stated as a theory. It had to be lived.` },
    { t: `Meaning is use`, b: `In the *Philosophical Investigations*, published after his death, Wittgenstein attacked his own earlier view. Language isn’t one thing with one job (picturing). It is a vast collection of different activities: giving orders, describing, reporting, speculating, making up stories, play-acting, telling jokes, thanking, cursing, greeting, praying. He calls them **language games**.

“For a large class of cases, though not for all, the meaning of a word is its use in the language.” You don’t learn what a word means by learning what object it names. You learn how to use it, in context, in a “form of life”. Ask not for the meaning; ask for the use.` },
    { t: `Family resemblance`, b: `What do all games have in common? Board games, card games, ball games, Olympic games? Wittgenstein says: “don’t think, but look!” You won’t find one thing common to all. You find “a complicated network of similarities overlapping and criss-crossing”, like the resemblances between members of a family: build, features, eye colour, gait, temperament. Many concepts work like this. The demand for a single definition (what *is* justice, knowledge, art?) that has driven philosophy since Socrates is often a mistake.` },
    { t: `Philosophy as therapy`, b: `Philosophical problems arise “when language goes on holiday”: when we take words out of their ordinary use and try to use them in the abstract. The result is confusion that feels like depth. The philosopher’s job isn’t to build theories but to untangle the knots, by reminding us how words are actually used. “What is your aim in philosophy? To show the fly the way out of the fly-bottle.”

“Philosophy is a battle against the bewitchment of our intelligence by means of language.”` },
    { t: `The private language argument`, b: `Could there be a language that only one person could understand, whose words refer to that person’s private sensations? Imagine you decide to write “S” in a diary every time you have a particular sensation. How do you know you’re using “S” correctly next time? Whatever seems right to you will be right, “and that only means that here we can’t talk about ‘right’.” Meaning requires public rules, checkable by others. This undermines the Cartesian picture in which each of us has a private inner world we know directly and others only infer.` },
    { t: `The beetle in the box`, b: `Suppose everyone has a box with something in it they call a “beetle”. No one can look into anyone else’s box; everyone says they know what a beetle is only by looking at their own. It might be that everyone has something different in their box, or that the thing constantly changes, or that the box is empty. The word “beetle” still has a use in the language, but the thing in the box plays no part in it. Wittgenstein’s point: our words for inner experiences can’t get their meaning from private objects.` }
  ],
  works: [
    { t: `Tractatus Logico-Philosophicus`, y: `1921`, b: `About 75 pages of numbered propositions. Austere, compressed, oracular. It inspired the Vienna Circle of logical positivists, whom Wittgenstein thought had missed the point entirely. Read the Preface and the last pages (6.4 onwards) first; they are where the heart is.` },
    { t: `Philosophical Investigations`, y: `1953, posthumous`, b: `693 numbered remarks, written in a conversational voice full of questions, imagined objections and examples. It is often considered the most important philosophy book of the twentieth century. Read §§1–43 and §§65–133 first.` },
    { t: `On Certainty`, y: `1969, posthumous`, b: `Notes from his last eighteen months, on knowledge and doubt. Some beliefs (that I have two hands, that the earth existed long before I was born) are not things we know but the “hinges” on which all knowing turns.` },
    { t: `Culture and Value`, y: `1977, posthumous`, b: `A collection of remarks from his notebooks on art, religion, music, culture and philosophy. The most personal and accessible of his books.` }
  ],
  quotes: [
    { q: `The limits of my language mean the limits of my world.`, s: `*Tractatus* 5.6` },
    { q: `Whereof one cannot speak, thereof one must be silent.`, s: `*Tractatus* 7, its final line (Ogden translation)` },
    { q: `Not how the world is, is the mystical, but that it is.`, s: `*Tractatus* 6.44` },
    { q: `The solution of the problem of life is seen in the vanishing of the problem.`, s: `*Tractatus* 6.521` },
    { q: `What is your aim in philosophy? To show the fly the way out of the fly-bottle.`, s: `*Philosophical Investigations* §309` },
    { q: `Philosophy is a battle against the bewitchment of our intelligence by means of language.`, s: `*Philosophical Investigations* §109` },
    { q: `If a lion could talk, we could not understand him.`, s: `*Philosophical Investigations*, Part II, xi` },
    { q: `Tell them I’ve had a wonderful life.`, s: `His last words, 29 April 1951` }

  fakes: [],
  critique: `Some philosophers think the later Wittgenstein made philosophy impossible, or trivial. If every philosophical problem is a confusion about language, the job is merely to dissolve problems, and nothing positive can be said. Critics like Bertrand Russell, who had championed the early work, came to think the later work was a surrender: “The later Wittgenstein seems to have grown tired of serious thinking and to have invented a doctrine which would make such an activity unnecessary.”

His style is also a problem. Both major books are cryptic, and the *Investigations* rarely states a thesis directly. Readers spend years arguing about what he meant, which is an odd result for a philosopher who wanted to bring clarity. His followers could be cultish, imitating his mannerisms and sharing his contempt for other philosophers.

And the private language argument, the most discussed part of the *Investigations*, is notoriously hard to pin down: some think it refutes the idea of private inner experience; others think it shows only that we need public criteria to talk about it; still others think it doesn’t work at all.`,
  start: `Start with Ray Monk’s biography *Ludwig Wittgenstein: The Duty of Genius* (1990), which weaves the life and the thought together and is one of the best philosopher biographies ever written. Then read the *Philosophical Investigations* §§1–133 (Blackwell, trans. Anscombe, Hacker and Schulte). For the *Tractatus*, read the Preface and propositions 6.4–7. A. C. Grayling’s *Wittgenstein: A Very Short Introduction* is a quick guide.`,

{
  id: 'heidegger', name: `Martin Heidegger`, born: 1889, died: 1976, era: 'c20',
  place: `Messkirch; Freiburg; the Black Forest`, role: `Philosopher`,
  themes: ['meaning', 'death', 'mind'], keywords: ['being and time', 'dasein', 'being in the world', 'das man', 'the they', 'authenticity', 'being toward death', 'thrownness', 'care', 'technology', 'enframing', 'nazism', 'black notebooks'],
  tagline: `We live distracted by “the They”, and only facing our own death makes us ourselves.`,
  summary: `Heidegger asked the question he thought philosophy had forgotten: what does it mean to *be*? His answer started with human existence (*Dasein*), which is always already “thrown” into a world, absorbed in practical tasks, and mostly living as “the They” (*das Man*) live: thinking, feeling and chattering as one does. Authentic existence comes from facing your own death, which is yours alone. Later he warned that modern technology turns everything, including us, into a resource to be optimised. He was also a member of the Nazi party, and that cannot be separated out.`,
  life: `Martin Heidegger was born in 1889 in Messkirch, a small Catholic town in south-west Germany, the son of the sexton of the local church. He was meant for the priesthood and studied theology, with Church scholarships, before switching to philosophy. He studied under Edmund Husserl, the founder of phenomenology (the careful description of experience as it is lived), and became his assistant.

In 1923 he became a professor at Marburg, where he was a legendary teacher. Hannah Arendt, then an 18-year-old student, said word spread through Germany “like the rumour of a hidden king”: here was someone thinking. He and Arendt had a secret affair; he was married with two sons.

*Being and Time*, published in 1927, made him famous overnight. In 1928 he succeeded Husserl at Freiburg. He built a small hut in the Black Forest village of Todtnauberg, where he did much of his writing and liked to present himself as a man of the soil.

In April 1933, three months after Hitler came to power, Heidegger was elected rector of Freiburg University and joined the Nazi party. In his inaugural address he celebrated “the glory and greatness of this new beginning”. He implemented the Nazi reorganisation of the university. He cut off contact with Husserl, his Jewish former teacher (whose university privileges were revoked under Nazi law; Heidegger removed the dedication to Husserl from later printings of *Being and Time*). He resigned the rectorship after a year, but remained a party member until 1945.

After the war, a denazification committee banned him from teaching until 1951. He never publicly apologised for or seriously discussed his Nazism, except in a brief, evasive interview published after his death. His “Black Notebooks”, private journals published from 2014, contain antisemitic passages, confirming for many that his Nazism was not just opportunism.

He continued to write and lecture, with enormous influence on French thought (Sartre, Derrida, Foucault), and resumed his friendship with Arendt. He died in 1976 and was buried in Messkirch.`,
  ideas: [
    { t: `The question of Being`, b: `Philosophers since Plato have asked what kinds of things exist, but Heidegger thought they had forgotten to ask what it means for anything to *be* at all. We use “is” constantly, and have no idea what we mean by it. *Being and Time* sets out to raise the question again.

The way in is through the one being for whom its own being is an issue: us. Heidegger calls human existence *Dasein*, literally “being-there”. He avoids words like “subject”, “mind” or “person” because they come loaded with the Cartesian picture of a thinking thing inside a head, looking out at a world of objects.` },
    { t: `Being-in-the-world`, b: `We are not minds that first exist and then look out at a world. We are always already in the world, absorbed in it, involved with it. When you use a hammer, you don’t first perceive a wooden and metal object and then decide to use it; you just hammer, and the hammer disappears into the activity. Heidegger calls this being “ready-to-hand”. Only when it breaks does the hammer become an object you stare at, “present-at-hand”.

This was a direct challenge to Descartes. Our primary relation to the world isn’t detached knowing; it is practical, caring involvement.` },
    { t: `Thrownness`, b: `We find ourselves “thrown” into existence: into a particular time, place, family, language, body and history we didn’t choose. We can’t get behind our thrownness. We have to take it up and make something of it.` },
    { t: `The They`, b: `Most of the time we don’t exist as ourselves. We exist as *das Man*, usually translated “the They” or “the One”. We enjoy ourselves as *one* enjoys oneself; we read, see and judge about literature and art as *one* sees and judges; we find “shocking” what *one* finds shocking. The They isn’t any particular person. It is everyone and no one. It takes the burden of choosing off our shoulders.

Everyday existence is marked by **idle talk** (chatter that passes things on without understanding them), **curiosity** (the restless craving for novelty, jumping from one thing to the next, never dwelling) and **ambiguity** (everyone seems to understand everything, and no one really does). Heidegger wrote this in 1927. It describes the experience of a social media feed with unsettling precision.` },
    { t: `Being-toward-death`, b: `How do we escape the They? Through death, or rather, through facing it. Death is the one possibility that is absolutely my own. No one can die for me. It is certain, but its “when” is indefinite. And it is the possibility of the impossibility of any further possibilities.

The They covers death up: “one dies”, as if it were an event that happens to other people, someday. Authentic existence means “anticipating” death: living in full awareness that you will die, which individualises you, tears you away from the They, and makes you face the question of what you will do with your finite existence. The mood that reveals this is *Angst*, anxiety, which, like Kierkegaard’s, has no object: it is anxiety about being-in-the-world as such.` },
    { t: `Care and time`, b: `The basic structure of Dasein is *Sorge*, care: we are always concerned with things, projecting ourselves into possibilities (the future), carrying our thrownness (the past), and dealing with what’s present. Human existence is fundamentally temporal. We aren’t things that exist in time; we are, in a sense, time itself unfolding.` },
    { t: `The question concerning technology`, b: `In his later work, Heidegger argued that modern technology isn’t just a set of tools. It is a way of revealing the world, which he called *Gestell*, “enframing”. Under enframing, everything shows up as “standing-reserve”: a resource to be ordered, stored, optimised and used. The river becomes a power supply; the forest, timber; the mountain, ore. And eventually human beings too become “human resources”.

The danger isn’t that machines will destroy us. It is that this way of seeing will become the only one, and we will forget that there was ever any other way for things to be. It is one of the sharpest critiques of a world run on metrics, engagement and optimisation.` },
    { t: `Releasement`, b: `Against enframing, the late Heidegger recommended *Gelassenheit*, “releasement” or letting-be: a meditative openness to things, using technology without being enslaved by it, saying both yes and no to it. He also turned to poetry (especially Hölderlin) as a way of thinking that lets things show themselves rather than ordering them.` }
  ],
  works: [
    { t: `Being and Time`, y: `1927`, b: `One of the most influential and most difficult philosophy books ever written, dense with invented terminology. It was never finished: the planned second half was abandoned. Division One, on everyday being-in-the-world and the They, is more accessible than Division Two, on death, conscience and time.` },
    { t: `What is Metaphysics?`, y: `1929`, b: `His inaugural lecture at Freiburg, on anxiety and “the Nothing”. Short and famous.` },
    { t: `The Origin of the Work of Art`, y: `1935–36`, b: `On how great art opens up a world. Includes his reading of Van Gogh’s painting of peasant shoes.` },
    { t: `The Question Concerning Technology`, y: `1954`, b: `A lecture, about 35 pages. The best entry point to the later Heidegger and the most relevant to now.` },
    { t: `Letter on Humanism and Building Dwelling Thinking`, y: `1947; 1951`, b: `Short essays. “Language is the house of Being.”` }
  ],
  quotes: [
    { q: `Everyone is the other, and no one is himself.`, s: `*Being and Time* §27` },
    { q: `We enjoy ourselves and have fun the way they enjoy themselves. We read, see and judge literature and art the way they see and judge.`, s: `*Being and Time* §27 (Stambaugh translation)` },
    { q: `As soon as man comes to life, he is at once old enough to die.`, s: `*Being and Time* §48, quoting a medieval saying` },
    { q: `Language is the house of Being.`, s: `*Letter on Humanism* (1947)` },
    { q: `The essence of technology is by no means anything technological.`, s: `*The Question Concerning Technology* (1954)` },
    { q: `Only a god can save us.`, s: `*Der Spiegel* interview, 1966, published 1976` }
  ],
  fakes: [],
  critique: `The first and unavoidable issue is Nazism. Heidegger joined the party, enthusiastically promoted the regime as rector, and never repudiated it. The Black Notebooks show antisemitic thinking bound up with his philosophy of history (he wrote of “world Jewry” as an agent of rootless calculation). Scholars disagree about how deep the connection goes, but it is now hard to argue that his philosophy and his politics were entirely separate. Some argue that his contempt for “the They”, his hostility to liberal modernity and his longing for rootedness, authenticity and a destiny of the people lent themselves easily to fascism.

The second is obscurity. Heidegger’s invented vocabulary can seem like depth, or like an elaborate way of saying simple things. Rudolf Carnap made him the prime example of meaningless metaphysics, mocking the sentence “The Nothing itself nothings.” Theodor Adorno wrote a whole book, *The Jargon of Authenticity*, attacking the style.

Third, authenticity is empty as a guide. Heidegger tells you to own your choices resolutely in the face of death, but not what to choose. A person can resolutely choose to be a Nazi rector, and he did.`,
  start: `Don’t start with *Being and Time*. Start with Sarah Bakewell’s *At the Existentialist Café* (2016), which gives the best account of Heidegger’s ideas and his life in context. Then read “The Question Concerning Technology” (in *Basic Writings*, ed. David Farrell Krell). Hubert Dreyfus’s recorded Berkeley lectures on *Being and Time* are free online and are how many people actually learned it. Michael Inwood’s *Heidegger: A Very Short Introduction* is excellent.`,
  related: ['kierkegaard', 'nietzsche', 'sartre', 'arendt', 'wittgenstein', 'pascal']
},
{
  id: 'sartre', name: `Jean-Paul Sartre`, born: 1905, died: 1980, era: 'c20',
  place: `Paris`, role: `Philosopher, novelist and playwright`,
  themes: ['meaning', 'ethics', 'mind', 'love', 'politics'], keywords: ['existentialism', 'existence precedes essence', 'condemned to be free', 'bad faith', 'nausea', 'being and nothingness', 'hell is other people', 'no exit', 'the look', 'freedom', 'responsibility', 'waiter'],
  tagline: `You are condemned to be free, and you’re responsible for everything you make of yourself.`,
  summary: `Sartre’s existentialism begins with a slogan: existence precedes essence. There is no human nature given in advance, no God with a plan for you. You exist first, and then define yourself through your choices. That means you are radically free, and radically responsible. Most people flee this freedom through “bad faith”, pretending they have no choice. He also explored how other people’s gaze turns us into objects, which is what his famous line “hell is other people” is really about.`,
  life: `Jean-Paul Sartre was born in Paris in 1905. His father, a naval officer, died of fever when Jean-Paul was fifteen months old, and he was raised by his mother and her father, Charles Schweitzer (uncle of Albert Schweitzer), a scholar with a vast library. Small, cross-eyed and bookish, he decided young that he would be a writer. His autobiography of childhood, *Words*, tells the story with savage irony.

He studied at the elite École Normale Supérieure. In 1929 he met Simone de Beauvoir, who came second to him in the national philosophy exam. They became lifelong partners, never married, never lived together, and agreed to an “essential” love that allowed “contingent” affairs, which both had in abundance, with complicated and sometimes cruel results.

In 1933 a friend described the new German philosophy of phenomenology over apricot cocktails, telling him you could philosophise about the cocktail itself. Sartre, according to Beauvoir, went pale with excitement. He went to Berlin to study Husserl and Heidegger.

His first novel, *Nausea* (1938), made his name. He was drafted in 1939, captured in 1940, and spent nine months in a prisoner-of-war camp, where he read Heidegger and wrote and staged a play. Back in occupied Paris he wrote his massive philosophical treatise *Being and Nothingness* (1943) and the plays *The Flies* and *No Exit*, largely in the cafés of Saint-Germain-des-Prés, especially the Café de Flore, which was warmer than his room.

After the Liberation, existentialism became a craze. Sartre’s lecture “Existentialism Is a Humanism” in October 1945 was so packed that people fainted. He and Beauvoir founded the journal *Les Temps modernes*. Increasingly political, he moved close to the Communist Party, defended the Soviet Union for years (to Camus’s disgust; their friendship ended over it), then broke with it after the Soviet invasion of Hungary in 1956. He supported Algerian independence (his apartment was bombed twice by right-wing extremists), opposed the Vietnam War, and later backed Maoist groups.

In 1964 he was awarded the Nobel Prize in Literature and refused it, saying a writer should not allow himself to be turned into an institution. He smoked, drank and took amphetamines heavily to keep writing, and went nearly blind in his last years. When he died in 1980, around 50,000 people followed his coffin through Paris.`,
  ideas: [
    { t: `Existence precedes essence`, b: `Consider a paper knife. Before it existed, its maker had a concept of what it would be and what it was for. Its essence (its definition, its purpose) came before its existence. If God created humans, we would be like that: made to a plan.

Sartre says there is no God, so there is no plan. “Man first of all exists, encounters himself, surges up in the world, and defines himself afterwards.” There is no human nature, because there is no God to conceive it. Man is nothing else but what he makes of himself.` },
    { t: `Condemned to be free`, b: `This means we are totally free. Not free in the sense of being able to do anything (you can’t fly) but free in that nothing determines what you make of your situation: not your past, your character, your emotions, your upbringing. You always choose. Even not choosing is a choice.

And this freedom is a burden. “Man is condemned to be free: condemned, because he did not create himself, yet is nevertheless at liberty, and from the moment that he is thrown into this world he is responsible for everything he does.” There are no excuses. The feeling that goes with this is anguish.` },
    { t: `Bad faith`, b: `Because freedom is frightening, we flee it. We pretend we are not free: that we are determined by our nature, our role, our circumstances. Sartre calls this *mauvaise foi*, bad faith: lying to yourself about your own freedom.

His famous example: a café waiter whose movements are a little too precise, a little too eager, bending forward a little too much, balancing his tray a little too cleverly. He is *playing at being* a waiter, trying to be a waiter the way an inkwell is an inkwell, to turn himself into a thing. But no one simply *is* a waiter. He could walk out at any moment. His performance is a way of hiding from that.

Another: a woman on a date lets her hand remain in her companion’s hand, but acts as if she hasn’t noticed, treating her hand as a mere object, so that she doesn’t have to decide. Any time you say “that’s just who I am” or “I had no choice”, Sartre suspects bad faith.` },
    { t: `The look`, b: `Imagine you are peering through a keyhole, absorbed, jealous or curious. You are not aware of yourself at all; you are pure consciousness of the scene. Then you hear footsteps behind you. Someone is looking at you. Suddenly you are an object: a voyeur, caught. You feel shame.

The gaze of another person transforms you into a thing in their world, with a nature you can’t control. You become what they see. Our relations with others, for Sartre, are a constant struggle between trying to be a subject who looks and being turned into an object by being looked at.` },
    { t: `Hell is other people`, b: `In *No Exit* (*Huis clos*, 1944), three dead people are shown into a room in hell. There are no torturers, no flames. Gradually they realise they are the torture. Each needs the others to see them the way they want to be seen, and each sees the others as they really are. At the end one of them says: “Hell is other people.”

Sartre later explained he didn’t mean that relationships with others are always poisoned. He meant that when our relationships are twisted, when we depend on others’ judgement to know who we are, then others become hell. We are always judged, and we judge ourselves by the means others give us.` },
    { t: `Nausea`, b: `In the novel *Nausea*, the historian Antoine Roquentin, living in a provincial seaport, is overcome by a strange sickness. Things start to lose their names and their familiarity. In the most famous scene, sitting in a park, he stares at the root of a chestnut tree and suddenly sees it as it is: a black, knotted, pure existing mass, without reason, without necessity, simply there, “de trop”, superfluous. So is everything, including him. That is the nausea: the experience of the sheer contingency of existence.` },
    { t: `Everything is permitted, and so you are responsible`, b: `Sartre quoted Dostoevsky: “If God did not exist, everything would be permitted.” That, he said, is the very starting point of existentialism. But this doesn’t make life easier. When I choose, I choose for all humanity: I create an image of what a human being should be. So my responsibility is much greater than I might have supposed. It concerns all of mankind.` }
  ],
  works: [
    { t: `Nausea`, y: `1938`, b: `His first and best novel, in the form of a diary. The chestnut-root scene is the heart.` },
    { t: `Being and Nothingness`, y: `1943`, b: `Over 700 pages of dense phenomenology. The chapters on bad faith (Part One, chapter 2) and the look (Part Three) are essential and readable. The rest is hard going.` },
    { t: `No Exit`, y: `1944`, b: `A one-act play, performable in an hour. Very readable, very funny, very dark.` },
    { t: `Existentialism Is a Humanism`, y: `1946`, b: `The lecture, about 40 pages. The clearest, most popular statement of his ideas, which Sartre later said he regretted publishing because it oversimplified them. Still the best place to start.` },
    { t: `The Roads to Freedom trilogy`, y: `1945–49`, b: `Three novels about the run-up to and start of the war, following characters trying to live authentically.` },
    { t: `Words (Les Mots)`, y: `1964`, b: `A short, brilliant and merciless memoir of his childhood.` }
  ],
  quotes: [
    { q: `Existence precedes essence.`, s: `*Existentialism Is a Humanism* (1946)` },
    { q: `Man is condemned to be free; because once thrown into the world, he is responsible for everything he does.`, s: `*Existentialism Is a Humanism*` },
    { q: `Man is nothing else but what he makes of himself.`, s: `*Existentialism Is a Humanism*` },
    { q: `Hell is other people.`, s: `*No Exit* (1944), Garcin’s line near the end` },
    { q: `Freedom is what you do with what’s been done to you.`, s: `*Saint Genet* (1952), paraphrased; the original says we are what we make of what others have made of us` },
    { q: `A writer should not allow himself to be turned into an institution.`, s: `Statement declining the Nobel Prize, 1964` }
  ],
  fakes: [
    { q: `We do not know what we want and yet we are responsible for what we are. That is the fact.`, n: `Widely circulated with no source found in his works.` }
  ],
  critique: `The most common objection is that Sartre’s freedom is exaggerated. Is a prisoner, a starving person or a child in a war zone really “totally free” to make of their situation what they will? Beauvoir and Merleau-Ponty pushed him on this, pointing out that freedom is always situated, limited by bodies, histories and circumstances. Sartre himself moved towards Marxism partly because he came to see that material conditions do constrain freedom. His later work is largely an attempt to reconcile the two.

Second: if there are no values given in advance and each person creates their own, why is bad faith bad? Why is authenticity better than self-deception? Sartre seems to smuggle in a value (honesty about freedom) that his theory says can’t be grounded. He promised a book on ethics and never finished it.

Third, his politics. For years he defended the Soviet Union and downplayed the Gulag, arguing that criticising it would give ammunition to the right. He praised Mao’s China during the Cultural Revolution. For a philosopher of responsibility, he could be remarkably willing to excuse atrocities by regimes on the “right side of history”. Camus called him out on this, and history has mostly sided with Camus.`,
  start: `Read *Existentialism Is a Humanism* first (Yale, 2007), then *No Exit* and *Nausea*. Then, for bad faith, the chapter from *Being and Nothingness* in the Routledge translation by Sarah Richmond. Sarah Bakewell’s *At the Existentialist Café* is the best introduction to Sartre, Beauvoir and their circle, and a joy to read.`,
  related: ['beauvoir', 'camus', 'heidegger', 'kierkegaard', 'dostoevsky']
},
{
  id: 'beauvoir', name: `Simone de Beauvoir`, born: 1908, died: 1986, era: 'c20',
  place: `Paris`, role: `Philosopher, novelist and memoirist`,
  themes: ['ethics', 'politics', 'love', 'mind', 'death'], keywords: ['the second sex', 'one is not born a woman', 'feminism', 'existentialism', 'ethics of ambiguity', 'other', 'old age', 'the mandarins', 'sartre'],
  tagline: `One is not born, but rather becomes, a woman.`,
  summary: `Beauvoir used existentialist philosophy to ask what it means to be a woman, and her answer founded modern feminism. Throughout history, man has defined himself as the Subject, the norm, and woman as the Other, defined only in relation to him. Being a woman isn’t a fixed nature but a situation, produced by upbringing, society and myth. She also wrote a lucid existentialist ethics: my freedom requires the freedom of others. And she wrote some of the best memoirs of the century.`,
  life: `Simone de Beauvoir was born in 1908 in Paris into a bourgeois Catholic family that lost most of its money after the First World War. Her father, a lawyer who loved the theatre, told her she “had a man’s brain”; he also told her that, without a dowry, she would have to work. Her mother was devoutly Catholic. At fourteen Simone lost her faith.

Her intense friendship with Zaza Lacoin, a girl from a wealthy Catholic family who died at 21, possibly of encephalitis, after her family blocked her marriage to the man she loved, haunted her all her life. She believed Zaza had been killed by bourgeois conformity.

She studied philosophy at the Sorbonne and in 1929 became, at 21, the youngest person ever to pass the *agrégation* in philosophy, placing second, just behind Sartre (some examiners thought she was the better philosopher). She taught in lycées in Marseille, Rouen and Paris. In 1943 she was dismissed after the mother of one of her students, Nathalie Sorokine, accused her of corrupting a minor. She and Sartre had a pattern of relationships with young women, some of them her former students, that biographers have documented and that looks worse the more that is known.

Her first novel, *She Came to Stay* (1943), was a fictionalised account of a destructive love triangle with Sartre and Olga Kosakiewicz. *The Second Sex* (1949) sold 22,000 copies in its first week and caused a scandal; the Vatican put it on the Index of Forbidden Books. Her novel *The Mandarins*, about intellectuals after the Liberation, won the Prix Goncourt in 1954.

She had an intense transatlantic affair with the American novelist Nelson Algren, who begged her to marry him and live in Chicago; she refused, unwilling to leave Sartre or Paris. Later she lived with the young filmmaker Claude Lanzmann. She wrote a four-volume autobiography, an account of her mother’s death (*A Very Easy Death*), and a major study of ageing (*Old Age*). She campaigned for abortion rights, signing the 1971 “Manifesto of the 343”, in which prominent women declared they had had illegal abortions.

She died in 1986, six years to the day after Sartre, and was buried beside him in Montparnasse cemetery.`,
  ideas: [
    { t: `Woman as the Other`, b: `*The Second Sex* begins by asking a question that seems obvious: what is a woman? Man never has to ask what a man is; he is simply the human being, the default. “He is the Subject, he is the Absolute: she is the Other.” Woman is defined in relation to man, as what he is not: the second sex. Humanity is male, and man defines woman not in herself but relative to him.

Every group, Beauvoir notes, defines itself against an Other: natives against foreigners, Christians against Jews. But these relations are usually reciprocal; the foreigner sees you as foreign. What is unusual about women is that they have often accepted their position as Other, because of their dispersal among men (unlike other oppressed groups, they have no separate history or community), their economic dependence, and the rewards of complicity.` },
    { t: `One becomes a woman`, b: `The second volume opens with the most famous sentence in feminist philosophy: “One is not born, but rather becomes, a woman.” No biological, psychological or economic destiny determines what a woman is. It is civilisation as a whole that produces “this creature, intermediate between male and eunuch, which is described as feminine”.

She then traces how this happens, stage by stage: how girls are raised differently from boys, taught to be passive, to please, to see their bodies as objects; how adolescence, sexual initiation, marriage and motherhood channel women into dependence. She describes this from inside, with devastating detail.

This distinction between biological sex and the social meaning of being a woman laid the ground for the later concept of gender.` },
    { t: `Myths of femininity`, b: `Beauvoir analyses the myths men have created about women: the mother, the virgin, the temptress, the muse, the mystery, the nature-goddess. Woman is made to represent everything man desires and fears. These myths deny women their existence as free individuals, making them into symbols. She traces them through the novels of Montherlant, D. H. Lawrence, Claudel, Breton and Stendhal.` },
    { t: `Freedom needs other freedoms`, b: `In *The Ethics of Ambiguity* (1947), Beauvoir tried to write the ethics Sartre never did. Human beings are ambiguous: we are both free consciousness and physical things, both subjects and objects, both individuals and part of a collective. Ethics means accepting that ambiguity rather than fleeing it.

Crucially, my freedom is bound up with others’: “To will oneself free is also to will others free.” I can’t achieve real freedom in a world where others are oppressed. So oppression is the fundamental wrong, and the oppressed have a right to revolt.

She also sketches a gallery of ways people flee freedom: the “sub-man” who is bored and apathetic, the “serious man” who submits to some external cause (a party, a nation, a career) and treats it as absolute, the nihilist, the adventurer, and the passionate man.` },
    { t: `Old age`, b: `In *Old Age* (1970), Beauvoir did for the elderly what she had done for women: showed that what seems a natural condition is largely a social one. Society treats the old as others, as not quite human, and hides them away. “Old age exposes the failure of our entire civilisation.” She also wrote honestly about her own ageing, her fear of death, and her mother’s death.` }
  ],
  works: [
    { t: `The Second Sex`, y: `1949`, b: `Nearly 800 pages in two volumes: “Facts and Myths” and “Lived Experience”. The first English translation (1953) cut about 15% of the text and mangled the philosophy; the 2009 translation by Constance Borde and Sheila Malovany-Chevallier restores it. The Introduction and the chapter “Childhood” are essential.` },
    { t: `The Ethics of Ambiguity`, y: `1947`, b: `Short, clear, and one of the best statements of existentialist ethics.` },
    { t: `The Mandarins`, y: `1954`, b: `A long novel about French intellectuals after the war, loosely based on Sartre, Camus, Algren and herself.` },
    { t: `Memoirs of a Dutiful Daughter`, y: `1958`, b: `The first volume of her autobiography, about her childhood, loss of faith, friendship with Zaza, and meeting Sartre. Beautifully written.` },
    { t: `A Very Easy Death`, y: `1964`, b: `A short, unsparing account of her mother’s death from cancer. One of the best books about dying.` }
  ],
  quotes: [
    { q: `One is not born, but rather becomes, a woman.`, s: `*The Second Sex*, Volume II, opening` },
    { q: `He is the Subject, he is the Absolute: she is the Other.`, s: `*The Second Sex*, Introduction` },
    { q: `To will oneself free is also to will others free.`, s: `*The Ethics of Ambiguity*` },
    { q: `Representation of the world, like the world itself, is the work of men; they describe it from their own point of view, which they confuse with the absolute truth.`, s: `*The Second Sex*, Volume I` },
    { q: `There is no such thing as a natural death: nothing that happens to a man is ever natural, since his presence calls the world into question.`, s: `*A Very Easy Death*` }
  ],
  fakes: [
    { q: `Change your life today. Don’t gamble on the future, act now, without delay.`, n: `Widely circulated under her name. It hasn’t been located in her works.` }
  ],
  critique: `Beauvoir has been criticised from many sides. Some later feminists thought she was too hostile to the female body, to motherhood and to femininity itself; she tends to treat pregnancy and childbirth as burdens and to present the male model of transcendence and independence as the ideal women should reach. Others think her distinction between sex and becoming a woman didn’t go far enough.

Her analysis is also heavily centred on the experience of white, middle-class European women. bell hooks and other Black feminists pointed out that race, class and colonialism shape womanhood in ways *The Second Sex* barely considers, even though Beauvoir drew analogies to racial oppression.

Her personal conduct is also a problem. She and Sartre had relationships with young women, some of them her students, and there is a pattern of what looks like grooming and manipulation, which her own letters, published after her death, make harder to excuse. In 1977 she signed a petition, along with Sartre, Barthes and others, calling for the decriminalisation of sexual relations between adults and minors under fifteen. It is a stain that her admirers have to reckon with.`,
  start: `Read the Introduction to *The Second Sex* (Vintage, 2009 translation), then *Memoirs of a Dutiful Daughter* for the life. *The Ethics of Ambiguity* (Citadel) is short and rewarding. Kate Kirkpatrick’s *Becoming Beauvoir* (2019) is an excellent, clear-eyed biography that restores her as a philosopher in her own right.`,
  related: ['sartre', 'camus', 'hegel', 'arendt', 'simone-weil']
}
);

window.PATHS = [];

</script>
<script>
// Routing, rendering and per-reader state (read marks, theme, text size).
(function () {
  var T = window.THINKERS, ERAS = window.ERAS, PATHS = window.PATHS, THEMES = window.THEMES;
  var byId = {};
  T.forEach(function (t) { byId[t.id] = t; });

  // Order of the index: era order, then birth year within each era.
  var eraOrder = {};
  ERAS.forEach(function (e, i) { eraOrder[e.id] = i; });
  T.sort(function (a, b) { return (eraOrder[a.era] - eraOrder[b.era]) || (a.born - b.born); });

  var view = document.getElementById('view');
  var root = document.documentElement;

  // ---------- storage (always optional) ----------
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ }
  }
  var read = load('ios-read', {});
  var state = { q: '', theme: '' };

  var theme = load('ios-theme', null);
  if (theme) root.setAttribute('data-theme', theme);
  var size = load('ios-size', 1.1);
  root.style.setProperty('--reading-size', size + 'rem');

  document.getElementById('theme-toggle').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme');
    if (!cur) cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    save('ios-theme', next);
  });
  document.getElementById('random-top').addEventListener('click', goRandom);

  function goRandom() {
    var pool = T.filter(function (t) { return !read[t.id]; });
    if (!pool.length) pool = T;
    var cur = location.hash.slice(1);
    var pick;
    do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && pick.id === cur);
    location.hash = pick.id;
  }

  // ---------- text helpers ----------
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\[\[([a-z0-9-]+)\|(.+?)\]\]/g, '<a href="#$1">$2</a>');
  }
  // Paragraphs split on blank lines; "- " lines make a list; "> " makes a block quote.
  function md(src) {
    if (!src) return '';
    return src.trim().split(/\n\s*\n/).map(function (block) {
      var lines = block.trim().split('\n').map(function (l) { return l.trim(); });
      if (lines.every(function (l) { return l.indexOf('- ') === 0; })) {
        return '<ul>' + lines.map(function (l) { return '<li>' + inline(l.slice(2)) + '</li>'; }).join('') + '</ul>';
      }
      if (lines[0].indexOf('> ') === 0) {
        return '<blockquote><p>' + inline(lines.map(function (l) { return l.replace(/^>\s?/, ''); }).join(' ')) + '</p></blockquote>';
      }
      return '<p>' + inline(lines.join(' ')) + '</p>';
    }).join('\n');
  }
  function year(y, approx) {
    var s = y < 0 ? (-y) + ' BCE' : String(y);
    return (approx ? 'c. ' : '') + s;
  }
  function dates(t) {
    var b = year(t.born, t.approx), d = year(t.died, t.approx);
    if (t.born < 0 && t.died < 0) b = (t.approx ? 'c. ' : '') + (-t.born);
    else if (t.born < 0 && t.died > 0) d = (t.approx ? 'c. ' : '') + t.died + ' CE';
    return b + '–' + d;
  }
  function words(t) {
    var s = [t.summary, t.life, t.critique, t.start];
    (t.ideas || []).forEach(function (i) { s.push(i.b); });
    (t.works || []).forEach(function (w) { s.push(w.b); });
    return s.join(' ').split(/\s+/).length;
  }

  // ---------- home ----------
  function renderHome() {
    var last = load('ios-last', null);
    var n = Object.keys(read).filter(function (k) { return byId[k]; }).length;
    var html = '';
    html += '<section class="intro">';
    html += '<span class="label">A reading room with ' + T.length + ' thinkers in it</span>';
    html += '<h1>Pick a name. Read until you’re done.</h1>';
    html += '<p>Philosophers, psychologists and the novelists who did philosophy by other means. Each one has their life, their big ideas, their books, what they actually said, what they never said, and the strongest case against them.</p>';
    html += '<div class="actions"><button class="btn" id="random" type="button">Open someone at random</button>';
    if (last && byId[last]) html += '<a class="btn ghost" href="#' + last + '">Back to ' + esc(byId[last].name) + '</a>';
    html += '<a class="btn ghost" href="#paths">Follow a reading path</a></div>';
    html += '<div class="progress">You’ve finished <b>' + n + '</b> of ' + T.length + '.</div>';
    html += '</section>';

    html += '<div class="tools"><div class="search"><label class="label" for="q">Find</label>';
    html += '<input id="q" type="search" placeholder="A name, a book, an idea: ‘stoic’, ‘Zarathustra’, ‘shadow’" value="' + esc(state.q) + '" autocomplete="off"></div>';
    html += '<div class="chips" role="group" aria-label="Filter by theme">';
    html += '<button class="chip" type="button" data-theme-filter="" aria-pressed="' + (!state.theme) + '">Everyone</button>';
    THEMES.forEach(function (th) {
      html += '<button class="chip" type="button" data-theme-filter="' + th.id + '" aria-pressed="' + (state.theme === th.id) + '">' + esc(th.label) + '</button>';
    });
    html += '</div></div><div id="results"></div>';
    view.innerHTML = html;

    document.getElementById('random').addEventListener('click', goRandom);
    var q = document.getElementById('q');
    q.addEventListener('input', function () { state.q = q.value; renderIndex(); });
    view.querySelectorAll('[data-theme-filter]').forEach(function (b) {
      b.addEventListener('click', function () {
        state.theme = b.getAttribute('data-theme-filter');
        view.querySelectorAll('[data-theme-filter]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
        renderIndex();
      });
    });
    renderIndex();
  }

  function matches(t) {
    if (state.theme && t.themes.indexOf(state.theme) < 0) return false;
    var q = state.q.trim().toLowerCase();
    if (!q) return true;
    var hay = [t.name, t.tagline, t.place, t.role, t.summary].concat(
      (t.works || []).map(function (w) { return w.t; }),
      (t.ideas || []).map(function (i) { return i.t; }),
      t.themes, t.keywords || []
    ).join(' ').toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function renderIndex() {
    var out = '';
    ERAS.forEach(function (era) {
      var list = T.filter(function (t) { return t.era === era.id && matches(t); });
      if (!list.length) return;
      out += '<section class="era"><div class="era-head"><h2>' + esc(era.name) + '</h2><p>' + esc(era.blurb) + '</p></div><ul class="index">';
      list.forEach(function (t) {
        out += '<li><a href="#' + t.id + '"><span class="nm">' + esc(t.name) + (read[t.id] ? '<span class="tick">READ</span>' : '') + '</span>';
        out += '<span class="dt">' + dates(t) + '</span><span class="tg">' + esc(t.tagline) + '</span></a></li>';
      });
      out += '</ul></section>';
    });
    document.getElementById('results').innerHTML = out || '<p class="empty">Nobody matches that. Try a shorter word, or clear the theme filter.</p>';
  }

  // ---------- thinker ----------
  function renderThinker(t) {
    save('ios-last', t.id);
    var era = ERAS[eraOrder[t.era]];
    var idx = T.indexOf(t);
    var prev = T[idx - 1], next = T[idx + 1];
    var mins = Math.max(3, Math.round(words(t) / 230));
    var sections = [['life', 'Life'], ['ideas', 'Big ideas'], ['works', 'The books'], ['quotes', 'In their words']];
    if (t.fakes && t.fakes.length) sections.push(['fakes', 'Never said it']);
    sections.push(['against', 'The case against'], ['start', 'Where to start']);

    var h = '<div class="crumbs"><a href="#">← All thinkers</a><div class="sizes" role="group" aria-label="Text size">';
    h += '<button type="button" data-size="-1" aria-label="Smaller text">A−</button><button type="button" data-size="1" aria-label="Larger text">A+</button></div></div>';
    h += '<article class="article"><header><span class="label">' + esc(era.name) + ' · ' + esc(t.role) + '</span>';
    h += '<h1>' + esc(t.name) + '</h1>';
    h += '<div class="meta">' + dates(t) + ' · ' + esc(t.place) + '</div>';
    h += '<p class="tagline">' + inline(t.tagline) + '</p></header>';
    h += '<div class="summary">' + md(t.summary) + '</div>';
    h += '<nav class="toc" aria-label="On this page">';
    sections.forEach(function (s) { h += '<button type="button" data-jump="' + s[0] + '">' + s[1] + '</button>'; });
    h += '<span class="rt">about ' + mins + ' min</span></nav>';

    h += '<section id="s-life"><h2>Life</h2>' + md(t.life) + '</section>';
    h += '<section id="s-ideas"><h2>Big ideas</h2>';
    t.ideas.forEach(function (i) { h += '<h3>' + inline(i.t) + '</h3>' + md(i.b); });
    h += '</section>';
    h += '<section id="s-works"><h2>The books</h2>';
    t.works.forEach(function (w) { h += '<h3>' + inline(w.t) + (w.y ? '<span class="yr">' + esc(w.y) + '</span>' : '') + '</h3>' + md(w.b); });
    h += '</section>';
    h += '<section id="s-quotes"><h2>In their words</h2><div class="quotes">';
    t.quotes.forEach(function (q) { h += '<figure class="quote"><blockquote>' + inline(q.q) + '</blockquote><figcaption>' + inline(q.s) + '</figcaption></figure>'; });
    h += '</div></section>';
    if (t.fakes && t.fakes.length) {
      h += '<section id="s-fakes"><h2>Never said it</h2><p>These circulate under ' + esc(t.name.split(' ').pop()) + '’s name. They aren’t in the work, or they’re someone else’s summary wearing a famous name.</p><div class="fakes">';
      t.fakes.forEach(function (f) { h += '<div class="fake"><q>' + esc(f.q) + '</q><p>' + inline(f.n) + '</p></div>'; });
      h += '</div></section>';
    }
    h += '<section id="s-against"><h2>The case against</h2>' + md(t.critique) + '</section>';
    h += '<section id="s-start"><h2>Where to start</h2>' + md(t.start) + '</section>';

    h += '<div class="read-toggle"><button class="btn" id="mark" type="button" aria-pressed="' + !!read[t.id] + '">' + (read[t.id] ? 'Finished ✓' : 'Mark as finished') + '</button>';
    h += '<button class="btn ghost" id="random2" type="button">Someone else at random</button></div>';

    var rel = (t.related || []).filter(function (r) { return byId[r]; });
    if (rel.length) {
      h += '<section><h2>Read next</h2><div class="related">';
      rel.forEach(function (r) { var o = byId[r]; h += '<a href="#' + o.id + '"><span class="nm">' + esc(o.name) + '</span><span class="dt">' + dates(o) + '</span></a>'; });
      h += '</div></section>';
    }
    h += '<nav class="pager" aria-label="Previous and next">';
    if (prev) h += '<a href="#' + prev.id + '">← ' + esc(prev.name) + '</a>';
    if (next) h += '<a class="nx" href="#' + next.id + '">' + esc(next.name) + ' →</a>';
    h += '</nav></article>';
    view.innerHTML = h;

    view.querySelectorAll('[data-jump]').forEach(function (b) {
      b.addEventListener('click', function () {
        var el = document.getElementById('s-' + b.getAttribute('data-jump'));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
    view.querySelectorAll('[data-size]').forEach(function (b) {
      b.addEventListener('click', function () {
        size = Math.min(1.5, Math.max(0.9, Math.round((size + 0.05 * Number(b.getAttribute('data-size'))) * 100) / 100));
        root.style.setProperty('--reading-size', size + 'rem');
        save('ios-size', size);
      });
    });
    document.getElementById('random2').addEventListener('click', goRandom);
    var mark = document.getElementById('mark');
    mark.addEventListener('click', function () {
      if (read[t.id]) delete read[t.id]; else read[t.id] = 1;
      save('ios-read', read);
      mark.setAttribute('aria-pressed', String(!!read[t.id]));
      mark.textContent = read[t.id] ? 'Finished ✓' : 'Mark as finished';
    });
  }

  // ---------- paths ----------
  function renderPaths() {
    var h = '<div class="page"><span class="label">Reading paths</span><h1>Where to go after the first one</h1>';
    h += '<p>Reading thinkers in a sensible order does half the work. Each one is answering someone before them. These paths follow an argument across centuries, so each page makes the next one easier.</p>';
    PATHS.forEach(function (p) {
      h += '<h2>' + esc(p.name) + '</h2>' + md(p.intro) + '<ol class="steps">';
      p.steps.forEach(function (s) {
        var t = byId[s[0]];
        if (!t) return;
        h += '<li><div><a href="#' + t.id + '">' + esc(t.name) + '</a>' + (read[t.id] ? ' <span class="tick" style="color:var(--done);font-family:var(--ui);font-size:.8rem">READ</span>' : '') + '<span>' + inline(s[1]) + '</span></div></li>';
      });
      h += '</ol>';
    });
    h += '</div>';
    view.innerHTML = h;
  }

  // ---------- timeline ----------
  function renderTimeline() {
    var list = T.slice().sort(function (a, b) { return a.born - b.born; });
    var min = -600, max = 2000, px = 0.95, rowH = 24, left = 20;
    var w = (max - min) * px + 200, hgt = list.length * rowH + 40;
    function x(y) { return left + (y - min) * px; }
    var h = '<div class="page"><span class="label">Timeline</span><h1>Who was alive when</h1>';
    h += '<p>Every thinker on one scale, 600 BCE to today. Dashed bars are lives whose dates are traditional or uncertain. Scroll sideways; tap a name to read.</p>';
    h += '<p class="note">Two things jump out. First, the gap: almost nothing here between Augustine and Aquinas, which says more about which traditions got written down and translated than about who was thinking. Second, the crowd after 1800, when writing, printing and universities multiplied.</p></div>';
    h += '<div class="tl-wrap"><div class="tl" style="width:' + w + 'px;height:' + hgt + 'px"><div class="tl-axis">';
    for (var y = -500; y <= max; y += 250) {
      h += '<span class="tl-tick" style="left:' + x(y) + 'px">' + (y < 0 ? -y + ' BCE' : y === 0 ? '1 CE' : y) + '</span>';
    }
    h += '</div>';
    for (var g = -500; g <= max; g += 250) h += '<div class="tl-grid" style="left:' + x(g) + 'px"></div>';
    list.forEach(function (t, i) {
      var bw = Math.max(6, (t.died - t.born) * px);
      h += '<a class="tl-row" href="#' + t.id + '" style="left:' + x(t.born) + 'px;top:' + (34 + i * rowH) + 'px"><span class="tl-bar' + (t.approx ? ' approx' : '') + '" style="width:' + bw + 'px"></span><span>' + esc(t.name) + '</span></a>';
    });
    h += '</div></div>';
    view.innerHTML = h;
    // Start scrolled so the densest stretch (1500 onward) is in view on a phone.
    var wrap = view.querySelector('.tl-wrap');
    if (wrap.clientWidth < 900) wrap.scrollLeft = x(1450);
  }

  function renderAbout() {
    view.innerHTML = '<div class="page">' + window.ABOUT + '</div>';
  }

  // ---------- router ----------
  function route() {
    var id = location.hash.slice(1);
    if (!id) renderHome();
    else if (id === 'paths') renderPaths();
    else if (id === 'timeline') renderTimeline();
    else if (id === 'about') renderAbout();
    else if (byId[id]) renderThinker(byId[id]);
    else renderHome();
    if (id) window.scrollTo(0, 0);
    document.title = byId[id] ? byId[id].name + ' · Instead of Scrolling' : 'Instead of Scrolling';
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
