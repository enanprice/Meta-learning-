{
  id: 'confucius', name: `Confucius`, born: -551, died: -479, era: 'east',
  place: `State of Lu (now Shandong, China)`, role: `Teacher and philosopher`,
  themes: ['ethics', 'politics', 'love'], keywords: ['analects', 'ren', 'li', 'junzi', 'gentleman', 'filial piety', 'ritual', 'golden rule', 'kongzi', 'rectification of names'],
  tagline: `You become a good person the way you become a good musician: by practising, in company, for years.`,
  summary: `Confucius taught that a good life and a good society come from cultivating character through learning, ritual and relationships. The ideal person, the *junzi* or “exemplary person”, is humane (*ren*), observes the proper forms of respect (*li*), honours parents, keeps learning, and leads by moral example rather than force. For two thousand years his ideas shaped the government, families and education of East Asia.`,
  life: `Kong Qiu, later honoured as Kongfuzi, “Master Kong” (Latinised by Jesuit missionaries as Confucius), was born in 551 BCE in the small state of Lu, in eastern China. China at the time was politically fragmented: the Zhou dynasty’s kings had lost real power, and warring states and noble families fought for control.

His father, a minor aristocrat and soldier, died when he was three, and he grew up in poverty with his mother. He said of himself: “When I was young I was of humble station, which is why I am skilled in many menial things.” He worked as a keeper of granaries and livestock, studied tirelessly, and became known for his knowledge of ancient rituals, music, poetry and history.

He wanted, above all, to serve in government and put his ideas into practice. He may briefly have held a senior post in Lu, but his career stalled; according to tradition he left in disgust after the ruler became distracted by a gift of dancing girls. He spent about fourteen years travelling from state to state with his disciples, looking for a ruler who would employ him. None did. He was ignored, threatened and, at one point, nearly starved.

He returned to Lu in his late sixties and spent his last years teaching. He is said to have had three thousand students, seventy-two of whom mastered his teaching. He died in 479 BCE, believing he had failed. Within a few centuries his ideas had become the official philosophy of the Chinese state, which they remained, with interruptions, until 1905.

He wrote nothing himself. The *Analects* (*Lunyu*, “selected sayings”) was compiled by his disciples and their students over several generations after his death.`,
  ideas: [
    { t: `Ren: humaneness`, b: `The central Confucian virtue is *ren*, variously translated as humaneness, benevolence, goodness or authoritative conduct. The character combines “person” and “two”: it is about how people are with each other. Asked what *ren* is, Confucius said simply: “Love others.” It is the quality of being fully, properly human in your relationships. He rarely claimed to have it himself.` },
    { t: `Li: ritual`, b: `*Li* originally meant religious ritual, but for Confucius it covers all the forms of respectful behaviour: ceremonies, manners, etiquette, the way you greet a guest, mourn a parent, or address a superior. It sounds stuffy. The idea behind it isn’t. Rituals shape feeling. Bowing to someone can create respect, not just express it. Going through the forms of mourning helps grief find its shape. Without shared forms, people have to improvise every interaction, and social life becomes brittle.

Crucially, ritual without feeling is empty. “Ritual, ritual! Does it mean no more than jade and silk?” Form and feeling have to grow together.` },
    { t: `The exemplary person`, b: `The *junzi* originally meant “son of a lord”, a nobleman by birth. Confucius changed its meaning to a person noble by character, which anyone could become through learning. The *Analects* contrasts the *junzi* with the petty person (*xiaoren*) again and again. The exemplary person understands what is right; the petty person understands what is profitable. The exemplary person seeks the cause of failure in himself; the petty person seeks it in others. The exemplary person is at ease without being arrogant; the petty person is arrogant without being at ease.` },
    { t: `The golden rule, stated negatively`, b: `Asked if there was one word that could guide a whole life, Confucius answered *shu*, reciprocity or empathy: “Do not impose on others what you yourself do not desire.” It comes five centuries before the version in the Gospels, and is framed as a restraint rather than a command, which some find wiser.` },
    { t: `Filial piety`, b: `*Xiao*, respect and care for parents and ancestors, is the root of *ren*: you first learn to love and respect within the family, and then extend it outward. It isn’t blind obedience; Confucius says you may gently remonstrate with parents who are wrong. But it is serious, including three years of mourning after a parent’s death.` },
    { t: `Rule by example`, b: `“Lead the people with government regulations and organise them with punishments, and they will avoid trouble but have no sense of shame. Lead them with virtue and organise them with ritual, and they will have a sense of shame and will reform themselves.” Laws and punishments produce compliance; example produces character. A ruler’s virtue is like the wind, and the people like grass: the grass bends where the wind blows.` },
    { t: `The rectification of names`, b: `Asked what he would do first if given a government, Confucius said: rectify the names. If names aren’t correct, speech doesn’t accord with reality, affairs fail, punishments go wrong, and people don’t know where to put hand or foot. Let the ruler be a ruler, the minister a minister, the father a father, the son a son. Words have to match what things really are. It is an idea with obvious relevance to any age of spin.` },
    { t: `Love of learning`, b: `The *Analects* opens: “Is it not a pleasure to learn and to practise at due times what one has learned?” Confucius claimed only one distinction: that he loved learning more than anyone. He describes his own life as a long apprenticeship: set on learning at fifteen, standing firm at thirty, free of doubts at forty, knowing the will of Heaven at fifty, with an attuned ear at sixty, and at seventy able to follow his heart’s desire without overstepping the line. That last stage is the goal: so trained that what you want and what is right have become the same thing.` }
  ],
  works: [
    { t: `The Analects (Lunyu)`, y: `compiled c. 475–221 BCE`, b: `About 500 short passages in 20 books: sayings, brief conversations with disciples, and descriptions of how Confucius behaved (how he ate, dressed, sat). It has no system. Its method is example and conversation, and some of its best moments are its most human: Confucius teasing a student, losing his temper, grieving uncontrollably for his favourite disciple Yan Hui.` },
    { t: `The Five Classics`, y: ``, b: `Tradition credits Confucius with editing the classic Chinese texts: the *Book of Songs* (poetry), the *Book of Documents* (history), the *Book of Rites*, the *Book of Changes* (*I Ching*) and the *Spring and Autumn Annals*. Scholars now doubt he edited most of them, but they were the curriculum he taught.` },
    { t: `Mencius and Xunzi`, y: `4th–3rd centuries BCE`, b: `His two great successors. Mencius argued that human nature is good and needs only to be nurtured, like sprouts; Xunzi argued it is bad and needs to be straightened by ritual and education, like warped wood. The debate is still worth reading.` }
  ],
  quotes: [
    { q: `Is it not a pleasure to learn and to practise at due times what one has learned?`, s: `*Analects* 1.1` },
    { q: `To know what you know and to know what you do not know: that is true knowledge.`, s: `*Analects* 2.17` },
    { q: `Do not impose on others what you yourself do not desire.`, s: `*Analects* 15.24` },
    { q: `At fifteen I set my heart on learning; at thirty I took my stand; at forty I was free from doubts; at fifty I understood the will of Heaven; at sixty my ear was attuned; at seventy I could follow my heart’s desire without overstepping the line.`, s: `*Analects* 2.4` },
    { q: `The exemplary person seeks it in himself; the petty person seeks it in others.`, s: `*Analects* 15.21` },
    { q: `When you see a worthy person, think of becoming equal to them. When you see an unworthy person, examine yourself.`, s: `*Analects* 4.17` },
    { q: `To make a mistake and not correct it: this is a real mistake.`, s: `*Analects* 15.30` }

  fakes: [
    { q: `Choose a job you love, and you will never have to work a day in your life.`, n: `Not in the *Analects* or anywhere in early Confucian texts. It appears in the twentieth century.` },
    { q: `Wherever you go, go with all your heart.`, n: `No source in Confucian texts.` },
    { q: `It does not matter how slowly you go as long as you do not stop.`, n: `Not found in the *Analects*. There is a vaguely similar passage in 9.19 about building a mound one basket at a time, which is about finishing, not speed.` },
    { q: `Our greatest glory is not in never falling, but in rising every time we fall.`, n: `Usually traced to Oliver Goldsmith in 1762, who attributed it loosely to “a Chinese philosopher”.` }
  ],
  critique: `Confucianism has been attacked hardest from inside China. The May Fourth Movement of 1919 blamed it for China’s weakness: a philosophy of hierarchy and deference that kept sons under fathers, wives under husbands and subjects under rulers, and treated innovation as disrespect. Mao’s Cultural Revolution tried to destroy it outright, smashing temples and the tomb of Confucius’s family.

The hierarchy charge is fair. Confucian relationships are mostly unequal: ruler and subject, father and son, husband and wife, elder and younger brother. Women barely appear in the *Analects*, and one passage (17.25) lumps them with “petty people” as hard to deal with. Later Confucian states used filial piety to demand obedience to authority.

Defenders reply that the reciprocity runs both ways (a father must act as a father to deserve a son’s respect), that the goal is humaneness not obedience, and that Confucius himself kept criticising the rulers of his day. The modern revival of Confucianism in China raises the same question again: is it being read as an ethics of character, or used as a philosophy of order?

A philosophical objection: Confucius gives little guidance when duties clash, and less on what to do when the whole social order is unjust. Ritual works well in a decent society. In a corrupt one it can become complicity.`,
  start: `Read the *Analects* in Edward Slingerland’s translation (Hackett, 2003), which includes short traditional commentaries that make obscure passages come alive, or the elegant D. C. Lau (Penguin). Don’t read straight through; read a book at a time and let it sit. Michael Puett and Christine Gross-Loh’s *The Path* (2016) is a lively, sometimes over-sold, introduction to how Chinese philosophy might apply now.`,

  themes: ['ethics', 'knowledge', 'politics'], keywords: ['lao tzu', 'tao te ching', 'dao de jing', 'tao', 'dao', 'wu wei', 'water', 'taoism', 'daoism', 'effortless action'],
  tagline: `Stop forcing. Water wins by yielding.`,
  summary: `The *Daodejing* (*Tao Te Ching*), traditionally credited to Laozi, teaches that the Dao, the nameless way of things, cannot be grasped or controlled, only followed. The wise person acts through *wu wei*, effortless or non-forcing action, like water flowing around rocks. Softness overcomes hardness, emptiness is useful, and the more you strive, grab and display, the further you get from the way.`,
  life: `Laozi may not have existed. His name means “Old Master”, and the first biography, written by the historian Sima Qian around 100 BCE, already admits uncertainty and offers several candidates. The traditional story is that he was an archivist at the Zhou court, an older contemporary of Confucius (who supposedly visited him and came away saying he had met a dragon). Seeing the dynasty decline, Laozi rode west on a water buffalo to leave China. At the border pass, the gatekeeper Yinxi begged him to write down his wisdom before he left. He wrote the five thousand characters of the *Daodejing*, handed it over, and rode off. No one knows where he went.

Scholars now mostly think the *Daodejing* is a compilation of sayings by several hands, put together between the sixth and fourth centuries BCE. The oldest manuscript fragments, found in a tomb at Guodian in 1993, date from around 300 BCE and differ in order and content from the received text. The dates on this page are the traditional ones and should be read as legend.

None of this matters much for reading it. The book has a single, distinctive voice: paradoxical, poetic, quietly subversive. It is the most translated work in the world after the Bible.`,
  ideas: [
    { t: `The Dao that can be spoken is not the constant Dao`, b: `The book opens with its most famous line, which undercuts everything that follows: the Dao that can be put into words is not the eternal Dao; the name that can be named is not the eternal name. *Dao* means way, path, road, and also “to speak”. It is the source and pattern of everything, but it can’t be captured in concepts. Every description is a finger pointing at the moon, not the moon.

This makes the *Daodejing* a strange book: eighty-one short chapters trying to talk about something that can’t be talked about. It works through images and paradox rather than argument.` },
    { t: `Wu wei: effortless action`, b: `*Wu wei* literally means “non-action” or “not doing”. It doesn’t mean doing nothing. It means acting without forcing, without strain, in harmony with how things naturally move. The sage “does nothing, and yet nothing is left undone.”

Think of a master carpenter, a good athlete in flow, a skilled parent. They don’t fight the grain of things; they work with it, and so they seem to act effortlessly. The opposite is pushing, controlling, grabbing, micromanaging: the effort that makes everything harder. A good deal of modern life (hustle, optimisation, relentless striving) is the opposite of *wu wei*.` },
    { t: `Water`, b: `Water is the book’s favourite image. “Nothing in the world is softer or weaker than water, yet nothing is better at attacking the hard and strong.” Water doesn’t compete; it flows to the lowest places that people despise; it takes the shape of any container. And it carves canyons. The highest good is like water.

The same goes for living things: a newborn is soft and supple, a corpse stiff and hard. A green plant bends; a dead one snaps. Rigidity is the companion of death; softness is the companion of life.` },
    { t: `Emptiness is useful`, b: `Chapter 11: thirty spokes meet at a hub, but it is the empty space in the middle that makes the wheel work. Clay is shaped into a pot, but it is the emptiness inside that holds things. Doors and windows are cut into a room, and it is the holes that make it usable. We value what is there; the usefulness comes from what isn’t.` },
    { t: `Knowing when enough is enough`, b: `“There is no disaster greater than not knowing contentment; no fault greater than wanting to acquire.” The person who knows when they have enough is rich. The sage doesn’t hoard, doesn’t display himself, doesn’t boast, and for that reason lasts.` },
    { t: `The reversal of values`, b: `The *Daodejing* likes to turn conventional values upside down. When the great Way is abandoned, we get talk of benevolence and righteousness; when cleverness appears, great hypocrisy follows. Moral rules and rewards are signs that something natural has been lost. “Get rid of sageliness, discard knowledge, and the people will benefit a hundredfold.” It is partly a direct attack on Confucian moralism.` },
    { t: `Govern lightly`, b: `Many chapters are addressed to rulers. The best ruler is one the people barely know exists; next best, one they love; next, one they fear; worst, one they despise. “Govern a large state as you would cook a small fish”: don’t keep poking it, or it falls apart. The more laws and prohibitions, the more thieves and poverty.` }
  ],

    { q: `Knowing others is intelligence; knowing yourself is true wisdom. Mastering others is strength; mastering yourself is true power.`, s: `*Daodejing* 33 (Stephen Mitchell)` },

  critique: `A book that says the truth can’t be put into words gives itself a lot of room. The *Daodejing* is so compressed and open that readers find whatever they bring to it: mysticism, anarchism, military strategy, management advice, New Age spirituality. The popular Stephen Mitchell version, for instance, is a lovely poem, but Mitchell doesn’t read Chinese and freely reshapes the text. If you only read one version, you may be reading the translator.

On substance: *wu wei* can slide into passivity. “Don’t force it” is wise for bread dough and dangerous for injustice. The advice to keep people simple, “empty their minds and fill their bellies”, reads in places like a manual for keeping a population docile. And the book’s contempt for learning and moral effort, however useful as a corrective to pompous moralising, is not a practical ethics for a complex society.

Still, the core observation (that trying too hard is often the obstacle) has aged extremely well.`,
  start: `Read two translations side by side. Ursula K. Le Guin’s *Lao Tzu: Tao Te Ching* (1997) is beautiful and honest about being a rendering, not a translation. D. C. Lau (Penguin) or Philip J. Ivanhoe (Hackett) are more faithful. Read one chapter a day. Then read Zhuangzi, who is funnier and makes the ideas come alive in stories.`,

  themes: ['mind', 'death', 'knowledge'], keywords: ['chuang tzu', 'butterfly dream', 'cook ding', 'useless tree', 'daoism', 'taoism', 'perspective', 'relativism', 'flow'],
  tagline: `Did he dream he was a butterfly, or is a butterfly dreaming it’s him?`,
  summary: `Zhuangzi is the funniest philosopher in the world. Through stories, jokes, talking animals and absurd characters, he questions whether we can really know anything, mocks rigid moralists, and shows that the “useless” may be the most valuable. He celebrates spontaneous skill, laughs at death, and suggests that the way to freedom is to loosen your grip on fixed perspectives, including the perspective that you are you.`,
  life: `Zhuang Zhou lived in the fourth century BCE, during the Warring States period, a time of violent chaos in China. Almost all we know about him comes from the book named after him, and many of those stories may be invented. He seems to have been a minor official in charge of a lacquer garden, lived in poverty, and turned down high office.

In one story, the king of Chu sends two officials to offer him the post of prime minister. Zhuangzi keeps fishing and asks them: I hear Chu has a sacred tortoise, dead three thousand years, which the king keeps wrapped in silk in the ancestral temple. Would that tortoise rather be dead and honoured, or alive and dragging its tail in the mud? Alive in the mud, they say. “Go away,” says Zhuangzi. “I’ll drag my tail in the mud.”

His best friend and sparring partner was the logician Huizi, with whom he argued constantly. When Huizi died, Zhuangzi passed his grave and said he no longer had anyone to talk to. When his own wife died, Huizi found him sitting on the floor, drumming on a pot and singing. Huizi was shocked. Zhuangzi said that at first he grieved like anyone. Then he thought about how she had once not existed, then came to be, and now had changed again, like the passing of the seasons. She was now lying peacefully in the great room of the universe. To wail over her would show he didn’t understand fate. So he stopped.`,
  ideas: [
    { t: `The butterfly dream`, b: `The most famous passage: “Once Zhuang Zhou dreamed he was a butterfly, fluttering happily about, doing as he pleased. He didn’t know he was Zhuang Zhou. Suddenly he woke up, and there he was, solid and unmistakably Zhuang Zhou. But he didn’t know if he was Zhuang Zhou who had dreamed he was a butterfly, or a butterfly dreaming he was Zhuang Zhou.” He ends: “This is called the transformation of things.”

Two thousand years before Descartes worried about whether he was dreaming, Zhuangzi raised the question and then, typically, didn’t treat it as a problem to solve. The point is less “how can I be sure?” than: identities are more fluid than we think, and there may be freedom in that.` },
    { t: `Everything depends on perspective`, b: `Zhuangzi loves to show that judgements depend on where you stand. People sleep in damp places and get sick; do eels? People climb trees and get scared; do monkeys? Of the three, who knows the right place to live? People think Mao Qiang and Lady Li are beautiful, but when fish see them they dive deep, and birds fly away.

This isn’t lazy relativism (“whatever you think is fine”). It is a challenge to anyone certain that their own framework is the one true view: Confucian or Mohist, this or that. Every “this” is also a “that” from somewhere else. The sage stands at the “hinge of the Way”, the centre of the circle, where he can respond to endless changes.` },
    { t: `Cook Ding and the ox`, b: `A cook is carving an ox for Lord Wenhui. Every movement is so graceful it looks like a dance. The lord is amazed. The cook explains: when he started, he saw only the whole ox. After three years he no longer saw the ox. Now he works with his spirit, not his eyes; he follows the natural spaces between the joints and never hits bone. An ordinary cook changes his knife every month because he hacks; a good cook every year, because he cuts; Ding has used the same knife for nineteen years and it is as sharp as new.

Lord Wenhui says: “I have heard the words of Cook Ding and learned how to care for life.” This is *wu wei* made concrete, and it is the ancient world’s best description of what psychologists now call flow.` },
    { t: `The usefulness of the useless`, b: `A carpenter passes a huge, ancient oak and doesn’t give it a glance: its wood is useless, too knotty for boats or coffins. That night the tree appears in his dream: fruit trees are useful, so their branches are broken and they die young. I’ve spent ages trying to be useless, and that is why I have lived so long. If I had been useful, would I have grown this big?

Zhuangzi keeps returning to this. The world measures everything by its usefulness, and uses things up. The person who refuses to be merely useful may be the one who lives.` },
    { t: `Laughing at death`, b: `The book is full of characters who face death with astonishing calm and humour. A man whose body is being twisted by illness says: if my left arm becomes a rooster, I’ll use it to crow the dawn; if my right arm becomes a crossbow, I’ll shoot birds for roasting. Life and death are part of one great transformation. Who knows whether the dead regret having clung to life?` },
    { t: `The happiness of fish`, b: `Zhuangzi and Huizi are walking on a bridge. Zhuangzi says: “See how the minnows dart about. That is the happiness of fish.” Huizi: “You’re not a fish. How do you know what makes fish happy?” Zhuangzi: “You’re not me. How do you know I don’t know?” Huizi: “I’m not you, so I don’t know about you. You’re not a fish, so you don’t know about fish.” Zhuangzi: “Let’s go back to your original question. You asked *how* I know, which means you already knew that I knew. I know it from here, on the bridge.”

Philosophers still argue about who wins. It may be the best short dialogue on the problem of other minds ever written.` }
  ],
  works: [
    { t: `The Zhuangzi`, y: `c. 4th–2nd centuries BCE`, b: `Thirty-three chapters. The first seven, the “Inner Chapters”, are thought to be mostly by Zhuangzi himself; the “Outer” and “Miscellaneous” chapters were added by followers and others over the next century or two. The Inner Chapters are the ones to read, and chapter 2, “On Seeing Things as Equal”, is the philosophical heart.` }
  ],
  quotes: [
    { q: `Once Zhuang Zhou dreamed he was a butterfly... He didn’t know if he was Zhuang Zhou who had dreamed he was a butterfly, or a butterfly dreaming he was Zhuang Zhou.`, s: `*Zhuangzi*, chapter 2` },
    { q: `Everyone knows the usefulness of the useful, but no one knows the usefulness of the useless.`, s: `*Zhuangzi*, chapter 4` },
    { q: `The fish trap exists because of the fish; once you’ve got the fish, you can forget the trap. Words exist because of meaning; once you’ve got the meaning, you can forget the words. Where can I find a man who has forgotten words, so I can have a word with him?`, s: `*Zhuangzi*, chapter 26 (Burton Watson)` },
    { q: `I’ll drag my tail in the mud.`, s: `*Zhuangzi*, chapter 17, turning down high office` },
    { q: `Your life has a limit, but knowledge has none. To use what is limited to pursue what has no limit is dangerous.`, s: `*Zhuangzi*, chapter 3` }
  ],
  fakes: [],
  critique: `Zhuangzi’s scepticism can undercut itself. If every perspective is partial, what about his? He sometimes seems to know perfectly well that his view is better than the Confucians’. He would probably laugh and agree, which is either the point or an evasion.

His calm about death and his detachment from politics can also read as withdrawal from a world that needed people to act. The Warring States period was full of real suffering; “drag your tail in the mud” is a luxury available to someone who can afford to decline office. Confucians accused the Daoists of irresponsibility, and they had a point.

Finally, like the *Daodejing*, the text is hard to pin down, and translations vary. It has been read as mysticism, scepticism, relativism, a therapy against rigid thinking, and a book of jokes. It is probably all of these, which makes it hard to argue with and easy to use for anything.`,
  start: `Read the Inner Chapters in Burton Watson’s translation (*Zhuangzi: Basic Writings*, Columbia), which is lively and reliable, or Brook Ziporyn’s (Hackett), which is more philosophical. Chapter 2 is hard; chapters 1, 3 and 4 are easier and full of stories. If you enjoy Monty Python, you will enjoy this.`,
  related: ['laozi', 'confucius', 'descartes', 'diogenes', 'montaigne']
}
);

THINKERS.push(
{
  id: 'augustine', name: `Augustine of Hippo`, born: 354, died: 430, era: 'medieval',
  place: `Thagaste and Hippo (now Algeria); Carthage; Rome; Milan`, role: `Philosopher, bishop and theologian`,
  themes: ['god', 'mind', 'love', 'ethics'], keywords: ['confessions', 'city of god', 'restless heart', 'time', 'original sin', 'grace', 'evil', 'will', 'saint augustine'],
  tagline: `Invented the autobiography to confess that he couldn’t make himself want what he knew was good.`,
  summary: `Augustine fused Plato’s philosophy with Christianity and shaped Western thought for a thousand years. His *Confessions* is the first great inward-looking autobiography: a brilliant, sensual, ambitious man’s account of a divided will and a restless heart that only God could satisfy. He also gave the West its ideas of original sin, grace, evil as the absence of good, time as a stretching of the mind, and the two cities, earthly and heavenly.`,
  life: `Aurelius Augustinus was born in 354 in Thagaste, a small town in the Roman province of Numidia, now Souk Ahras in Algeria. His father Patricius was a minor official and a pagan; his mother Monica was a devout Christian, and her prayers for her son run all through the *Confessions*.

He was gifted and ambitious. At sixteen, he and his friends stole pears from a neighbour’s tree, not because they wanted them (they threw them to pigs) but for the thrill of doing wrong. He later spent pages on this petty theft, because it showed him something frightening: he had loved wrongdoing for its own sake.

He studied rhetoric at Carthage, where he lived with a woman whose name he never gives, for about fifteen years; they had a son, Adeodatus (“given by God”). At nineteen he read Cicero’s lost *Hortensius* and fell in love with philosophy. For nine years he belonged to the Manichees, a sect that held the world was a battle between two equal powers, Light and Darkness. It explained evil neatly: the bad part of you wasn’t really you.

He moved to Rome and then Milan, where he became the official professor of rhetoric, a very prestigious post. His mother arranged a respectable marriage for him, and he sent his long-term partner back to Africa, which he describes as tearing his heart. There he heard the sermons of Ambrose, bishop of Milan, and read the Neoplatonist philosophers, who gave him a way to think about God as spiritual rather than physical and about evil as a lack rather than a force.

He was intellectually convinced by Christianity but couldn’t bring himself to commit. Famously, he prayed: “Grant me chastity and continence, but not yet.” In 386, in a garden in Milan, in a state of anguish, he heard a child’s voice chanting *tolle lege*, “take up and read”. He opened Paul’s letters at random, read a passage about putting away drunkenness and lust, and felt, he wrote, a light of certainty flood his heart. He was baptised by Ambrose in 387. His mother died soon after at Ostia, following a shared mystical experience at a window that is one of the most beautiful passages in the book.

He returned to Africa intending to live as a monk. In 391, visiting the port of Hippo Regius, he was grabbed by the congregation and ordained a priest against his will, and was soon made bishop. He spent the rest of his life as a working bishop: preaching, settling disputes, and writing constantly, over five million words in all. He died in 430 as the Vandals besieged Hippo.`,
  ideas: [
    { t: `The restless heart`, b: `The *Confessions* opens with a sentence that frames all of Augustine: “You have made us for yourself, and our heart is restless until it rests in you.” Human beings are driven by desire, and every finite thing we chase (sex, success, praise, possessions) leaves us wanting more, because we are looking for the infinite in the wrong places. The problem isn’t desire. It is disordered desire: loving lesser things as if they were the highest.

Whatever you think of his God, the diagnosis of restlessness (the endless search for the next thing that will finally satisfy) describes modern life uncomfortably well.` },
    { t: `The divided will`, b: `Augustine discovered, in himself, something the Greeks hadn’t quite described: the will at war with itself. He knew what was good. He wanted, in a way, to want it. But he couldn’t. “The mind commands the body, and it obeys instantly; the mind commands itself, and meets resistance.” He felt he had two wills, an old one and a new one, fighting inside him.

Socrates thought wrongdoing was ignorance. Augustine knew better from experience: you can know the good and still not do it, because the problem is in what you love, not in what you know.` },
    { t: `Evil is the absence of good`, b: `If God is good and created everything, where does evil come from? The Manichees said from a rival evil power. Augustine, following the Neoplatonists, said evil isn’t a thing at all. It is a privation, a lack or corruption of good, the way blindness is a lack of sight or a hole is a lack of cloth. Everything that exists is good insofar as it exists. Evil comes from free creatures turning away from the higher good towards lower ones.` },
    { t: `What is time?`, b: `Book XI of the *Confessions* contains one of the great pieces of philosophy about time. “What then is time? If no one asks me, I know; if I wish to explain it to someone who asks, I do not know.” The past no longer exists; the future doesn’t yet exist; the present has no duration. So how can we measure time at all?

His answer: time exists in the mind. The past exists as memory, the future as expectation, the present as attention. Time is a *distentio animi*, a stretching of the soul. When you recite a psalm, your expectation shrinks as your memory grows, and your attention passes the future into the past. It’s a startlingly modern, psychological theory.` },
    { t: `Original sin and grace`, b: `Augustine’s most influential and most controversial idea. Through Adam’s fall, all humanity inherited a damaged nature and guilt; we are born with our wills bent towards ourselves. We cannot become good by our own effort. Only God’s grace, freely given and undeserved, can heal the will.

He developed this against Pelagius, a British monk who argued that humans could choose good by their own free will. Augustine won; Pelagius was condemned as a heretic. Western Christianity, Catholic and Protestant, has been Augustinian ever since. The idea also produced the grim doctrine that unbaptised infants are damned, and Augustine’s own conviction that most of humanity would be.` },
    { t: `The two cities`, b: `When Rome was sacked by the Goths in 410, pagans blamed the Christians for abandoning the old gods. Augustine answered with *The City of God*, a 22-book work that became a philosophy of history. Humanity is divided into two “cities”, defined by what they love. The earthly city is built on love of self, even to contempt of God. The heavenly city is built on love of God, even to contempt of self. They are mixed together in this world and will be separated only at the end. No earthly empire, not even a Christian Rome, is the Kingdom of God.` },
    { t: `Love, and do what you will`, b: `In a sermon on the First Letter of John, Augustine says: *dilige, et quod vis fac*, “love, and do what you will.” This isn’t permission to do anything. It means that if love (for God and neighbour) is truly the root of what you do, your actions will be good; a loving parent may be stern, and a cruel person may speak softly. Morality is fundamentally about what you love.` },
    { t: `I err, therefore I am`, b: `Twelve centuries before Descartes, Augustine answered the sceptics with something close to the cogito: *si fallor, sum*, “if I am mistaken, I exist.” Even if I am deceived about everything, I must exist to be deceived.` }
  ],
  works: [
    { t: `Confessions`, y: `c. 397–400`, b: `Thirteen books, addressed as a prayer to God. Books I–IX tell his life up to his mother’s death: childhood, the pear theft, lust, ambition, conversion. Books X–XIII turn to memory, time and creation. It is the first real autobiography in Western literature, and still one of the most honest. Even if you have no interest in God, the psychology is extraordinary.` },
    { t: `The City of God`, y: `413–426`, b: `Enormous, digressive and influential. Books I–X demolish pagan religion and philosophy; XI–XXII tell the story of the two cities from creation to the end. Read Book XIX, on peace and the purpose of the state, if nothing else.` },
    { t: `On Free Choice of the Will`, y: `c. 388–395`, b: `A dialogue on evil and freedom, from before the Pelagian controversy hardened his views.` },
    { t: `On the Trinity`, y: `c. 400–420`, b: `Includes his analysis of the mind as an image of God, with a triad of memory, understanding and will.` }
  ],
  quotes: [
    { q: `You have made us for yourself, and our heart is restless until it rests in you.`, s: `*Confessions* I.1` },
    { q: `Grant me chastity and continence, but not yet.`, s: `*Confessions* VIII.7` },
    { q: `What then is time? If no one asks me, I know; if I wish to explain it to one who asks, I do not know.`, s: `*Confessions* XI.14` },
    { q: `Late have I loved you, beauty so old and so new: late have I loved you. And see, you were within and I was in the external world and sought you there.`, s: `*Confessions* X.27` },
    { q: `I became a great question to myself.`, s: `*Confessions* IV.4, after the death of a friend` },
    { q: `Love, and do what you will.`, s: `*Homilies on the First Epistle of John* 7.8` },
    { q: `Without justice, what are kingdoms but great bands of robbers?`, s: `*The City of God* IV.4` }
  ],
  fakes: [
    { q: `The world is a book, and those who do not travel read only one page.`, n: `No source in Augustine. It appears in the eighteenth century with no citation.` },
    { q: `Hope has two beautiful daughters; their names are Anger and Courage.`, n: `Not found in his works. It seems to come from a much later misattribution.` }
  ],
  critique: `Augustine’s influence on Western attitudes to sex and the body is hard to overstate, and many think it was harmful. He came to see sexual desire as the clearest sign of the fallen will, because it doesn’t obey reason, and he tied original sin to its transmission through sex. Centuries of Christian guilt and shame about the body run through him.

The doctrine of original sin and predestination raises obvious moral problems. If we can do nothing good without grace, and God gives grace to some and not others, how are the rest to blame? Augustine accepted the consequence that God justly damns most of humanity, including unbaptised babies. Many Christians since, and nearly all non-Christians, find this monstrous.

He also provided the theological justification for using state power against heretics, in his campaign against the Donatists: “compel them to come in”. It was later cited to justify the Inquisition.

And the *Confessions* has a troubling silence at its centre: the woman he lived with for fifteen years, the mother of his son, whom he sent away for a better match, never gets a name.`,
  start: `Read the *Confessions*, Books I–IX. Sarah Ruden’s translation (Modern Library, 2017) is raw and vivid; Henry Chadwick’s (Oxford) is the standard; Maria Boulding’s (New City) reads well as prayer. Then Book X on memory and Book XI on time. Peter Brown’s *Augustine of Hippo* is one of the great biographies of any thinker.`,
  related: ['plato', 'aquinas', 'pascal', 'kierkegaard', 'boethius']
},
{
  id: 'boethius', name: `Boethius`, born: 477, died: 524, approx: true, era: 'medieval',
  place: `Rome; Ravenna; Pavia`, role: `Philosopher and statesman`,
  themes: ['suffering', 'god', 'ethics'], keywords: ['consolation of philosophy', 'wheel of fortune', 'lady philosophy', 'prison', 'fortune', 'providence', 'free will'],
  tagline: `Wrote the most-read book of the Middle Ages on death row.`,
  summary: `Boethius was a Roman senator who fell from the top of society to a prison cell awaiting execution. There he wrote *The Consolation of Philosophy*, in which Philosophy herself appears as a woman and argues him out of despair. Fortune is a wheel that always turns; nothing it gives is really yours; true happiness lies in the good, which no one can take away.`,
  life: `Anicius Manlius Severinus Boethius was born around 477 into one of Rome’s oldest aristocratic families, just after the last Western Roman emperor had been deposed. Italy was now ruled by the Ostrogothic king Theodoric, who governed from Ravenna and kept the Roman senate and administration running.

Orphaned young, Boethius was raised by the senator Symmachus, whose daughter he married. He was brilliantly educated and fluent in Greek, which was becoming rare in the Latin West, and set himself an enormous task: to translate all of Plato and Aristotle into Latin, with commentaries, and show that they agreed. He finished only part of Aristotle’s logic, but for six hundred years his translations were almost all of Aristotle that Western Europe could read. He also wrote textbooks on arithmetic and music used in medieval schools.

His public career was spectacular. He was consul in 510; in 522 both his sons were made consuls together, an extraordinary honour, and he became Master of Offices, head of the civil service. Then, in 523, he defended a fellow senator accused of treasonable correspondence with the Eastern emperor in Constantinople. He was accused himself, on what seems to have been forged evidence, and condemned without being allowed to defend himself. He was imprisoned near Pavia and, in 524 or 525, executed, reportedly by being tortured with a cord tightened around his head and then clubbed to death.

In prison he wrote the *Consolation*. Remarkably, it never mentions Christianity, though Boethius was a Christian who wrote theological treatises.`,
  ideas: [
    { t: `Lady Philosophy`, b: `The book opens with Boethius in his cell, writing self-pitying poetry with the help of the Muses. A woman appears, of immense age yet ageless, her height shifting from human to touching the heavens. Her dress is torn where various philosophical schools ripped off pieces. She drives out the Muses as “theatrical tarts” who feed grief instead of curing it, and sets about treating him. It is philosophy as medicine: first gentle remedies, then stronger ones.` },
    { t: `The wheel of Fortune`, b: `Philosophy speaks in Fortune’s voice: “I turn the wheel that spins. I delight to see the high come down and the low ascend. Mount up, if you like, but only on condition that you don’t think it unfair to come down when my game requires it.” You were happy to ride the wheel when it lifted you; you can’t complain that it turns. Fortune’s nature is to change. If she stayed, she wouldn’t be Fortune.

The image of Fortune’s wheel became one of the most common in medieval art and literature, from Chaucer to Dante to the Tarot.` },
    { t: `Nothing Fortune gives is yours`, b: `Wealth, office, fame, pleasure: none of these was ever truly yours; they were on loan. Riches are more precious when given away; fame is limited to a tiny part of a tiny earth, and lasts a moment compared with eternity. Even bad fortune does you a favour: good fortune deceives, bad fortune teaches you who your real friends are.` },
    { t: `True happiness`, b: `Everyone seeks happiness, but by the wrong roads: money, honour, power, fame and pleasure. Each promises self-sufficiency, respect, strength, glory or joy, and each delivers only a fragment, bringing new anxieties with it. True happiness is the complete good, which contains all of these, and that is God, the supreme good. So the wicked, who seem to prosper, are actually powerless and miserable; they don’t get what they really want.` },
    { t: `Providence and free will`, b: `The final book tackles a hard problem. If God knows everything in advance, including what I will choose, how can my choice be free? Boethius’s answer is influential: God doesn’t know things “in advance”. God is eternal, outside time, and sees all of time at once, in an eternal present, the way you might see a man walking from a hilltop. Your seeing him doesn’t make him walk; God’s knowing your choice doesn’t make you choose it.` }
  ],
  works: [
    { t: `The Consolation of Philosophy`, y: `c. 524`, b: `Five books alternating prose and verse. It was one of the most widely read books in Europe for a thousand years, translated into Old English by King Alfred, into Middle English by Chaucer, and into early modern English by Elizabeth I. It is short, moving and surprisingly easy to read.` },
    { t: `Translations and commentaries on Aristotle`, y: `c. 510–522`, b: `His Latin versions of Aristotle’s *Categories* and *On Interpretation* and Porphyry’s *Isagoge* were the core of medieval logic until the 12th century.` }
  ],
  quotes: [
    { q: `In every adversity of fortune, the most unhappy kind of misfortune is to have been happy.`, s: `*Consolation* II, prose 4` },
    { q: `Nothing is miserable unless you think it so; and on the other hand, nothing brings happiness unless you are content with it.`, s: `*Consolation* II, prose 4` },
    { q: `I turn the wheel that spins. I delight to see the high come down and the low ascend.`, s: `*Consolation* II, prose 2, Fortune speaking` },
    { q: `Who can give a law to lovers? Love is a greater law unto itself.`, s: `*Consolation* III, metre 12, on Orpheus` }
  ],
  fakes: [],
  critique: `A modern reader can find the *Consolation* strangely cold. Boethius has lost his freedom, his reputation and soon his life, and Philosophy’s answer is, in effect, that none of it mattered. Where is anger at the injustice? Where is grief for his family? The book consoles by detachment, and for some the cost of that detachment is too high.

Its arguments also depend on a Neoplatonic picture (a supreme Good that is also God, evil as unreal) that you may not share. If you don’t, the claim that the wicked are really powerless and miserable sounds like wishful thinking; plenty of the wicked seem to do fine.

And the solution to free will and foreknowledge, while elegant, has been argued over ever since. Does placing God outside time really dissolve the problem, or just relocate it?`,
  start: `Read *The Consolation of Philosophy* in Victor Watts’s translation (Penguin) or David R. Slavitt’s (Harvard), which renders the poems as real poems. It is about 150 pages. Read it on a bad week.`,
  related: ['augustine', 'seneca', 'marcus-aurelius', 'aquinas']
},
{
  id: 'avicenna', name: `Avicenna (Ibn Sina)`, born: 980, died: 1037, era: 'medieval',
  place: `Afshana, near Bukhara (now Uzbekistan); Persia`, role: `Philosopher and physician`,
  themes: ['mind', 'god', 'knowledge'], keywords: ['ibn sina', 'floating man', 'canon of medicine', 'necessary existent', 'essence', 'existence', 'islamic philosophy', 'book of healing'],
  tagline: `Imagine yourself floating in the dark, with no senses at all. Do you still know you exist?`,
  summary: `Ibn Sina, known in Latin as Avicenna, was the greatest philosopher of the Islamic world and one of the most influential in history. He built a vast system combining Aristotle, Neoplatonism and Islamic theology. He argued that the self can know itself without the body (the “floating man”), that essence and existence are distinct, and that God is the one being whose existence is necessary. His *Canon of Medicine* was a standard textbook in Europe for five centuries.`,
  life: `Abu Ali al-Husayn ibn Abd Allah ibn Sina was born in 980 near Bukhara, then capital of the Persian Samanid dynasty. His autobiography, dictated to a student, paints him as a prodigy: he had memorised the Qur’an and much Arabic poetry by ten, mastered logic, mathematics and physics as a teenager, and turned to medicine at sixteen because it was “not one of the difficult sciences”. He was treating patients by eighteen.

He tells a lovely story. He read Aristotle’s *Metaphysics* forty times, until he knew it by heart, and still didn’t understand it. Then one day in the booksellers’ market he bought, for three dirhams, a short commentary by the earlier philosopher al-Farabi. He read it and suddenly understood everything. He went home and, the next day, gave generous alms to the poor in gratitude.

At eighteen he cured the Samanid sultan of an illness, and in return was given access to the royal library, which he says contained books he had never seen before or since. When the dynasty fell, his life became unsettled. He moved from court to court across Persia, serving as physician and sometimes as vizier (chief minister), getting caught up in politics, being imprisoned, escaping in disguise. He wrote much of his work at night, after days of official business, with wine at hand to keep him going; some of it was written on horseback during military campaigns.

He died in 1037 at Hamadan, in western Iran, aged about 57, of a colic that he reportedly treated himself, too aggressively. His tomb is still there.`,
  ideas: [
    { t: `The floating man`, b: `Avicenna’s most famous thought experiment. Imagine you have just been created, fully formed and rational, but floating in the air or a void, eyes covered, limbs spread so that they don’t touch each other, with no sensation of anything, not even your own body. Would you know that you exist?

Avicenna says yes. You would affirm your own existence without affirming the existence of any body at all. So the self that knows itself is something other than the body. Six centuries later Descartes made a similar argument, and scholars have long debated whether he knew of Avicenna’s.` },
    { t: `Essence and existence`, b: `Think of a unicorn, or a phoenix. You can understand what it is (its essence) without knowing whether it exists. So what a thing is and whether it is are two different things. For everything in the world, existence is added to essence, as it were, from outside: nothing about being a horse guarantees that there are any horses.

This distinction, which Avicenna made sharp, became one of the pillars of medieval philosophy and was central to Aquinas.` },
    { t: `The Necessary Existent`, b: `If everything we see is merely *possible* (it could have not existed, and depends on something else to exist), then there must be something whose existence is *necessary*, which exists by its own nature and depends on nothing. Otherwise there would be an infinite chain of dependent things with nothing holding it up. This Necessary Existent is God: one, simple, perfect, pure intellect, whose essence just is existence. It is one of the most carefully worked out arguments for God’s existence in the history of philosophy.` },
    { t: `The soul and the intellect`, b: `Avicenna held that the rational soul is immaterial and survives the death of the body. Knowledge happens when the human intellect receives intelligible forms from the Active Intellect, a cosmic mind that illuminates ours. He also developed an influential theory of internal senses (common sense, imagination, estimation, memory) as distinct brain functions, an early cognitive psychology.` },
    { t: `Medicine as a science`, b: `The *Canon of Medicine* organised all of Greek and Islamic medical knowledge into a single system. It included rules for testing drugs that anticipate the clinical trial (test on a pure substance, on a simple disease, compare timing, test on humans, not only animals), recognised contagion, and described many diseases accurately.` }
  ],
  works: [
    { t: `The Book of Healing (Kitab al-Shifa)`, y: `c. 1014–1020`, b: `An enormous encyclopedia of philosophy and science: logic, physics, mathematics, psychology and metaphysics. “Healing” here means healing the soul of ignorance.` },
    { t: `The Canon of Medicine (al-Qanun fi al-Tibb)`, y: `completed 1025`, b: `Five books, a million words. Translated into Latin in the twelfth century, it was a standard medical text in European universities until the seventeenth.` },
    { t: `Remarks and Admonitions (al-Isharat wa al-Tanbihat)`, y: `late`, b: `His last major work, more personal and compressed, ending with a section on the mystical path.` }
  ],
  quotes: [
    { q: `The one who is floating in the air... affirms the existence of his self, but does not affirm the existence of any of his limbs or inner organs.`, s: `*The Book of Healing*, On the Soul I.1 (paraphrased translation)` },
    { q: `I prefer a short life with width to a narrow one with length.`, s: `Attributed; reported in early biographies` }
  ],
  fakes: [],
  critique: `The floating man argument has the same weakness as Descartes’ version. That I can conceive of myself without a body doesn’t show that I could actually exist without one. I can conceive of water without thinking of H2O, but water is still H2O.

In the Islamic world, the theologian al-Ghazali attacked Avicenna in *The Incoherence of the Philosophers* (c. 1095), charging him with three errors so serious that they amounted to unbelief: that the world is eternal, that God knows particulars only “in a universal way”, and that there is no bodily resurrection. The critique had lasting effect, and Averroes (Ibn Rushd) wrote a reply called *The Incoherence of the Incoherence*.

For modern readers, the cosmology (emanating intellects, celestial spheres) is hard to take seriously, and much of the system depends on it. The logic, the essence–existence distinction and the philosophy of mind stand up much better.`,
  start: `Avicenna is hard going for beginners, and there is no easy single book. Start with Peter Adamson’s *Philosophy in the Islamic World* (Oxford, 2016), which is engaging and clear, or his free podcast *History of Philosophy Without Any Gaps*, which has several episodes on Avicenna. Jon McGinnis’s *Avicenna* (Oxford) is the best one-volume study.`,

{
  id: 'aquinas', name: `Thomas Aquinas`, born: 1225, died: 1274, era: 'medieval',
  place: `Roccasecca (Italy); Paris; Naples`, role: `Philosopher, theologian and friar`,
  themes: ['god', 'ethics', 'knowledge', 'politics'], keywords: ['summa theologiae', 'five ways', 'natural law', 'faith and reason', 'scholasticism', 'virtue', 'saint thomas', 'dominican'],
  tagline: `Believed faith and reason can’t really contradict each other, and spent his life proving it.`,
  summary: `Aquinas took Aristotle, newly rediscovered in Europe, and built him into Christian theology. Reason can prove some things about God (that God exists, is one, is good), and revelation completes what reason can’t reach. Morality follows natural law, built into human nature and knowable by anyone. Happiness is our goal, and it is found finally in knowing God. His system, taught in Catholic schools for centuries, is the most comprehensive synthesis of faith and reason ever attempted.`,
  life: `Tommaso d’Aquino was born around 1225 in the castle of Roccasecca, between Rome and Naples, into a noble family. At five he was sent to the great Benedictine abbey of Monte Cassino; his family hoped he would one day become its abbot, a position of power and wealth.

Instead, at nineteen, he joined the Dominicans, a new order of mendicant friars who begged for their living and dedicated themselves to preaching and study. His family was horrified. His brothers kidnapped him on the road and held him prisoner in the family castle for about a year. According to a famous story, they sent a prostitute into his room to tempt him; he chased her out with a burning stick from the fire. His family eventually gave up.

He studied in Paris and Cologne under Albert the Great, who took Aristotle more seriously than anyone in Europe. Thomas was large, quiet and slow-moving, and his fellow students called him “the dumb ox”. Albert is supposed to have said: “You call him a dumb ox, but one day his bellowing will be heard throughout the world.”

He became a master of theology at the University of Paris and spent the rest of his life teaching and writing in Paris and Italy, at an astonishing pace. He dictated to several secretaries at once, on different subjects. His works run to about eight million words.

On 6 December 1273, while saying Mass in Naples, something happened to him. He stopped writing, leaving the *Summa Theologiae* unfinished. When his secretary Reginald begged him to continue, he said: “I can do no more. Such things have been revealed to me that all I have written seems to me as straw.” He died three months later, on his way to a church council, aged about 49. In 1277, some of his propositions were condemned by the bishop of Paris. In 1323 he was made a saint.`,
  ideas: [
    { t: `Faith and reason`, b: `For Aquinas, truth is one: reason and revelation both come from God, so they can’t genuinely conflict. If they seem to, someone has made a mistake in reasoning or in interpreting scripture.

Some truths about God can be reached by reason alone: that God exists, is one, is good. Philosophers like Aristotle got there without the Bible. Others, like the Trinity or the Incarnation, can only be known by revelation; they are above reason but not against it. Reason can still show that they aren’t contradictory. “Grace does not destroy nature but perfects it”: faith builds on reason rather than replacing it.` },
    { t: `The Five Ways`, b: `At the start of the *Summa*, Aquinas gives five short arguments that God exists, all starting from features of the world.

**Motion:** things change, and whatever changes is changed by something else. The chain can’t go back forever, so there must be a first unmoved mover. **Causation:** things are caused, and the chain of causes can’t be infinite, so there is a first cause. **Contingency:** things exist that could have not existed. If everything were like that, at some point nothing would have existed, and then nothing would exist now. So something must exist necessarily (Avicenna’s argument). **Degrees:** things are more or less good, true and noble, which implies a maximum. **Design:** things without intelligence act towards goals, like an arrow shot by an archer, which implies an intelligence directing them.

Each ends with the words “and this everyone understands to be God”, which critics point out is doing a lot of work. The arguments are only a few paragraphs long, and they are the most discussed paragraphs in the philosophy of religion.` },
    { t: `Natural law`, b: `Aquinas defines law as “an ordinance of reason for the common good, made by whoever has care of the community, and promulgated”. God’s eternal law governs everything. Humans participate in it through reason: that is the natural law.

Its first principle is simple: good is to be done and pursued, and evil avoided. What is good for us follows from our nature: we are inclined to preserve our lives, to have and raise children, to know the truth, and to live in society. Human laws are just only if they follow natural law. An unjust law, Aquinas says (quoting Augustine), is not really a law at all but “a perversion of law”. Martin Luther King Jr. quoted this in his *Letter from Birmingham Jail*.` },
    { t: `Happiness`, b: `Like Aristotle, Aquinas thinks all humans seek happiness as their final end. He goes through the candidates (wealth, honour, fame, power, bodily health, pleasure) and rejects each, much as Boethius did. No created thing can satisfy us, because our intellect wants to know the cause of everything and our will wants the complete good. Perfect happiness is the vision of God. In this life we can have imperfect happiness, through virtue and contemplation.` },
    { t: `The virtues`, b: `Aquinas combines Aristotle’s virtues with Christian ones. The four cardinal virtues (prudence, justice, courage and temperance) can be acquired by practice. The three theological virtues (faith, hope and charity) are given by grace and direct us to God. Charity, love of God and neighbour, is the form of all the virtues. “To love is to will the good of another.”` },
    { t: `Double effect`, b: `In his discussion of self-defence, Aquinas notes that one act can have two effects, one intended and one not. You may defend yourself even if the attacker dies, as long as you intend only to save your life, and use no more force than necessary. This became the “principle of double effect”, still used in medical ethics and the ethics of war.` },
    { t: `Just war`, b: `A war is just, Aquinas says, only if three conditions are met: it is declared by a legitimate authority, for a just cause, and with right intention (to promote good and avoid evil). Just war theory, developed from here, still shapes international law.` }
  ],
  works: [
    { t: `Summa Theologiae`, y: `1265–1273, unfinished`, b: `The “Summary of Theology”, written, he says, for beginners. It is huge: three parts, 512 questions, 2,669 articles, about three thousand pages. Each article follows a strict format. A question is posed (“Whether God exists?”). Objections are listed, the strongest arguments against Aquinas’s view. Then a “but on the contrary” citing an authority, his own answer, and replies to each objection. It is intellectually honest in a way that is rare: he always states the other side’s best case first.` },
    { t: `Summa contra Gentiles`, y: `c. 1259–1265`, b: `A defence of Christian belief addressed to those who don’t share it, arguing from reason alone as far as possible.` },
    { t: `Commentaries on Aristotle`, y: ``, b: `Line-by-line commentaries on the *Ethics*, *Metaphysics*, *Physics*, *De Anima* and more. Still used by Aristotle scholars.` }
  ],
  quotes: [
    { q: `Grace does not destroy nature but perfects it.`, s: `*Summa Theologiae* I, q.1, a.8, ad 2` },
    { q: `To love is to will the good of another.`, s: `*Summa Theologiae* I–II, q.26, a.4` },
    { q: `Law is nothing else than an ordinance of reason for the common good, made by him who has care of the community, and promulgated.`, s: `*Summa Theologiae* I–II, q.90, a.4` },
    { q: `I can do no more. Such things have been revealed to me that all I have written seems to me as straw.`, s: `Reported by his secretary Reginald of Piperno, December 1273` },
    { q: `The study of philosophy is not that we may know what men have thought, but what the truth of things is.`, s: `*Commentary on Aristotle’s De Caelo* I, lecture 22` },
    { q: `Beware the man of a single book.`, s: `Attributed; the Latin *hominem unius libri timeo* is traditionally his, but no text confirms it` }
  ],
  fakes: [
    { q: `To one who has faith, no explanation is necessary. To one without faith, no explanation is possible.`, n: `Not found in his works. It may come from a 20th-century film, *The Song of Bernadette* (1943).` },
    { q: `There is nothing on this earth more to be prized than true friendship.`, n: `No source has been found. It circulates widely on memorial cards.` }
  ],
  critique: `The Five Ways have been criticised for centuries. Why can’t the chain of causes go back forever? Aquinas himself admitted that reason alone can’t prove the world had a beginning. Even if there is a first cause, why should it be the personal, loving God of Christianity rather than, say, a physical event? Hume and Kant attacked these arguments, and Darwin undercut the argument from design by showing how purpose-like features can arise without a designer.

Natural law has a similar problem. What counts as “natural” tends to look a lot like what the author’s culture already thought. Aquinas used natural law to condemn contraception, masturbation and homosexuality as “against nature”, and the Catholic Church still does. Critics argue that he moved from “what is” to “what ought to be” too easily, the mistake Hume later named.

And some of his views are simply those of a thirteenth-century friar. He followed Aristotle in thinking women were “misbegotten males”. He supported the execution of persistent heretics. Admirers say his method, stating objections fairly, reasoning carefully, is better than some of his conclusions. That’s true, and it cuts both ways.`,
  start: `Don’t start with the *Summa*. Start with G. K. Chesterton’s *Saint Thomas Aquinas: The Dumb Ox* (1933), a lively, affectionate portrait, or Edward Feser’s *Aquinas: A Beginner’s Guide* (2009), which is clear and rigorous. Then try Peter Kreeft’s *A Summa of the Summa*, which selects the key articles with notes. Read the first question of Part I (on theology), question 2 (the Five Ways) and questions 2–5 of Part I–II (on happiness).`,
  related: ['aristotle', 'augustine', 'avicenna', 'boethius', 'hume']
}
);
