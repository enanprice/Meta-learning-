{
  id: 'aristotle', name: `Aristotle`, born: -384, died: -322, era: 'ancient',
  place: `Stagira, Macedonia; Athens`, role: `Philosopher and scientist`,
  themes: ['ethics', 'knowledge', 'politics', 'love'], keywords: ['virtue', 'golden mean', 'eudaimonia', 'happiness', 'flourishing', 'nicomachean ethics', 'logic', 'four causes', 'friendship', 'lyceum', 'habit'],
  tagline: `Happiness isn’t a feeling. It’s a life lived well, and you get there by practice.`,
  summary: `Aristotle brought philosophy back down to earth. Where Plato looked to perfect Forms, Aristotle looked at the world: animals, cities, arguments, people. His ethics says the goal of life is *eudaimonia*, flourishing, which you reach by developing virtues of character through habit, finding the right balance between extremes, and using practical wisdom. He also invented formal logic, founded biology, and wrote on nearly everything else.`,
  life: `Aristotle was born in 384 BCE in Stagira, a small town in Macedonia, in northern Greece. His father was physician to the Macedonian king, which may explain his lifelong interest in biology and in how living things work. Orphaned young, he was sent to Athens at seventeen to study at Plato’s Academy, and stayed twenty years, until Plato died.

Passed over as head of the Academy, he left Athens and spent several years on the island of Lesbos and around the Aegean, doing what we would now call marine biology: dissecting, observing and classifying hundreds of species. Some of his observations, like the reproduction of a certain dogfish, weren’t confirmed until the nineteenth century.

In 343 BCE Philip II of Macedon hired him to tutor his thirteen-year-old son, Alexander, who would become Alexander the Great. How much Aristotle influenced him is unknown; Alexander’s empire-building doesn’t look much like Aristotle’s ideal of the small, self-governing city.

In 335 BCE he returned to Athens and founded his own school, the Lyceum. He had a habit of teaching while walking in its covered walkway (*peripatos*), which is why his followers were called Peripatetics. He collected a huge library and had students gather the constitutions of 158 Greek cities.

When Alexander died in 323, anti-Macedonian feeling in Athens turned on Aristotle, and he was charged with impiety. Mindful of Socrates, he left the city, reportedly saying he would not let Athens sin twice against philosophy. He died the next year on the island of Euboea, aged 62.

What we have of Aristotle is mostly lecture notes. His polished works for the public, praised by Cicero as a “golden river” of prose, are lost. That is why his surviving writing can feel dry and compressed: you are reading a brilliant professor’s teaching files.`,
  ideas: [
    { t: `Everything aims at some good`, b: `The *Nicomachean Ethics* opens with a simple observation. Every action and every craft aims at some end. Medicine aims at health, shipbuilding at ships, strategy at victory. Some ends are pursued for the sake of others: you want money to buy things. But there must be some final end, wanted for its own sake and not for anything else, or desire would go on forever and be empty. What is it?

Everyone agrees it’s *eudaimonia*, usually translated “happiness” but better translated “flourishing” or “living well”. The disagreement is about what it consists in: pleasure, honour, wealth?` },
    { t: `The function argument`, b: `To find out what the good life is for a human, Aristotle asks what a human is for. A good flute-player is one who plays the flute well; a good knife cuts well. Things are good when they perform their characteristic function well.

What is distinctive about humans? Not growth (plants do that) or perception (animals do that) but reason. So the human good is “activity of the soul in accordance with virtue”, reason exercised excellently, “in a complete life”. That last phrase matters. He adds: “one swallow does not make a spring, nor one fine day.” Happiness isn’t a mood you have on a good afternoon. It is a verdict on how a whole life has been lived.` },
    { t: `Virtue is a habit`, b: `Virtues (*aretai*, excellences) of character are not feelings and not inborn capacities. They are stable dispositions, trained states of the self, and you get them the way you get any skill: by practice. “We become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.” You don’t wait to feel courageous before acting bravely. You act bravely, repeatedly, and become a brave person.

This is the most practically useful idea in ancient ethics. It means character is built, not discovered, and that small repeated choices matter more than grand intentions. Modern habit research is, in large part, a footnote to Book II of the *Ethics*.` },
    { t: `The golden mean`, b: `Each virtue is a mean between two vices, one of excess and one of deficiency. Courage lies between cowardice and recklessness. Generosity lies between stinginess and wastefulness. Proper pride lies between small-mindedness and vanity. Good temper lies between being a pushover and being irascible.

Two warnings. First, the mean isn’t mediocrity or the mathematical midpoint. It is “relative to us”: the right amount of food for an Olympic wrestler differs from a beginner’s. Sometimes the right amount of anger is a lot. Second, some actions have no mean: there is no right amount of murder or adultery. The mean is about feelings and actions that come in degrees.

He admits it’s hard. Anyone can get angry. But being angry with the right person, to the right degree, at the right time, for the right reason and in the right way is not easy.` },
    { t: `Practical wisdom`, b: `How do you know where the mean is in a given situation? Not by rulebook. You need *phronesis*, practical wisdom, the ability to see what a situation calls for and to deliberate well about how to act. It is learned through experience, which is why Aristotle thought young people, however clever, can be brilliant at mathematics but rarely wise. Good character and practical wisdom need each other: you can’t have one fully without the other.` },
    { t: `Friendship`, b: `Two of the ten books of the *Ethics* are about friendship, which tells you how important he thought it was: “no one would choose to live without friends, even if he had all other goods.” There are three kinds. Friendships of **utility** (colleagues, business partners) last as long as the usefulness does. Friendships of **pleasure** (drinking buddies, many youthful friendships) last as long as the fun does. Friendships of **virtue**, between good people who love each other for who they are, are rare, slow to form, and lasting. A true friend, he says, is “another self”.` },
    { t: `The contemplative life`, b: `At the end of the *Ethics* there is a twist. The highest happiness, Aristotle says, is contemplation (*theoria*): the activity of understanding truth for its own sake. It is the most self-sufficient, continuous and godlike activity we have. Scholars still argue about how this fits with the rest of the book, which is about living well among other people.` },
    { t: `Four causes`, b: `To understand anything, Aristotle says, you need four kinds of explanation. The **material** cause: what it’s made of (bronze). The **formal** cause: its structure or shape (the shape of the statue). The **efficient** cause: what made it (the sculptor). The **final** cause: what it’s for (to honour a god). Modern science dropped final causes for non-living things, but biologists still ask what the heart is *for*.` },
    { t: `Potential and actual`, b: `An acorn is potentially an oak. Change is the actualisation of a potential. This lets Aristotle answer the old puzzles about how change is possible. It also frames his ethics: a human being is born with the potential to become virtuous and has to realise it.` },
    { t: `Logic`, b: `Aristotle more or less invented formal logic. His syllogism (“All men are mortal; Socrates is a man; therefore Socrates is mortal”) was the core of logic for over two thousand years, until Frege in the 1870s. Kant thought logic had been complete since Aristotle.` },
    { t: `The political animal`, b: `“Man is by nature a political animal.” We can only flourish in a community, the *polis*. Someone who lives outside a city, he says, is either a beast or a god. Politics is the master science, because it is about creating the conditions under which people can live well.` }
  ],
  works: [
    { t: `Nicomachean Ethics`, y: `c. 340 BCE`, b: `Probably named after his son Nicomachus, who may have edited it. Ten books on happiness, virtue, responsibility, weakness of will, pleasure and friendship. It is the most read and most useful thing he wrote. Books I, II and VIII are the essential parts.` },
    { t: `Politics`, y: `c. 350 BCE`, b: `On the nature of the city, types of constitution (monarchy, aristocracy, polity and their corruptions: tyranny, oligarchy, democracy), revolution, and education. It also contains his defence of “natural slavery” (see below).` },
    { t: `Poetics`, y: `c. 335 BCE`, b: `The first work of literary theory. Tragedy imitates serious action and, through pity and fear, brings about *catharsis*, a purging or clarifying of those emotions. It introduced plot structure (beginning, middle and end), the tragic flaw (*hamartia*) and the reversal. Screenwriting manuals still repeat it.` },
    { t: `Rhetoric`, y: `c. 350 BCE`, b: `How persuasion works: through *ethos* (the speaker’s character), *pathos* (the audience’s emotions) and *logos* (the argument). Still the best short guide to how you are being persuaded, by adverts, politicians and feeds.` },
    { t: `Metaphysics`, y: `c. 350 BCE`, b: `A collection of treatises on “first philosophy”: substance, being, causes, and God as the Unmoved Mover, the eternal pure activity that moves the heavens as an object of love. It opens: “All men by nature desire to know.” Difficult; not a starting point.` },
    { t: `On the Soul, History of Animals, Physics, Organon`, y: ``, b: `The soul as the form of a living body; hundreds of pages of zoology; motion, place and time; and the logical works. Enormously influential, mostly for specialists.` }
  ],
  quotes: [
    { q: `For one swallow does not make a spring, nor does one day; and so too one day, or a short time, does not make a man blessed and happy.`, s: `*Nicomachean Ethics* I.7` },
    { q: `We become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.`, s: `*Nicomachean Ethics* II.1` },
    { q: `Anyone can get angry; that is easy. But to be angry with the right person, to the right degree, at the right time, for the right purpose and in the right way is not within everyone’s power and is not easy.`, s: `*Nicomachean Ethics* II.9 (paraphrased closely; translations vary)` },
    { q: `Without friends no one would choose to live, though he had all other goods.`, s: `*Nicomachean Ethics* VIII.1` },
    { q: `All men by nature desire to know.`, s: `*Metaphysics* I.1` },
    { q: `Man is by nature a political animal.`, s: `*Politics* I.2` },
    { q: `It is the mark of an educated person to look for precision in each class of things just so far as the nature of the subject admits.`, s: `*Nicomachean Ethics* I.3` }
  ],
  fakes: [
    { q: `We are what we repeatedly do. Excellence, then, is not an act, but a habit.`, n: `Will Durant, *The Story of Philosophy* (1926), summarising Aristotle. A fair summary, but Durant’s sentence, not Aristotle’s.` },
    { q: `It is the mark of an educated mind to be able to entertain a thought without accepting it.`, n: `Not found in Aristotle. The nearest real line is the one above about precision, which says something different.` },
    { q: `Knowing yourself is the beginning of all wisdom.`, n: `No source in Aristotle. “Know yourself” was a maxim carved at Delphi, long before him.` }
  ],
  critique: `Some of Aristotle is simply wrong, and some of it is ugly. He defended “natural slavery”: some people, he argued, are by nature fit only to be ruled and are better off enslaved. He thought women were deficient in rational authority and should be ruled by men. These weren’t incidental; they followed from his view that nature has a fixed hierarchy of functions. His physics, which dominated Europe for 1,800 years, was wrong about motion, and its authority held back science until Galileo.

The ethics has a subtler problem. The function argument assumes that humans have a single characteristic function and that the good life is excelling at it. Why assume that? Existentialists would say there is no human function given in advance; we make our own. And Aristotle’s ideal person, the “great-souled man” of Book IV, is a proud, wealthy, slightly smug aristocrat who doesn’t like owing favours. His ethics was written for leisured Greek male citizens, and it shows.

Finally, “find the mean with practical wisdom” can feel circular when you’re actually stuck. How do I know the right amount of anger? Do what the wise person would do. Who is the wise person? The one who hits the mean.`,
  start: `Read the *Nicomachean Ethics*, Books I, II, III and VIII–IX first. The translation by Terence Irwin (Hackett) is accurate; Roger Crisp’s (Cambridge) is clearer; Joe Sachs’s (Focus) is literal and interesting. For a gentle start, Edith Hall’s *Aristotle’s Way: How Ancient Wisdom Can Change Your Life* (2018) is a warm, reliable modern guide.`,
  related: ['plato', 'aquinas', 'epictetus', 'avicenna', 'confucius']
},
{
  id: 'diogenes', name: `Diogenes the Cynic`, born: -412, died: -323, approx: true, era: 'ancient',
  place: `Sinope (Black Sea coast); Athens; Corinth`, role: `Cynic philosopher`,
  themes: ['ethics', 'politics'], keywords: ['cynic', 'barrel', 'jar', 'alexander', 'lamp', 'cosmopolitan', 'shameless', 'dog'],
  tagline: `Lived in a jar, mocked everyone important, and told Alexander the Great to get out of his sun.`,
  summary: `Diogenes was philosophy as performance art. He believed happiness came from living according to nature, needing almost nothing, and ignoring social conventions that made people anxious and fake. So he lived in a large storage jar, begged for food, did in public what polite people did in private, and insulted the powerful to their faces. He was the first person known to call himself “a citizen of the world”.`,
  life: `Diogenes was born in Sinope, a Greek colony on the Black Sea. His father was in charge of the city mint, and at some point father or son (or both) was caught debasing the currency, and Diogenes was exiled. He later turned this into a motto: his mission was to “deface the currency”, meaning to strike out the false values stamped on social life.

He came to Athens, reportedly attached himself to Antisthenes, a follower of Socrates, and adopted a life of radical simplicity. He slept in a *pithos*, a huge ceramic jar used for storing wine or grain, often called a barrel or tub in translation. He owned a cloak, a staff, a bag and a cup. When he saw a child drinking water from cupped hands, he threw away his cup, saying a child had beaten him in simplicity.

The Greeks called his followers *kynikoi*, “dog-like”, because they lived shamelessly in public like dogs. Diogenes embraced it: “I fawn on those who give me anything, bark at those who don’t, and bite scoundrels.”

Almost everything we know comes from anecdotes, most collected by Diogenes Laertius around five centuries later. Some are surely invented. They were passed around because they were funny and pointed, which in a way is a tribute to the man. The most famous: Alexander the Great visited him in Corinth, found him sunbathing, and asked if he could do anything for him. “Yes,” said Diogenes. “Stand out of my sun.” Alexander reportedly said that if he weren’t Alexander, he would wish to be Diogenes.

He is said to have been captured by pirates and sold as a slave in Corinth. Asked what trade he knew, he said: “Ruling men. Sell me to someone who needs a master.” He was bought by a man named Xeniades, whose sons he tutored. He died in Corinth, old, around 323 BCE, supposedly on the same day as Alexander.`,
  ideas: [
    { t: `Live according to nature`, b: `Most human misery, Diogenes thought, comes from artificial needs: wealth, status, fine food, reputation, comfort. Animals and children show how little we actually need. The more you want, the more you are a slave to your wants and to the people who can supply or deny them. Freedom (*eleutheria*) and self-sufficiency (*autarkeia*) come from reducing your needs to almost nothing.` },
    { t: `Deface the currency`, b: `Social conventions are like coins: they carry a value everyone accepts but nobody examines. Diogenes set out to show that many of them were worthless. Why is it shameful to eat in the marketplace but not to cheat there? Why is money valued and virtue ignored? His shocking behaviour, much of which is unprintable, was argument by demonstration.` },
    { t: `Training: askesis`, b: `Freedom from need takes practice. He rolled in hot sand in summer and hugged snow-covered statues in winter. He begged from statues, he said, to get used to being refused. The word he used, *askesis*, training, is the root of “ascetic”. The Stoics took the idea and made it gentler: deliberately practise discomfort so that losing comfort can’t frighten you.` },
    { t: `Shamelessness as honesty`, b: `*Parrhesia*, frank speech, was the Cynic virtue. Diogenes said whatever he thought to whoever he thought it about. When Plato defined man as “a featherless biped”, Diogenes plucked a chicken, brought it to the Academy and said, “Here is Plato’s man.” (Plato’s school reportedly added “with broad flat nails” to the definition.)` },
    { t: `Citizen of the world`, b: `Asked where he came from, he said: “I am a citizen of the world” (*kosmopolitēs*). In a Greek world where your city was your identity, this was radical. Loyalty belongs to humanity and to nature, not to a particular state. The Stoics developed the idea into a real ethic of universal human community.` },
    { t: `Looking for a human being`, b: `He walked around Athens in daylight carrying a lit lamp, and when asked why, said: “I am looking for a human being.” The joke is that he couldn’t find one among all the people, meaning he couldn’t find anyone living as a real, honest, natural human rather than a performance of one.` }
  ],
  works: [
    { t: `No surviving writings`, y: ``, b: `Ancient lists credit Diogenes with dialogues and tragedies, and a *Republic*, but none survive, and some ancients doubted he wrote anything. His “works” are his life and the stories about it.` },
    { t: `Diogenes Laertius, Lives of the Eminent Philosophers, Book VI`, y: `c. 3rd century CE`, b: `The main source: about 40 pages of anecdotes and one-liners about Diogenes, alongside other Cynics like Crates and Hipparchia (a rare female philosopher who married Crates and lived as a Cynic with him). Read it as a collection of jokes with a point, not a biography.` }
  ],
  quotes: [
    { q: `I am a citizen of the world.`, s: `Diogenes Laertius, *Lives* VI.63` },
    { q: `Stand a little out of my sun.`, s: `To Alexander the Great, in Diogenes Laertius, *Lives* VI.38 and Plutarch, *Life of Alexander* 14` },
    { q: `I am looking for a human being.`, s: `Carrying a lamp by day, Diogenes Laertius, *Lives* VI.41` },
    { q: `Here is Plato’s man.`, s: `Holding up a plucked chicken, Diogenes Laertius, *Lives* VI.40` },
    { q: `It is the privilege of the gods to want nothing, and of godlike men to want little.`, s: `Diogenes Laertius, *Lives* VI.105 (attributed)` }
  ],
  fakes: [],
  critique: `Diogenes was a parasite, in the plain sense. His freedom from need depended on other people working, producing food and giving it to him. If everyone lived like Diogenes, there would be nothing to beg for. Cynicism only works as a minority position, a critique from the margins, not as a way of life for a society.

He also confused honesty with contempt. Frank speech is a virtue; treating everyone as an idiot is not, and much of what he did looks less like wisdom than like a clever man enjoying being rude. Modern “cynicism” (sneering disbelief in everyone’s motives) is a debased descendant, but you can see the family resemblance.

And since nearly all we have are anecdotes written down centuries later, it is hard to know how much of “Diogenes” is a real person and how much a character people built to carry an attitude.`,
  start: `Read Book VI of Diogenes Laertius’s *Lives of Eminent Philosophers* (translated by Pamela Mensch, Oxford, 2018, with beautiful illustrations). It is short and funny. Then read *Sayings and Anecdotes: With Other Popular Moralists* translated by Robin Hard (Oxford World’s Classics), which gathers the Cynic material. For the idea’s later life, Epictetus’s discourse “On the Calling of a Cynic” (*Discourses* 3.22) shows how the Stoics admired and tamed him.`,
  related: ['socrates', 'epictetus', 'zhuangzi', 'thoreau']
},
{
  id: 'epicurus', name: `Epicurus`, born: -341, died: -270, era: 'ancient',
  place: `Samos; Athens`, role: `Philosopher`,
  themes: ['ethics', 'death', 'love', 'suffering'], keywords: ['pleasure', 'ataraxia', 'garden', 'atoms', 'death is nothing to us', 'tetrapharmakos', 'friendship', 'desire'],
  tagline: `Pleasure is the point of life. Just not the kind you think.`,
  summary: `Epicurus said the goal of life is pleasure, and the word “epicurean” now means someone who loves fine food. He meant almost the opposite. The highest pleasure is tranquillity: freedom from pain in the body and turmoil in the mind. You get it by wanting less, keeping good friends, and not fearing death or the gods. His community lived on bread, water and conversation in a garden outside Athens.`,
  life: `Epicurus was born in 341 BCE on the island of Samos to Athenian parents. He started studying philosophy at fourteen, reportedly because his schoolteachers couldn’t explain where the chaos in Hesiod’s creation story came from. He studied with a follower of Democritus, the atomist, whose theory of the world as atoms moving in a void became the basis of his physics.

After teaching in several cities, he bought a house with a garden in Athens around 306 BCE and founded a community there: the Garden. It was unusual. It admitted women (including courtesans) and slaves, which scandalised critics and fed rumours of orgies that the evidence doesn’t support. Members lived simply, ate plain food, and studied together. A sign over the gate is said to have read: “Stranger, here you will do well to tarry; here our highest good is pleasure.”

Epicurus suffered from kidney stones and other illnesses for years. On the day he died, in 270 BCE, he wrote a letter to his friend Idomeneus: “On this blissful day, which is also the last of my life, I write to you. My continual sufferings from strangury and dysentery are so great that nothing could increase them; but I set against them the joy in my heart at the recollection of our conversations.” It is the best evidence we have that he meant what he taught.

He wrote around 300 works. Almost all are lost. We have three letters and two collections of sayings, preserved by Diogenes Laertius and in a Vatican manuscript. We also have *On the Nature of Things*, a long Latin poem by the Roman Epicurean Lucretius, written about two centuries later, and fragments of Epicurean texts carbonised in the eruption of Vesuvius at Herculaneum, which scholars are still reading with X-ray imaging.`,
  ideas: [
    { t: `Pleasure is the beginning and end of the good life`, b: `Epicurus was a hedonist: he held that pleasure is the only thing good in itself and pain the only thing bad. Every creature seeks pleasure and avoids pain from birth, before it has been taught anything. So far, this sounds like a charter for self-indulgence.

But he distinguished two kinds of pleasure. **Kinetic** pleasures are the active ones: the taste of a meal, the thrill of sex, the rush of excitement. **Static** (or katastematic) pleasures are the states of being free of pain: the calm of a satisfied body (*aponia*) and an untroubled mind (*ataraxia*). The static kind is higher. Kinetic pleasures can vary pain-free living, but they can’t increase it. Once you are free from pain and anxiety, you have reached the peak.

This changes everything. The best life isn’t maximum thrills. It’s a quiet, contented one.` },
    { t: `Three kinds of desire`, b: `Epicurus sorted desires into three groups. **Natural and necessary**: food, water, shelter, friendship, freedom from fear. Easy to satisfy, and you must satisfy them. **Natural but unnecessary**: fancy food, sex, luxury. Fine if they come along, but chasing them brings trouble. **Vain and empty**: wealth, fame, power, status. These have no natural limit, so they can never be satisfied, and pursuing them guarantees anxiety.

Most of our unhappiness, he thought, comes from the third group. “Nothing is enough for the man to whom enough is too little.” Swap “fame and wealth” for “followers and likes” and he could be writing today.` },
    { t: `Death is nothing to us`, b: `His most famous argument. Good and bad consist in sensation. Death is the end of sensation. So death is neither good nor bad for the person who dies. “When we exist, death is not present; and when death is present, we do not exist.”

Lucretius added the **symmetry argument**: you don’t feel distress about the infinite time before you were born. Death is just the mirror image. Why fear one blankness and not the other?

Many people find these arguments logically tidy and emotionally useless. But they’re aimed at a specific fear: fear of being dead, of something awful waiting on the other side. For that fear, they work well.` },
    { t: `Don’t fear the gods`, b: `Epicurus believed gods existed, but as perfectly blissful beings who live in the spaces between worlds and have no interest in us. They don’t punish, reward or intervene. The universe is atoms and void, run by natural causes. So fear of divine punishment, which he thought poisoned human life, is groundless.` },
    { t: `The four-part cure`, b: `Later Epicureans summed up the teaching as the *tetrapharmakos*, the four-part remedy: God is nothing to fear. Death is nothing to worry about. The good is easy to get. The terrible is easy to endure. (Severe pain is brief; chronic pain is usually mild enough to live with.)` },
    { t: `Friendship above all`, b: `“Of all the things wisdom provides for the happiness of the whole of life, by far the greatest is the possession of friendship.” Friends give security, and the confidence of having help when we need it. Epicurus said we should look for someone to eat and drink with before we look for something to eat and drink: to eat alone is to live like a lion or wolf.` },
    { t: `Live unnoticed`, b: `*Lathe biōsas*: “live unnoticed”. Stay out of politics and public life, which brings enemies, envy and anxiety. Cultivate your garden and your friends. It is a direct challenge to the Greek ideal of the public man, and a very modern-sounding one.` },
    { t: `The swerve`, b: `In Epicurean physics, atoms fall through the void and occasionally, unpredictably, swerve (*clinamen*, in Lucretius’s Latin). This swerve is what allows atoms to collide and form things, and it was supposed to make room for free will in a material universe. Even ancient critics thought it was ad hoc. But the atomic picture itself was astonishingly close to modern science.` }
  ],
  works: [
    { t: `Letter to Menoeceus`, y: `c. 300 BCE`, b: `His ethics in about five pages. Death, the gods, desire, pleasure, prudence. The single best thing to read by Epicurus, and one of the best short texts in philosophy.` },
    { t: `Principal Doctrines and Vatican Sayings`, y: ``, b: `Two collections of short maxims, 40 and 81 of them respectively. They read like a guide to calm.` },
    { t: `Letter to Herodotus and Letter to Pythocles`, y: ``, b: `His physics and astronomy. More technical.` },
    { t: `Lucretius: On the Nature of Things (De Rerum Natura)`, y: `c. 55 BCE`, b: `A 7,400-line Latin poem by a Roman disciple explaining the whole Epicurean system: atoms, the soul, death, sex, the origins of civilisation, a plague. It was lost for centuries, rediscovered in a German monastery in 1417, and helped spark the scientific revolution. Stephen Greenblatt tells the story in *The Swerve*.` }
  ],
  quotes: [
    { q: `Death is nothing to us; for that which has been dissolved is without sensation, and that which lacks sensation is nothing to us.`, s: `*Principal Doctrines* 2` },
    { q: `When we exist, death is not present; and when death is present, we do not exist.`, s: `*Letter to Menoeceus* 125` },
    { q: `Nothing is enough for the man to whom enough is too little.`, s: `*Vatican Sayings* 68` },
    { q: `Of all the things which wisdom provides for the happiness of the whole of life, by far the greatest is the possession of friendship.`, s: `*Principal Doctrines* 27` },
    { q: `Do not spoil what you have by desiring what you have not; remember that what you now have was once among the things you only hoped for.`, s: `*Vatican Sayings* 35` },
    { q: `It is impossible to live pleasantly without living wisely, well and justly, and impossible to live wisely, well and justly without living pleasantly.`, s: `*Principal Doctrines* 5` },
    { q: `Send me a little pot of cheese, so that I may have a feast whenever I like.`, s: `Letter fragment, in Diogenes Laertius, *Lives* X.11` }
  ],
  fakes: [
    { q: `Is God willing to prevent evil, but not able? Then he is not omnipotent. Is he able, but not willing? Then he is malevolent...`, n: `The “Epicurean paradox” is attributed to him by the Christian writer Lactantius around 300 CE, and made famous by Hume. There is no evidence Epicurus framed it this way, and he believed the gods existed.` }
  ],
  critique: `Is the absence of pain really the highest pleasure? Most people would trade some calm for love, adventure, achievement or meaning, even if these bring suffering. Epicurus’s ideal can look like a well-managed retreat from life. Nietzsche admired him but saw his philosophy as the wisdom of someone who suffered a lot and wanted, above all, for it to stop.

The death argument has a known gap. Even if being dead isn’t bad *for* you, death can still be bad because of what it takes away: the future you would have had. The philosopher Thomas Nagel makes this “deprivation” case in his essay “Death” (1970). A person killed at twenty has lost something, even if they aren’t around to feel the loss.

And “live unnoticed” works only if someone else is running the city. If every decent person withdrew from public life, the indecent ones would have it to themselves.`,
  start: `Read the *Letter to Menoeceus* first; it takes fifteen minutes. The best collection is *The Art of Happiness* translated by George K. Strodach (Penguin Classics), which has all the surviving letters and maxims with a good introduction. Then, if you want more, Lucretius’s *The Nature of Things* in A. E. Stallings’s verse translation (Penguin). For a modern take, Catherine Wilson’s *How to Be an Epicurean* (2019).`,
  related: ['seneca', 'marcus-aurelius', 'montaigne', 'buddha', 'schopenhauer']
},
{
  id: 'epictetus', name: `Epictetus`, born: 50, died: 135, approx: true, era: 'ancient',
  place: `Hierapolis (Phrygia); Rome; Nicopolis (Greece)`, role: `Stoic philosopher`,
  themes: ['ethics', 'suffering', 'mind'], keywords: ['stoic', 'stoicism', 'dichotomy of control', 'enchiridion', 'discourses', 'slave', 'impressions'],
  tagline: `A former slave who taught that nobody can make you miserable without your consent.`,
  summary: `Epictetus is Stoicism at its hardest and clearest. Some things are up to us (our judgements, choices and desires) and everything else isn’t (our bodies, property, reputation, other people, what happens). Suffering comes from confusing the two. It isn’t events that disturb us but our judgements about them. Master your judgements and nothing outside can touch your freedom.`,
  life: `Epictetus was born around 50 CE in Hierapolis, in what is now south-western Turkey, as a slave. His name simply means “acquired”. He was owned by Epaphroditus, a freedman who worked as secretary to the emperor Nero, and at some point was lame, possibly from birth, possibly from abuse. A later story says his master twisted his leg, and Epictetus calmly said, “If you go on, you will break it.” When it broke, he said, “Didn’t I tell you?” The story is probably legend, but it fits the teaching.

His master allowed him to study with Musonius Rufus, the leading Stoic teacher in Rome. After he was freed, Epictetus taught philosophy in Rome until around 93 CE, when the emperor Domitian banished all philosophers from the city. He moved to Nicopolis in north-western Greece and set up a school that attracted students from across the empire, including, possibly, the young Hadrian. He lived simply, never married until old age (when he adopted a child who would otherwise have been left to die, and took a woman to help raise it), and died around 135.

Like Socrates, he wrote nothing. One of his students, Arrian (who later became a historian of Alexander the Great), took notes of his lectures, which survive as the *Discourses*, and made a short handbook of the core teachings, the *Enchiridion*. Marcus Aurelius read the *Discourses* and quotes them in the *Meditations*.`,
  ideas: [
    { t: `The dichotomy of control`, b: `The *Enchiridion* opens with the whole philosophy in two sentences: “Some things are within our power, while others are not. Within our power are opinion, motivation, desire, aversion, and, in a word, whatever is of our own doing; not within our power are our body, our property, reputation, office, and, in a word, whatever is not of our own doing.”

Things within our power are by nature free; things outside it are weak, slavish and belong to others. If you treat what belongs to others as your own, you will be frustrated, grieve, and blame gods and people. If you treat only what is yours as yours, no one will ever compel you or stop you.

Notice what’s on the list of things *not* up to you: your body, your reputation, your job. That is radical. Your health, how others see you, whether you get promoted, whether someone loves you back: none of it is yours to control. What is up to you is how you judge and respond. The modern “circle of control” diagram is this idea, flattened.` },
    { t: `Judgements, not things`, b: `“Men are disturbed not by things, but by the opinions about things.” Death isn’t terrible (Socrates didn’t think so); the judgement that death is terrible is what’s terrible. When someone insults you, it isn’t the insult that hurts you but your judgement that you have been harmed.

This is the root idea of cognitive behavioural therapy. Albert Ellis and Aaron Beck, who founded the approach in the 1950s and 60s, both cited Epictetus. The difference is that Epictetus thought you could, with training, change your judgements about almost everything.` },
    { t: `Examine your impressions`, b: `The practical method: when an impression strikes you (“This is a disaster”, “He disrespected me”), don’t go along with it immediately. Say to it: “Wait for me a little, impression. Let me see what you are and what you represent. Let me test you.” Ask whether it concerns something up to you or not. If not, be ready to say: “It is nothing to me.”` },
    { t: `Returning, not losing`, b: `“Never say of anything, ‘I have lost it’, but ‘I have given it back.’ Is your child dead? It has been given back. Is your wife dead? She has been given back.” This is the part of Epictetus people find hardest, and it can sound monstrous. His point is that nothing external is ever truly ours; it is on loan from the universe. He also says that when you kiss your child, you should remind yourself that it is mortal. Not to love less, but to love without the illusion of permanence.` },
    { t: `Roles`, b: `You are not just a person; you are a son or daughter, a sibling, a citizen, a friend. Each role carries duties. “Your brother wrongs you? Then keep your relationship with him.” You can’t control how he acts; you can control whether you act as a good brother. This keeps Stoicism from being pure withdrawal. It is about acting well in the positions life puts you in.` },
    { t: `The play and the playwright`, b: `“Remember that you are an actor in a play, the character of which is determined by the playwright. If short, then short; if long, then long. If he wants you to act a poor man, a cripple, a ruler, or a private citizen, see that you act it well. For this is your business: to act well the given part; but to choose it belongs to another.”` },
    { t: `Progress looks foolish`, b: `“If you want to improve, be content to be thought foolish and stupid with regard to external things.” If you are really working on yourself, people will think you strange for not caring about what they care about. Wanting to look wise is itself a way of caring about an external.` }
  ],
  works: [
    { t: `The Enchiridion (Handbook)`, y: `c. 125 CE`, b: `About 20 pages. Fifty-three short sections of practical advice, compiled by Arrian. It was used as a manual by monks in the Middle Ages (with Christian edits), by soldiers and by people in prison. It is the most compact guide to living ever written. Read it in an hour, then keep it by you.` },
    { t: `The Discourses`, y: `c. 108 CE`, b: `Four books survive (of an original eight). These are the lectures themselves, recorded as spoken: blunt, funny, sarcastic, full of imaginary opponents. He mocks students who want to be admired for quoting philosophy but fall apart when their dinner is late. They are longer and more human than the *Enchiridion*.` }
  ],
  quotes: [
    { q: `Some things are within our power, while others are not.`, s: `*Enchiridion* 1` },
    { q: `Men are disturbed not by things, but by the opinions about things.`, s: `*Enchiridion* 5` },
    { q: `Never say of anything, “I have lost it”; but, “I have returned it.”`, s: `*Enchiridion* 11` },
    { q: `If you want to improve, be content to be thought foolish and stupid with regard to external things.`, s: `*Enchiridion* 13` },
    { q: `Do not seek to have events happen as you want them to, but instead want them to happen as they do happen, and your life will go well.`, s: `*Enchiridion* 8` },
    { q: `Remember that it is not he who reviles or strikes you who insults you, but your opinion about these things as being insulting.`, s: `*Enchiridion* 20` },
    { q: `No one is free who is not master of himself.`, s: `Fragment 35 (attributed)` },
    { q: `First say to yourself what you would be; and then do what you have to do.`, s: `*Discourses* 3.23` }
  ],
  fakes: [
    { q: `It’s not what happens to you, but how you react to it that matters.`, n: `A modern paraphrase of *Enchiridion* 5. The idea is his; this wording isn’t in the text.` },
    { q: `Don’t explain your philosophy. Embody it.`, n: `A loose compression of *Enchiridion* 46, where he says not to call yourself a philosopher or talk about principles among ordinary people, but to act on them.` }
  ],
  critique: `The dichotomy is cleaner on paper than in life. Most important things are partly up to us: our health, our relationships, our work. Later Stoics and modern writers (William Irvine calls it a “trichotomy”) have had to add a middle category. Otherwise Stoicism can slide into passivity.

The deeper worry is emotional. Telling a grieving parent that their child has been “returned” is, to most people, obscene. Stoicism aims at *apatheia*, freedom from disturbing passions, and critics from Augustine onward argue that some grief, anger and fear are the right response to the world. A person who feels nothing at injustice isn’t wise; they are numb. Epictetus would reply that he isn’t asking you not to feel, only not to be enslaved. Whether that distinction holds up under real loss is something you have to test for yourself.

There is also a political problem. A philosophy that tells a slave his chains don’t matter, only his judgements, is very convenient for slave owners. Epictetus might answer that it gave him a freedom no owner could take. Both things can be true.`,
  start: `Read the *Enchiridion* first, in Robin Hard’s translation (*Discourses, Fragments, Handbook*, Oxford World’s Classics) or the free Elizabeth Carter translation of 1758, still lovely. Then dip into the *Discourses*, especially 1.1, 1.12, 2.18, 3.22 and 4.1. For a modern guide, A. A. Long’s *Epictetus: A Stoic and Socratic Guide to Life* is the best scholarly book; Massimo Pigliucci’s *How to Be a Stoic* is the best popular one.`,
  related: ['marcus-aurelius', 'seneca', 'socrates', 'diogenes', 'frankl']
},
{
  id: 'seneca', name: `Seneca`, born: -4, died: 65, approx: true, era: 'ancient',
  place: `Córdoba (Spain); Rome`, role: `Stoic philosopher, statesman and playwright`,
  themes: ['ethics', 'death', 'suffering'], keywords: ['stoic', 'stoicism', 'letters', 'lucilius', 'shortness of life', 'time', 'nero', 'anger', 'premeditatio malorum'],
  tagline: `The most readable Stoic: warm, witty, obsessed with time, and a millionaire who wrote in praise of poverty.`,
  summary: `Seneca wrote about how to live well with a friend’s voice rather than a teacher’s. His subjects are time (we waste most of it), anger (the most destructive passion), fear (we suffer more in imagination than in reality), death (practise it daily) and friendship. He was also the richest man in Rome and tutor to Nero, and his life is a long argument about whether you can be a philosopher at the heart of power.`,
  life: `Lucius Annaeus Seneca was born around 4 BCE in Córdoba in Roman Spain, to a wealthy family. His father was a famous teacher of rhetoric. Seneca was sickly (he suffered from asthma and possibly tuberculosis, and at one point considered suicide) and was brought to Rome young, where he studied Stoic philosophy and became a celebrated lawyer and senator.

In 41 CE the emperor Claudius exiled him to Corsica, on a charge of adultery with the emperor’s niece, possibly trumped up. He spent eight years there. In 49 he was recalled by Agrippina, Claudius’s new wife, to tutor her twelve-year-old son, Nero. When Nero became emperor at sixteen, Seneca became his chief adviser and speechwriter, and for about five years, with the prefect Burrus, effectively ran the empire, well by most accounts.

It went bad. Nero murdered his stepbrother, then his mother (Seneca may have drafted the letter to the Senate justifying it). Seneca became enormously rich from imperial gifts and moneylending; he was accused of charging ruinous interest in Britain, which some ancient sources blame for Boudica’s revolt. Around 62 CE he tried to retire and offered his fortune back to Nero, who refused. He withdrew anyway and spent his last years writing his best work, the *Letters to Lucilius*.

In 65 CE Nero accused him of joining a conspiracy and ordered him to kill himself. According to Tacitus, Seneca, forbidden to make a will, told his friends he was leaving them the only thing he had left and the most beautiful: the image of his life. He cut his veins, but being old and thin, bled too slowly; he took poison, which didn’t work; he was finally carried into a hot bath and suffocated by the steam. His wife Paulina tried to die with him, but Nero’s soldiers saved her.`,
  ideas: [
    { t: `The shortness of life`, b: `His most famous essay opens with a complaint everyone makes: life is too short. Seneca says it isn’t. “It is not that we have a short time to live, but that we waste a lot of it.” Life is long enough if you know how to use it.

We guard our property fiercely but let anyone take our time. We give it away to busywork, to other people’s ambitions, to parties and grudges and waiting. We live as if we’ll live forever, postponing real living to some future retirement that may never come. He mocks people who have spent their lives busy and are only now, as old men, preparing to live.

Replace “banquets and legal cases” with “notifications and feeds” and the essay needs no updating at all.` },
    { t: `Time is the only thing we own`, b: `The first of the *Letters* starts: “Claim yourself for yourself, Lucilius. Gather and guard the time that until now has been taken from you, or stolen, or has slipped away.” Everything else is borrowed; time alone is ours, and it is the one thing nobody can repay. “While we postpone, life speeds by.”` },
    { t: `We suffer more in imagination`, b: `“There are more things likely to frighten us than to crush us; we suffer more often in imagination than in reality.” Most of what we fear never happens; what does happen is usually more bearable than we expected. Much anxiety is suffering the disaster in advance, often many times, for events that never arrive.` },
    { t: `Rehearse misfortune`, b: `The Stoics practised *praemeditatio malorum*: imagining losses in advance. Seneca also suggests spending a few days each month living on the cheapest food and roughest clothes, and asking yourself: “Is this what I feared?” The point is not gloom but inoculation. Once you have tasted poverty voluntarily, you are no longer terrified of it, and you enjoy what you have more.` },
    { t: `Anger is temporary madness`, b: `*On Anger* is a three-book assault on what Seneca considered the most harmful of emotions. Aristotle thought some anger was right; Seneca disagrees. Anger is a brief madness that ruins judgement, and its damage outlasts it. His practical advice is excellent: delay (the first rush of anger passes if you wait), don’t act while angry, assume people’s mistakes are mistakes, and review your day each night, as his teacher Sextius did, asking where you went wrong.` },
    { t: `Practise dying`, b: `“Let us prepare our minds as if we had come to the very end of life. Let us postpone nothing.” Seneca returns again and again to death, not morbidly but as the one fact that puts everything else in proportion. We die daily; the part of life that has passed already belongs to death. Whoever has learned how to die has unlearned how to be a slave.` },
    { t: `Friendship and reading`, b: `Choose friends who will make you better. Read a few great authors deeply rather than skimming many: “Everywhere means nowhere.” A person who travels constantly has many acquaintances and no friends; so too with a reader who flits between books. This, too, is advice for an age of infinite content.` }
  ],
  works: [
    { t: `Letters to Lucilius (Moral Letters)`, y: `c. 63–65 CE`, b: `124 letters to a younger friend, the governor of Sicily, written in Seneca’s last years. Each is a few pages, ending with a quotation (often from Epicurus, whom he admired despite belonging to a rival school). They cover grief, fear, old age, crowds, travel, slavery (Letter 47 argues slaves are human beings like us), reading and death. Perhaps the single best book of practical philosophy. Read one a day.` },
    { t: `On the Shortness of Life`, y: `c. 49 CE`, b: `About 30 pages. If you read one thing by Seneca, make it this.` },
    { t: `On Anger`, y: `c. 45 CE`, b: `Written for his brother. Long, but Book III, with the nightly self-review, is worth it.` },
    { t: `Consolations`, y: `c. 40–45 CE`, b: `Three letters comforting the grieving: to Marcia on the death of her son, to his mother Helvia on his own exile, and to Polybius (a flattering one, written to get him recalled from exile). The one to his mother is tender and good.` },
    { t: `On the Happy Life, On Tranquillity of Mind, On Providence`, y: ``, b: `Shorter essays. *On the Happy Life* includes his defence against the charge of hypocrisy: “I am not a wise man... I am not good; I am only trying to be.”` },
    { t: `The tragedies`, y: ``, b: `Nine bloody plays (*Medea*, *Thyestes*, *Phaedra*), full of passion out of control, which influenced Shakespeare and the Jacobean revenge play. They are Stoicism shown in reverse: what happens when reason loses.` }
  ],
  quotes: [
    { q: `It is not that we have a short time to live, but that we waste a lot of it.`, s: `*On the Shortness of Life* 1` },
    { q: `We suffer more often in imagination than in reality.`, s: `*Letters* 13.4` },
    { q: `While we are postponing, life speeds by.`, s: `*Letters* 1.3` },
    { q: `Nothing, Lucilius, is ours, except time.`, s: `*Letters* 1.3` },
    { q: `Everywhere means nowhere.`, s: `*Letters* 2.2, on skimming books and restless travel` },
    { q: `Wherever there is a human being, there is an opportunity for kindness.`, s: `*On the Happy Life* 24` },
    { q: `No man was ever wise by chance.`, s: `*Letters* 76.6` },
    { q: `Associate with people who are likely to improve you.`, s: `*Letters* 7.8` }

  fakes: [
    { q: `Luck is what happens when preparation meets opportunity.`, n: `Not found in Seneca. It is a modern saying, sometimes credited to the American football coach Darrell Royal.` },

  ],
  critique: `The charge of hypocrisy was made in his lifetime and has never gone away. Seneca wrote in praise of poverty while owning 300 million sesterces, villas and 500 citrus-wood tables with ivory legs. He wrote *On Clemency* for Nero, then served him through murders. He wrote that the wise man stays out of politics while running the empire. The historian Cassius Dio, a century later, called him a hypocrite outright.

His defence, in *On the Happy Life*, is honest: he is not a sage, only someone trying, and philosophers should be judged by what they teach, not only by how well they live it. That’s fair up to a point. But it is also exactly what every hypocrite says. The question his life poses is real: can you do more good compromising inside power than keeping your hands clean outside it?

Philosophically, Seneca is not original; he popularised Stoic ideas rather than developing them. Some of his reasoning is rhetorical rather than rigorous. He is also repetitive. But he is read because he is psychologically perceptive, not because he is systematic.`,
  start: `Read *On the Shortness of Life* (Penguin Great Ideas prints it with two other essays for a few pounds). Then the *Letters*: Robin Campbell’s selection *Letters from a Stoic* (Penguin) or the full set translated by Margaret Graver and A. A. Long (Chicago). James Romm’s *Dying Every Day: Seneca at the Court of Nero* tells the life honestly, including the ugly parts.`,

{
  id: 'marcus-aurelius', name: `Marcus Aurelius`, born: 121, died: 180, era: 'ancient',
  place: `Rome; the Danube frontier`, role: `Roman emperor and Stoic philosopher`,
  themes: ['ethics', 'death', 'suffering', 'mind'], keywords: ['stoic', 'stoicism', 'meditations', 'emperor', 'impermanence', 'obstacle is the way', 'view from above'],
  tagline: `The most powerful man in the world, writing notes to himself about how not to become a monster.`,
  summary: `The *Meditations* is a private notebook, never meant for publication, kept by a Roman emperor while he fought wars and managed a plague. In it Marcus reminds himself, again and again, of the same few things: that life is short and everything passes; that other people’s faults are not his business but his own are; that he must do his duty without complaint; that obstacles are material for virtue; and that he is a small part of a vast, rational whole.`,
  life: `Marcus Annius Verus was born in Rome in 121 CE into a wealthy family of Spanish origin. His father died when he was about three. The emperor Hadrian noticed the serious boy (he nicknamed him *Verissimus*, “most truthful”) and arranged for Marcus to be adopted, via his successor Antoninus Pius, into the line of succession. At eleven, Marcus took up philosophy and started dressing in a rough Greek cloak and sleeping on the ground, until his mother persuaded him to use a bed.

He studied rhetoric with the famous orator Fronto (their affectionate letters survive) but was drawn to Stoicism, especially after his teacher Junius Rusticus lent him his own copy of Epictetus’s *Discourses*. In 161, at forty, he became emperor, and insisted on sharing power with his adoptive brother Lucius Verus, an unprecedented move.

His reign was almost continuous crisis. War with Parthia in the east. The Antonine Plague, probably smallpox, brought back by the returning army, which killed perhaps five to ten million people across the empire over two decades. Floods, famine. Then years of brutal war against Germanic tribes (the Marcomanni and Quadi) along the Danube. Marcus, not a natural soldier, spent most of his last decade in army camps. Much of the *Meditations* was written there; Book I ends “Among the Quadi, on the river Gran”.

He had fourteen children with his wife Faustina; most died young. In 175 his most trusted general, Avidius Cassius, falsely hearing he was dead, declared himself emperor. The revolt collapsed and Cassius was killed; Marcus reportedly burned Cassius’s correspondence unread so he wouldn’t have to punish the conspirators.

He died in 180, probably of plague, at a military camp, possibly at Vindobona (Vienna). He was succeeded by his son Commodus, one of the worst emperors Rome ever had. The historian Cassius Dio wrote that with Marcus’s death, history “descends from a kingdom of gold to one of iron and rust”.`,
  ideas: [
    { t: `Prepare for difficult people`, b: `Book II opens: “When you wake up in the morning, tell yourself: the people I deal with today will be meddling, ungrateful, arrogant, dishonest, jealous and surly.” It sounds bitter. It isn’t. He goes on: they are like this because they can’t tell good from evil. But I can, and I know that the wrongdoer is my kin, sharing the same mind and the same share of the divine. None of them can hurt me, because none of them can make me do wrong. We are made to work together, like feet, hands and eyelids.

The morning meditation is a pre-commitment. Expect friction, so it can’t ambush you, and decide in advance to respond with patience.` },
    { t: `The obstacle becomes the way`, b: `“The impediment to action advances action. What stands in the way becomes the way.” Every obstacle is an opportunity to practise some virtue: patience, courage, resourcefulness, fairness. The mind, he says, “adapts and converts to its own purposes the obstacle to our acting”, as a fire makes fuel out of whatever is thrown on it. Ryan Holiday built a bestseller on this one passage (5.20).` },
    { t: `Everything passes`, b: `Marcus keeps reminding himself how small and brief everything is. Remember the court of Augustus: his wife, daughter, grandsons, friends, doctors. All dead. Remember Vespasian’s time: people marrying, falling ill, making war, feasting, flattering, scheming. That entire life is gone. Alexander the Great and his mule-driver ended up in the same place.

“Soon you will have forgotten everything; soon everyone will have forgotten you.” It’s meant to be freeing. If fame is this fragile, why live for it? Just do what is right, now.` },
    { t: `The view from above`, b: `He often imagines looking down on human life from a great height: armies, farms, weddings, divorces, births, deaths, noise, courts, markets, a whole swarming spectacle, all tiny and brief against the scale of time and space. Pierre Hadot, the great scholar of the *Meditations*, called this “the view from above”. Astronauts report a version of it looking at Earth. It shrinks grievances.` },
    { t: `It’s your judgement that hurts you`, b: `From Epictetus: “Choose not to be harmed, and you won’t feel harmed. Don’t feel harmed, and you haven’t been.” And: “If you are distressed by anything external, the pain is not due to the thing itself, but to your estimate of it; and this you have the power to revoke at any moment.” This is his most repeated exercise: strip things down to what they objectively are. Purple robes are sheep’s wool dyed with shellfish blood. Sex is friction and a spasm. Fine food is dead fish. The point isn’t cynicism but seeing clearly, so that you aren’t bewitched by labels.` },
    { t: `Do your job`, b: `Book V opens with Marcus arguing with himself about getting out of bed. “At dawn, when you have trouble getting out of bed, tell yourself: I have to go to work, as a human being. What do I have to complain of, if I’m going to do what I was born for? Or was I made to huddle under the blankets and stay warm?” It is the most relatable thing an emperor ever wrote.` },
    { t: `Be good now`, b: `“Waste no more time arguing what a good man should be. Be one.” And: “Do not act as if you had ten thousand years to live. Death hangs over you. While you live, while it is in your power, be good.” The *Meditations* is less a theory than a nag, and the nag is always: stop theorising, do it today.` },
    { t: `The whole and the part`, b: `Stoic physics held that the universe is a single living, rational being, run by the *logos*. Every event is part of a web of causes, and everything that happens happens as it should for the whole. Marcus returns to this for comfort: “Either there is providence or there are atoms.” Even if the universe is random, he still has to act well. Either way, he doesn’t get to opt out of virtue.` },
    { t: `The best revenge`, b: `“The best revenge is not to be like that.” When someone wrongs you, the temptation is to become like them. Refusing that is the only victory that matters.` }
  ],
  works: [
    { t: `Meditations`, y: `c. 170–180 CE`, b: `Twelve books of notes, written in Greek. The title was added later; the manuscript heading is *Ta eis heauton*, “To himself”. Book I is a list of what he learned from each person in his life, a beautiful exercise in gratitude. The rest is unordered: reminders, arguments with himself, quotations, bursts of irritation, exhortations. It is repetitive because he was training, not writing a book, and you repeat what you are trying to learn.

Its survival is almost accidental. It was barely mentioned for centuries, and the first printed edition appeared in 1558. It has since been read by Frederick the Great, Goethe, John Stuart Mill, Theodore Roosevelt, Nelson Mandela’s fellow prisoners, Bill Clinton and generals from James Mattis down.` }
  ],
  quotes: [
    { q: `The impediment to action advances action. What stands in the way becomes the way.`, s: `*Meditations* 5.20 (Hays translation)` },
    { q: `Waste no more time arguing what a good man should be. Be one.`, s: `*Meditations* 10.16` },
    { q: `Do not act as if you had ten thousand years to live. Death hangs over you. While you live, while it is in your power, be good.`, s: `*Meditations* 4.17` },
    { q: `Choose not to be harmed, and you won’t feel harmed. Don’t feel harmed, and you haven’t been.`, s: `*Meditations* 4.7 (Hays)` },
    { q: `The best revenge is not to be like that.`, s: `*Meditations* 6.6 (Hays)` },
    { q: `How much time he gains who does not look to see what his neighbour says or does or thinks, but only at what he does himself.`, s: `*Meditations* 4.18` },
    { q: `Loss is nothing else but change, and change is Nature’s delight.`, s: `*Meditations* 9.35` },
    { q: `Very little is needed to make a happy life; it is all within yourself, in your way of thinking.`, s: `*Meditations* 7.67 (translations vary)` },
    { q: `Soon you will have forgotten all things; soon all things will have forgotten you.`, s: `*Meditations* 7.21` }
  ],
  fakes: [
    { q: `You have power over your mind, not outside events. Realize this, and you will find strength.`, n: `A modern paraphrase of the spirit of the book. That sentence isn’t in any translation.` },
    { q: `Everything we hear is an opinion, not a fact. Everything we see is a perspective, not the truth.`, n: `Not in the *Meditations*. It adds a relativism Marcus would have rejected: the Stoics thought you could see things as they really are.` },
    { q: `Live a good life. If there are gods and they are just, they will not care how devout you have been...`, n: `This long passage, circulated as “Marcus Aurelius on the gods”, is modern. Nothing like it is in his writing.` }
  ],
  critique: `A Stoic emperor is still an emperor. Marcus persecuted Christians during his reign (the martyrdoms at Lyon in 177 happened under him, though how directly he was involved is debated). He fought long, bloody wars of pacification and planned new provinces beyond the Danube. The *Meditations* never questions slavery, empire or his own right to rule. Stoic acceptance of “your role” fits very comfortably with the role of absolute ruler.

He also chose Commodus as his heir, breaking the century-long practice of adopting the best candidate. It was a catastrophe. For a man so sure of his judgement about others, it is a striking failure, possibly a father’s blind spot.

As philosophy, the *Meditations* is not original, and it isn’t an argument; it is a set of exercises. Some find its constant talk of death and insignificance depressing rather than consoling. There is a real question whether reminding yourself that nothing matters on a cosmic scale makes you calmer or just detached. And the popular “Stoicism” sold online, as a toolkit for productivity and emotional control, tends to strip out his cosmic piety, his sense of duty to others, and his gentleness, leaving a kind of self-help machismo he would not recognise.`,
  start: `Read the *Meditations* in Gregory Hays’s translation (Modern Library, 2002), which is the most alive in modern English. Robin Hard (Oxford) is more literal and has good notes. Read a few pages at a time, not straight through. Start with Book II and Book V, then go back to Book I. For understanding, Pierre Hadot’s *The Inner Citadel* is the best book ever written about it, and Donald Robertson’s *How to Think Like a Roman Emperor* is the best accessible one.`,
  related: ['epictetus', 'seneca', 'heraclitus', 'spinoza', 'nietzsche']
}
);

{
  id: 'buddha', name: `The Buddha`, born: -480, died: -400, approx: true, era: 'east',
  place: `Lumbini (Nepal); the Ganges plain of northern India`, role: `Teacher; founder of Buddhism`,
  themes: ['suffering', 'mind', 'ethics', 'death'], keywords: ['siddhartha', 'gautama', 'four noble truths', 'eightfold path', 'dukkha', 'anatta', 'no self', 'impermanence', 'nirvana', 'meditation', 'mindfulness', 'dhammapada', 'second arrow'],
  tagline: `Life hurts because we cling to things that can’t last, including the idea of a self.`,
  summary: `Siddhartha Gautama taught that suffering (*dukkha*) is built into ordinary life, that it comes from craving and clinging, that it can end, and that there is a practical path to ending it. Everything is impermanent, and there is no fixed, unchanging self underneath our experiences. He offered this less as a belief system than as a diagnosis and a treatment, to be tested in your own experience.`,
  life: `The traditional dates for the Buddha are 563–483 BCE. Most historians now place his death later, around 400 BCE, give or take a few decades. Nothing was written down for about four centuries after he died; the teachings were memorised and chanted by monks. So the details of his life come to us through layers of legend.

The traditional story: Siddhartha Gautama was born a prince of the Shakya clan in Lumbini, in what is now southern Nepal. A seer predicted he would become either a great king or a great holy man, so his father kept him in luxury inside the palace and shielded him from all unpleasantness. He married and had a son. At around 29, on trips outside the palace, he saw for the first time an old man, a sick man and a corpse, and then a wandering ascetic who seemed at peace. Shaken by the realisation that ageing, sickness and death come to everyone, he left home in the night to find a way out of suffering. (The “four sights” are almost certainly a teaching story, but the core is plausible: a young man of privilege renouncing it.)

He studied meditation with two teachers, mastered their methods, and found them incomplete. He then spent about six years in extreme asceticism, starving himself until, the texts say, he could feel his spine through his stomach. This didn’t work either. He accepted a bowl of rice milk from a young woman named Sujata, which his fellow ascetics took as a betrayal, and sat down beneath a fig tree at Bodh Gaya, resolving not to get up until he understood. Some time that night, the story goes, he became awake: *buddha* means “one who has woken up”.

He spent the next 45 years walking the Ganges plain, teaching anyone who would listen: kings, merchants, courtesans, farmers, outcastes. He founded an order of monks and, after some resistance, of nuns. He died at about eighty at Kushinagar, apparently of food poisoning from a meal given by a blacksmith named Cunda. His last words, according to the *Mahaparinibbana Sutta*, were: “All conditioned things are subject to decay. Strive on with diligence.”`,
  ideas: [
    { t: `The Four Noble Truths`, b: `The Buddha’s first sermon, at the Deer Park near Varanasi, is structured like a medical diagnosis.

**One: there is suffering.** The word *dukkha* means more than pain. It covers the stress, dissatisfaction and unease that run through life: getting what you don’t want, not getting what you want, losing what you love, and the quiet background feeling that things are never quite right. The root image is a wheel whose axle doesn’t fit properly, so every turn grinds.

**Two: suffering has a cause.** The cause is *tanha*, literally “thirst”: craving for pleasure, craving to exist and become, and craving not to exist, to get rid of things.

**Three: suffering can end.** When craving stops, suffering stops. This state is *nirvana* (Pali: *nibbana*), which literally means “blowing out”, like a flame, the flame being greed, hatred and delusion.

**Four: there is a path.** The Noble Eightfold Path.` },
    { t: `The Eightfold Path`, b: `The path is grouped into three parts. **Wisdom**: right view (understanding the Four Truths) and right intention (renunciation, goodwill, harmlessness). **Ethical conduct**: right speech, right action and right livelihood (not harming others in how you speak, act or earn a living). **Mental discipline**: right effort, right mindfulness and right concentration.

“Right” (*samma*) also means “complete” or “skilful”. These aren’t steps in order but aspects practised together, like strands of a rope.` },
    { t: `The Middle Way`, b: `Having lived both extremes (palace luxury and near-starvation) the Buddha taught that both were dead ends. Indulgence feeds craving; self-mortification feeds a different kind of craving, for purity and escape. The path lies between. The famous image: a lute string that is too slack makes no sound, and one that is too tight snaps.` },
    { t: `Impermanence`, b: `*Anicca*: everything conditioned (everything that arises from causes) changes and passes away. Bodies, feelings, thoughts, relationships, civilisations. We suffer because we grasp at things as if they were permanent. This isn’t meant as a gloomy fact but a liberating one, when you really see it rather than just believe it.` },
    { t: `No self`, b: `*Anatta* is the most radical teaching. Look for your self, the Buddha said, and you will find only five constantly changing “heaps” (*skandhas*): the body, feelings, perceptions, mental formations (habits, intentions) and consciousness. None of these is a permanent, unchanging owner; none is under your full control; each is in flux. There’s no one extra sitting behind them.

The classic illustration comes from a later text, the *Questions of King Milinda*. The monk Nagasena asks the king whether his chariot is the axle, the wheels, the frame or the reins. None of them. Is it something apart from them? No. “Chariot” is a convenient label for parts arranged a certain way. So too “I”.

This isn’t nihilism. The person exists conventionally; you still have a name and a life. What doesn’t exist is the solid, separate self we keep defending, which is the thing that suffers most.

Hume arrived at a strikingly similar view in 1739, and some neuroscientists find it compatible with how brains construct a sense of self.` },
    { t: `Dependent origination`, b: `Nothing exists on its own; everything arises from conditions. The Buddha put it as a formula: “When this exists, that comes to be; with the arising of this, that arises. When this does not exist, that does not come to be; with the cessation of this, that ceases.” Suffering is not random. It arises from a chain of conditions (ignorance leads to mental formations, which lead to consciousness, and on through craving and clinging to birth and death), and breaking any link breaks the chain.` },
    { t: `The second arrow`, b: `In the *Sallatha Sutta*, the Buddha says that when an ordinary person feels a painful sensation, they worry, grieve, lament and become distraught. So they feel two pains, one physical and one mental, as if shot by an arrow and then by a second arrow. A trained person feels the first arrow and stops there. The first arrow is life. The second one you fire at yourself.` },
    { t: `Karma`, b: `*Karma* means action, specifically intentional action. Actions have consequences, shaping both the world and the actor’s mind. The Buddha put the weight on intention: “It is intention, monks, that I call karma.” It is not cosmic punishment dealt by a god but something closer to cause and effect in character. Traditional Buddhism also ties karma to rebirth; modern secular Buddhists often don’t.` },
    { t: `Don’t take my word for it`, b: `In the *Kalama Sutta*, villagers confused by rival teachers ask how to decide. The Buddha tells them not to accept anything merely because of tradition, scripture, logic, or the authority of a teacher, but to find out for themselves what leads to harm and what leads to well-being, and act accordingly. He compared his teaching to a raft: useful for crossing the river, but you don’t carry the raft on your head once you reach the other side.` },
    { t: `The poisoned arrow`, b: `When a monk demanded answers to metaphysical questions (Is the universe eternal? Does the Buddha exist after death?), the Buddha refused. He compared the monk to a man shot with a poisoned arrow who won’t let the surgeon remove it until he knows who shot it, what caste he was, what the bow was made of. He will die before he finds out. The teaching is practical: here is suffering, here is its end. The rest is distraction.` }
  ],
  works: [
    { t: `The Pali Canon (Tipitaka)`, y: `oral; written c. 1st century BCE`, b: `The oldest complete collection of the Buddha’s teachings, preserved by the Theravada tradition of Sri Lanka and Southeast Asia: “three baskets” of monastic rules, discourses (*suttas*) and later philosophical analysis. It runs to around forty volumes in English. The discourses are the core, and they are repetitive because they were designed to be memorised.` },
    { t: `The Dhammapada`, y: ``, b: `423 verses in 26 chapters, the most widely read Buddhist text. Short, sharp sayings on mind, anger, craving, wisdom and death. An afternoon’s read, a lifetime’s use.` },
    { t: `Key suttas`, y: ``, b: `The *Dhammacakkappavattana Sutta* (first sermon, the Four Truths); the *Anattalakkhana Sutta* (not-self); the *Satipatthana Sutta* (the foundations of mindfulness, source of most modern mindfulness practice); the *Kalama Sutta* (don’t take my word for it); the *Mahaparinibbana Sutta* (his last days); the *Metta Sutta* (loving-kindness).` }
  ],
  quotes: [
    { q: `Mind precedes all mental states. Mind is their chief; they are all mind-wrought. If with an impure mind a person speaks or acts, suffering follows him like the wheel that follows the foot of the ox.`, s: `*Dhammapada* 1 (Buddharakkhita translation)` },
    { q: `Hatred is never appeased by hatred in this world. By non-hatred alone is hatred appeased. This is a law eternal.`, s: `*Dhammapada* 5` },
    { q: `Better than a thousand hollow words is one word that brings peace.`, s: `*Dhammapada* 100` },
    { q: `Though one may conquer a thousand times a thousand men in battle, yet he indeed is the noblest victor who conquers himself.`, s: `*Dhammapada* 103` },
    { q: `Be islands unto yourselves, refuges unto yourselves, seeking no external refuge.`, s: `*Mahaparinibbana Sutta* (Digha Nikaya 16)` },
    { q: `All conditioned things are subject to decay. Strive on with diligence.`, s: `His last words, *Mahaparinibbana Sutta*` },
    { q: `It is intention, monks, that I call karma.`, s: `*Anguttara Nikaya* 6.63` }

  fakes: [
    { q: `Holding on to anger is like grasping a hot coal with the intent of throwing it at someone else; you are the one who gets burned.`, n: `Nowhere in the Pali Canon. It seems to be a modern elaboration of a passage by the fifth-century commentator Buddhaghosa.` },
    { q: `What we think, we become.`, n: `A heavy simplification of *Dhammapada* 1–2, which is about the mind shaping experience and action, not a law of attraction.` },
    { q: `Happiness never decreases by being shared.`, n: `No source in Buddhist texts. The “thousand candles from one candle” saying attached to it is modern.` },

  ],
  critique: `The first objection is that the diagnosis is too dark. Is life really suffering? Plenty of people find it full of joy, and a philosophy that treats all attachment as a problem may miss the goods that come precisely from attachment: love, grief, loyalty, ambition. Nietzsche saw Buddhism as a refined, honest form of “passive nihilism”, a tired civilisation’s wish to stop wanting. Buddhists reply that *dukkha* is closer to “unsatisfactoriness” than misery, and that the goal isn’t to stop caring but to stop grasping.

The second is about no-self. If there is no self, who is responsible for karma? Who is reborn? Who attains nirvana? Buddhist philosophers spent two thousand years on this. Western critics add that the doctrine is used loosely: “there is no self” can become a way to avoid taking responsibility for the particular person you are.

Third, “Buddhism” in the West is often a very selective import: meditation as a productivity tool, “mindfulness” stripped of its ethics and its goal. The historical Buddha taught monks to renounce sex, money and family life, believed in rebirth and many realms of gods and ghosts, and was not offering a stress-management technique. It is fine to take what is useful. It is dishonest to pretend that is all there was.`,
  start: `Read the *Dhammapada* (the translation by Gil Fronsdal, Shambhala, is clear and faithful). Then Walpola Rahula’s *What the Buddha Taught* (1959), a short, lucid overview by a Sri Lankan monk-scholar, still the best introduction. For the life, Karen Armstrong’s *Buddha* is short and careful about what is legend. For the texts themselves, Bhikkhu Bodhi’s anthology *In the Buddha’s Words* is the best way into the Pali Canon.`,
