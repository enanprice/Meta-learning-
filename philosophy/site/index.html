<style>
/* Layout: a quiet reading room. The home page is a name index grouped by era,
   like the back of a library catalogue; each name opens a long single-column essay. */
:root {
  --paper: #f1f2ee;
  --card: #fafaf7;
  --ink: #1c1f24;
  --muted: #5d6470;
  --rule: #d4d7d0;
  --accent: #2b4a6f;
  --accent-soft: #dfe6ee;
  --gilt: #8f631b;
  --done: #3f6b4a;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --reading-size: 1.1rem;
  --measure: 40rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121518; --card: #181c20; --ink: #e5e3dc; --muted: #969ca5;
    --rule: #2a2f35; --accent: #a3bddc; --accent-soft: #1f2a37; --gilt: #d3a852; --done: #86b894;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121518; --card: #181c20; --ink: #e5e3dc; --muted: #969ca5;
  --rule: #2a2f35; --accent: #a3bddc; --accent-soft: #1f2a37; --gilt: #d3a852; --done: #86b894;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  margin: 0;
}
a { color: var(--accent); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { text-wrap: balance; }

.shell { max-width: 72rem; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 700px) { .shell { padding-inline: 32px; } }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px;
  padding-block: 12px; background: var(--paper); border-bottom: 1px solid var(--rule);
}
.brand { font-family: var(--display); font-weight: 600; font-size: 1.35rem; color: var(--ink); text-decoration: none; letter-spacing: 0.01em; }
.topnav { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--ui); font-size: 0.9rem; }
.topnav a, .linkish { color: var(--muted); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.topnav a:hover, .linkish:hover { color: var(--ink); }

main { padding-block: 28px 56px; outline: none; }
.foot { border-top: 1px solid var(--rule); padding-block: 20px 36px; color: var(--muted); font-size: 0.9rem; font-style: italic; }

.label {
  font-family: var(--ui); font-size: 0.78rem; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--gilt);
}

/* Home */
.intro { display: grid; gap: 18px; max-width: 46rem; padding-block: 12px 28px; }
.intro h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.3rem, 6vw, 3.6rem); line-height: 1.02; margin: 0; }
.intro p { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 38rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font-family: var(--ui); font-size: 0.95rem; font-weight: 500; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--paper);
  padding: 8px 16px; border-radius: 3px; text-decoration: none; display: inline-block;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.progress { font-family: var(--ui); font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--done); font-weight: 600; }

.tools { display: grid; gap: 12px; padding-block: 8px 20px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 32px; }
.search { display: flex; gap: 8px; align-items: center; padding-top: 12px; }
.search input {
  flex: 1; min-width: 0; font-family: var(--body); font-size: 1rem; color: var(--ink);
  background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--ui); font-size: 0.85rem; cursor: pointer; background: transparent;
  border: 1px solid var(--rule); color: var(--muted); padding: 3px 11px; border-radius: 999px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }

.era { margin-bottom: 40px; }
.era-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px; }
.era-head h2 { font-family: var(--display); font-weight: 600; font-size: 1.9rem; margin: 0; line-height: 1.1; }
.era-head p { margin: 0; color: var(--muted); font-size: 0.92rem; font-style: italic; }
.index { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; column-gap: 40px; }

.index li { border-bottom: 1px solid var(--rule); min-width: 0; }
.index a { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 10px 0; text-decoration: none; color: var(--ink); }
.index a:hover .nm { color: var(--accent); }
.nm { font-family: var(--display); font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
.nm .tick { color: var(--done); font-family: var(--ui); font-size: 0.8rem; margin-left: 8px; font-weight: 500; letter-spacing: 0.04em; }
.dt { font-family: var(--ui); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; white-space: nowrap; }
.tg { grid-column: 1 / -1; color: var(--muted); font-size: 0.93rem; line-height: 1.45; }
.empty { color: var(--muted); font-style: italic; }

/* Thinker page */
.crumbs { font-family: var(--ui); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.crumbs .sizes { display: flex; gap: 6px; }
.crumbs .sizes button { border: 1px solid var(--rule); background: var(--card); border-radius: 3px; padding: 2px 9px; cursor: pointer; color: var(--muted); font-family: var(--ui); }

.article { max-width: var(--measure); margin: 0 auto; font-size: var(--reading-size); }
.article header { display: grid; gap: 10px; margin-bottom: 26px; }
.article h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.6rem, 8vw, 4.2rem); line-height: 0.98; margin: 0; }
.meta { font-family: var(--ui); font-size: 0.92rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tagline { font-family: var(--display); font-style: italic; font-size: 1.45rem; line-height: 1.3; margin: 0; color: var(--ink); }
.summary { background: var(--accent-soft); padding: 16px 18px; border-radius: 3px; margin: 0 0 20px; }
.summary p { margin: 0; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--ui); font-size: 0.88rem; margin: 0 0 8px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.toc button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.toc .rt { color: var(--muted); margin-left: auto; }

.article section { padding-top: 30px; }
.article h2 { font-family: var(--display); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 14px; }
.article h3 { font-family: var(--display); font-weight: 600; font-size: 1.45rem; line-height: 1.2; margin: 26px 0 6px; }
.article h3 .yr { font-family: var(--ui); font-size: 0.85rem; color: var(--muted); font-weight: 400; margin-left: 8px; letter-spacing: 0.02em; }
.article p { margin: 0 0 1em; }
.article ul { margin: 0 0 1em; padding-left: 1.2em; }
.article li { margin-bottom: 0.4em; }
.article blockquote { margin: 0 0 1em; padding-left: 16px; border-left: 2px solid var(--gilt); font-style: italic; }

.quotes { display: grid; gap: 22px; }
.quote { margin: 0; }
.quote blockquote { margin: 0; border: 0; padding: 0; font-family: var(--display); font-size: 1.4rem; line-height: 1.32; font-style: normal; }
.quote blockquote::before { content: "\201C"; color: var(--gilt); margin-right: 2px; }
.quote blockquote::after { content: "\201D"; color: var(--gilt); margin-left: 1px; }
.quote figcaption { font-family: var(--ui); font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

.fakes { display: grid; gap: 16px; }
.fake { border: 1px dashed var(--rule); padding: 12px 14px; border-radius: 3px; }
.fake q { font-style: italic; display: block; margin-bottom: 4px; text-decoration: line-through; text-decoration-color: var(--gilt); text-decoration-thickness: 1px; }
.fake p { margin: 0; font-size: 0.95em; color: var(--muted); }

.read-toggle { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.read-toggle .btn[aria-pressed="true"] { background: var(--done); border-color: var(--done); }

.related { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 10px; }
.related a { display: block; border: 1px solid var(--rule); background: var(--card); padding: 10px 12px; border-radius: 3px; text-decoration: none; color: var(--ink); min-width: 0; }
.related a:hover { border-color: var(--accent); }
.related .nm { font-size: 1.2rem; display: block; }
.related .dt { font-size: 0.8rem; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--rule); font-family: var(--ui); font-size: 0.92rem; }
.pager a { text-decoration: none; }
.pager .nx { text-align: right; margin-left: auto; }

/* Paths / about */
.page { max-width: var(--measure); margin: 0 auto; font-size: var(--reading-size); }
.page h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.3rem, 6vw, 3.4rem); line-height: 1; margin: 0 0 14px; }
.page h2 { font-family: var(--display); font-weight: 600; font-size: 1.7rem; margin: 34px 0 8px; line-height: 1.15; }
.page p { margin: 0 0 1em; }
.steps { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: s; display: grid; gap: 8px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; gap: 8px; align-items: baseline; }
.steps li::before { content: counter(s); font-family: var(--ui); color: var(--gilt); font-variant-numeric: tabular-nums; font-size: 0.9rem; }

.steps span { color: var(--muted); font-size: 0.95rem; display: block; }

/* Timeline */
.tl-wrap { overflow-x: auto; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 16px; -webkit-overflow-scrolling: touch; }
.tl { position: relative; }
.tl-axis { position: sticky; top: 0; height: 26px; border-bottom: 1px solid var(--rule); background: var(--paper); z-index: 1; }
.tl-tick { position: absolute; top: 4px; font-family: var(--ui); font-size: 0.75rem; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-grid { position: absolute; top: 26px; bottom: 0; width: 1px; background: var(--rule); }
.tl-row { position: absolute; height: 20px; display: flex; align-items: center; text-decoration: none; }
.tl-bar { height: 8px; border-radius: 4px; background: var(--accent); flex: none; }
.tl-bar.approx { background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 9px); }
.tl-row span { font-family: var(--ui); font-size: 0.8rem; color: var(--ink); margin-left: 6px; white-space: nowrap; }
.tl-row:hover span { color: var(--accent); text-decoration: underline; }
.note { color: var(--muted); font-size: 0.92rem; }

@media (prefers-reduced-motion: no-preference) {
  #view { animation: fade 0.25s ease-out; }
  @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }
}

<span class="label">How to use this</span>
<h1>This is still a screen</h1>
<p>Let’s be straight about it. Swapping a feed for a philosophy site is better, but it can turn into the same habit in a nicer jacket: open a page, skim the quotes, feel clever, open another. That isn’t reading. It’s scrolling with a reading list.</p>
<p>Here is how to make it count.</p>
<h2>One person per sitting</h2>
<p>Pick one thinker and read the whole page, top to bottom, before you open anything else. Each page takes 8 to 20 minutes. If you can’t finish one in a sitting, that tells you something about your attention right now, and it is worth knowing.</p>
<h2>Write one sentence afterwards</h2>
<p>Close the page and write down, from memory, the single idea that stuck. Paper, notes app, whatever. If you can’t write it, you skimmed. This one habit is the difference between having read about Epictetus and knowing what Epictetus thought.</p>
<h2>Argue back</h2>
<p>Every page has a section called “The case against”. Read it, then decide who wins. Philosophy is an argument that has been going on for 2,500 years, and you are allowed to join it. If you agree with everyone you read, you aren’t thinking yet.</p>
<h2>Then go to the real book</h2>
<p>These pages are a doorway, not the room. Every page ends with “Where to start”, which names one actual book and usually a specific translation. When someone grabs you, buy or borrow that book. Seneca’s letters, Marcus Aurelius’s <em>Meditations</em>, Frankl’s <em>Man’s Search for Meaning</em> and Camus’s <em>The Stranger</em> are all short, cheap and readable in a week of evenings. A summary of Nietzsche is to Nietzsche what a photo of the sea is to swimming.</p>
<h2>Use the paths</h2>
<p>Thinkers make more sense in conversation with each other. Schopenhauer is answering Kant; Nietzsche is answering Schopenhauer; Camus is answering Kierkegaard and Dostoevsky. The <a href="#paths">reading paths</a> follow those arguments, so each page makes the next one easier.</p>
<h2>About the quotes</h2>
<p>Every quote here comes with its source, and translations vary, so the wording you know may differ slightly. Where a famous line is fake or garbled, it is listed under “Never said it”. The internet is full of invented quotes stuck onto famous names, and knowing which ones are fake is a small, useful immunity.</p>
<h2>A note on accuracy</h2>
<p>This is a large amount of writing and it compresses big, contested bodies of thought into a few thousand words each. Scholars argue about nearly every sentence of it. Treat it as a well-informed friend explaining things over a drink: good for orientation, and not the last word.</p>

  id: 'heraclitus', name: `Heraclitus`, born: -535, died: -475, approx: true, era: 'ancient',
  place: `Ephesus, Ionia (now western Turkey)`, role: `Pre-Socratic philosopher`,
  themes: ['knowledge', 'mind'], keywords: ['flux', 'river', 'logos', 'fire', 'change', 'opposites', 'presocratic'],
  tagline: `Everything flows. The trick is noticing the pattern that doesn’t.`,
  summary: `Heraclitus saw the world as constant change held together by a hidden order he called the *logos*. Opposites (day and night, war and peace, up and down) aren’t enemies but parts of one process. He wrote in riddles on purpose, and most people, he thought, sleepwalk through life without noticing any of it.`,
  life: `We know almost nothing reliable about Heraclitus. He came from an aristocratic family in Ephesus, a rich Greek city on the coast of what is now Turkey, and he was active around 500 BCE. Ancient writers say he gave up a hereditary royal title to his brother, despised the politics of his city, and spent his later life alone in the mountains eating grass. Diogenes Laertius, who wrote a gossipy history of philosophers seven centuries later, says he tried to cure his dropsy by burying himself in cow dung and died of it. Treat all of this as legend.

What survives is about 130 fragments: short, oracular sentences quoted by later writers, some of whom were hostile and some of whom didn’t understand him. He was already known in antiquity as “the Obscure” and “the Riddler”. His book, if it was one book, was said to have been deposited in the temple of Artemis so that only those who could handle it would read it.

He is the first Western thinker whose style is part of his philosophy. He doesn’t argue step by step. He hands you a paradox and waits for it to open.`,
  ideas: [
    { t: `Everything is in flux`, b: `The most famous idea attached to Heraclitus is *panta rhei*, “everything flows”. That exact phrase probably isn’t his, but the thought is. His river fragment says: “On those stepping into the same rivers, other and other waters flow.” The river stays the river precisely because the water keeps changing. Identity isn’t the absence of change; it is a stable pattern of change.

This is a better idea than it first looks. You are not the same collection of cells you were ten years ago, yet you’re still you. A flame looks like a thing but it is a process. Heraclitus picked fire as the basic stuff of the world for exactly this reason: fire is always consuming and always renewing, a thing that exists only by changing.` },

His point is that opposites define each other and pass into each other, and that the tension between them is what keeps things alive. He compares it to a bow or a lyre, whose power comes from strings pulled in opposite directions. A world without strife wouldn’t be peaceful. It would be dead.` },

  critique: `The obvious problem: if everything is always changing, how can we know anything? Plato took this seriously, and it pushed him to posit unchanging Forms behind the world of flux. Heraclitus’s follower Cratylus reportedly went further and decided you can’t step into the same river even once, and in the end refused to speak, only wagging his finger. That is where pure flux leads if you drop the logos.

The second problem is style. Riddles are memorable, but they let a reader find whatever they want in them. Hegel, Nietzsche and Heidegger all claimed Heraclitus as an ancestor, and they disagree with each other. When a thinker can be recruited by everyone, you should ask how much he is actually saying.

And “strife is the father of all” reads worse after the twentieth century than it did in Ephesus. The cosmic point about contrast is fine; the glorification of war it can slide into is not.`,
  start: `Read *Heraclitus: Fragments*, translated by Brooks Haxton (Penguin), which is short and poetic, or the more careful *The Art and Thought of Heraclitus* by Charles Kahn, which gives each fragment with commentary. Kahn is the better book if you want to know what he meant rather than what he sounds like. Either way, it is one sitting’s reading, and a lifetime of rereading.`,

},
{
  id: 'socrates', name: `Socrates`, born: -470, died: -399, era: 'ancient',
  place: `Athens`, role: `Philosopher`,
  themes: ['ethics', 'knowledge', 'death'], keywords: ['socratic method', 'elenchus', 'apology', 'unexamined life', 'hemlock', 'daimonion'],
  tagline: `Wrote nothing, asked everything, and was executed for it.`,
  summary: `Socrates walked around Athens asking people what justice, courage and piety were, and showing them they didn’t know. He claimed wisdom only in knowing his own ignorance. He believed the most important thing in life was the care of your soul, that no one does wrong knowingly, and that it is better to suffer injustice than to commit it. Athens put him to death at seventy, and he refused a chance to escape.`,
  life: `Socrates was born in Athens around 470 BCE, the son of a stonemason and a midwife. He fought as a hoplite in the Peloponnesian War and was known for his toughness: walking barefoot on ice, standing still in thought all night, holding the line during a retreat at Delium. He was famously ugly, with a snub nose and bulging eyes, and poor, and he never charged for teaching, which set him apart from the Sophists, the paid teachers of rhetoric he is often lumped in with.

He wrote nothing. Almost everything we know comes from three sources: the dialogues of his student Plato, the memoirs of the soldier-writer Xenophon, and a comedy by Aristophanes, *The Clouds*, which mocks him as a head-in-the-air fraud. These give three rather different men. The Socrates most people mean is Plato’s, and the hardest problem in the history of philosophy may be working out where Socrates stops and Plato starts. Scholars usually treat Plato’s early dialogues as closest to the historical man.

His mission began, he said, when his friend Chaerephon asked the oracle at Delphi whether anyone was wiser than Socrates, and the oracle said no. Socrates, sure that he knew nothing, set out to prove the oracle wrong by questioning people with a reputation for wisdom: politicians, poets, craftsmen. He found that they thought they knew things they did not. So he concluded that he was wiser only in this: he didn’t think he knew what he didn’t know.

This made him enemies. Young aristocrats loved watching him humiliate important men, and some of them, notably Alcibiades and Critias, later did terrible things to Athens. In 399 BCE, after the city’s defeat by Sparta and a brutal oligarchic coup, Socrates was charged with impiety (not recognising the city’s gods and introducing new ones) and corrupting the young. A jury of 501 citizens convicted him by a narrow margin. Asked to propose his own penalty, he suggested free meals for life as a public benefactor. They sentenced him to death.

His friends arranged an escape. He refused, arguing in Plato’s *Crito* that he had lived his whole life under the laws of Athens and could not now break them to save himself. He drank hemlock in prison, surrounded by friends, talking philosophy to the end. His last words, according to Plato, were: “Crito, we owe a cock to Asclepius. Pay it and don’t forget.” Asclepius was the god of healing, and people have argued ever since about whether this meant death was a cure.`,
  ideas: [
    { t: `The Socratic method`, b: `Socrates’ technique, called the *elenchus*, goes like this. Ask someone to define something they claim to understand: “What is courage?” Accept their answer. Then ask questions that draw out other things they believe. Soon those beliefs contradict the definition. The person must revise it, and the process repeats until they admit they don’t know.

Most early dialogues end without an answer. That’s the point. Socrates isn’t trying to hand you a definition. He is trying to get you to notice that the words you use most confidently (justice, love, good) are the ones you have thought about least. He called himself a midwife: he couldn’t give birth to wisdom himself, but he could help others deliver their ideas and check whether they were healthy or “wind eggs”.` },
    { t: `Knowing that you don’t know`, b: `Socratic ignorance isn’t false modesty or a pose of knowing nothing at all. He is quite confident about some things, for instance that it is wrong to do injustice. What he disclaims is expert knowledge of the most important things. The dangerous person isn’t the one who doesn’t know; it’s the one who doesn’t know and thinks he does. Most of us, most of the time, are that person.` },
    { t: `The unexamined life`, b: `At his trial, Socrates said that the unexamined life is not worth living for a human being. He meant it. He preferred death to giving up philosophy. The claim is not that thinking is a hobby for clever people. It is that a human life lived on autopilot, following habit, appetite and other people’s opinions without ever asking whether they are right, is missing the one thing that makes it human.` },
    { t: `Care of the soul`, b: `Socrates told the jury that he spent his life urging Athenians not to care for their bodies or money before their souls. By “soul” (*psyche*) he meant roughly the self that thinks, chooses and acts: your character. Wealth, reputation and even life are only good if used well, and only a good soul can use them well. So the most important project a person has is making themselves good.` },
    { t: `No one does wrong willingly`, b: `This is the most surprising Socratic idea. If virtue is knowledge, then wrongdoing is a kind of ignorance. Everyone wants what is good for them; people do bad things because they mistakenly think those things are good for them. Nobody knowingly chooses what harms their own soul.

It sounds naive. Surely people do things they know are wrong all the time? Aristotle thought so, and called it *akrasia*, weakness of will. But the Socratic view has teeth: when you “know” smoking is bad and do it anyway, do you really know it, in the way you know a fire will burn you? Or is it knowledge on paper that hasn’t reached the part of you that decides?` },
    { t: `Better to suffer wrong than to do it`, b: `In the *Gorgias*, Socrates argues that doing injustice is worse for you than suffering it, because the wrongdoer damages the most valuable thing he has, his own soul. A good person cannot be truly harmed by others; they can take his money, his freedom, his life, but not his goodness. This idea runs straight into Stoicism, and into Christianity.` },
    { t: `The inner voice`, b: `Socrates claimed that since childhood he had heard a divine sign, his *daimonion*, a voice that never told him what to do but warned him against things he was about to do. On the day of his trial it stayed silent, and he took this as a sign that death was not an evil for him.` }
  ],
  works: [
    { t: `He wrote nothing`, y: ``, b: `Socrates distrusted writing. In Plato’s *Phaedrus* he says that written words are like paintings: they look alive, but if you ask them a question they just say the same thing again. Philosophy for him was live conversation. So “his works” means the works written about him.` },
    { t: `Plato: Apology, Crito and Phaedo`, y: `c. 390s–380s BCE`, b: `The trilogy of his trial, imprisonment and death. The *Apology* is his defence speech (“apology” in the Greek sense of a defence, not a sorry). The *Crito* is his refusal to escape. The *Phaedo* is his last day, a conversation about whether the soul is immortal that ends with one of the great death scenes in literature. Together they take a couple of evenings, and they are the best way to meet him.` },
    { t: `Plato: Euthyphro`, y: `c. 399–395 BCE`, b: `Set just before the trial. Socrates asks a confident young priest what piety is, and gets the famous dilemma: is something good because the gods love it, or do the gods love it because it is good? If the first, goodness is arbitrary; if the second, goodness is independent of the gods. Philosophers of religion are still arguing about it.` },
    { t: `Xenophon: Memorabilia`, y: `c. 371 BCE`, b: `A plainer, more practical Socrates giving advice on friendship, self-control and household management. Less brilliant than Plato’s, possibly more accurate.` },
    { t: `Aristophanes: The Clouds`, y: `423 BCE`, b: `Written while Socrates was alive, this comedy shows him hanging in a basket in the air, running a “Thinkery” that teaches young men to win arguments dishonestly. Socrates mentions it at his trial as the source of prejudice against him. It is funny, unfair, and a reminder of how he looked to ordinary Athenians.` }
  ],
  quotes: [
    { q: `The unexamined life is not worth living for a human being.`, s: `Plato, *Apology* 38a` },
    { q: `I am wiser than this man; it is likely that neither of us knows anything worthwhile, but he thinks he knows something when he does not, whereas when I do not know, neither do I think I know.`, s: `Plato, *Apology* 21d` },
    { q: `Wonder is the feeling of a philosopher, and philosophy begins in wonder.`, s: `Plato, *Theaetetus* 155d` },
    { q: `Is the pious loved by the gods because it is pious, or is it pious because it is loved by the gods?`, s: `Plato, *Euthyphro* 10a` },
    { q: `A good man cannot be harmed either in life or in death.`, s: `Plato, *Apology* 41d` },
    { q: `Now the hour to part has come. I go to die, you go to live. Which of us goes to the better lot is known to no one, except the god.`, s: `Plato, *Apology* 42a` },
    { q: `Crito, we owe a cock to Asclepius. Pay it and do not forget.`, s: `Plato, *Phaedo* 118a, his last words` }
  ],
  fakes: [
    { q: `I know that I know nothing.`, n: `A compressed and slightly wrong version of *Apology* 21d. He says he doesn’t think he knows what he doesn’t know, which is more careful and less paradoxical.` },
    { q: `The secret of change is to focus all of your energy not on fighting the old, but on building the new.`, n: `From Dan Millman’s 1980 novel *Way of the Peaceful Warrior*, spoken by a character nicknamed Socrates.` },
    { q: `Education is the kindling of a flame, not the filling of a vessel.`, n: `A loose paraphrase of a line from Plutarch, who lived five centuries later.` }
  ],
  critique: `Start with the obvious irritation: Socrates is often a bully. In the dialogues he asks leading questions, gets people to agree to things they wouldn’t normally accept, then pounces. Several of his arguments, read closely, are bad. Nietzsche despised him as the man who taught the Greeks to distrust instinct and worship cold reason, a symptom of decline dressed up as wisdom.

Then there is the politics. Socrates was contemptuous of democracy: why let the ignorant majority decide, when you wouldn’t let them steer a ship? Some of his closest associates helped overthrow the democracy and ran a murderous junta. I. F. Stone’s *The Trial of Socrates* (1988) argues the Athenians had real reasons to fear him. You don’t have to agree to see that his trial wasn’t simply a mob killing a saint.

Philosophically, “no one does wrong willingly” clashes with experience. Most of us have done something while fully aware it was wrong. Aristotle thought Socrates simply denied the plain facts. And the method itself has a limit: it is superb at showing people they are confused and poor at telling anyone what to do instead.`,
  start: `Read Plato’s *Apology*, *Crito* and the death scene at the end of the *Phaedo*. The Penguin volume *The Last Days of Socrates* (translated by Hugh Tredennick and Harold Tarrant) puts them together, alongside the *Euthyphro*. It is under 200 pages. Then read the *Gorgias* for Socrates at his most combative, arguing that a tyrant is the most miserable man alive.`,

{
  id: 'plato', name: `Plato`, born: -428, died: -348, approx: true, era: 'ancient',
  place: `Athens`, role: `Philosopher`,
  themes: ['knowledge', 'ethics', 'politics', 'love', 'death'], keywords: ['forms', 'cave', 'republic', 'symposium', 'academy', 'philosopher king', 'soul', 'idealism'],
  tagline: `The world you see is a shadow of a truer one, and most of us are staring at the wall.`,
  summary: `Plato turned Socrates’ questions into a whole philosophy. Behind the changing world of the senses lies a realm of perfect, unchanging Forms (Justice itself, Beauty itself, the Good), which only reason can grasp. The soul has three parts that must be ordered by reason. Love, rightly followed, climbs from bodies to Beauty itself. And a just city would be ruled by those who have seen the Good. Western philosophy, one historian said, is a series of footnotes to him.`,
  life: `Plato was born around 428 BCE into one of the richest and best-connected families in Athens. His relatives included Critias and Charmides, two leaders of the Thirty Tyrants who briefly seized power in 404. As a young man he expected to go into politics. Two things stopped him: the brutality of the Thirty, and then the restored democracy’s execution of Socrates, whom he had followed as a young man. He concluded, he wrote in his *Seventh Letter*, that cities would never be well governed until philosophers ruled or rulers became philosophers.

After Socrates’ death he left Athens and travelled, probably to Egypt and certainly to southern Italy and Sicily, where he met Pythagoreans, whose mathematical mysticism shaped his thought. Around 387 BCE he founded the Academy, in a grove outside Athens: a school for mathematics, astronomy and philosophy that lasted in some form for centuries. Our word “academic” comes from it. Aristotle studied there for twenty years.

Plato tried once to put his politics into practice. He went to Syracuse in Sicily, twice, to educate the young tyrant Dionysius II into a philosopher-king. It went badly. According to a later story he was even sold into slavery on one trip and ransomed. He died around 348 BCE in Athens, reportedly while at a wedding feast, or in his sleep, depending on who you believe.

Unlike almost every other ancient philosopher, all of Plato’s known works survive: around 35 dialogues and some letters of disputed authenticity. He never speaks in his own voice in any of them. Socrates is usually the main character, which means that in the later dialogues Plato is putting his own theories into his dead teacher’s mouth.`,
  ideas: [
    { t: `The Forms`, b: `Think about a circle. Every circle you have ever drawn is imperfect: slightly lumpy, with a line of some thickness. Yet you know exactly what a perfect circle is, and you judge your drawings against it. Where does that standard come from? Not from experience, since you’ve never seen one.

Plato’s answer is that there really is a perfect Circle, not in space or time, but in a realm of unchanging, eternal realities he called Forms (or Ideas, *eidē*). The same goes for Beauty, Justice, Equality and Goodness. Beautiful things in the world are beautiful because they “participate in” or imitate Beauty itself. They come and go; it doesn’t. The senses give us only opinion about the shifting world; reason gives us knowledge of the Forms.

This was his answer to Heraclitus (the visible world does flow) and to the relativists of his time (there are real, objective standards of justice and beauty, even if people disagree about them).` },
    { t: `The Allegory of the Cave`, b: `The most famous image in philosophy, from Book VII of the *Republic*. Imagine prisoners chained since birth in a cave, facing a wall. Behind them is a fire, and between the fire and their backs people carry objects whose shadows fall on the wall. The prisoners have only ever seen shadows, so they take them to be reality, and give prizes to whoever is best at predicting which shadow comes next.

One prisoner is freed. Turning to the fire hurts his eyes. Dragged up out of the cave into sunlight, he is blinded at first, then slowly sees reflections, then real things, and finally the sun itself, the source of light and life. He pities his old companions. But if he went back down, his eyes would be useless in the dark; he would stumble, and the prisoners would laugh at him and say the journey had ruined his sight. If he tried to free them, they would kill him. (Plato is thinking of Socrates.)

The cave is the world of the senses and of popular opinion. The sun is the Form of the Good. Education isn’t pouring knowledge into empty heads; it is turning the whole soul around, away from shadows. It is not hard to see why this image has new force in an age of screens.` },
    { t: `The Form of the Good`, b: `At the top of the Forms is the Good, which Plato compares to the sun: as the sun makes things visible and makes them grow, the Good makes the Forms knowable and gives them their being. It is the final object of all knowledge and all desire. Plato is notoriously cagey about what exactly it is; Socrates in the *Republic* says he can only offer its “offspring”, an image.` },
    { t: `The three-part soul`, b: `In the *Republic*, Plato divides the soul into three. **Reason** calculates and loves truth. **Spirit** (*thumos*) is the seat of anger, pride, honour and indignation. **Appetite** wants food, drink, sex and money. In the *Phaedrus* he pictures it as a charioteer (reason) driving two horses: a noble one (spirit) and an unruly one (appetite).

Justice in a person is each part doing its own job: reason ruling, spirit backing reason up, appetite obeying. Injustice is civil war in the soul, with appetite or anger in charge. A tyrant, on this view, is the most enslaved man in the city, because he is ruled by his worst desires. This model of inner conflict runs directly to Freud’s id, ego and superego.` },
    { t: `The just city and the philosopher-king`, b: `The *Republic* asks why anyone should be just, and to answer it builds an ideal city as the soul written large. It has three classes that mirror the soul: rulers (reason), soldiers or auxiliaries (spirit), and producers (appetite). Rulers are philosophers, trained for decades in mathematics and dialectic until they can see the Good. They own no private property and, in the guardian class, have no private families: children are raised in common so the rulers have no interest but the city’s.

Plato also banishes most poets, because they imitate imitations and stir up the passions, and has the rulers tell a “noble lie” that people are born with gold, silver or bronze in their souls, to keep everyone content with their class. Read it and you will find ideas that are startlingly progressive (women can be guardians, on equal terms with men) sitting next to ideas that are frankly authoritarian.` },
    { t: `Knowledge as recollection`, b: `In the *Meno*, Socrates takes a slave boy with no education and, only by asking questions, gets him to work out how to double the area of a square. Where did that knowledge come from? Plato’s answer: the soul existed before birth, saw the Forms, and forgot them. Learning is remembering. It is an early version of a question that never went away: how do we know things (mathematics, logic) that experience can’t teach us?` },
    { t: `Love as a ladder`, b: `In the *Symposium*, a dinner party of speeches in praise of love, Socrates reports what a wise woman, Diotima, taught him. Love (*eros*) is desire for what we lack, specifically desire to possess the beautiful forever. It starts with attraction to one beautiful body, then all beautiful bodies, then beautiful souls, then beautiful laws and customs, then beautiful knowledge, and finally Beauty itself, “pure, clean, unmixed”. That is where “Platonic love” comes from, though it originally meant this ascent, not a sexless friendship.` },
    { t: `The soul is immortal`, b: `The *Phaedo* offers several arguments that the soul survives death: opposites come from opposites (life from death), learning is recollection so the soul pre-existed, the soul is like the Forms and so indestructible. Few philosophers now find them convincing. But the dialogue also gives Plato’s famous line that philosophy is practice for dying: the philosopher trains to separate the soul from the body’s distractions, so death holds no terror.` }
  ],
  works: [
    { t: `The Republic`, y: `c. 375 BCE`, b: `His masterpiece, ten books long. It starts with a simple question (what is justice, and is the just person happier than the unjust one?) and ends up covering psychology, education, politics, the arts, the theory of Forms, and the afterlife. Book I is a classic Socratic takedown; Book II has the Ring of Gyges (would you be just if you could turn invisible?); Books VI and VII have the Sun, the Divided Line and the Cave; Book X ends with the Myth of Er, a vision of souls choosing their next lives.` },
    { t: `The Symposium`, y: `c. 385–370 BCE`, b: `The most enjoyable Plato. Athenian men at a drinking party each give a speech about love. Aristophanes tells the myth that humans were once double creatures, split in two by Zeus, which is why we search for our other half. Socrates gives Diotima’s ladder. Then a drunk Alcibiades crashes in and gives a raw, funny, painful speech about his unrequited love for Socrates. It is philosophy as theatre.` },
    { t: `The Phaedrus`, y: `c. 370 BCE`, b: `A walk outside the city walls about love, madness and rhetoric. It contains the chariot image of the soul and Socrates’ critique of writing, which is ironic given it’s a written dialogue.` },
    { t: `The Meno`, y: `c. 385 BCE`, b: `Can virtue be taught? Short, clear, and the home of the slave-boy geometry lesson and the theory of recollection. A good second Plato after the trial dialogues.` },
    { t: `The Gorgias`, y: `c. 380 BCE`, b: `Socrates against Callicles, an early advocate of “might makes right” who argues that conventional morality is a trick the weak play on the strong. It anticipates Nietzsche by two thousand years, and Socrates doesn’t win as cleanly as Plato may have hoped.` },
    { t: `Timaeus and Laws`, y: `c. 360–348 BCE`, b: `*Timaeus* is a strange, influential creation story in which a divine craftsman shapes the world from geometry; it was the only Plato most of medieval Europe could read. *Laws*, his longest and last work, is a darker, more practical design for a real city, with fewer philosophers and more rules.` }
  ],
  quotes: [
    { q: `The beginning is the most important part of the work.`, s: `*Republic*, Book II, 377a` },
    { q: `Until philosophers rule as kings, or those now called kings and leaders genuinely and adequately philosophise, cities will have no rest from evils.`, s: `*Republic*, Book V, 473c–d` },
    { q: `Education is not what some people proclaim it to be, putting knowledge into souls that lack it, like putting sight into blind eyes.`, s: `*Republic*, Book VII, 518b–c` },
    { q: `Those who practise philosophy in the right way are in training for dying.`, s: `*Phaedo* 67e` },
    { q: `Love is the name for our pursuit of wholeness, for our desire to be complete.`, s: `*Symposium* 192e, from Aristophanes’ speech` }
  ],
  fakes: [
    { q: `Every heart sings a song, incomplete, until another heart whispers back.`, n: `Nowhere in Plato. It appears on countless wedding cards with his name on it.` },
    { q: `Be kind, for everyone you meet is fighting a hard battle.`, n: `Usually traced to the Scottish minister John Watson (pen name Ian Maclaren), around 1897.` },
    { q: `Only the dead have seen the end of war.`, n: `George Santayana, *Soliloquies in England* (1922). It was misattributed to Plato in, among other places, the film *Black Hawk Down*.` },

  ],
  critique: `Aristotle, his best student, raised the classic objection. If a man is a man because he resembles the Form of Man, what makes the Form and the man resemble each other? You need a third thing, and then a fourth, forever (the “Third Man” argument). Plato raised versions of this himself in the *Parmenides*, which suggests he knew the theory had problems. More simply: where exactly are these Forms, and how does a physical brain get in touch with a non-physical realm?

The politics is the bigger problem for most modern readers. Karl Popper, in *The Open Society and Its Enemies* (1945), called Plato the first great enemy of freedom: a philosopher who wanted a closed, censored, caste-based society run by a self-appointed elite who lie to the people for their own good. Defenders reply that the *Republic* is a thought experiment about the soul, not a policy paper. But Plato did try to shape a real tyrant in Syracuse, and the *Laws* is plainly meant to be practical.

Nietzsche’s objection goes deepest: Plato taught Europe to despise this world, the body and the senses, in favour of an invented “true world” behind it. Christianity, Nietzsche said, is “Platonism for the people”.`,
  start: `Begin with Socrates’ trial and death (*Apology*, *Crito*, *Phaedo*), then the *Symposium*, then the *Republic*. For the *Republic*, G. M. A. Grube’s translation revised by C. D. C. Reeve (Hackett) is clear; Reeve’s own freer version (also Hackett) is the most readable. Don’t try to read all of Plato in order. Read the dialogues that grab you and let the rest wait.`,
