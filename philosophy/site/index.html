{
  id: 'schopenhauer', name: `Arthur Schopenhauer`, born: 1788, died: 1860, era: 'c19',
  place: `Danzig; Frankfurt`, role: `Philosopher`,
  themes: ['suffering', 'meaning', 'ethics', 'mind', 'love'], keywords: ['will', 'pessimism', 'world as will and representation', 'pendulum', 'boredom', 'compassion', 'music', 'hedgehog', 'asceticism', 'buddhism'],
  tagline: `Life swings like a pendulum between pain and boredom.`,
  summary: `Schopenhauer took Kant’s hidden “thing-in-itself” and gave it a name: Will, a blind, endless striving that drives everything, including us. Because we are driven by a will that can never be satisfied, life is mostly suffering: we want, we get, we’re bored, we want again. The only escapes are art (especially music), compassion for others, and finally the denial of the will itself. He was the first major Western philosopher to take Indian thought seriously, and the great pessimist.`,
  life: `Arthur Schopenhauer was born in 1788 in Danzig (now Gdańsk, Poland), to a wealthy merchant family. His father wanted him to be a merchant and bribed him away from school with a grand tour of Europe, on which the teenage Arthur saw galley slaves in Toulon and the poverty of London, and was deeply affected by human misery.

In 1805 his father died, probably by suicide, falling from a warehouse window. Arthur continued his hated commercial apprenticeship for two years out of loyalty, then quit to study. His mother, Johanna, moved to Weimar and became a successful novelist and salon hostess, friends with Goethe. Mother and son quarrelled fiercely. When he published his doctoral thesis, *On the Fourfold Root of the Principle of Sufficient Reason*, she remarked that it sounded like something for pharmacists. He replied that it would be read when her books were forgotten. She threw him out, and they never met again for the last 24 years of her life. (He was right, as it happened.)

He published his masterpiece, *The World as Will and Representation*, in 1818, at thirty. It was largely ignored. He became a lecturer at Berlin and, contemptuous of Hegel, scheduled his lectures at the same hour. Almost nobody came, and he gave up.

He lived off his inheritance, settling in Frankfurt in 1833 with a series of poodles, all named Atma (Sanskrit for the world-soul). He followed a fixed routine: writing in the morning, playing the flute before lunch, dinner at the Englischer Hof, a walk, reading the *Times*. He kept a statue of the Buddha in his study. He was notoriously irritable; in 1821 he pushed a seamstress named Caroline Marquet down a staircase for chatting outside his door, and a court ordered him to pay her a pension for twenty years. When she died, he wrote in his account book: *Obit anus, abit onus* (“The old woman dies, the burden departs”).

Fame came, finally, in his sixties, with a popular collection of essays and aphorisms, *Parerga and Paralipomena* (1851). Richard Wagner sent him a copy of the *Ring* libretto. He died peacefully in 1860, aged 72. His ideas went on to shape Nietzsche, Wagner, Tolstoy, Freud, Thomas Mann, Wittgenstein and Borges.`,
  ideas: [
    { t: `The world as representation`, b: `The first sentence of his masterpiece: “The world is my representation.” Following Kant, Schopenhauer holds that everything we perceive is an appearance, shaped by our minds through space, time and causation. The world you see is, in a real sense, your picture of it.` },
    { t: `The world as will`, b: `But we have one route to the thing-in-itself that Kant missed: our own bodies. From outside, I see my body as an object among others. From inside, I experience it as will: striving, desire, urge. When I raise my arm, I don’t just see an object move; I *will* it.

Schopenhauer’s great leap is to say that this is what everything is, underneath. The whole of reality, in itself, is Will: a single, blind, aimless striving that shows up as gravity in a falling stone, growth in a plant, instinct in an animal, and desire in a human being. It has no purpose and no end. It just wants.` },
    { t: `Life is suffering`, b: `If our essence is a will that can never be satisfied, then suffering is built in. To want is to lack, and lack is pain. When we get what we want, the satisfaction is brief, and then either a new desire arises (more pain) or none does, and we are bored. “Life swings like a pendulum backwards and forwards between pain and boredom.”

Happiness, on this view, is only ever negative: the temporary absence of pain. Pain is what is real and felt; its absence we barely notice. Compare the pleasure of an animal eating another with the pain of the animal being eaten.` },
    { t: `Escape through art`, b: `There are moments when we are released from the will. In aesthetic contemplation, when we lose ourselves in a painting, a landscape, a poem, we stop seeing things as objects of desire and become, for a moment, a “pure, will-less subject of knowing”. The wheel of Ixion stops turning.

Music is the highest art, because it doesn’t represent things at all. It is a direct copy of the will itself, which is why it moves us so profoundly and why it seems to express the essence of feelings without their particular causes. Wagner and generations of composers loved him for this.` },
    { t: `Compassion is the basis of morality`, b: `Since the same Will underlies all beings, the separation between me and you is ultimately an illusion (the *principium individuationis*, or, in the Hindu term he borrowed, the veil of Maya). The good person sees through it, and feels another’s suffering as their own. So compassion (*Mitleid*) is the true basis of morality, not Kant’s rational duty. Schopenhauer also extended compassion to animals, and was a fierce critic of animal cruelty and vivisection.` },
    { t: `Denial of the will`, b: `The final escape is to turn against the will itself: to renounce desire through asceticism, chastity and voluntary poverty, as saints and holy people in every tradition have done. What remains, for those who achieve it, is something that looks like nothing to us, but to them is peace. Schopenhauer saw this in the Upanishads, in Buddhism and in Christian mystics. He did not, himself, live like this.` },
    { t: `Love is the will of the species`, b: `In a notorious chapter, “The Metaphysics of Sexual Love”, Schopenhauer argues that romantic love is the will to live of the species, disguised as individual passion. What draws two people together, and makes them feel their love is unique and fated, is the unconscious drive to produce the next generation. Freud acknowledged the debt.` },
    { t: `The hedgehogs`, b: `A parable from *Parerga*: on a cold winter’s day, a group of hedgehogs huddle together for warmth, but their quills prick each other, so they move apart. Then the cold drives them together again. After much shuffling they find a moderate distance, where they can bear each other. So too with people: need drives them together, their many unpleasant qualities push them apart, and the distance they finally find is politeness and good manners.` }
  ],
  works: [
    { t: `The World as Will and Representation`, y: `1818; expanded 1844`, b: `Four books in the first volume: the world as representation (epistemology), as will (metaphysics), art, and ethics. The second volume, added 26 years later, has fifty chapters of supplements, including the chapters on love and death. Unlike Hegel, Schopenhauer writes lucidly, even beautifully. Book IV is the one that changes people.` },
    { t: `Parerga and Paralipomena`, y: `1851`, b: `“Appendices and Omissions”: essays and aphorisms on everything from noise to women (a notoriously misogynist essay), reading, suicide, ghosts and the wisdom of life. The section *Aphorisms on the Wisdom of Life* is practical and often funny. It made him famous.` },
    { t: `On the Basis of Morality`, y: `1840`, b: `His attack on Kant’s ethics and defence of compassion.` }
  ],
  quotes: [
    { q: `The world is my representation.`, s: `*The World as Will and Representation* I, §1` },
    { q: `Life swings like a pendulum backwards and forwards between pain and boredom.`, s: `*The World as Will and Representation* I, §57` },
    { q: `Talent hits a target no one else can hit; genius hits a target no one else can see.`, s: `*The World as Will and Representation* II, chapter 31` },
    { q: `A man can do what he wills, but he cannot will what he wills.`, s: `*On the Freedom of the Will* (1839), paraphrased; Einstein quoted it often` },
    { q: `Compassion is the basis of all morality.`, s: `*On the Basis of Morality*, §16 (paraphrased)` },
    { q: `Every man takes the limits of his own field of vision for the limits of the world.`, s: `*Parerga and Paralipomena* II, “Psychological Remarks”` },
    { q: `When we read, someone else thinks for us: we merely repeat his mental process.`, s: `*Parerga and Paralipomena* II, “On Reading and Books”` }
  ],
  fakes: [
    { q: `All truth passes through three stages. First, it is ridiculed. Second, it is violently opposed. Third, it is accepted as being self-evident.`, n: `Not found in Schopenhauer. The closest he comes is a line about truth having a brief victory between being condemned as paradoxical and dismissed as trivial. The three-stage version appears in the twentieth century.` }
  ],
  critique: `Schopenhauer’s pessimism rests on a picture of desire (want, get, bored) that is too simple. Many of the best things in life are activities, not satisfactions of lack: playing music, doing good work, being with friends. Aristotle would say they are pleasant in the doing. Nietzsche, who started as a devoted Schopenhauerian, broke with him on exactly this: the will isn’t something to deny but something to affirm. Schopenhauer, he thought, had described the symptoms of a sick, tired life and called them the essence of all life.

He also didn’t practise what he preached. He preached asceticism and lived comfortably on inherited money, ate large dinners, and had affairs. He praised compassion and pushed a woman down the stairs. His essay “On Women” is misogynist even by the standards of his time. Admirers say a philosopher should be judged by his ideas, not his character. Fair enough, but it is worth noticing when someone’s philosophy recommends a life he found impossible.

The metaphysics also has a gap. If the thing-in-itself is unknowable, as Kant said, how can Schopenhauer know it is Will? His answer (we experience it from inside) only gives him access to his own will, not to the essence of stones.`,
  start: `Start with his *Essays and Aphorisms* (Penguin, selected and translated by R. J. Hollingdale), which gives the best of *Parerga*. Then read Book IV of *The World as Will and Representation* (Judith Norman, Alistair Welchman and Christopher Janaway, Cambridge). Christopher Janaway’s *Schopenhauer: A Very Short Introduction* is a lucid guide. Bryan Magee’s *The Philosophy of Schopenhauer* is excellent.`,
  related: ['kant', 'buddha', 'nietzsche', 'freud', 'tolstoy', 'wittgenstein']
},
{
  id: 'kierkegaard', name: `Søren Kierkegaard`, born: 1813, died: 1855, era: 'c19',
  place: `Copenhagen`, role: `Philosopher and theologian`,
  themes: ['god', 'meaning', 'mind', 'suffering', 'love'], keywords: ['existentialism', 'anxiety', 'despair', 'leap of faith', 'either or', 'fear and trembling', 'abraham', 'knight of faith', 'stages', 'aesthetic', 'ethical', 'religious', 'regine', 'the crowd', 'the present age'],
  tagline: `Life can only be understood backwards, but it must be lived forwards.`,
  summary: `Kierkegaard is usually called the father of existentialism. Against Hegel’s grand system, he insisted that what matters is the single individual, facing real choices with no system to guarantee the answer. He described anxiety as “the dizziness of freedom”, despair as the failure to become yourself, and faith as a passionate leap beyond reason. He wrote under a crowd of pseudonyms, and he warned, in 1846, that the press and “the public” were turning everyone into spectators with opinions and no commitments.`,
  life: `Søren Aabye Kierkegaard was born in Copenhagen in 1813, the youngest of seven children of a wealthy, deeply religious, melancholy wool merchant, Michael Pedersen Kierkegaard. His father had cursed God as a poor shepherd boy on the Jutland heath and believed his family was under a curse because of it. Five of his seven children died before he did. Søren grew up convinced he would not live past 34, the age at which Christ died.

He studied theology at the University of Copenhagen for ten years, spending much of that time drinking, going to the theatre and running up debts. In 1838 his father died, and Søren reconciled with him and with his faith.

In 1840 he became engaged to Regine Olsen, eighteen, whom he loved intensely. Almost immediately he felt he had made a terrible mistake. He believed his melancholy, his sense of vocation, and something he never fully explained made him unfit for marriage. He broke the engagement, and, to make it easier for her to let him go, he behaved like a cad, pretending not to care. She begged him to stay. He left for Berlin. He never married, and Regine haunted his writing for the rest of his life. When she married someone else, he was devastated. He left her everything in his will.

The next decade was one of astonishing productivity. He published book after book, many under pseudonyms (Johannes Climacus, Victor Eremita, Johannes de Silentio, Vigilius Haufniensis, Anti-Climacus), each representing a different point of view on life. He lived on his inheritance, walked the streets of Copenhagen talking to everyone, and wrote at a standing desk.

In 1846 he picked a fight with *The Corsair*, a satirical paper, which retaliated by mocking him relentlessly in cartoons: his thin legs, uneven trousers, his hunched back. Children jeered at him in the street. It shaped his views of “the public” and the press.

His last years were spent in a furious public attack on the Danish Lutheran church, which he accused of turning Christianity into a comfortable social convention. In October 1855 he collapsed in the street and died in hospital a few weeks later, aged 42, having spent almost all his money. He refused communion from a priest of the state church.`,
  ideas: [
    { t: `The single individual`, b: `Hegel had built a system in which everything, including each person, found its place in the grand development of Spirit. Kierkegaard thought this left out the one thing that matters most: what it is like to be *this* particular human being, who has to make choices, who will die, and for whom no system can make those choices.

“The thing is to find a truth which is true for me, to find the idea for which I can live and die.” He wrote that in his journal at 22. Truth, in matters of how to live, is subjectivity: not that anything goes, but that the truths that matter have to be lived and appropriated, not merely known.` },
    { t: `The three stages`, b: `Kierkegaard described three ways of living, or “spheres of existence”.

**The aesthetic.** Living for pleasure, interest, novelty, beauty and avoiding boredom. The aesthete can be crude (a seducer, a hedonist) or highly refined (an ironic intellectual who samples experiences and commits to none). The aesthete’s life is a series of moments with no thread. Its secret is despair, and its enemy is boredom: Kierkegaard’s aesthete recommends “crop rotation”, constantly changing the way you enjoy things to keep from being bored.

**The ethical.** Committing yourself: to marriage, work, duty, community. The ethical person chooses themselves and takes responsibility for their life, building a continuous self over time.

**The religious.** A relationship with God that goes beyond, and can even conflict with, ethics. It requires faith, a leap beyond reason.

You can’t argue someone from one stage to the next. Each requires a choice, a leap.` },
    { t: `Either/Or`, b: `His first major book is built as a choice. Volume I contains the papers of “A”, a young aesthete: brilliant essays on Mozart’s *Don Giovanni*, boredom, tragedy, and the notorious “Seducer’s Diary”. Volume II contains long letters from “B”, Judge William, a married civil servant, urging A to choose the ethical life. Kierkegaard doesn’t tell you who wins. You have to decide.` },
    { t: `Anxiety: the dizziness of freedom`, b: `In *The Concept of Anxiety*, Kierkegaard distinguishes anxiety from fear. Fear has an object: a dog, an exam. Anxiety has no object; it is the feeling of facing possibility itself. He compares it to standing at the edge of a cliff: you are afraid of falling, but you also feel the strange pull of the possibility that you might jump. “Anxiety is the dizziness of freedom.”

Anxiety isn’t just a disorder to be treated. It is a sign of our freedom and our spiritual nature. Animals don’t feel it. And learning to be anxious in the right way, he says, is the ultimate thing to learn.` },
    { t: `Despair: failing to be yourself`, b: `*The Sickness unto Death* defines despair not as a feeling but as a condition: the failure to be the self you are. You can despair by not being willing to be yourself (hiding in the crowd, trying to be someone else) or by being willing to be yourself on your own terms, defiantly, without reference to God.

The most common form is not knowing you are in despair at all: being absorbed in everyday concerns, work, status, never having become a self. “The greatest hazard of all, losing one’s self, can occur very quietly in the world, as if it were nothing at all. No other loss can occur so quietly; any other loss, an arm, a leg, five dollars, a wife, is sure to be noticed.”` },
    { t: `Abraham and the leap of faith`, b: `*Fear and Trembling* is about the story in Genesis in which God commands Abraham to sacrifice his son Isaac. Abraham rises early, saddles his donkey and goes, prepared to kill his son, and is stopped only at the last moment.

Most preachers tell this as a nice story about faith. Kierkegaard’s pseudonym, Johannes de Silentio, says it is terrifying. Ethically, Abraham is a murderer. If faith is what Abraham had, then faith involves a “teleological suspension of the ethical”: a relationship to God that places the individual above the universal moral law. It can’t be explained, justified or communicated. Abraham can’t tell anyone. The “knight of faith” gives everything up and believes, by virtue of the absurd, that he will get it back.

Johannes says he can understand Abraham’s greatness but cannot make the movement of faith himself. It is one of the most disturbing and brilliant books in philosophy.` },
    { t: `The crowd is untruth`, b: `Kierkegaard hated “the public”, “the crowd”. In a crowd, no one is responsible; everyone hides behind everyone else. In *The Present Age* (1846) he described a society that had replaced passion and action with reflection and chatter. People are informed about everything and committed to nothing. The press creates “the public”, an abstract phantom that is no one in particular and yet dominates everyone. Everyone becomes a spectator, a commentator, an opinion.

He saw this in 1846 Copenhagen, with its newspapers and coffee houses. It is hard to read now without thinking of comment sections.` },
    { t: `Understanding backwards`, b: `His most quoted journal entry (1843): “It is perfectly true, as the philosophers say, that life must be understood backwards. But they forget the other proposition, that it must be lived forwards. And if one thinks over that proposition it becomes more and more evident that life can never really be understood in time simply because at no particular moment can I find the necessary resting-place from which to understand it.”` }
  ],
  works: [
    { t: `Either/Or`, y: `1843`, b: `Two volumes; the aesthetic vs the ethical. Start with “Diapsalmata” (short aphorisms) and “Rotation of Crops” in Volume I.` },
    { t: `Fear and Trembling`, y: `1843`, b: `About 120 pages on Abraham and faith. The most readable of his major works, and the most unsettling.` },
    { t: `The Concept of Anxiety`, y: `1844`, b: `Anxiety, freedom and sin. Difficult but foundational for existentialism and psychology.` },
    { t: `Concluding Unscientific Postscript`, y: `1846`, b: `A long, funny attack on Hegel and the idea that truth can be systematic. Truth is subjectivity.` },
    { t: `The Sickness unto Death`, y: `1849`, b: `Despair and the self. Starts with a famously convoluted definition of the self (“a relation that relates itself to itself”) and gets clearer.` },
    { t: `The Present Age`, y: `1846`, b: `A short section of a book review. Worth reading in its own right as a prophecy of media culture.` },
    { t: `Works of Love`, y: `1847`, b: `Signed in his own name. A long meditation on what it means to love your neighbour.` },
    { t: `The Journals`, y: ``, b: `Thousands of pages of private writing: where he is most honest and most human.` }
  ],
  quotes: [
    { q: `Life can only be understood backwards; but it must be lived forwards.`, s: `*Journals*, 1843 (JJ:167)` },
    { q: `Anxiety is the dizziness of freedom.`, s: `*The Concept of Anxiety*, chapter 2` },
    { q: `The thing is to find a truth which is true for me, to find the idea for which I can live and die.`, s: `*Journals*, Gilleleje, 1 August 1835` },
    { q: `The greatest hazard of all, losing one’s self, can occur very quietly in the world, as if it were nothing at all.`, s: `*The Sickness unto Death*, Part One` },
    { q: `The crowd is untruth.`, s: `“The Single Individual”, in *The Point of View* (1848–59)` },
    { q: `Marry, and you will regret it; don’t marry, you will also regret it; marry or don’t marry, you will regret it either way.`, s: `*Either/Or* I, “Diapsalmata”` },
    { q: `People demand freedom of speech as a compensation for the freedom of thought which they seldom use.`, s: `*Either/Or* I, “Diapsalmata”` },
    { q: `Boredom is the root of all evil.`, s: `*Either/Or* I, “Rotation of Crops”, spoken by the aesthete` }
  ],
  fakes: [
    { q: `Once you label me, you negate me.`, n: `No source in Kierkegaard. It is often attributed to him online.` },
    { q: `Leap of faith.`, n: `He never used exactly this phrase, though he wrote constantly of “the leap” and of faith. The combined phrase comes from later commentary.` }
  ],
  critique: `The central problem is in *Fear and Trembling* itself. If faith can require suspending ethics, how do you tell the knight of faith from a madman who hears voices telling him to kill his child? Kierkegaard admits there is no external test. That is honest, and it is also frightening. Every religious fanatic believes he has a special relationship to God that places him above ordinary morality.

His individualism has limits too. Martin Buber and others argued that Kierkegaard’s single individual, alone before God, neglects the fact that we become selves in relationship to other people. His treatment of Regine, idealised, abandoned and turned into literature, can look like a case study in this.

The pseudonyms make it hard to pin down what Kierkegaard himself thought, and that can be frustrating as well as liberating. And his contempt for “the crowd” and for ordinary, comfortable Christians can shade into spiritual snobbery.

Finally, for non-believers, the religious stage, which Kierkegaard saw as the goal, may be exactly where they get off. Many existentialists (Sartre, Camus) kept his analysis of anxiety, choice and the individual and dropped his God.`,
  start: `Start with *Fear and Trembling* (Penguin, trans. Alastair Hannay). Then the “Diapsalmata” from *Either/Or*, which are short aphorisms and very funny. Then *The Present Age* if you want his critique of media. The *Essential Kierkegaard* (Princeton, ed. Hong & Hong) is a good reader. Clare Carlisle’s *Philosopher of the Heart: The Restless Life of Søren Kierkegaard* (2019) is a wonderful biography.`,
  related: ['hegel', 'nietzsche', 'dostoevsky', 'sartre', 'camus', 'heidegger']
},
{
  id: 'mill', name: `John Stuart Mill`, born: 1806, died: 1873, era: 'c19',
  place: `London; Avignon`, role: `Philosopher, economist and politician`,
  themes: ['ethics', 'politics', 'suffering'], keywords: ['utilitarianism', 'on liberty', 'harm principle', 'higher pleasures', 'pig satisfied', 'freedom of speech', 'subjection of women', 'harriet taylor', 'breakdown'],
  tagline: `Better to be Socrates dissatisfied than a fool satisfied, and your freedom ends only where harm to others begins.`,
  summary: `Mill defended utilitarianism, the view that right actions are those that produce the greatest happiness, but insisted that some pleasures are higher than others. In *On Liberty* he argued that the only justification for restricting someone’s freedom is to prevent harm to others, and made the classic case for free speech. He was also one of the first male politicians to campaign for women’s votes. And at twenty he had a breakdown that taught him something his education never had.`,
  life: `John Stuart Mill was born in London in 1806, the eldest son of James Mill, a Scottish philosopher and close friend of Jeremy Bentham, the founder of utilitarianism. James Mill decided to use his son as an experiment in education, and to raise him as the future leader of the utilitarian cause.

The result was one of the most extraordinary childhoods on record. John began Greek at three and Latin at eight. By eight he had read Aesop, Xenophon, Herodotus and six dialogues of Plato in Greek. By twelve he was studying logic and Aristotle; at thirteen, political economy. He had no holidays, no friends his own age, and was taught to distrust emotion and religion. His father taught him by making him walk alongside and explain what he had read.

In 1826, at twenty, he fell into a deep depression. He asked himself: “Suppose that all your objects in life were realised; that all the changes in institutions and opinions which you are looking forward to could be completely effected at this very instant: would this be a great joy and happiness to you?” And “an irrepressible self-consciousness distinctly answered, No!” The whole foundation of his life collapsed. For months he went on mechanically.

The first break came when he read a passage in a French memoir about a boy whose father had died, who felt he would be everything to his family, and Mill was moved to tears. He realised he wasn’t “a stock or a stone”. Then he found Wordsworth’s poetry, which gave him “a source of inward joy, of sympathetic and imaginative pleasure”, a “culture of the feelings” that his education had starved.

He worked for 35 years at the East India Company, rising to chief examiner. In 1830 he met Harriet Taylor, a married woman and brilliant thinker. Their intense friendship lasted twenty years, scandalising London society; they married in 1851, two years after her husband’s death. He credited her as co-author of much of his work, especially *On Liberty*. She died in Avignon in 1858; he bought a house overlooking her grave and spent much of the rest of his life there.

He was elected MP for Westminster in 1865, where he proposed giving women the vote (the amendment failed, 196 to 73). He died in Avignon in 1873 and was buried beside Harriet.`,
  ideas: [
    { t: `The greatest happiness principle`, b: `Utilitarianism, from Bentham, holds that actions are right in proportion as they tend to promote happiness, and wrong as they tend to produce the reverse. Happiness means pleasure and the absence of pain. And everyone’s happiness counts equally: “each to count for one, and none for more than one”. It was a radical, reforming idea: laws and institutions should be judged by their effects on human welfare, not by tradition or divine command.` },
    { t: `Higher and lower pleasures`, b: `Bentham said that, quantity of pleasure being equal, “pushpin is as good as poetry”. Critics said this made utilitarianism a “doctrine worthy only of swine”. Mill replied that some kinds of pleasure are higher than others: the pleasures of the intellect, feelings, imagination and moral sentiments are more valuable than those of mere sensation. How do we know? Ask anyone who has experienced both. Few would agree to become an animal, or a fool, even if promised the fullest share of the animal’s or fool’s pleasures.

“It is better to be a human being dissatisfied than a pig satisfied; better to be Socrates dissatisfied than a fool satisfied.”` },
    { t: `The harm principle`, b: `*On Liberty* argues for “one very simple principle”: the only purpose for which power can rightfully be exercised over any member of a civilised community, against their will, is to prevent harm to others. Their own good, physical or moral, is not a sufficient warrant. Over himself, over his own body and mind, “the individual is sovereign”.

So you may be persuaded, reasoned with, pleaded with, but not compelled, for your own good. Governments and societies can’t ban things just because they are unwise, immoral or offensive, only if they harm others.` },
    { t: `Freedom of speech`, b: `Chapter 2 of *On Liberty* is the classic argument for free speech. Silencing an opinion is wrong for several reasons. The opinion might be true, and we are not infallible. Even if it is false, it may contain part of the truth. And even if it is wholly false, truth that is never challenged becomes “dead dogma”, held as a prejudice, without understanding of its grounds. “He who knows only his own side of the case knows little of that.”` },
    { t: `The tyranny of the majority`, b: `Mill worried that in a democracy the danger wasn’t only government oppression but social pressure: “the tyranny of the prevailing opinion and feeling”, which can enslave the soul itself. Conformity, public opinion and custom can crush individuality more effectively than law. He defended “experiments in living” and eccentricity as valuable for human progress.` },
    { t: `Happiness comes sideways`, b: `From his breakdown, Mill learned something that runs against utilitarianism’s surface: “Ask yourself whether you are happy, and you cease to be so.” Those only are happy who have their minds fixed on some object other than their own happiness: on the happiness of others, on the improvement of mankind, even on some art or pursuit, followed not as a means but as an end in itself. Aiming thus at something else, they find happiness by the way.` },
    { t: `The subjection of women`, b: `In *The Subjection of Women* (1869), Mill argued that the legal subordination of women to men was wrong in itself and one of the chief obstacles to human improvement. We cannot know what women’s “nature” is, since we have only ever seen them in conditions of subjection. It was one of the first philosophical arguments for full sexual equality by a man, and it was widely mocked.` }
  ],
  works: [
    { t: `On Liberty`, y: `1859`, b: `About 120 pages. One of the founding texts of liberalism, and still argued over in every debate about free speech. Chapter 2 is essential.` },
    { t: `Utilitarianism`, y: `1861`, b: `A short defence of the greatest happiness principle, written for a general magazine. Chapter 2 contains the higher pleasures.` },
    { t: `Autobiography`, y: `1873`, b: `Written near the end of his life. Chapter 5, “A Crisis in My Mental History”, is one of the best accounts of depression in English.` },
    { t: `The Subjection of Women`, y: `1869`, b: `Clear, forceful and ahead of its time.` }
  ],
  quotes: [
    { q: `It is better to be a human being dissatisfied than a pig satisfied; better to be Socrates dissatisfied than a fool satisfied.`, s: `*Utilitarianism*, chapter 2` },
    { q: `The only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others.`, s: `*On Liberty*, chapter 1` },
    { q: `Over himself, over his own body and mind, the individual is sovereign.`, s: `*On Liberty*, chapter 1` },
    { q: `He who knows only his own side of the case knows little of that.`, s: `*On Liberty*, chapter 2` },
    { q: `Ask yourself whether you are happy, and you cease to be so.`, s: `*Autobiography*, chapter 5` },
    { q: `If all mankind minus one were of one opinion, mankind would be no more justified in silencing that one person than he, if he had the power, would be justified in silencing mankind.`, s: `*On Liberty*, chapter 2` }
  ],
  fakes: [
    { q: `The only thing necessary for the triumph of evil is for good men to do nothing.`, n: `Attributed to Mill, and even more often to Edmund Burke. Neither wrote it. The nearest real line is Mill’s, from his 1867 address at St Andrews: “Bad men need nothing more to compass their ends, than that good men should look on and do nothing.”` }
  ],
  critique: `Utilitarianism faces famous objections. If only total happiness matters, it seems to permit terrible things to individuals when the numbers add up: framing an innocent man to stop a riot, or harvesting one person’s organs to save five. Mill tried to answer this by arguing that respecting justice and rights generally maximises happiness in the long run, but critics say this just shows utilitarianism needs moral principles it can’t itself supply.

The higher pleasures argument has a problem too. If some pleasures are better in kind, not just in quantity, then pleasure isn’t the only thing that matters: there is some other standard by which the higher are higher. Mill seems to have smuggled in something beyond happiness.

The harm principle is harder to apply than it looks. What counts as harm? Is offence harm? Is harm to yourself also harm to your family? Almost every modern debate about drugs, speech and public health is about how to draw this line.

Finally, Mill worked for the East India Company and defended British rule in India as good for “backward” peoples, writing in *On Liberty* that despotism is a legitimate mode of government in dealing with barbarians. His liberalism had a clear imperial boundary.`,
  start: `Read chapter 5 of his *Autobiography* (it is short), then *On Liberty* (Penguin or Oxford). Then chapter 2 of *Utilitarianism*. Richard Reeves’s *John Stuart Mill: Victorian Firebrand* is a lively biography.`,
  related: ['locke', 'hume', 'kant', 'marx', 'william-james']
}
);

THINKERS.push(
{
  id: 'marx', name: `Karl Marx`, born: 1818, died: 1883, era: 'c19',
  place: `Trier; Paris; Brussels; London`, role: `Philosopher, economist and revolutionary`,
  themes: ['politics', 'meaning', 'suffering'], keywords: ['communism', 'capital', 'das kapital', 'communist manifesto', 'alienation', 'class struggle', 'historical materialism', 'surplus value', 'commodity fetishism', 'ideology', 'opium of the people', 'engels'],
  tagline: `Philosophers have only interpreted the world. The point is to change it.`,
  summary: `Marx argued that the way a society produces its material life (its economy) shapes its politics, law, religion and ideas. History is a story of class struggle. Under capitalism, workers are alienated from their work, from what they make, from each other and from their own humanity, while owners extract profit from their unpaid labour. He predicted capitalism would collapse from its own contradictions and give way to a classless society. Few thinkers have been more influential, or had their ideas used to justify more suffering.`,
  life: `Karl Marx was born in 1818 in Trier, in the Prussian Rhineland, into a middle-class family descended from a long line of rabbis. His father, a lawyer, converted to Lutheranism to keep his job under Prussian laws restricting Jews.

He studied law at Bonn, where he was more interested in drinking, debt and a duel, and then in Berlin, where he fell in with the Young Hegelians, radicals who used Hegel’s philosophy to criticise religion and the Prussian state. He wrote a doctoral thesis on Epicurus and Democritus. An academic career was closed to him because of his politics, so he became a journalist, editing the liberal *Rheinische Zeitung* in Cologne until the government shut it down in 1843.

That year he married Jenny von Westphalen, his childhood sweetheart, the daughter of a Prussian aristocrat, and moved to Paris, where he met Friedrich Engels, the son of a wealthy German textile manufacturer with mills in Manchester. It was the start of a lifelong partnership. Engels had seen the misery of the English working class first-hand and written about it.

Expelled from Paris, then Brussels, Marx and Engels wrote *The Communist Manifesto* in 1848, published weeks before revolutions broke out across Europe. When they failed, Marx settled in London in 1849, where he lived for the rest of his life, stateless, often in desperate poverty in Soho. Three of his children died young, partly from the conditions they lived in. The family pawned their clothes; Marx sometimes couldn’t go out because his coat was at the pawnbroker’s. Engels supported them for decades, working in his father’s Manchester firm, which he hated, and sending money.

Marx spent years in the Reading Room of the British Museum researching his great work on political economy. The first volume of *Capital* appeared in 1867. He never finished the rest; Engels assembled volumes two and three from his notes. He also helped lead the International Workingmen’s Association.

Jenny died in 1881, and his eldest daughter in January 1883. Marx died two months later, in his armchair, aged 64. Eleven people came to his funeral at Highgate Cemetery. Engels said in his eulogy: “His name will endure through the ages, and so also will his work.”`,
  ideas: [
    { t: `Alienation`, b: `In his early *Economic and Philosophical Manuscripts* (1844, not published until 1932), Marx described what capitalism does to workers. Under capitalism, the worker is alienated in four ways.

**From the product of their labour:** what they make belongs to someone else and confronts them as an alien power. **From the activity of labour itself:** work becomes something forced, a means to survive, not an expression of who they are. The worker “only feels himself freely active in his animal functions, eating, drinking and procreating... and in his human functions he feels himself an animal.” **From their species-being:** humans are distinctively creative, capable of freely shaping the world; capitalism reduces that to a job. **From other people:** relationships become competitive and transactional.

This analysis doesn’t depend on accepting the rest of Marx. Anyone who has done work that felt meaningless, performed for someone else’s profit, will recognise it.` },
    { t: `Historical materialism`, b: `Hegel saw history as driven by the development of ideas, of Spirit. Marx “turned Hegel on his head”: history is driven by material conditions, by how people produce the means of life.

Every society has an economic **base**: its forces of production (tools, technology, skills) and its relations of production (who owns what, who works for whom). On this base rises a **superstructure** of law, politics, religion, art and philosophy, which largely reflects and supports the base. “It is not the consciousness of men that determines their being, but, on the contrary, their social being that determines their consciousness.”

When the forces of production develop beyond what the existing relations allow, society enters an era of revolution. Feudalism gave way to capitalism; capitalism, Marx predicted, would give way to socialism.` },
    { t: `Class struggle`, b: `“The history of all hitherto existing society is the history of class struggles.” Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman: oppressor and oppressed, in constant conflict. Capitalism has simplified this into two great classes: the **bourgeoisie**, who own the means of production (factories, land, capital), and the **proletariat**, who own nothing but their ability to work and must sell it to survive.` },
    { t: `Exploitation and surplus value`, b: `In *Capital*, Marx argues that the value of goods comes from the labour needed to produce them. Workers are paid wages equal to what it costs to keep them alive and working (the value of their labour-power). But they work longer than it takes to produce that value. If a worker produces the value of their wage in six hours but works ten, the remaining four hours’ value (surplus value) goes to the capitalist as profit. This, Marx says, is exploitation, even when the wage is fair by market standards and no one is cheated.` },
    { t: `Commodity fetishism`, b: `Under capitalism, relations between people appear as relations between things. When you buy a shirt, you see a price and a product, not the web of human labour (the cotton pickers, the factory workers) behind it. The commodity seems to have value in itself, almost magically, like a religious fetish. We end up governed by the movements of markets and prices as if they were forces of nature, forgetting that we created them.` },
    { t: `Ideology`, b: `“The ideas of the ruling class are in every epoch the ruling ideas.” The class that controls material production also controls mental production: schools, press, churches. So the dominant ideas of a society tend to present the interests of the ruling class as natural, universal and inevitable. Religion, famously, is “the opium of the people”.

People often miss the full passage: “Religious suffering is, at one and the same time, the expression of real suffering and a protest against real suffering. Religion is the sigh of the oppressed creature, the heart of a heartless world, and the soul of soulless conditions. It is the opium of the people.” It is a sympathetic diagnosis as much as an attack. People need the painkiller because of the pain.` },
    { t: `Capitalism’s creative destruction`, b: `The *Manifesto* contains one of the most lyrical tributes to capitalism ever written. The bourgeoisie “has accomplished wonders far surpassing Egyptian pyramids, Roman aqueducts, and Gothic cathedrals”. It has created more massive productive forces in a hundred years than all preceding generations together. It has torn down every feudal tie and left “no other nexus between man and man than naked self-interest, than callous cash payment”. “All that is solid melts into air, all that is holy is profaned.”

Its constant need for new markets drives it across the globe. Marx described globalisation 150 years before the word was common.` },
    { t: `The point is to change it`, b: `The eleventh of his *Theses on Feuerbach* (1845), later carved on his tombstone: “Philosophers have only interpreted the world, in various ways; the point is to change it.”` }
  ],
  works: [
    { t: `The Communist Manifesto (with Engels)`, y: `1848`, b: `About 40 pages. A political pamphlet, brilliantly written. Part I is the essential section.` },
    { t: `Economic and Philosophical Manuscripts`, y: `1844, published 1932`, b: `The early, humanist Marx on alienation. The section “Estranged Labour” is the key text.` },
    { t: `The German Ideology (with Engels)`, y: `1846, published 1932`, b: `Sets out historical materialism. Contains the famous picture of communist society in which you could “hunt in the morning, fish in the afternoon, rear cattle in the evening, criticise after dinner”.` },
    { t: `Capital, Volume I`, y: `1867`, b: `His masterpiece of economic analysis. Long and in places very technical, but with extraordinary passages on the working day, child labour and the factory system, drawn from British government reports. Chapter 1 (on commodities) is famously hard; many readers start with chapter 10, “The Working Day”.` },
    { t: `The Eighteenth Brumaire of Louis Bonaparte`, y: `1852`, b: `A dazzling piece of political journalism about Napoleon III’s coup. Opens with: history repeats itself, “the first time as tragedy, the second time as farce”.` }
  ],
  quotes: [
    { q: `The philosophers have only interpreted the world, in various ways; the point is to change it.`, s: `*Theses on Feuerbach* XI (1845)` },
    { q: `The history of all hitherto existing society is the history of class struggles.`, s: `*The Communist Manifesto*, Part I` },
    { q: `All that is solid melts into air, all that is holy is profaned, and man is at last compelled to face with sober senses his real conditions of life.`, s: `*The Communist Manifesto*, Part I` },
    { q: `Religion is the sigh of the oppressed creature, the heart of a heartless world, and the soul of soulless conditions. It is the opium of the people.`, s: `*A Contribution to the Critique of Hegel’s Philosophy of Right*, Introduction (1844)` },
    { q: `Men make their own history, but they do not make it as they please.`, s: `*The Eighteenth Brumaire of Louis Bonaparte* (1852)` },
    { q: `It is not the consciousness of men that determines their being, but their social being that determines their consciousness.`, s: `*A Contribution to the Critique of Political Economy*, Preface (1859)` },
    { q: `Capital is dead labour, which, vampire-like, lives only by sucking living labour.`, s: `*Capital* I, chapter 10` },
    { q: `From each according to his ability, to each according to his needs!`, s: `*Critique of the Gotha Programme* (1875)` }
  ],
  fakes: [
    { q: `Democracy is the road to socialism.`, n: `No source in Marx’s writings.` }
  ],
  critique: `The biggest objection is history. Every state that has called itself Marxist, from the Soviet Union to Mao’s China, Cambodia under the Khmer Rouge and North Korea, became a dictatorship, and together they killed tens of millions of people through famine, purges and labour camps. Defenders argue that these regimes betrayed Marx, who wrote little about what socialism would look like and envisioned a free, democratic society. Critics reply that the betrayal was built in: if a revolutionary party knows the laws of history and the true interests of the working class, it will feel entitled to crush anyone who disagrees. Marx’s own term “dictatorship of the proletariat” didn’t help.

His predictions largely failed. The revolution didn’t come in the most advanced capitalist countries, as he expected, but in agrarian Russia and China. Workers in the West got richer, not poorer, partly through the trade unions and welfare states that Marxists fought for. The middle class grew instead of disappearing.

The labour theory of value, the core of his economics, has been abandoned by almost all economists, including many Marxists, since it doesn’t explain prices well and ignores the role of scarcity, demand and risk. Karl Popper argued that Marxism became unfalsifiable: every failed prediction was explained away.

And yet his analysis of capitalism’s dynamism, its tendency to crisis, its global reach, and its effects on work and human relationships remains extraordinarily perceptive. You don’t have to be a Marxist to think he saw something true about alienation.`,
  start: `Read *The Communist Manifesto* (Penguin, with Gareth Stedman Jones’s introduction). Then “Estranged Labour” from the *1844 Manuscripts*. Peter Singer’s *Marx: A Very Short Introduction* is a fair, clear guide. For the life, Gareth Stedman Jones’s *Karl Marx: Greatness and Illusion* (2016) is excellent, and Francis Wheen’s *Karl Marx* is lively.`,
  related: ['hegel', 'rousseau', 'fromm', 'arendt', 'foucault']
},
{
  id: 'thoreau', name: `Henry David Thoreau`, born: 1817, died: 1862, era: 'c19',
  place: `Concord, Massachusetts`, role: `Essayist, naturalist and philosopher`,
  themes: ['ethics', 'politics', 'meaning'], keywords: ['walden', 'civil disobedience', 'simplicity', 'transcendentalism', 'emerson', 'nature', 'live deliberately', 'quiet desperation', 'woods'],
  tagline: `Went to live in the woods for two years to find out what life actually requires.`,
  summary: `In 1845 Thoreau built a one-room cabin by Walden Pond and lived there for two years, to strip life down to its essentials and see what was left. *Walden*, his account of it, argues that most people lead lives of “quiet desperation”, working to buy things they don’t need, and that a simpler, more attentive life is richer. His essay on civil disobedience, written after a night in jail for refusing to pay taxes that funded slavery and war, inspired Gandhi and Martin Luther King.`,
  life: `Henry David Thoreau was born in 1817 in Concord, Massachusetts, the son of a pencil maker. He went to Harvard, then briefly taught school, resigning after he refused to beat his pupils. He ran a progressive school with his brother John, and worked in the family pencil business, improving the design (Thoreau pencils were among the best in America). He also worked as a surveyor and handyman.

He was befriended by Ralph Waldo Emerson, the leading figure of Transcendentalism, a movement that stressed the divinity of nature, intuition and self-reliance. Emerson encouraged him to keep a journal, which eventually ran to two million words.

In 1842 his beloved brother John died of tetanus after cutting himself shaving; Henry developed sympathetic symptoms. On 4 July 1845, at 27, he moved into a cabin he had built himself, on land Emerson owned beside Walden Pond, about a mile and a half from town. It cost him $28.12. He grew beans, read, wrote, walked, watched the pond, and received visitors. He wasn’t a hermit: he walked into town often and ate at his family’s house.

In July 1846 he was arrested for refusing to pay his poll tax, in protest against slavery and the Mexican–American War. He spent one night in jail; someone, probably his aunt, paid the tax, and he was released, apparently annoyed. He left Walden in 1847.

*Walden* was published in 1854 and sold poorly. He became a fierce abolitionist, defending the radical John Brown after his raid on Harpers Ferry. He died of tuberculosis in 1862, aged 44. Asked on his deathbed whether he had made his peace with God, he said: “I did not know that we had ever quarrelled.”`,
  ideas: [
    { t: `Quiet desperation`, b: `The first chapter of *Walden*, “Economy”, is a sustained attack on how his neighbours lived. They inherited farms and houses and spent their lives paying for them. They worked to buy things that required more work to maintain. “The mass of men lead lives of quiet desperation. What is called resignation is confirmed desperation.” People think they have chosen their way of life because it is the one they know.

He counts the true cost of things: “the cost of a thing is the amount of what I will call life which is required to be exchanged for it, immediately or in the long run.” That is a question worth asking of any purchase, job, or habit.` },
    { t: `Live deliberately`, b: `“I went to the woods because I wished to live deliberately, to front only the essential facts of life, and see if I could not learn what it had to teach, and not, when I came to die, discover that I had not lived.” He wanted to “live deep and suck out all the marrow of life”.

His rallying cry was: “Simplicity, simplicity, simplicity! I say, let your affairs be as two or three, and not a hundred or a thousand.”` },
    { t: `News and distraction`, b: `Thoreau was scathing about the news. People rush to the post office for letters, most of which aren’t worth the postage. “Hardly a man takes a half-hour’s nap after dinner, but when he wakes he holds up his head and asks, ‘What’s the news?’ as if the rest of mankind had stood his sentinels.” If you have read of one man robbed, or murdered, or one train wreck, “you never need read of another. One is enough.” The news is gossip. Of the new transatlantic telegraph, he wrote that we are in great haste to tunnel under the Atlantic to bring the Old World some weeks nearer to the New, “but perchance the first news that will leak through into the broad, flapping American ear will be that the Princess Adelaide has the whooping cough.”` },
    { t: `Nature as teacher`, b: `Much of *Walden* is patient, precise observation of the natural world: the pond through the seasons, ice, ants at war, a loon diving, the sounds at night. Thoreau was a serious naturalist whose records of flowering dates at Concord are now used by climate scientists. For him, attention to nature was a spiritual discipline: waking up. “Only that day dawns to which we are awake.”` },
    { t: `Civil disobedience`, b: `In “Resistance to Civil Government” (1849), later called “Civil Disobedience”, Thoreau argued that individuals must not let governments override their consciences. “Must the citizen ever for a moment, or in the least degree, resign his conscience to the legislator? Why has every man a conscience then?” If a law requires you to be the agent of injustice to another, break the law. And accept the penalty: “Under a government which imprisons any unjustly, the true place for a just man is also a prison.”

Tolstoy, Gandhi and Martin Luther King Jr. all cited it.` }
  ],
  works: [
    { t: `Walden, or Life in the Woods`, y: `1854`, b: `Eighteen chapters, compressing two years into one cycle of seasons. “Economy” (long and combative) and “Where I Lived, and What I Lived For” (short and luminous) are the core. Some chapters are slow; skim them. The final chapter, “Conclusion”, is superb.` },
    { t: `Civil Disobedience`, y: `1849`, b: `About 25 pages. One of the most influential essays in political history.` },
    { t: `Walking`, y: `1862`, b: `An essay on sauntering and wildness: “in Wildness is the preservation of the World.”` },
    { t: `The Journal`, y: `1837–61`, b: `Fourteen volumes in the old edition. Many think his best writing is here.` }
  ],
  quotes: [
    { q: `The mass of men lead lives of quiet desperation.`, s: `*Walden*, “Economy”` },
    { q: `I went to the woods because I wished to live deliberately, to front only the essential facts of life, and see if I could not learn what it had to teach, and not, when I came to die, discover that I had not lived.`, s: `*Walden*, “Where I Lived, and What I Lived For”` },
    { q: `Simplicity, simplicity, simplicity!`, s: `*Walden*, “Where I Lived, and What I Lived For”` },
    { q: `The cost of a thing is the amount of what I will call life which is required to be exchanged for it, immediately or in the long run.`, s: `*Walden*, “Economy”` },
    { q: `Under a government which imprisons any unjustly, the true place for a just man is also a prison.`, s: `“Civil Disobedience”` },
    { q: `Only that day dawns to which we are awake.`, s: `*Walden*, “Conclusion”` },
    { q: `If a man does not keep pace with his companions, perhaps it is because he hears a different drummer.`, s: `*Walden*, “Conclusion”` },
    { q: `I did not know that we had ever quarrelled.`, s: `On his deathbed, asked if he had made his peace with God` }
  ],
  fakes: [
    { q: `Go confidently in the direction of your dreams! Live the life you’ve imagined.`, n: `A paraphrase of a longer, more careful sentence in *Walden*’s “Conclusion”: “if one advances confidently in the direction of his dreams, and endeavors to live the life which he has imagined, he will meet with a success unexpected in common hours.”` },
    { q: `Most men lead lives of quiet desperation and go to the grave with the song still in them.`, n: `The first half is Thoreau. The second half isn’t in *Walden*; it echoes Oliver Wendell Holmes’s poem “The Voiceless” (“die with all their music in them”), and the two got welded together.` }
  ],
  critique: `The usual jab is that Thoreau’s mother did his laundry. The walk to town was short, he ate at his family’s house regularly, and he built on his rich friend’s land. The experiment was less rugged than the book implies, and a writer with no dependants, no debts and a generous patron is in an unusually good position to recommend simplicity. Kathryn Schulz’s 2015 *New Yorker* essay “Pond Scum” made the case against him as a sanctimonious misanthrope who preached to people who had far fewer choices than he did.

There’s truth in it. *Walden* can be preachy and contemptuous of ordinary working people, who, after all, couldn’t all go live in the woods. And civil disobedience raises a hard question: if everyone follows their conscience against the law, whose conscience wins? The segregationist also has a conscience.

But the core challenge (count the true cost in life of everything you do) doesn’t depend on Thoreau being a perfect person.`,
  start: `Read the chapters “Where I Lived, and What I Lived For” and “Conclusion” from *Walden*, then go back and read “Economy”. Then “Civil Disobedience”. The Penguin Classics or Library of America editions are fine. Laura Dassow Walls’s *Henry David Thoreau: A Life* (2017) is the best biography.`,
