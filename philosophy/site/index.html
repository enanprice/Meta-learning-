{
  id: 'machiavelli', name: `Niccolò Machiavelli`, born: 1469, died: 1527, era: 'early-modern',
  place: `Florence`, role: `Political philosopher and diplomat`,
  themes: ['politics', 'ethics'], keywords: ['the prince', 'discourses', 'virtu', 'fortuna', 'feared', 'loved', 'realism', 'medici', 'machiavellian'],
  tagline: `Described power as it actually works, not as it ought to, and got his name turned into an insult.`,
  summary: `Machiavelli’s *The Prince* tells rulers that to hold power they must be willing, when necessary, to lie, break promises and use cruelty, and that it is safer to be feared than loved if you can’t be both. That made “Machiavellian” a byword for cynicism. But he was a republican who loved his city, and his real target was the gap between how politics is described and how it works. He founded political science by refusing to pretend.`,
  life: `Machiavelli was born in Florence in 1469, into an old but modestly off family. His father, a lawyer, loved books and made sure his son received a humanist education in Latin classics. Florence at the time was ruled, unofficially, by the Medici banking family, and was one of the richest, most artistically brilliant cities in Europe, and one of the most politically unstable.

In 1494 the Medici were expelled; the friar Savonarola briefly ran the city as a puritanical theocracy, until he was burned at the stake in 1498. That year, at 29, Machiavelli became secretary of the Second Chancery of the new Florentine republic, a senior civil service post handling foreign affairs and defence. For fourteen years he was a diplomat, meeting kings, popes and warlords. He watched Cesare Borgia, the ruthless son of Pope Alexander VI, carve out a state in central Italy by fraud and violence, and studied him closely. He also created a Florentine citizen militia, convinced that relying on mercenaries was ruinous.

In 1512 the Spanish army helped the Medici return to power. Machiavelli was dismissed. The next year he was wrongly suspected of joining a conspiracy, imprisoned, and tortured with the *strappado*: hands tied behind the back, hoisted by the wrists and dropped. He was given six drops and confessed nothing. Released in an amnesty, he retired to his small farm outside Florence.

There he wrote *The Prince*, partly to get a job with the Medici. In a famous letter to his friend Francesco Vettori, he describes his days: snaring birds, arguing with woodcutters, playing cards at the inn with the butcher and the miller. Then in the evening he changes out of his muddy clothes into formal robes and enters “the ancient courts of ancient men”, reading and conversing with the great writers of antiquity, and for four hours feels no boredom and forgets all his troubles.

The Medici gave him only minor commissions, including writing a history of Florence. When they were expelled again in 1527 and the republic restored, the republicans saw him as a Medici man and wouldn’t employ him. He died that year, aged 58.`,
  ideas: [
    { t: `How things are, not how they should be`, b: `The key sentence is in chapter 15 of *The Prince*. Many writers have imagined republics and principalities that have never existed. But “how one lives is so far from how one ought to live that he who neglects what is done for what ought to be done learns his ruin rather than his preservation.” A person who wants to be good in all things will come to ruin among so many who are not good. So a prince must learn how not to be good, and use this knowledge or not, according to necessity.

This is the break. Before Machiavelli, political writing was mostly about the virtues of the ideal ruler. He writes about what actually works.` },
    { t: `Better feared than loved`, b: `Chapter 17: is it better to be loved or feared? Ideally both. But since it is hard to combine them, if you must choose, it is much safer to be feared. People are “ungrateful, fickle, liars and deceivers, fearful of danger and greedy for gain”. Love is held by a chain of obligation that people break whenever it suits them; fear is held by dread of punishment, which never fails.

But note the condition he adds, often forgotten: a prince must be feared *without being hated*. And he avoids hatred above all by keeping his hands off his subjects’ property and their women. “Men forget the death of their father sooner than the loss of their patrimony.”` },
    { t: `Virtù and Fortuna`, b: `Two forces shape political life. *Fortuna* is chance, circumstance, luck. *Virtù* isn’t Christian virtue but something closer to ability, energy, boldness, the capacity to seize an opportunity and shape events. Machiavelli guesses that fortune governs about half our actions and leaves the other half to us. He compares fortune to a violent river that floods the plain; you can’t stop it, but in calm times you can build dykes and embankments.

In chapter 25 he uses a notorious image: fortune is a woman, and to keep her down you must beat and push her; she yields more to the bold and young than to the cautious. The misogyny is plain. The underlying point is that in politics, hesitation is usually more dangerous than action.` },
    { t: `Appearances matter more than reality`, b: `A prince doesn’t need to have all the good qualities, but he must seem to have them. It is useful to appear merciful, faithful, humane, honest and religious, and even to be so, as long as you can be the opposite when necessary. “Everyone sees what you appear to be; few touch what you are.” People judge by results and by appearances, and “the vulgar are always taken in”.` },
    { t: `The lion and the fox`, b: `A prince must know how to use both the beast and the man, and among beasts, the fox and the lion. The lion can’t defend itself from traps; the fox can’t defend itself from wolves. So you must be a fox to recognise traps and a lion to frighten wolves.` },
    { t: `The republican Machiavelli`, b: `*The Prince* is his most famous book, but his longest political work, the *Discourses on Livy*, is a defence of republics. Here he argues that a republic in which people, nobles and institutions check each other is more stable, more free and more durable than a principality. He praises the conflict between classes in ancient Rome as what kept it free. The people are wiser and more constant than a prince, he says. Scholars have argued for centuries about how to reconcile the two books.` }
  ],
  works: [
    { t: `The Prince`, y: `written 1513, published 1532`, b: `Twenty-six short chapters on how to acquire and keep a principality, dedicated to Lorenzo de’ Medici. It was published after his death and placed on the Church’s Index of Prohibited Books in 1559. Chapters 15 to 19 and 25 are the heart of it. Under a hundred pages.` },
    { t: `Discourses on the First Ten Books of Titus Livy`, y: `c. 1517`, b: `A long commentary on the Roman historian Livy, used to reflect on how republics are founded, preserved and corrupted. It is the other half of Machiavelli, and the more important one to many scholars.` },
    { t: `The Art of War and Florentine Histories`, y: `1521; 1532`, b: `A dialogue on military organisation, and a commissioned history of his city.` },
    { t: `The Mandrake (La Mandragola)`, y: `c. 1518`, b: `A bawdy comedy about seduction and deception, still performed. Everyone in it behaves exactly as *The Prince* predicts.` }
  ],
  quotes: [
    { q: `It is much safer to be feared than loved, if one of the two must be lacking.`, s: `*The Prince*, chapter 17` },
    { q: `Men forget the death of their father sooner than the loss of their patrimony.`, s: `*The Prince*, chapter 17` },
    { q: `Everyone sees what you appear to be; few touch what you are.`, s: `*The Prince*, chapter 18` },
    { q: `How one lives is so far from how one ought to live that he who neglects what is done for what ought to be done learns his ruin rather than his preservation.`, s: `*The Prince*, chapter 15` },
    { q: `Men must be either pampered or crushed, because they can get revenge for small injuries but not for fatal ones.`, s: `*The Prince*, chapter 3` },
    { q: `I love my native city more than my soul.`, s: `Letter to Francesco Vettori, 16 April 1527` }
  ],
  fakes: [
    { q: `The ends justify the means.`, n: `Never written by Machiavelli. The closest line (chapter 18) says that in the actions of princes, where there is no court to appeal to, people look at the result. That is an observation about how rulers are judged, not a moral principle.` },
    { q: `Keep your friends close and your enemies closer.`, n: `From *The Godfather Part II* (1974). Often attributed to Machiavelli or Sun Tzu. Neither wrote it.` }
  ],
  critique: `The moral objection is obvious. If a ruler may lie, betray and kill whenever “necessity” requires it, who decides what counts as necessity? The ruler, of course. Machiavelli gives no principle that limits this, and history is full of tyrants who read him or thought like him. Isaiah Berlin argued that his real originality was showing that political and Christian values can be incompatible, not just hard to combine, and that you have to choose. That is honest. It is also frightening.

His view of human nature (people are ungrateful, fickle, greedy) is a generalisation from Renaissance Italian politics at its most treacherous. It may describe the court of Cesare Borgia; it doesn’t describe everyone.

Some have read *The Prince* as satire, or as a warning to the people about how rulers behave (Rousseau and Spinoza both suggested this). Others think it was a job application. The honest answer is that we don’t know exactly what he meant, and that he probably meant more than one thing.`,
  start: `Read *The Prince* in Harvey Mansfield’s translation (Chicago) or Tim Parks’s (Penguin), which is punchier. It takes an evening. If it grabs you, read a selection of the *Discourses*. Maurizio Viroli’s *Niccolò’s Smile* is a sympathetic biography; Erica Benner’s *Be Like the Fox* argues he was a moralist in disguise.`,
  related: ['hobbes', 'aristotle', 'rousseau', 'nietzsche', 'arendt']
},
{
  id: 'montaigne', name: `Michel de Montaigne`, born: 1533, died: 1592, era: 'early-modern',
  place: `Château de Montaigne, near Bordeaux`, role: `Essayist and philosopher`,
  themes: ['mind', 'death', 'ethics', 'knowledge', 'love'], keywords: ['essays', 'que sais-je', 'what do i know', 'scepticism', 'friendship', 'la boetie', 'cannibals', 'self', 'essay'],
  tagline: `Invented the essay by writing about himself, honestly, for twenty years.`,
  summary: `Montaigne retired at 38 to a tower full of books and started writing short pieces about anything: friendship, cannibals, thumbs, sleep, cruelty, smells, death. He called them *essais*, “attempts”. In them he studied the one subject he could observe from the inside, himself, and found a creature so changeable, contradictory and uncertain that the only honest motto was “What do I know?” He is the most companionable writer in philosophy.`,
  life: `Michel Eyquem de Montaigne was born in 1533 at the family château in the Périgord, near Bordeaux. His father, a wealthy merchant turned minor noble, had eccentric ideas about education. The baby was sent to live with a peasant family for his first years, to bond with ordinary people. Back home, he was woken each morning by music, and his father arranged that everyone in the household, servants included, spoke to him only in Latin, so that Latin became his first language. He didn’t learn French until he was six.

He studied law and became a magistrate in the Bordeaux parliament. There he met Étienne de La Boétie, a fellow magistrate and writer, and they became intensely close. La Boétie died of an illness, probably plague or dysentery, in 1563, with Montaigne at his bedside. Montaigne never got over it.

In 1571, at 38, he retired to his estate. He had an inscription painted on the wall of his library announcing that he had withdrawn into “the bosom of the learned virgins” to spend what remained of his life in calm and freedom. His library was on the third floor of a round tower, with over a thousand books and Greek and Latin quotations painted on the ceiling beams, which are still there.

Retirement didn’t stay quiet. France was being torn apart by the Wars of Religion between Catholics and Protestants. Montaigne, a moderate Catholic, was trusted by both sides and acted as a go-between for the Protestant Henry of Navarre, later King Henry IV. He served two terms as mayor of Bordeaux. He travelled through Germany, Switzerland and Italy looking for a cure for his kidney stones, which tormented him. He was once captured by a band of armed men on the road, and released, he thought, because of his open face.

He married, and had six daughters; only one survived infancy. He mentions this in a single, startling aside: that he had lost two or three children at nurse, “not without regret, but without great vexation”. He died at his château in 1592, aged 59.`,
  ideas: [
    { t: `I am myself the matter of my book`, b: `In his note “To the Reader”, Montaigne says he wants to be seen in his simple, natural, ordinary fashion, without straining or artifice: “for it is myself I portray.” He had discovered something new: you could write philosophy by observing one ordinary person, honestly, in detail. Not a great man, not an ideal, just a human being, with his moods, habits, bodily functions and inconsistencies.

The key discovery was how changeable that person is. “I cannot keep my subject still. It goes along befuddled and staggering, with a natural drunkenness.” He doesn’t portray being but passing, not from age to age but from day to day, minute to minute. The self isn’t a fixed thing to be discovered; it is a flowing, contradictory process.` },
    { t: `What do I know?`, b: `Montaigne had a medal struck with the motto *Que sais-je?*, “What do I know?”, and a picture of scales in balance. His longest essay, the *Apology for Raymond Sebond*, is a full-blown assault on human arrogance. We think we are the masters of creation, but we can’t prove animals don’t reason. (“When I play with my cat, who knows if I am not a pastime to her more than she is to me?”) Our senses deceive us; our reason can argue for anything; our customs vary wildly from place to place and we take our own for nature.

This scepticism wasn’t despair. It was a cure for fanaticism, in a country where people were killing each other over religious certainty.` },
    { t: `On cannibals`, b: `In 1562 Montaigne met three Tupinambá people from Brazil who had been brought to the French court. In his essay “Of Cannibals” he argues that there is nothing barbarous about them, “except that each man calls barbarism whatever is not his own practice”. Yes, they eat their dead enemies. But Europeans torture living people, tear them apart on the rack and roast them over slow fires, and call it religious zeal. Which is more barbarous?

At the end, he reports that the Tupinambá were astonished at two things in France: that grown men would obey a child king, and that some people were gorged with good things while others begged at their doors, starving, and didn’t take the rich by the throat. Then he adds: “All this is not too bad. But what’s the use? They don’t wear breeches.” It is one of the great deadpan endings in literature.` },
    { t: `To philosophise is to learn to die`, b: `Early on, Montaigne was obsessed with death, and wrote that we should think about it constantly to strip it of its strangeness: “Let us have nothing on our minds so often as death.” Then, in his forties, he was thrown from his horse and nearly killed. Semi-conscious, he felt himself drifting away, and the experience was gentle, even pleasant.

He changed his mind. In the late essays he says that the whole business of preparing for death is overdone: nature will teach you how to die when the time comes. “If you don’t know how to die, don’t worry; Nature will tell you what to do on the spot.” Better to learn how to live.` },
    { t: `Because it was he, because it was I`, b: `In “Of Friendship”, written about La Boétie, Montaigne describes a friendship so complete that their souls “mingle and blend with each other so completely that they efface the seam that joined them”. If pressed to say why he loved him, he writes, “I feel that this cannot be expressed, except by answering: Because it was he, because it was I.”` },
    { t: `Live appropriately`, b: `The final essay, “Of Experience”, is his wisest. After all his doubts, he ends in something like happiness: a celebration of ordinary life, the body, eating, sleeping, the pleasures of the moment. “We are great fools. ‘He has spent his life in idleness,’ we say. ‘I have done nothing today.’ What? Have you not lived? That is not only the fundamental but the most illustrious of your occupations.” Our great masterpiece is to live appropriately.

And: “On the loftiest throne in the world, we are still sitting on our own behind.”` }
  ],
  works: [
    { t: `The Essays`, y: `1580, 1588, 1595`, b: `107 essays in three books, ranging from a page to over a hundred. He kept revising them until his death, adding rather than deleting, so editions mark layers (A, B, C) showing when each passage was written. You can watch his mind change on the page. The titles are often misleading: “Of Coaches” is mostly about the Spanish conquest of the Americas. You don’t read them in order. You open them and wander.` },
    { t: `Travel Journal`, y: `1580–81, published 1774`, b: `His journal of the trip to Italy, partly dictated to a secretary, partly in Italian. Mainly of interest for how much he writes about his kidney stones.` }

  quotes: [
    { q: `I am myself the matter of my book.`, s: `*Essays*, “To the Reader”` },
    { q: `What do I know?`, s: `His motto, *Que sais-je?*, *Essays* II.12` },
    { q: `If you press me to say why I loved him, I feel that this cannot be expressed, except by answering: Because it was he, because it was I.`, s: `“Of Friendship”, *Essays* I.28` },

  fakes: [
    { q: `My life has been full of terrible misfortunes, most of which never happened.`, n: `Not found in the *Essays*. It is attributed to Montaigne, Mark Twain and others; the thought is closer to Seneca’s “we suffer more in imagination than in reality”.` }
  ],
  critique: `Montaigne’s scepticism can shade into conservatism. If we can’t know what is right, and every custom seems natural to those who follow it, then the sensible thing is to keep to the customs and religion of your country, which is exactly what Montaigne recommends. That is a comfortable conclusion for a Catholic nobleman with an estate. It gives no grounds to challenge an unjust law or a bad custom beyond pointing out that other countries do things differently.

Pascal, who loved and hated Montaigne, thought he was dangerous precisely because he was so charming: he made doubt pleasant and death trivial, and so lulled people out of the anguish that might lead them to God. Descartes started his whole project in reaction to Montaigne’s scepticism, determined to find at least one thing that couldn’t be doubted.

Some readers find him self-absorbed: a wealthy man writing endlessly about his bowels. That is partly the point, and partly a fair hit.`,
  start: `Don’t read the *Essays* in order. Start with “Of Friendship” (I.28), “Of Cannibals” (I.31), “Of Practice” (II.6, the fall from his horse), “Of Repentance” (III.2) and “Of Experience” (III.13). M. A. Screech’s translation (Penguin) is excellent; Donald Frame’s (Everyman) is equally good. Sarah Bakewell’s *How to Live: A Life of Montaigne in One Question and Twenty Attempts at an Answer* (2010) is one of the best introductions to any philosopher ever written.`,

{
  id: 'hobbes', name: `Thomas Hobbes`, born: 1588, died: 1679, era: 'early-modern',
  place: `Malmesbury, England; Paris; London`, role: `Political philosopher`,
  themes: ['politics', 'mind'], keywords: ['leviathan', 'state of nature', 'nasty brutish and short', 'social contract', 'sovereign', 'war of all against all', 'materialism'],
  tagline: `Without a government, life would be “solitary, poor, nasty, brutish, and short”.`,
  summary: `Hobbes asked what life would be like without any government at all. His answer: a war of everyone against everyone, driven by fear, competition and pride, in which nothing could be built and no one would be safe. To escape it, rational people would agree to hand almost unlimited power to a sovereign who keeps the peace. He founded modern political philosophy by starting from individuals and their fears rather than from God or nature.`,
  life: `Hobbes was born in 1588 in Malmesbury, Wiltshire. His mother, he later claimed, went into premature labour on hearing that the Spanish Armada was approaching England, and so “she brought forth twins: myself and fear”. His father, a poorly educated vicar, got into a fight with another clergyman at the church door and fled, leaving Thomas to be raised by an uncle.

He went to Oxford, disliked what he was taught, and became tutor and secretary to the wealthy Cavendish family, Earls of Devonshire, with whom he stayed for most of his long life. This gave him travel, time and access to the great minds of Europe: he worked briefly for Francis Bacon, met Galileo in Italy, and knew Descartes and Mersenne in Paris.

At about forty, in a gentleman’s library, he came across a copy of Euclid’s *Elements* open at Book I, Proposition 47 (Pythagoras’s theorem). “By God,” he said, “this is impossible!” He traced the proof back step by step to its axioms, and was convinced. He fell in love with geometry, and decided that political philosophy could be built the same way, from clear definitions to certain conclusions.

As tensions grew towards the English Civil War, Hobbes, who defended royal power, feared for his safety and fled to Paris in 1640, “the first of all that fled”, he said. He spent eleven years there, tutoring the exiled future Charles II in mathematics. He wrote *Leviathan* there, published in 1651, while England was a republic after the execution of Charles I. It offended almost everyone: royalists, because it justified obeying whoever actually held power; the Church, because it was suspected of atheism.

After the Restoration in 1660, Charles II protected his old tutor and gave him a pension, though a parliamentary committee investigated *Leviathan* for atheism after the Great Plague and Fire of London were blamed on God’s anger. Hobbes burned some of his papers. He kept working into his nineties, translating Homer at 86, and died in 1679 at 91.`,
  ideas: [
    { t: `The state of nature`, b: `Imagine there were no government, no laws, no police. Hobbes argues that people are roughly equal: even the weakest can kill the strongest, by trickery or in alliance with others. People want the same things, and there isn’t enough to go around. So there are three causes of conflict: **competition** (for gain), **diffidence**, meaning distrust (for safety: attack first before you are attacked), and **glory** (for reputation: people fight over trifles, a word, a smile, a sign of disrespect).

The result is “a war of every man against every man”. In such a condition there is no place for work, farming, trade, building, science, arts, society, “and which is worst of all, continual fear and danger of violent death: and the life of man, solitary, poor, nasty, brutish, and short.”

Is this fantasy? Hobbes points to how you behave now: you lock your doors and chests, you travel armed, even with laws and police. What does that say about what you think of your fellow citizens?` },
    { t: `The social contract`, b: `Reason shows people a way out. The first law of nature is to seek peace. The second is to be willing to give up your right to all things, if others do the same. So people agree, with each other, to hand their power to a single sovereign (a person or an assembly) who will keep the peace and protect them.

This is the social contract. The state isn’t natural or ordained by God; it is an artificial creation, made by people to escape fear. Hobbes calls it the Leviathan, after the sea monster in the Book of Job, a “mortal god”. The famous frontispiece of the book shows a giant king whose body is made up of hundreds of tiny people.` },
    { t: `An almost absolute sovereign`, b: `Because the alternative is war, the sovereign must have near-total power: to make laws, judge disputes, control the army, even decide what doctrines may be taught. Divided power leads to civil war (Hobbes had seen one). Subjects can’t rebel just because they think the sovereign is unjust; that would return everyone to the state of nature.

But there is a limit. Since people entered the contract to protect their lives, no one can be obliged to kill themselves or not to resist being killed. If the sovereign can no longer protect you, your obligation to it ends.` },
    { t: `Everything is matter in motion`, b: `Hobbes was a thoroughgoing materialist. Everything that exists is body. Thought is motion in the brain; sensation is motion transmitted from objects to the organs. The soul, if it means something immaterial, is a contradiction in terms. Even God, he suggested, must be a body of some kind. This, more than his politics, is why he was suspected of atheism.` },
    { t: `Life is restless desire`, b: `There is no “utmost aim” or “greatest good” in this life, as older philosophers claimed. Happiness is continual progress of desire from one object to another, and a person whose desires have come to an end can no longer live. The general inclination of all mankind is “a perpetual and restless desire of power after power, that ceaseth only in death”.` }
  ],
  works: [
    { t: `Leviathan`, y: `1651`, b: `Four parts: “Of Man” (psychology and the state of nature), “Of Commonwealth” (the social contract and the sovereign), and two long parts on religion and the church that most people skip. Hobbes writes vigorous, witty English prose. Chapters 13 to 18 are the core.` },
    { t: `De Cive (On the Citizen)`, y: `1642`, b: `An earlier, shorter Latin version of the political theory.` }
  ],
  quotes: [
    { q: `And the life of man, solitary, poor, nasty, brutish, and short.`, s: `*Leviathan*, chapter 13` },
    { q: `During the time men live without a common power to keep them all in awe, they are in that condition which is called war; and such a war as is of every man against every man.`, s: `*Leviathan*, chapter 13` },
    { q: `I put for a general inclination of all mankind a perpetual and restless desire of power after power, that ceaseth only in death.`, s: `*Leviathan*, chapter 11` },
    { q: `Covenants, without the sword, are but words.`, s: `*Leviathan*, chapter 17` },
    { q: `Fear and I were born twins together.`, s: `*Verse Autobiography* (1672), on the Armada` },
    { q: `I am about to take my last voyage, a great leap in the dark.`, s: `Reported as his last words, 1679` }

  fakes: [],
  critique: `Is the state of nature real? Critics point out that humans have always lived in groups, bound by kinship, custom and cooperation, not as isolated individuals. Rousseau said Hobbes had taken the vices of civilised Europeans (pride, greed, competition) and projected them back onto “natural” man. Anthropologists have found stateless societies that are far from a war of all against all.

The political conclusion is the bigger problem. If the only alternative to absolute power is chaos, people should accept almost any tyranny. Hobbes lived through a civil war and feared anarchy more than despotism. But the twentieth century showed what an unchecked Leviathan does. Locke’s reply was that it makes no sense to protect yourself from polecats and foxes by handing yourself over to a lion.

Still, Hobbes’s basic question is permanent. Look at any place where the state collapses and you see something close to what he described.`,
  start: `Read *Leviathan*, chapters 13 to 17. The Penguin edition (edited by C. B. Macpherson) or the Hackett edition (Edwin Curley) with modernised spelling are best. Richard Tuck’s *Hobbes: A Very Short Introduction* is a good guide.`,

{
  id: 'descartes', name: `René Descartes`, born: 1596, died: 1650, era: 'early-modern',
  place: `La Haye (France); the Netherlands; Stockholm`, role: `Philosopher and mathematician`,
  themes: ['knowledge', 'mind', 'god'], keywords: ['cogito', 'i think therefore i am', 'meditations', 'doubt', 'evil demon', 'dualism', 'mind body', 'rationalism', 'cartesian'],
  tagline: `Doubted everything he could, and found one thing he couldn’t: that he was doubting.`,
  summary: `Descartes set out to tear down all his beliefs and rebuild knowledge on foundations that couldn’t be doubted. He doubted his senses, his body, even mathematics, imagining an evil demon deceiving him about everything. One thing survived: *I think, therefore I am*. From there he tried to prove God and the external world. He left philosophy with the split between mind and body that it is still arguing about.`,
  life: `René Descartes was born in 1596 in La Haye, a small town in Touraine, France (now renamed Descartes). His mother died when he was one. A sickly child, he was sent to the Jesuit college of La Flèche, one of the best schools in Europe, where he was allowed to lie in bed late in the mornings, a habit he kept for life, doing his best thinking there.

He came out of school, he later wrote, disappointed: he had learned many things, but little that was certain, except mathematics. He took a law degree, then decided to study “the great book of the world”, and joined the army of Maurice of Nassau in the Netherlands as a gentleman volunteer. On 10 November 1619, stuck in winter quarters in Germany, he spent a day shut in a stove-heated room thinking, and that night had three vivid dreams which he took as a sign that he was called to found a new, unified science.

He spent most of his adult life in the Netherlands, moving house often to protect his privacy. He worked on mathematics (he invented the Cartesian coordinate system, linking algebra and geometry, which is why graphs have x and y axes), optics, physiology and philosophy. When he heard in 1633 that Galileo had been condemned by the Inquisition for teaching that the earth moves, he withdrew his own book on physics, *The World*, which said the same.

He had a daughter, Francine, with a servant named Helena Jans. Francine died of scarlet fever at five; he said it was the greatest sorrow of his life.

In 1649 Queen Christina of Sweden invited him to Stockholm to teach her philosophy. She insisted on lessons at five in the morning, in a freezing palace. Descartes, the lifelong late riser, caught pneumonia and died in February 1650, aged 53. His body was later returned to France, minus his skull, which is now in the Musée de l’Homme in Paris.`,
  ideas: [
    { t: `The method of doubt`, b: `Descartes realised that many things he had believed since childhood were false, and that anything built on them was shaky. So, “once in my life”, he would demolish everything and start again from the foundations.

He didn’t check each belief one by one. He attacked their sources. **The senses** sometimes deceive (a straight stick looks bent in water), so they can’t be fully trusted. **But surely I can’t doubt that I’m sitting here by the fire in my dressing gown?** Yet I’ve often dreamed exactly that, and there are no sure signs by which to tell waking from dreaming. **But even in dreams, 2 + 3 = 5.** Unless there is an evil demon, supremely powerful and cunning, devoting all his energy to deceiving me, even about that.

The evil demon is the ancestor of every “brain in a vat” thought experiment and of *The Matrix*.` },
    { t: `I think, therefore I am`, b: `Is there anything the demon can’t deceive me about? Yes. If he deceives me, I must exist to be deceived. “Let him deceive me as much as he can, he will never bring it about that I am nothing so long as I think that I am something.” The proposition *I am, I exist* is necessarily true whenever I think it.

In the *Discourse on Method* he put it as *je pense, donc je suis*, and in Latin, *cogito, ergo sum*: I think, therefore I am. This is the rock on which he rebuilds everything.

But what am I? Not a body, since I can doubt I have one. I am a thinking thing: something that doubts, understands, affirms, denies, wills, refuses, imagines and feels.` },
    { t: `Clear and distinct ideas`, b: `Why is the cogito certain? Because I perceive it “clearly and distinctly”. So Descartes adopts a rule: whatever I perceive clearly and distinctly is true. But the rule needs a guarantee: what if the demon makes me go wrong even about clear ideas? Only a good God, who is no deceiver, can guarantee it.` },
    { t: `Proving God`, b: `Descartes offers two proofs. **The trademark argument:** I have an idea of an infinite, perfect being. I am finite and imperfect, so I couldn’t have produced that idea myself. Only an infinite being could have caused it, like a craftsman’s trademark stamped on his work. **The ontological argument:** a supremely perfect being must have every perfection; existence is a perfection; so God must exist, as surely as a triangle’s angles add up to two right angles.

With God established, and God being no deceiver, Descartes can trust his clear and distinct ideas and, eventually, the existence of the physical world.` },
    { t: `Mind and body`, b: `I can clearly conceive of my mind existing without my body, and of my body without my mind. So they are two distinct substances: mind, whose essence is thinking and which isn’t in space, and body, whose essence is extension (taking up space) and which doesn’t think. This is Cartesian dualism.

It left a huge problem, raised immediately by Princess Elisabeth of Bohemia, one of his sharpest correspondents: how can an unextended mind move an extended body? If I decide to raise my arm, and it rises, how does a thought push matter? Descartes suggested that they interact through the pineal gland in the brain. Elisabeth wasn’t convinced, and neither has almost anyone else been.` },
    { t: `Animals as machines`, b: `Since only minds think, and only humans have minds, Descartes concluded that animals are complex automata, machines without consciousness. Their cries are like the sounds of a clock. This view was used to justify vivisection, and it is the part of his philosophy most people now find hardest to forgive.` }
  ],
  works: [
    { t: `Discourse on Method`, y: `1637`, b: `Written in French, not Latin, so that ordinary intelligent readers could follow it. Partly autobiography, partly a guide to thinking: accept nothing as true unless it’s evident; divide problems into parts; think in order from simple to complex; make complete reviews. Contains the first appearance of “I think, therefore I am”. About 50 pages.` },
    { t: `Meditations on First Philosophy`, y: `1641`, b: `Six meditations, one per day, taking the reader through doubt, the cogito, God, error, the essence of material things, and the distinction between mind and body. It was published with objections from leading thinkers (including Hobbes) and Descartes’s replies. It is one of the most carefully built and most influential short books in philosophy. The first two meditations are gripping.` },
    { t: `Principles of Philosophy and The Passions of the Soul`, y: `1644; 1649`, b: `A textbook version of his system, and his last work, a physiological theory of emotions dedicated to Elisabeth.` }
  ],
  quotes: [
    { q: `I think, therefore I am.`, s: `*Discourse on Method*, Part IV` },
    { q: `I am, I exist, is necessarily true whenever it is put forward by me or conceived in my mind.`, s: `*Meditations*, Second Meditation` },
    { q: `It is not enough to have a good mind; the main thing is to use it well.`, s: `*Discourse on Method*, Part I` },
    { q: `Good sense is the best distributed thing in the world: for everyone thinks himself so well endowed with it that even those who are hardest to please in everything else do not usually desire more of it than they have.`, s: `*Discourse on Method*, opening line` },
    { q: `In order to seek truth, it is necessary once in the course of our life to doubt, as far as possible, of all things.`, s: `*Principles of Philosophy* I.1` },
    { q: `The reading of all good books is like a conversation with the finest minds of past centuries.`, s: `*Discourse on Method*, Part I` }
  ],
  fakes: [],
  critique: `Philosophers have gone after nearly every step. **The cogito:** is it an inference (“I think, therefore...”) or an intuition? The eighteenth-century critic Lichtenberg said Descartes was entitled only to “there is thinking going on”, not “I think”; the existence of a self doing the thinking is assumed, not proved.

**The Cartesian circle:** Descartes uses clear and distinct ideas to prove God exists, then uses God to guarantee that clear and distinct ideas are true. That is circular, as Antoine Arnauld pointed out in the published objections.

**The proofs of God** are the weakest part. Kant argued that existence isn’t a property like others, so it can’t be one of God’s “perfections”.

**Dualism** created the mind–body problem, and most philosophers and scientists today reject it. Gilbert Ryle mocked it in 1949 as the dogma of “the ghost in the machine”. The neuroscientist Antonio Damasio titled a book *Descartes’ Error*, arguing that reason and emotion, mind and body, are inseparable.

But even critics admit he set the agenda. Modern philosophy of mind, epistemology and scepticism are still, in large part, responses to Descartes.`,
  start: `Read the *Meditations*, especially the first two, in John Cottingham’s translation (Cambridge). It is under 70 pages. Then the *Discourse on Method* (Penguin, trans. Desmond Clarke). Anthony Grayling’s *Descartes: The Life of René Descartes and Its Place in His Times* is a lively biography.`,

{
  id: 'pascal', name: `Blaise Pascal`, born: 1623, died: 1662, era: 'early-modern',
  place: `Clermont-Ferrand; Paris`, role: `Mathematician, physicist and religious philosopher`,
  themes: ['god', 'mind', 'meaning', 'suffering'], keywords: ['pensees', 'wager', 'diversion', 'divertissement', 'sit quietly in a room', 'thinking reed', 'heart has its reasons', 'distraction'],
  tagline: `All of humanity’s problems come from our inability to sit quietly in a room alone.`,
  summary: `Pascal was a mathematical genius who invented a calculating machine and helped found probability theory, then turned his mind to the human condition. His *Pensées* diagnoses us as creatures of wretchedness and greatness, caught between the infinite and nothing. Above all, we flee from thinking about our condition through *divertissement*, diversion: endless distraction. He is the patron philosopher of anyone trying to stop scrolling.`,
  life: `Blaise Pascal was born in 1623 in Clermont-Ferrand, in central France. His mother died when he was three, and his father, a tax official and amateur mathematician, took charge of his education personally, moving the family to Paris. His father wanted him to learn languages before mathematics and hid the maths books. According to his sister, Blaise, aged twelve, worked out on his own, on the floor with charcoal, that the angles of a triangle add up to two right angles. His father gave up and let him study geometry.

At sixteen he wrote a treatise on conic sections that impressed Descartes. At nineteen, to help his father with endless tax calculations, he designed and built one of the first mechanical calculators, the Pascaline. He did pioneering work on vacuums and air pressure (the unit of pressure is named after him). With Pierre de Fermat, in letters about gambling problems, he laid the foundations of probability theory. Pascal’s triangle is named for him.

He was sickly all his life, suffering severe headaches and digestive pain. For a time in his late twenties he enjoyed Parisian society, gambling and conversation. Then, on the night of 23 November 1654, from about half past ten until half past midnight, he had an intense religious experience. He wrote it down on a piece of parchment, beginning with the word “FIRE”, and continuing: “God of Abraham, God of Isaac, God of Jacob, not of the philosophers and scholars. Certainty, certainty, heartfelt, joy, peace.” He sewed it into the lining of his coat and carried it with him until he died. A servant found it there afterwards.

He became associated with Port-Royal, a convent at the centre of Jansenism, a strict, Augustinian movement within Catholicism that the Jesuits opposed. He defended it in the *Provincial Letters*, a brilliantly witty satire of Jesuit moral reasoning that is considered a founding work of French prose.

In his last years he worked on a great defence of Christianity aimed at sceptics and free-thinkers. He never finished. He gave away most of his possessions, cared for the poor, and died in 1662, aged 39, probably of stomach cancer. His notes for the book, found as bundles of paper slips, were published as the *Pensées* (“Thoughts”).`,
  ideas: [
    { t: `Diversion`, b: `Pascal’s most piercing observation. “I have often said that the sole cause of man’s unhappiness is that he does not know how to stay quietly in his room.”

Why can’t we? Because if we sit still with nothing to do, we start to think about our condition: that we are weak, mortal, and will die, and we cannot bear it. So we flee into *divertissement*, diversion. Gambling, hunting, conversation, war, work, ambition: not because we want the prize, but because the chase keeps us from thinking. A man who spends his days gambling would be miserable if you gave him every day the money he could win, on condition he didn’t play. It is the agitation he wants, not the winnings.

“That is why men are so fond of the hustle and bustle; that is why prison is such a fearful punishment; that is why the pleasure of solitude is so incomprehensible.” Even a king, without diversion, is a miserable man.

Pascal wrote this in the 1650s. The infinite feed is the perfect diversion machine: it never runs out and it never asks you to be alone with yourself. He would not have been surprised by any of it.` },
    { t: `The thinking reed`, b: `“Man is only a reed, the weakest in nature, but he is a thinking reed.” The universe doesn’t need to arm itself to crush him: a vapour, a drop of water is enough. But even if the universe crushed him, he would still be nobler than what kills him, because he knows that he dies, and the universe knows nothing. “All our dignity consists, then, in thought.”` },
    { t: `Wretchedness and greatness`, b: `Humans are a paradox: “What a chimera then is man! What a novelty, what a monster, what chaos, what a subject of contradiction, what a prodigy! Judge of all things, feeble earthworm; repository of truth, sink of uncertainty and error; the glory and refuse of the universe.”

We know we are wretched, and that knowledge is itself a sign of greatness: a tree doesn’t know it’s wretched. Philosophies that stress only our greatness (the Stoics) make us proud; those that stress only our wretchedness (the sceptics) make us despair. Pascal thought only Christianity explained both: we are fallen creatures who remember a lost greatness.` },
    { t: `The two infinities`, b: `Look up at the vastness of the universe, in which the earth is a speck; look down into a mite, with its tiny legs and veins and blood, and within it infinite further worlds. Man is suspended between two abysses, “a nothing compared to the infinite, an everything compared to nothing”. He can grasp neither the beginning nor the end.

“The eternal silence of these infinite spaces terrifies me.” The new science of Copernicus and Galileo had shattered the cosy medieval cosmos, and Pascal was one of the first to feel the cold of that.` },
    { t: `The heart has its reasons`, b: `“The heart has its reasons, which reason knows nothing of.” This isn’t sentimental. For Pascal, the “heart” is a faculty of direct, intuitive knowledge. We know first principles (that space has three dimensions, that numbers are infinite) by the heart, not by proof, and reason then builds on them. Faith, too, is God perceived by the heart, not by argument.` },
    { t: `The wager`, b: `Pascal’s most famous argument is aimed at a sceptic who says reason can’t decide whether God exists. Fine, says Pascal. But you must bet; you are already on board, and not choosing is a choice. Weigh the odds. If you bet that God exists and you’re right, you gain infinite happiness. If you’re wrong, you lose almost nothing (a few worldly pleasures). If you bet against God and you’re right, you gain little; if you’re wrong, you lose everything. So bet on God.

And if you can’t make yourself believe? Act as if you do: go to Mass, take holy water. “That will make you believe naturally, and will make you more docile.” Habit shapes belief.` }
  ],
  works: [
    { t: `Pensées`, y: `published 1670`, b: `About 900 fragments, some a few words long, some several pages, which editors have arranged in different orders ever since (hence the two numbering systems, Lafuma and Brunschvicg). It is unfinished and so reads like a notebook. Its sharpest passages, on diversion, the thinking reed, the two infinities and the wager, are among the best prose in French.` },
    { t: `Provincial Letters`, y: `1656–57`, b: `Eighteen anonymous letters mocking the Jesuits’ flexible approach to sin (for example, their idea that you could lie as long as you silently added a true qualification in your head). Very funny, and they include his famous apology: “I have made this letter longer than usual because I have not had time to make it shorter.”` },

    { q: `There is a God-shaped vacuum in the heart of every man.`, n: `Not in the *Pensées* in this form. The nearest passage (L148) speaks of an “infinite abyss” that can only be filled by an infinite object, God himself. The snappier version is a modern paraphrase.` }
  ],
  critique: `The wager has taken a beating. **The many-gods objection:** Pascal assumes the only options are the Catholic God or no God. But there are many possible gods, some of whom might punish belief in the wrong one. **Belief isn’t chosen:** you can’t believe something just because it pays to. Pascal knows this, which is why he recommends habit, but critics see “go through the motions until you believe” as self-manipulation. **A God worth worshipping** might not reward belief held for reasons of self-interest. William James noted that if he were God, he would take particular pleasure in cutting off believers of this kind.

His picture of human nature is also grim, shaped by Jansenism’s view that most people are damned. Voltaire wrote a whole set of notes attacking him as a “sublime misanthrope”, arguing that our restless activity isn’t flight from misery but simply our nature: we are made to act, and there is nothing wretched about it.

But even people who reject his religious conclusion tend to accept his diagnosis. Diversion is real, and it describes us.`,
  start: `Read the *Pensées* in the Penguin translation by A. J. Krailsheimer or Honor Levi’s (Oxford World’s Classics). Don’t read it straight through. Start with the fragments on diversion (L132–139), the thinking reed (L200), the two infinities (L199) and the wager (L418). Then read around. Ben Rogers’s short *Pascal* (Phoenix, Great Philosophers series) is a good guide to the ideas, and Morris Bishop’s *Pascal: The Life of Genius* covers the life.`,
  related: ['montaigne', 'augustine', 'kierkegaard', 'descartes', 'simone-weil']
}
);

THINKERS.push(
{
  id: 'spinoza', name: `Baruch Spinoza`, born: 1632, died: 1677, era: 'early-modern',
  place: `Amsterdam; The Hague`, role: `Philosopher and lens grinder`,
  themes: ['god', 'mind', 'ethics', 'suffering'], keywords: ['ethics', 'god or nature', 'deus sive natura', 'determinism', 'conatus', 'affects', 'emotions', 'pantheism', 'excommunication', 'freedom'],
  tagline: `God and Nature are the same thing, and freedom means understanding why you do what you do.`,
  summary: `Spinoza argued that there is only one substance, which you can call God or Nature. Everything, including you, is a part or expression of it, and everything happens by necessity. There is no free will in the ordinary sense. But there is freedom of another kind: by understanding the causes of our emotions, we stop being their slaves. His *Ethics*, written in the form of geometric proofs, ends in a calm, clear love of the whole of reality.`,
  life: `Baruch (Bento, later Benedict) de Spinoza was born in 1632 in Amsterdam, into a family of Portuguese Jews whose ancestors had been forced to convert to Christianity in Portugal and who had fled the Inquisition to the relatively tolerant Dutch Republic, where they could practise Judaism openly again. His father was a successful merchant. Spinoza received a traditional Jewish education and was a gifted student.

He also started reading Descartes, the new science and radical thinkers, and developed ideas the community found intolerable. On 27 July 1656, aged 23, he was issued a *cherem*, a writ of excommunication, of unusual severity: “Cursed be he by day and cursed be he by night; cursed be he when he lies down, and cursed be he when he rises up.” No one was to communicate with him, stay under the same roof, or read anything he wrote. The document doesn’t specify his offences, only “abominable heresies” and “monstrous deeds”. He never returned.

He changed his name to the Latin Benedictus, which, like Baruch, means “blessed”. He supported himself by grinding lenses for microscopes and telescopes, a skilled trade at which he was respected; the glass dust may have worsened the lung disease that killed him. He lived modestly in rented rooms in villages near Leiden and then in The Hague. He turned down a professorship at Heidelberg in 1673, worried it would limit his freedom to think. He turned down a pension offered on condition he dedicate a book to Louis XIV.

In 1670 he published the *Theological-Political Treatise* anonymously. It argued that the Bible should be read as a historical document, written by many human authors, and that the state should allow freedom of thought and speech. It caused an uproar and was banned. His masterpiece, the *Ethics*, he decided not to publish in his lifetime, fearing the reaction.

In 1672, when a mob in The Hague lynched the brothers Johan and Cornelis de Witt, the republican leaders, Spinoza, usually calm, wrote a sign reading *ultimi barbarorum*, “the lowest of barbarians”, and wanted to post it at the scene. His landlord locked him in the house to save his life.

He died in 1677, aged 44, probably of tuberculosis or silicosis. His friends published the *Ethics* later that year, without his name on the title page.`,
  ideas: [
    { t: `God or Nature`, b: `Spinoza starts from the idea of substance: something that exists in itself and is conceived through itself, depending on nothing else. He argues that there can only be one such substance, and that it must be infinite. He calls it “God, or Nature” (*Deus sive Natura*).

Everything that exists (you, stars, thoughts, stones) is a “mode” of this one substance: a way that God-or-Nature exists and expresses itself. God isn’t a person outside the world who created it and watches over it. God is the world, understood in its totality and its necessity.

This God has no emotions, no plans and no favourites. It doesn’t reward or punish. It doesn’t act for purposes. Spinoza thought the idea of a God who made everything for human benefit was a projection of human vanity. He was called an atheist for this, and alternatively a “God-intoxicated man” (by the poet Novalis). Einstein, asked if he believed in God, said: “I believe in Spinoza’s God, who reveals himself in the orderly harmony of what exists.”` },
    { t: `Everything is necessary`, b: `In nature there is nothing contingent; everything is determined to exist and act in a certain way by the necessity of the divine nature. There are no accidents. There is also no free will in the ordinary sense. People think they are free only because they are conscious of their desires but ignorant of the causes that determine them. A stone thrown through the air, if it were conscious, would think it was flying of its own free will.

This sounds bleak. Spinoza thought it was the opposite: understanding necessity is the beginning of peace.` },
    { t: `Mind and body are one thing`, b: `Against Descartes, Spinoza held that mind and body aren’t two substances. They are one and the same thing, conceived in two different ways: once under the attribute of thought, once under the attribute of extension (space). Every bodily event has a mental side and every mental event a bodily side. This neatly dissolves Descartes’s problem of how the mind moves the body: it doesn’t, because they aren’t two things. Many neuroscientists, including Antonio Damasio in *Looking for Spinoza*, have found this remarkably modern.` },
    { t: `Conatus`, b: `“Each thing, as far as it lies in itself, strives to persevere in its being.” This striving, the *conatus*, is the actual essence of every thing. For humans, it takes the form of desire. And Spinoza turns traditional morality upside down: we don’t desire things because they are good; we call them good because we desire them.` },
    { t: `The emotions, analysed like geometry`, b: `Spinoza said he would treat human emotions “as if it were a question of lines, planes and bodies”. Every emotion is built from three basic ones: desire, joy (the passage to greater power of acting) and sadness (the passage to lesser). Love is joy accompanied by the idea of an external cause; hatred is sadness accompanied by the idea of an external cause. From these he derives dozens of others: hope, fear, envy, pity, pride, shame.

The analysis is often uncannily accurate. Hope and fear always come together, because hope is joy mixed with doubt about the outcome, and where there is doubt there is fear. Envy is hatred that makes a person sad at another’s happiness and glad at their misfortune.` },
    { t: `Human bondage and freedom`, b: `Part IV of the *Ethics* is called “Of Human Bondage, or the Power of the Emotions”. We are in bondage when we are driven by passions: emotions caused by outside things we don’t understand. A person in their grip “is not his own master”, often seeing the better and doing the worse.

The way out is understanding. “An emotion that is a passion ceases to be a passion as soon as we form a clear and distinct idea of it.” When you understand why you feel what you feel (the causes, the necessity, the chain behind it), the emotion changes from something done to you into something you understand, and you become more active. You can’t decide not to be angry. But understanding the causes of your anger weakens its hold. This is not far from modern psychotherapy.` },
    { t: `Seeing things under the aspect of eternity`, b: `The highest form of knowledge, which Spinoza calls intuitive knowledge, sees each thing as following necessarily from God-or-Nature: *sub specie aeternitatis*, under the aspect of eternity. From this comes the “intellectual love of God”, a calm, unshakeable joy in understanding reality as it is. It isn’t a love that expects to be loved back: “He who loves God cannot strive that God should love him in return.”

The *Ethics* ends: “If the way I have shown to lead to these things now seems very hard, still, it can be found. And of course, what is found so rarely must be hard. For if salvation were at hand and could be found without great effort, how could nearly everyone neglect it? But all things excellent are as difficult as they are rare.”` },
    { t: `Freedom of thought`, b: `In the *Theological-Political Treatise*, Spinoza made one of the first great arguments for freedom of speech and thought. No one can transfer their right to think to anyone else. A state that tries to control people’s beliefs creates hypocrites and rebels. “The purpose of the state is freedom.”` }
  ],
  works: [
    { t: `Ethics, Demonstrated in Geometrical Order`, y: `1677, posthumous`, b: `Five parts: on God, on the mind, on the emotions, on human bondage, and on human freedom. Written like Euclid, with definitions, axioms, propositions, proofs and corollaries. This makes it look impossibly dry at first. The secret is that the best parts are in the “scholia” (explanatory notes) and prefaces, where Spinoza speaks directly and sometimes passionately. Start with the Appendix to Part I and the Preface to Part IV.` },
    { t: `Theological-Political Treatise`, y: `1670`, b: `The founding text of modern biblical criticism and a powerful case for secular government and free speech.` },
    { t: `Treatise on the Emendation of the Intellect`, y: `unfinished`, b: `Opens with a gorgeous passage on why he turned from wealth, honour and pleasure to seek a lasting good. An excellent entry point.` }
  ],
  quotes: [
    { q: `All things excellent are as difficult as they are rare.`, s: `*Ethics* V, last line` },
    { q: `A free man thinks of nothing less than of death, and his wisdom is a meditation not on death but on life.`, s: `*Ethics* IV, Proposition 67` },
    { q: `I have striven not to laugh at human actions, not to weep at them, nor to hate them, but to understand them.`, s: `*Political Treatise* I.4` },
    { q: `An emotion that is a passion ceases to be a passion as soon as we form a clear and distinct idea of it.`, s: `*Ethics* V, Proposition 3` },
    { q: `Men think themselves free because they are conscious of their volitions and desires, and are ignorant of the causes by which they are led to wish and desire.`, s: `*Ethics* I, Appendix` },
    { q: `We do not desire something because we judge it to be good; on the contrary, we judge something to be good because we desire it.`, s: `*Ethics* III, Proposition 9, scholium` },
    { q: `The purpose of the state is really freedom.`, s: `*Theological-Political Treatise*, chapter 20` }
  ],
  fakes: [
    { q: `If you want the present to be different from the past, study the past.`, n: `Widely attributed, but no source in his works has been found.` },
    { q: `Peace is not the absence of war; it is a virtue, a state of mind, a disposition for benevolence, confidence, justice.`, n: `A loose, expanded version of a line in the *Political Treatise* (V.4). The original is shorter and is specifically about a state’s condition.` }
  ],
  critique: `The geometric method promises certainty it can’t deliver. The definitions at the start of Part I do a huge amount of work, and if you don’t accept them, the whole system doesn’t follow. Critics from Leibniz on have found gaps in the proofs.

Determinism raises the familiar problem. If everything is necessary and there is no free will, what sense does it make to tell people to become free, or to praise and blame them? Spinoza’s answer is that the “freedom” he recommends is itself caused (by understanding), but many readers feel this redefines freedom out of existence.

His God is also hard to recognise as God. Something that has no will, no love for individuals and no purposes is, to most religious believers, simply nature, and calling it God looks like a way of avoiding the charge of atheism. His Jewish community and Christian critics said exactly that.

Finally, the ideal of calm understanding can seem cold. Spinoza says that pity, humility and repentance are not virtues. Is it really wise to aim at not being moved by others’ suffering, but only to act to relieve it, rationally?`,
  start: `Read Steven Nadler’s *Spinoza: A Life* for the man, and Nadler’s *Think Least of Death* (2020) for a clear account of his ethics as a guide to living. Then try the *Ethics* in Edwin Curley’s translation (Penguin), starting with Part I’s Appendix, then Parts III–V. Don’t worry about following every proof on a first read.`,
  related: ['descartes', 'marcus-aurelius', 'nietzsche', 'hegel', 'freud']
},
{
  id: 'locke', name: `John Locke`, born: 1632, died: 1704, era: 'early-modern',
  place: `Wrington, Somerset; Oxford; London; the Netherlands`, role: `Philosopher and physician`,
  themes: ['politics', 'knowledge', 'mind'], keywords: ['blank slate', 'tabula rasa', 'natural rights', 'life liberty property', 'consent', 'toleration', 'empiricism', 'personal identity', 'two treatises'],
  tagline: `Governments exist to protect your rights, and if they don’t, you can replace them.`,
  summary: `Locke argued that all our knowledge comes from experience (the mind at birth is a blank slate), that people have natural rights to life, liberty and property, and that governments get their authority only from the consent of the governed. A government that violates those rights can legitimately be overthrown. These ideas went straight into the American Declaration of Independence and the foundations of liberal democracy.`,
  life: `John Locke was born in 1632 in Somerset, the son of a lawyer who fought for Parliament in the English Civil War. He went to Westminster School and Christ Church, Oxford, where he found the traditional Aristotelian curriculum dull. He was drawn instead to the new experimental science and to medicine, and worked with the chemist Robert Boyle.

In 1666 he met Lord Ashley, later Earl of Shaftesbury, and became his physician and adviser. In 1668 he supervised a risky operation to drain a liver abscess, and the silver tube he had inserted stayed in Shaftesbury for the rest of his life. Shaftesbury became one of the most powerful men in England, and then a leader of the opposition to the Catholic heir to the throne, James. When Shaftesbury’s plotting failed, he fled to Holland in 1682, where he died. Locke, under suspicion, followed him into exile in 1683, living under a false name for a time.

He returned to England in 1689, after the Glorious Revolution had replaced James II with William and Mary, and quickly published the books he had been working on for years: the *Essay Concerning Human Understanding*, the *Two Treatises of Government* (anonymously) and the *Letter Concerning Toleration*. They made him famous. He spent his last years at the country house of his friend Damaris Masham, a philosopher herself, and died in 1704.`,
  ideas: [
    { t: `The blank slate`, b: `Against Descartes, who believed some ideas (like God) are innate, Locke argued that the mind at birth is like “white paper, void of all characters”. Everything we know comes from experience, either from **sensation** (the senses) or from **reflection** (observing the operations of our own minds). Complex ideas are built up from simple ones. This is empiricism, and it shaped British philosophy for the next two centuries.` },
    { t: `Personal identity`, b: `What makes you the same person over time? Not the same body, Locke argued. Imagine a prince’s soul, with all his memories, entering the body of a cobbler: we would say it is the prince in a cobbler’s body. Personal identity consists in consciousness, specifically memory: you are the same person as someone in the past if you can remember their experiences as your own. The theory had problems (Thomas Reid pointed out that you might remember being a boy, and an old man remember being an officer, but not the boy), but it launched the modern debate.` },
    { t: `Natural rights`, b: `Before government, in the state of nature, people live under the law of nature, which reason teaches: since we are all equal and independent, no one ought to harm another in their life, health, liberty or possessions. These are natural rights. We don’t get them from governments; governments exist to protect them.` },
    { t: `Property and labour`, b: `How can anyone own anything, if God gave the earth to everyone in common? Locke’s answer: you own your own body, and so you own the labour of your body. When you mix your labour with something (pick an apple, plough a field), you make it yours, as long as you leave “enough and as good” for others and don’t let it spoil. This labour theory of property was enormously influential and has been criticised just as much.` },
    { t: `Consent and revolution`, b: `People leave the state of nature and form governments to protect their rights more securely. So the legitimate power of government comes only from the consent of the governed, and it is limited to the purposes for which it was created. When a government violates the rights it was set up to protect, it puts itself into a state of war with the people, who may resist and replace it. This was the justification for the Glorious Revolution of 1688 and later for the American Revolution.` },
    { t: `Toleration`, b: `The state’s job is to protect civil interests (life, liberty, health, property), not to save souls. Belief can’t be forced; torture can make someone say they believe but not actually believe. So the state should tolerate different religions. Locke’s toleration had limits, though: he excluded Catholics (whom he thought owed allegiance to a foreign prince, the Pope) and atheists (whose oaths couldn’t be trusted).` }
  ],
  works: [
    { t: `An Essay Concerning Human Understanding`, y: `1689`, b: `Four books on the origins and limits of human knowledge. Long and repetitive, but clearly written. Book II on ideas and the chapter on personal identity (II.27) are the most important.` },
    { t: `Two Treatises of Government`, y: `1689`, b: `The first attacks Robert Filmer’s argument that kings rule by divine right inherited from Adam; nobody reads it now. The second sets out Locke’s own theory and is one of the founding texts of liberalism.` },
    { t: `A Letter Concerning Toleration`, y: `1689`, b: `Short, clear and still relevant.` }
  ],
  quotes: [
    { q: `Let us then suppose the mind to be, as we say, white paper, void of all characters, without any ideas.`, s: `*Essay* II.1.2` },
    { q: `Wherever law ends, tyranny begins.`, s: `*Second Treatise*, §202` },
    { q: `The end of law is not to abolish or restrain, but to preserve and enlarge freedom.`, s: `*Second Treatise*, §57` },
    { q: `Being all equal and independent, no one ought to harm another in his life, health, liberty or possessions.`, s: `*Second Treatise*, §6` },
    { q: `New opinions are always suspected, and usually opposed, without any other reason but because they are not already common.`, s: `*Essay*, Epistle Dedicatory` }
  ],
  fakes: [],
  critique: `Locke’s ideals of liberty and equality sat alongside some deep compromises. He invested in the Royal African Company, which traded in enslaved people, and helped write the *Fundamental Constitutions of Carolina* (1669), which gave colonists “absolute power and authority” over their slaves. His labour theory of property was used to justify taking land from Native Americans, on the grounds that they hadn’t “improved” it by farming in the European way.

Philosophically, the social contract is a fiction: no one alive actually consented to their government. Locke’s answer, “tacit consent” (you consent by living in a country and using its roads), is weak; David Hume compared it to saying that a man carried aboard a ship while asleep has consented to the captain’s authority because he doesn’t jump into the sea.

And the “blank slate” is now known to be wrong. Babies are born with a great deal of built-in structure, as Steven Pinker argues in *The Blank Slate*.`,
  start: `Read the *Second Treatise of Government* (Hackett, ed. C. B. Macpherson), about 120 pages, and the chapter on personal identity from the *Essay* (II.27). John Dunn’s *Locke: A Very Short Introduction* is a good guide.`,
  related: ['hobbes', 'rousseau', 'hume', 'descartes', 'mill']
},
{
  id: 'hume', name: `David Hume`, born: 1711, died: 1776, era: 'early-modern',
  place: `Edinburgh; La Flèche; Paris`, role: `Philosopher, historian and essayist`,
  themes: ['knowledge', 'mind', 'god', 'ethics'], keywords: ['empiricism', 'induction', 'causation', 'habit', 'bundle theory', 'self', 'is ought', 'miracles', 'scepticism', 'treatise of human nature', 'passions', 'reason slave'],
  tagline: `Reason is, and ought only to be, the slave of the passions.`,
  summary: `Hume pushed empiricism to its limits and found that it undermined much of what we take for granted. We can’t prove the sun will rise tomorrow. We never observe causation, only one thing following another. There is no self to be found, only a bundle of perceptions. And reason can’t tell us what to value; it only serves our feelings. Yet he was the most cheerful of sceptics: when philosophy got too much, he played backgammon and dined with friends.`,
  life: `David Hume was born in Edinburgh in 1711, the younger son of a minor landowner. His father died when he was two. He went to Edinburgh University at about ten or twelve (normal then), left without a degree, and was supposed to study law. Instead he found himself obsessed with philosophy.

At about eighteen he had a breakthrough (“a new scene of thought”) and threw himself into it so hard that he had a nervous breakdown, with physical symptoms, lasting several years. He recovered partly by taking a job with a Bristol sugar merchant, then went to France, living cheaply at La Flèche, where Descartes had been educated, and wrote *A Treatise of Human Nature*. He published it in 1739–40, at 28. It “fell dead-born from the press”, he said, barely noticed.

He rewrote its ideas in more accessible form as the *Enquiries*, and wrote essays that became popular. He applied twice for professorships of philosophy, at Edinburgh and Glasgow, and was rejected both times because of his reputation for atheism. He worked as tutor to a mad young marquis, as secretary to a general on a military expedition, and as librarian of the Advocates’ Library in Edinburgh, where he wrote a six-volume *History of England* that became a bestseller and made him rich and famous.

In the 1760s he served at the British embassy in Paris, where he was lionised by the salons (they called him *le bon David*). He brought Rousseau back to England to help him escape persecution; Rousseau, increasingly paranoid, accused him of plotting against him, and a very public quarrel followed.

Hume spent his last years in Edinburgh at the centre of the Scottish Enlightenment, friends with Adam Smith. He died of bowel cancer in 1776. James Boswell visited him near the end, hoping to find the famous sceptic terrified of death. He found Hume perfectly calm, joking, and insisting he had no more fear of not existing after death than he had of not existing before birth. Boswell was disturbed. Adam Smith wrote that Hume came as near to the idea of a perfectly wise and virtuous man as human frailty will permit.`,
  ideas: [
    { t: `Impressions and ideas`, b: `Everything in the mind is either an **impression** (a vivid perception: seeing red, feeling anger) or an **idea** (a fainter copy of an impression, as in memory or imagination). Every simple idea comes from an impression. So if someone uses a word and you can’t find the impression it comes from, the word is probably meaningless. Hume used this test like a razor.` },
    { t: `The problem of induction`, b: `We believe the sun will rise tomorrow, that bread will nourish us, that fire will burn. Why? Because it always has. But how do we get from “it has always happened” to “it will happen”? Only by assuming that the future will resemble the past. And how do we know that? Because in the past, the future has always resembled the past. That is circular.

So there is no rational justification for induction. We rely on it, and must, but it is habit, not reason. Bertrand Russell’s version: the chicken that is fed every day by the farmer comes to expect food every morning, until the day the farmer wrings its neck.` },
    { t: `Causation is habit`, b: `When one billiard ball hits another and the second moves, what do we actually observe? One ball moving, contact, the other ball moving. We don’t see any “power” or “necessary connection” passing between them. After seeing this many times, our mind simply forms the habit of expecting the second event when it sees the first. The feeling of necessity is in us, not in the balls.` },
    { t: `There is no self`, b: `Look inside for your “self”, Hume said, and what do you find? “For my part, when I enter most intimately into what I call myself, I always stumble on some particular perception or other, of heat or cold, light or shade, love or hatred, pain or pleasure. I never can catch myself at any time without a perception, and never can observe anything but the perception.”

So the self is “nothing but a bundle or collection of different perceptions, which succeed each other with an inconceivable rapidity, and are in a perpetual flux and movement.” The resemblance to the Buddha’s teaching of no-self is striking; some scholars think Hume may have heard of Buddhist ideas through a Jesuit at La Flèche, but it is unproven.` },
    { t: `Reason is the slave of the passions`, b: `Reason alone can never motivate us to act. It can tell us what is true and how to get what we want, but it can’t tell us what to want. That comes from the passions: desire, aversion, love, hatred. So “reason is, and ought only to be the slave of the passions, and can never pretend to any other office than to serve and obey them.”

He illustrates with a deliberately shocking example: “’Tis not contrary to reason to prefer the destruction of the whole world to the scratching of my finger.” Wanting that is monstrous, but it is not a logical error.` },
    { t: `Is and ought`, b: `Hume noticed that in every book of morality he read, the author would go along describing how things are (God exists, humans have such-and-such a nature) and then suddenly start saying what we ought to do, without explaining how the “ought” follows from the “is”. It can’t, he suggested: no set of facts alone logically implies a moral conclusion. This “is–ought gap” is still one of the central problems of ethics.` },
    { t: `Morality is feeling`, b: `If morality isn’t derived from reason, where does it come from? From sentiment. We call actions virtuous when they give us a certain feeling of approval, which comes from sympathy, our natural capacity to feel what others feel. Virtue is what is useful or agreeable to ourselves or others. This made Hume a founder of both utilitarianism and modern moral psychology.` },
    { t: `On miracles`, b: `A miracle is a violation of a law of nature, and our experience in favour of the laws of nature is as complete as experience can be. So it will always be more likely that the testimony for a miracle is mistaken or false than that the miracle happened. “No testimony is sufficient to establish a miracle, unless the testimony be of such a kind that its falsehood would be more miraculous than the fact which it endeavours to establish.”` },
    { t: `Scepticism and backgammon`, b: `Hume’s scepticism was total in the study. But he noticed that it doesn’t survive dinner. At the end of Book I of the *Treatise*, after reasoning himself into a state of despair where he can’t be sure of anything, he writes: “Most fortunately it happens that since reason is incapable of dispelling these clouds, nature herself suffices to that purpose... I dine, I play a game of backgammon, I converse and am merry with my friends; and when after three or four hours’ amusement I would return to these speculations, they appear so cold, and strained, and ridiculous, that I cannot find in my heart to enter into them any farther.”

“Be a philosopher,” he wrote, “but amidst all your philosophy, be still a man.”` }
  ],
  works: [
    { t: `A Treatise of Human Nature`, y: `1739–40`, b: `Three books: “Of the Understanding”, “Of the Passions” and “Of Morals”. Brilliant, youthful, often difficult. Book I, Part IV (on scepticism and personal identity) is where the most famous passages are.` },
    { t: `An Enquiry Concerning Human Understanding`, y: `1748`, b: `A shorter, clearer rewrite of Book I, including the essay on miracles. The best place to start.` },
    { t: `An Enquiry Concerning the Principles of Morals`, y: `1751`, b: `Hume thought this was his best book.` },
    { t: `Dialogues Concerning Natural Religion`, y: `1779, posthumous`, b: `Three characters argue about whether we can prove God’s existence from the design of the world. Philo, the sceptic, demolishes the argument from design with arguments Darwin would later make unnecessary: maybe the world was made by a committee of gods, or by an infant god who botched it, or it simply grew, like a vegetable. Hume’s friends persuaded him not to publish it in his lifetime.` },
    { t: `My Own Life`, y: `1776`, b: `A five-page autobiography written as he was dying, calm, witty and modest.` }
  ],
  quotes: [
    { q: `Reason is, and ought only to be the slave of the passions, and can never pretend to any other office than to serve and obey them.`, s: `*Treatise* 2.3.3` },
    { q: `When I enter most intimately into what I call myself, I always stumble on some particular perception or other.`, s: `*Treatise* 1.4.6` },
    { q: `’Tis not contrary to reason to prefer the destruction of the whole world to the scratching of my finger.`, s: `*Treatise* 2.3.3` },
    { q: `A wise man proportions his belief to the evidence.`, s: `*Enquiry Concerning Human Understanding*, section 10` },
    { q: `Be a philosopher; but, amidst all your philosophy, be still a man.`, s: `*Enquiry Concerning Human Understanding*, section 1` },

    { q: `Custom, then, is the great guide of human life.`, s: `*Enquiry Concerning Human Understanding*, section 5` },

  ],
  fakes: [],
  critique: `Hume’s scepticism, if taken seriously, seems to undermine science itself. If induction has no rational basis, why is physics more reasonable than astrology? Philosophers have been trying to answer him ever since. Karl Popper argued that science doesn’t actually use induction: it proposes bold theories and tries to falsify them. Others think the problem is simply unsolved.

Kant said that Hume woke him from his “dogmatic slumber”, and built his whole philosophy to answer him. He argued that causation isn’t a habit we pick up from experience but a structure our minds impose on experience, which is why we can know it applies everywhere.

The bundle theory has a famous difficulty that Hume himself admitted in an appendix to the *Treatise*: what ties the bundle together? Why are these perceptions *mine*? He confessed he couldn’t answer it.

And some of his writing is ugly. A footnote to his essay “Of National Characters”, revised in 1753, says he is “apt to suspect the negroes to be naturally inferior to the whites”. It was cited by defenders of slavery. In 2020 the University of Edinburgh removed his name from one of its buildings.`,
  start: `Read *An Enquiry Concerning Human Understanding*, sections 2–7 and 10 (Oxford, ed. Peter Millican). Then the *Dialogues Concerning Natural Religion*, which are genuinely entertaining. Julian Baggini’s *How the World Thinks* and James Harris’s *Hume: An Intellectual Biography* (for the ambitious) are both good. Read *My Own Life* for the man.`,
